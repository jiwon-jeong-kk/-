<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="오늘의 행복">
<meta name="theme-color" content="#090912">
<title>오늘의 행복</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #090912;
  --surface: #111119;
  --card:    #16161f;
  --card2:   #1c1c27;
  --border:  rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --gold:    #c9a96e;
  --gold-dim: rgba(201,169,110,0.12);
  --blue:    #6baed6;
  --blue-dim: rgba(107,174,214,0.1);
  --hanja:   #d4846a;
  --hanja-dim: rgba(212,132,106,0.1);
  --green:   #6bbfa0;
  --green-dim: rgba(107,191,160,0.1);
  --text:    #ede9e0;
  --muted:   #5c5c72;
  --muted2:  #7a7a8f;
  --success: #6bbfa0;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 15% 10%, rgba(201,169,110,0.035) 0%, transparent 70%),
    radial-gradient(ellipse 50% 60% at 85% 90%, rgba(107,174,214,0.03) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}

.wrapper {
  position: relative; z-index: 1;
  max-width: 720px; margin: 0 auto;
  padding: 0 22px 100px;
}

/* ── 헤더 ── */
.header {
  padding: 44px 0 18px;
  display: flex; align-items: flex-start; justify-content: space-between;
}
.app-brand {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 10px; letter-spacing: 5px;
  color: var(--muted2); text-transform: uppercase;
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.app-brand-badge {
  background: var(--gold); color: #090912;
  font-size: 8px; font-weight: 700; letter-spacing: 1px;
  padding: 2px 6px; border-radius: 4px;
  font-family: 'Noto Sans KR', sans-serif;
}
.header-date {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 48px; font-weight: 800;
  color: var(--text); line-height: 1;
  letter-spacing: -1px;
}
.header-day {
  font-size: 12px; color: var(--muted2);
  font-weight: 300; letter-spacing: 3px;
  margin-top: 6px;
}
.header-right {
  display: flex; flex-direction: column;
  align-items: flex-end; gap: 8px; padding-top: 4px;
}
.sync-status {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--muted); cursor: pointer;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 100px;
  transition: all 0.2s;
}
.sync-status:hover { border-color: var(--border2); color: var(--muted2); }
.sync-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--muted); transition: background 0.3s;
}
.sync-dot.synced { background: var(--green); }
.sync-dot.syncing { background: var(--gold); animation: pulse 1s infinite; }
.gb-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted2); font-family: 'Noto Sans KR', sans-serif;
  font-size: 11px; padding: 6px 14px; border-radius: 100px;
  cursor: pointer; transition: all 0.2s; letter-spacing: 1px;
}
.gb-btn:hover { border-color: var(--gold); color: var(--gold); }

/* ── 픽셀 농장 ── */
.farm {
  position: relative;
  height: 78px;
  margin: 0 0 34px;
  border-bottom: 1px solid var(--border);
  overflow: hidden;
}
.farm-ground {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 20px;
  background: linear-gradient(#25301c, #1a2214);
  border-top: 2px solid #33402a;
}
.pxwrap { position: absolute; bottom: 16px; image-rendering: pixelated; }
.pxinner { transition: transform 0.15s; }
.px { width: 3px; height: 3px; background: transparent; }
.chick { cursor: pointer; z-index: 3; }
.chick.peck .pxinner { transform: translateY(3px) rotate(14deg); }
.chick.hop .pxinner { transform: translateY(-5px); }
.egg { cursor: pointer; z-index: 2; bottom: 15px; }
.egg.wobble .pxinner { animation: wob 0.8s ease; }
.deco { z-index: 1; pointer-events: none; bottom: 14px; }
@keyframes wob {
  0%,100% { transform: rotate(0); }
  25% { transform: rotate(-8deg); }
  50% { transform: rotate(7deg); }
  75% { transform: rotate(-4deg); }
}
@media (prefers-reduced-motion: reduce) {
  .pxinner { transition: none; }
  .egg.wobble .pxinner { animation: none; }
}

/* ── 섹션 라벨 ── */
.section-label {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 9px; letter-spacing: 5px;
  color: var(--muted); text-transform: uppercase;
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 12px;
}
.section-label::after {
  content: ''; flex: 1; height: 1px;
  background: var(--border);
}
.section-note {
  font-size: 10px; color: var(--muted);
  font-weight: 300; margin: -6px 0 10px; letter-spacing: 0.3px;
}

/* ── 공용 nav ── */
.quote-nav {
  display: flex; align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.quote-section-label {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 9px; letter-spacing: 4px;
  color: var(--gold);
}
.quote-arrows { display: flex; gap: 4px; }
.quote-arrow {
  background: none; border: 1px solid var(--border);
  color: var(--muted2); width: 28px; height: 28px;
  border-radius: 50%; cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; font-family: 'Noto Sans KR', sans-serif;
}
.quote-arrow:hover { border-color: var(--gold); color: var(--gold); }
.quote-index {
  text-align: right; margin-top: 12px;
  font-size: 10px; color: var(--muted);
  letter-spacing: 1px;
}

/* ── 명언 카드 ── */
.quote-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px; padding: 28px;
  margin-bottom: 40px;
  position: relative;
}
.quote-card::before {
  content: '"';
  position: absolute; top: 16px; left: 22px;
  font-family: 'Nanum Myeongjo', serif;
  font-size: 60px; color: var(--gold-dim);
  line-height: 1; pointer-events: none;
  font-weight: 800;
}
.quote-type-badge {
  display: inline-block;
  background: var(--gold-dim);
  border: 1px solid rgba(201,169,110,0.25);
  color: var(--gold);
  font-size: 9px; font-weight: 700; letter-spacing: 2px;
  padding: 2px 8px; border-radius: 4px;
  margin-top: 6px;
}
.quote-text {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 19px; font-weight: 700;
  color: var(--text); line-height: 1.8;
  margin-bottom: 18px; margin-top: 8px;
  padding-left: 2px;
  white-space: pre-line;
}
.quote-author-row {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 12px;
}
.quote-author-name {
  font-size: 13px; font-weight: 600;
  color: var(--gold); margin-bottom: 2px;
}
.quote-author-meta {
  font-size: 11px; color: var(--muted2);
  font-weight: 300; letter-spacing: 0.5px;
}
.meaning-toggle {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted); font-family: 'Noto Sans KR', sans-serif;
  font-size: 10px; padding: 5px 12px; border-radius: 100px;
  cursor: pointer; transition: all 0.2s; white-space: nowrap;
  flex-shrink: 0;
}
.meaning-toggle:hover, .meaning-toggle.open { border-color: var(--blue); color: var(--blue); }
.quote-meaning {
  display: none;
  margin-top: 16px; padding: 16px 18px;
  background: var(--blue-dim);
  border: 1px solid rgba(107,174,214,0.15);
  border-radius: 10px;
  font-size: 13px; color: var(--muted2);
  line-height: 1.85; font-weight: 300;
  animation: fadeUp 0.25s ease;
}
.quote-meaning.open { display: block; }

/* ── 사자성어 카드 ── */
.idiom-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px; padding: 28px;
  margin-bottom: 40px;
}
.idiom-kor {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 27px; font-weight: 800;
  color: var(--green); margin-top: 10px; margin-bottom: 4px;
}
.idiom-hanja {
  font-size: 13px; color: var(--muted2);
  letter-spacing: 2px; margin-bottom: 16px;
}
.idiom-meaning {
  font-size: 14px; color: var(--text);
  line-height: 1.8; margin-bottom: 14px; font-weight: 400;
}
.idiom-story {
  padding: 16px 18px;
  background: var(--green-dim);
  border: 1px solid rgba(107,191,160,0.18);
  border-radius: 10px;
  font-size: 13px; color: var(--muted2);
  line-height: 1.9; font-weight: 300;
}
.idiom-story-label {
  color: var(--green); font-weight: 700; font-size: 11px;
  display: block; margin-bottom: 6px; letter-spacing: 1px;
}

/* ── 영어단어 카드 ── */
.eng-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px; padding: 28px;
  margin-bottom: 40px;
}
.eng-word-row { display: flex; align-items: baseline; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.eng-word { font-family: 'Nanum Myeongjo', serif; font-size: 28px; font-weight: 800; color: var(--blue); }
.eng-pos {
  font-size: 11px; color: var(--muted2);
  border: 1px solid var(--border); padding: 2px 9px; border-radius: 100px;
}
.eng-pron { font-size: 13px; color: var(--muted2); margin: 8px 0 16px; font-style: italic; }
.eng-meaning { font-size: 14px; color: var(--text); line-height: 1.8; margin-bottom: 14px; }
.eng-example {
  font-size: 13px; color: var(--text); line-height: 1.7;
  background: var(--blue-dim); border: 1px solid rgba(107,174,214,0.15);
  border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
}
.eng-example-kor { font-size: 12px; color: var(--muted2); padding: 0 2px; font-weight: 300; }

/* ── 한자 카드 ── */
.hanja-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.hanja-tab {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px 4px;
  color: var(--muted2);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 11px; cursor: pointer;
  transition: all 0.2s;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.hanja-tab .tab-char {
  font-family: 'Noto Serif SC', serif;
  font-size: 20px; color: var(--muted2); line-height: 1.1;
}
.hanja-tab.active { border-color: var(--hanja); color: var(--hanja); background: var(--hanja-dim); }
.hanja-tab.active .tab-char { color: var(--hanja); }
.hanja-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 40px;
}
.hanja-top { display: flex; gap: 0; }
.hanja-char-block {
  width: 130px; flex-shrink: 0;
  background: var(--hanja-dim);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 28px 16px;
}
.hanja-char {
  font-family: 'Noto Serif SC', 'Nanum Myeongjo', serif;
  font-size: 86px; font-weight: 700;
  color: var(--hanja);
  line-height: 1;
  text-shadow: 0 0 40px rgba(212,132,106,0.25);
}
.hanja-stroke { font-size: 10px; color: var(--muted); letter-spacing: 1px; margin-top: 8px; }
.hanja-info { flex: 1; padding: 24px 22px; display: flex; flex-direction: column; gap: 6px; }
.hanja-info-row { display: flex; align-items: baseline; gap: 10px; }
.hanja-kor { font-family: 'Nanum Myeongjo', serif; font-size: 20px; font-weight: 700; color: var(--text); }
.hanja-chi { font-size: 13px; color: var(--muted2); font-style: italic; }
.hanja-meaning { font-size: 12px; color: var(--muted2); line-height: 1.6; margin-top: 2px; }
.hanja-grade {
  display: inline-block; align-self: flex-start;
  background: rgba(212,132,106,0.12);
  border: 1px solid rgba(212,132,106,0.25);
  color: var(--hanja);
  font-size: 10px; font-weight: 700;
  padding: 2px 8px; border-radius: 4px;
  letter-spacing: 1px; margin-top: 6px;
}
.hanja-expand-btn {
  width: 100%; background: none; border: none;
  border-top: 1px solid var(--border);
  color: var(--muted2); font-family: 'Noto Sans KR', sans-serif;
  font-size: 11px; padding: 12px;
  cursor: pointer; transition: all 0.2s; letter-spacing: 1px;
}
.hanja-expand-btn:hover { background: var(--card2); color: var(--hanja); }
.hanja-detail { display: none; padding: 18px 22px; border-top: 1px solid var(--border); animation: fadeUp 0.25s ease; }
.hanja-detail.open { display: block; }
.hanja-detail-title { font-size: 10px; letter-spacing: 3px; color: var(--hanja); margin-bottom: 10px; font-family: 'Nanum Myeongjo', serif; }
.hanja-detail-text { font-size: 13px; color: var(--muted2); line-height: 1.9; font-weight: 300; margin-bottom: 12px; }
.hanja-example {
  background: var(--hanja-dim);
  border: 1px solid rgba(212,132,106,0.15);
  border-radius: 8px; padding: 10px 14px;
  font-size: 13px; color: var(--text);
  font-family: 'Nanum Myeongjo', serif;
  margin-bottom: 14px;
}
.hanja-stroke-link {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--hanja);
  border: 1px solid rgba(212,132,106,0.3);
  padding: 8px 14px; border-radius: 100px;
  text-decoration: none; transition: all 0.2s;
}
.hanja-stroke-link:hover { background: var(--hanja-dim); }

/* ── 방명록 ── */
.gb-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px; padding: 20px 22px;
  margin-bottom: 16px;
}
.gb-input-row { display: flex; gap: 8px; margin-bottom: 4px; }
.gb-input {
  flex: 1; min-width: 0; background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 100px; padding: 11px 18px;
  color: var(--text); font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px; outline: none; transition: border-color 0.2s;
}
.gb-input:focus { border-color: var(--gold); }
.gb-input::placeholder { color: var(--muted); }
.gb-submit {
  flex-shrink: 0;
  background: var(--gold); border: none;
  color: #090912; font-weight: 700;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 12px; padding: 0 16px;
  border-radius: 100px; cursor: pointer;
  transition: opacity 0.2s; white-space: nowrap;
}
.gb-submit:hover { opacity: 0.85; }
.gb-list {
  margin-top: 16px;
  display: flex; flex-direction: column; gap: 10px;
  max-height: 440px; overflow-y: auto;
  scrollbar-gutter: stable;
}
.gb-item {
  display: flex; flex-direction: column; gap: 6px;
  padding: 11px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  animation: fadeUp 0.25s ease;
}
.gb-item-top { display: flex; align-items: center; gap: 8px; }
.gb-time { font-size: 10px; color: var(--gold); font-weight: 700; letter-spacing: 0.5px; flex-shrink: 0; }
.gb-edited-tag { font-size: 10px; color: var(--muted); font-weight: 300; }
.gb-actions { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; }
.gb-action-btn {
  background: none; border: 1px solid var(--border);
  color: var(--muted2); font-size: 10px; padding: 3px 10px;
  border-radius: 100px; cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.2s;
}
.gb-action-btn:hover { border-color: var(--blue); color: var(--blue); }
.gb-action-btn.danger:hover { border-color: var(--hanja); color: var(--hanja); }
.gb-action-btn.save { border-color: var(--gold); color: var(--gold); }
.gb-edit-row { display: flex; gap: 6px; align-items: center; }
.gb-edit-input {
  flex: 1; min-width: 0;
  background: var(--card2); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 12px;
  color: var(--text); font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px; outline: none;
}
.gb-edit-input:focus { border-color: var(--gold); }
.gb-text { font-size: 13px; color: var(--text); line-height: 1.7; font-weight: 300; white-space: pre-wrap; word-break: break-word; }
.gb-empty { font-size: 12px; color: var(--muted); text-align: center; padding: 18px 0; }

/* ── 토스트 ── */
.toast {
  position: fixed; bottom: 28px; right: 24px;
  background: var(--green); color: #090912;
  font-size: 11px; font-weight: 700; padding: 8px 16px;
  border-radius: 100px; opacity: 0; letter-spacing: 1px;
  transform: translateY(6px); transition: all 0.3s ease;
  pointer-events: none; z-index: 300;
  font-family: 'Noto Sans KR', sans-serif;
}
.toast.show { opacity: 1; transform: translateY(0); }

@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

@media (max-width: 600px) {
  .wrapper { padding: 0 16px 80px; }
  .header { padding: 28px 0 14px; }
  .header-date { font-size: 36px; }
  .hanja-char { font-size: 68px; }
  .hanja-char-block { width: 105px; }
  .quote-text { font-size: 16px; }
  .farm { height: 68px; }
}
</style>
</head>
<body>

<div class="wrapper">

  <header class="header">
    <div class="header-left">
      <div class="app-brand" onclick="location.reload()" title="새로고침" style="cursor:pointer;">
        오늘의 행복
        <span class="app-brand-badge">v4</span>
      </div>
      <div class="header-date" id="headerDate"></div>
      <div class="header-day" id="headerDay"></div>
    </div>
    <div class="header-right">
      <div class="sync-status" id="syncStatus" onclick="manualSync()">
        <div class="sync-dot" id="syncDot"></div>
        <span id="syncLabel">동기화</span>
      </div>
      <button class="gb-btn" onclick="jumpToGuestbook()">✏️ 방명록</button>
    </div>
  </header>

  <!-- 픽셀 농장 -->
  <div class="farm" id="farm">
    <div class="farm-ground"></div>
  </div>

  <!-- 1. 오늘의 명언 -->
  <div class="section-label">오늘의 명언</div>
  <div class="quote-card">
    <div class="quote-nav">
      <div class="quote-section-label" id="quoteDateLabel">QUOTE OF THE DAY</div>
      <div class="quote-arrows">
        <button class="quote-arrow" onclick="prevQuote()" title="이전">‹</button>
        <button class="quote-arrow" onclick="nextQuote()" title="다음">›</button>
      </div>
    </div>
    <div class="quote-text" id="quoteText"></div>
    <div class="quote-author-row">
      <div class="quote-author-block">
        <div class="quote-author-name" id="quoteAuthor"></div>
        <div class="quote-author-meta" id="quoteMeta"></div>
        <span class="quote-type-badge" id="quoteBadge" style="display:none;"></span>
      </div>
      <button class="meaning-toggle" id="meaningToggle" onclick="toggleMeaning()">의미 보기 ▾</button>
    </div>
    <div class="quote-meaning" id="quoteMeaning"></div>
    <div class="quote-index" id="quoteIndex"></div>
  </div>

  <!-- 2. 오늘의 사자성어 -->
  <div class="section-label">오늘의 사자성어</div>
  <div class="idiom-card">
    <div class="quote-nav">
      <div class="quote-section-label" style="color:var(--green);">FOUR-CHARACTER IDIOM</div>
      <div class="quote-arrows">
        <button class="quote-arrow" onclick="prevIdiom()" title="이전">‹</button>
        <button class="quote-arrow" onclick="nextIdiom()" title="다음">›</button>
      </div>
    </div>
    <div class="idiom-kor" id="idiomKor"></div>
    <div class="idiom-hanja" id="idiomHanja"></div>
    <div class="idiom-meaning" id="idiomMeaning"></div>
    <div class="idiom-story"><span class="idiom-story-label">📜 이렇게 생겨난 말이야</span><span id="idiomStory"></span></div>

<script>
// ══════════════════════════════════════════
// 명언 — 시간이 검증한 것들만. 반박당할 명언은 뺐어.
// + 하이쿠(俳句): 일본의 5·7·5 열일곱 자 짧은 시.
// ══════════════════════════════════════════
const QUOTES = [
  { text: "나는 내가 아무것도 모른다는 것을 안다.", author: "소크라테스 (Socrates)", country: "고대 그리스", years: "기원전 470 — 399",
    meaning: "철학의 출발점 '무지의 지'. 스스로 모른다는 걸 아는 사람이 진짜 배울 준비가 된 사람이야." },
  { text: "배우기만 하고 생각하지 않으면 헛되고, 생각만 하고 배우지 않으면 위태롭다.", author: "공자 (孔子)", country: "중국", years: "기원전 551 — 479",
    meaning: "논어 위정편. 학습과 사유는 수레의 두 바퀴 — 하나만으로는 굴러가지 않아. 기술사 공부에 딱 맞는 말이지." },
  { text: "습관은 제2의 천성이다.", author: "아리스토텔레스 (Aristoteles)", country: "고대 그리스", years: "기원전 384 — 322",
    meaning: "니코마코스 윤리학의 사상. 타고난 재능보다 반복된 행동이 사람을 만들어. 매일의 루틴이 중요한 이유야." },
  { text: "그대를 방해하는 것은 사물이 아니라, 사물에 대한 그대의 생각이다.", author: "에픽테토스 (Epictetus)", country: "로마 제국", years: "서기 50경 — 135경",
    meaning: "노예 출신 스토아 철학자. 외부 상황은 못 바꿔도, 그것을 어떻게 해석할지는 언제나 내 선택이야." },
  { text: "서둘러 살지 마라. 행복은 지금 여기에 있다.", author: "마르쿠스 아우렐리우스 (Marcus Aurelius)", country: "로마 제국", years: "121 — 180",
    meaning: "황제이자 철학자. 전쟁터에서 쓴 일기가 『명상록』이야. 성취에 집착하다 지금을 잃지 말라는 경고." },
  { text: "인생은 짧고, 기술은 길다.", author: "히포크라테스 (Hippocrates)", country: "고대 그리스", years: "기원전 460 — 370경",
    meaning: "의학의 아버지. 배울 것은 평생 다 못 배울 만큼 방대한데 시간은 짧다는 뜻. 그래서 오늘 하는 거야." },
  { text: "우리를 두렵게 하는 것은 대개 현실보다 상상이다.", author: "세네카 (Seneca)", country: "로마 제국", years: "기원전 4경 — 서기 65",
    meaning: "스토아 철학자. 걱정의 대부분은 실제로 일어나지 않아. 2천 년 전 사람이 한 말인데 지금도 유효해." },
  { text: "알면 알수록 모른다는 것이 많아진다.", author: "아이작 뉴턴 (Isaac Newton)", country: "영국", years: "1643 — 1727",
    meaning: "노년의 뉴턴은 자신을 '해변에서 조개 줍는 아이'에 비유했어. 진정한 앎은 겸손을 동반해." },
  { text: "무지는 지식보다 더 자주 확신을 낳는다.", author: "찰스 다윈 (Charles Darwin)", country: "영국", years: "1809 — 1882",
    meaning: "조금 알 때 가장 자신만만하고, 깊이 알수록 모르는 게 보이는 게 지식의 아이러니야." },
  { text: "상상력은 지식보다 중요하다. 지식은 한계가 있지만, 상상력은 세상을 품는다.", author: "알베르트 아인슈타인 (Albert Einstein)", country: "독일-미국", years: "1879 — 1955",
    meaning: "공식을 외우는 것보다 '왜?'라고 묻고 그림을 그리는 능력이 더 강하다는 뜻이야." },
  { text: "인간은 생각하는 갈대다.", author: "블레즈 파스칼 (Blaise Pascal)", country: "프랑스", years: "1623 — 1662",
    meaning: "우주 앞에서 갈대처럼 연약하지만, 생각할 수 있다는 것이 인간의 위엄이라는 뜻이야." },
  { text: "나는 생각한다, 고로 나는 존재한다.", author: "르네 데카르트 (René Descartes)", country: "프랑스", years: "1596 — 1650",
    meaning: "모든 것을 의심하던 끝에 찾아낸, 의심할 수 없는 단 하나. 존재의 가장 단단한 출발점." },
  { text: "독서는 완전한 사람을, 대화는 준비된 사람을, 글쓰기는 정확한 사람을 만든다.", author: "프랜시스 베이컨 (Francis Bacon)", country: "영국", years: "1561 — 1626",
    meaning: "읽어서 채우고, 말하면서 정리하고, 쓰면서 날카로워지는 것 — 공부의 세 단계를 이보다 깔끔하게 정리한 말이 없어." },
  { text: "가장 위대한 영광은 넘어지지 않는 데 있는 것이 아니라, 넘어질 때마다 일어서는 데 있다.", author: "넬슨 만델라 (Nelson Mandela)", country: "남아프리카공화국", years: "1918 — 2013",
    meaning: "27년 감옥 생활 후 대통령이 된 사람. 실패가 끝이 아니라는 걸 아는 게 중요해." },
  { text: "아는 사람은 말하지 않고, 말하는 사람은 알지 못한다.", author: "노자 (老子)", country: "중국", years: "기원전 6세기경",
    meaning: "도덕경 56장. 말이 많은 사람이 실은 불확실하기 때문에 말로 채우려 한다는 역설." },
  { text: "천 리 길도 발 아래서 시작된다.", author: "노자 (老子)", country: "중국", years: "기원전 6세기경",
    meaning: "도덕경 64장. 먼 목표에 압도되지 말고 지금 이 한 발에 집중하라는 뜻. 141회까지도 이렇게 가는 거야." },
  { text: "고요함 속에 위대한 힘이 있다.", author: "노자 (老子)", country: "중국", years: "기원전 6세기경",
    meaning: "도덕경의 무위 사상. 요란하게 애쓰는 것보다 차분히 중심을 지키는 것이 더 큰 힘을 발휘해." },
  { text: "모든 것이 변한다. 같은 강물에 두 번 발을 담글 수 없다.", author: "헤라클레이토스 (Heraclitus)", country: "고대 그리스", years: "기원전 535 — 475경",
    meaning: "변화를 두려워하기보다 그 흐름을 읽는 것이 지혜라는 뜻이야." },
  { text: "두 가지가 내 마음을 경외감으로 채운다. 내 머리 위의 별이 빛나는 하늘, 그리고 내 안의 도덕 법칙.", author: "임마누엘 칸트 (Immanuel Kant)", country: "독일 (프로이센)", years: "1724 — 1804",
    meaning: "그의 묘비에 새겨진 문장. 외부 우주의 광대함과 내면 양심의 무게가 같은 깊이라는 뜻." },
  { text: "모든 이론은 회색이고, 오직 생명의 황금 나무만이 녹색이다.", author: "괴테 (Goethe)", country: "독일", years: "1749 — 1832",
    meaning: "파우스트의 대사. 책 속 지식과 현장에서 몸으로 익힌 앎은 질적으로 달라. 감리 9년이 답안에 힘이 되는 이유." },
  { text: "사람은 자기가 이해한 만큼만 보인다.", author: "괴테 (Goethe)", country: "독일", years: "1749 — 1832",
    meaning: "아는 만큼 보인다. 배움이 쌓일수록 이전에 안 보이던 것들이 보이기 시작해." },
  { text: "재능은 고독 속에서 만들어지고, 성격은 세상의 조류 속에서 형성된다.", author: "괴테 (Goethe)", country: "독일", years: "1749 — 1832",
    meaning: "혼자 집중하는 시간이 실력을 키우고, 그걸 사람들 속에서 쓰는 과정이 인격을 다듬어." },
  { text: "인생을 이해하려면 뒤를 봐야 한다. 그러나 살아가려면 앞을 봐야 한다.", author: "쇠렌 키르케고르 (Søren Kierkegaard)", country: "덴마크", years: "1813 — 1855",
    meaning: "과거를 돌아보되, 거기에 발목 잡혀 앞으로 못 가는 것도 경계해야 해." },
  { text: "나를 죽이지 못하는 것은 나를 더 강하게 만든다.", author: "프리드리히 니체 (Friedrich Nietzsche)", country: "독일", years: "1844 — 1900",
    meaning: "힘든 경험을 통과한 사람은 그 전의 자신으로 돌아갈 수 없어 — 이미 더 강해졌으니까." },
  { text: "아름다움이 세상을 구원할 것이다.", author: "도스토옙스키 (Dostoevsky)", country: "러시아", years: "1821 — 1881",
    meaning: "『백치』에 나오는 말. 진심 어린 선의와 진실됨이 세상을 낫게 만든다는 믿음." },
  { text: "행복의 비결은 더 많은 것을 원하는 것이 아니라, 더 많이 사랑하는 능력이다.", author: "버트런드 러셀 (Bertrand Russell)", country: "영국", years: "1872 — 1970",
    meaning: "욕망을 키우는 게 아니라, 이미 있는 것들에 대한 사랑과 감사를 키우는 것이 진짜 행복이야." },
  { text: "우주는 인간을 이해하도록 의무지워져 있지 않다.", author: "리처드 파인만 (Richard Feynman)", country: "미국", years: "1918 — 1988",
    meaning: "모른다는 것 자체를 편안하게 받아들이는 태도, 그게 진짜 과학 정신이야." },
  { text: "자기 자신을 극복하는 자가 가장 강한 자다.", author: "공자 (孔子)", country: "중국", years: "기원전 551 — 479",
    meaning: "극기복례(克己復禮). 어제의 나보다 오늘의 내가 조금이라도 나은 것, 그게 진짜 승리야." },
  { text: "군자는 말은 더디 하고 행동은 민첩하게 한다.", author: "공자 (孔子)", country: "중국", years: "기원전 551 — 479",
    meaning: "논어 이인편. 입으로 떠드는 것보다 실제로 해내는 것이 더 가치 있다는 말이야." },
  { text: "군자는 화합하되 같아지지 않는다.", author: "공자 (孔子)", country: "중국", years: "기원전 551 — 479",
    meaning: "논어 자로편. 남과 잘 지내되 소신까지 버리지는 않는 태도. 감리 일 하면서 곱씹을 만하지." },
  { text: "오늘 읽지 않는 사람은 어제 읽지 못한 사람보다 나을 것이 없다.", author: "마크 트웨인 (Mark Twain)", country: "미국", years: "1835 — 1910",
    meaning: "읽을 수 있는데 읽지 않는 것은 읽지 못하는 것과 결과가 같다는 따끔한 말." },
  { text: "지혜로운 자는 많은 것을 알지만, 배움을 멈추지 않는다.", author: "정약용 (丁若鏞)", country: "조선", years: "1762 — 1836",
    meaning: "다산은 18년 유배 중에도 500여 권을 썼어. 많이 알수록 더 많이 모른다는 걸 알게 되는 것이 지혜야." },
  { text: "세상에서 가장 어려운 일은 자기 자신을 아는 것이고, 가장 쉬운 일은 남을 비판하는 것이다.", author: "탈레스 (Thales)", country: "고대 그리스", years: "기원전 624 — 546경",
    meaning: "최초의 철학자. 비판하기 전에 먼저 자신을 돌아보는 것이 지혜의 시작이야." },
  { text: "위험을 무릅쓰고 나아가라. 인생 자체가 위험이다.", author: "헬렌 켈러 (Helen Keller)", country: "미국", years: "1880 — 1968",
    meaning: "보지도 듣지도 못했지만 세상과 소통한 사람. 새로운 시도 앞의 두려움은 당연해 — 그래도 가는 거야." },
  { text: "작은 사람들이 이 세상을 이루고 있다. 모든 위대한 것은 결국 그 작은 사람들의 모임이다.", author: "빅토르 위고 (Victor Hugo)", country: "프랑스", years: "1802 — 1885",
    meaning: "레미제라블의 작가. 매일 묵묵히 공부하고 일하는 사람들이 세상을 떠받치고 있어." },
  { text: "인생에서 두려워할 것은 없다. 이해해야 할 것이 있을 뿐이다.", author: "마리 퀴리 (Marie Curie)", country: "폴란드-프랑스", years: "1867 — 1934",
    meaning: "두 분야에서 노벨상을 받은 유일한 과학자. 낯선 것을 두려움이 아니라 이해의 대상으로 대하라는 뜻." },
  { text: "단순함이야말로 최고의 정교함이다.", author: "레오나르도 다빈치 (Leonardo da Vinci)", country: "이탈리아", years: "1452 — 1519",
    meaning: "복잡하게 꾸미기보다 본질만 남기는 것이 진짜 실력. 답안지 쓸 때도 마찬가지야." },
  { text: "나는 대리석 속에서 천사를 보았고, 천사가 자유로워질 때까지 조각했다.", author: "미켈란젤로 (Michelangelo)", country: "이탈리아", years: "1475 — 1564",
    meaning: "이미 안에 있는 가능성을 발견하고 불필요한 것을 덜어내는 것이 창작이라는 관점." },
  { text: "하늘이 장차 큰 임무를 맡기려 할 때는 반드시 먼저 그 마음을 괴롭게 한다.", author: "맹자 (孟子)", country: "중국", years: "기원전 372 — 289",

  { text: "역경 속에서도 여전히 아름다움이 존재한다고 믿는다.", author: "안네 프랑크 (Anne Frank)", country: "독일-네덜란드", years: "1929 — 1945",

  { text: "죽고자 하면 살고, 살고자 하면 죽는다.", author: "이순신 (李舜臣)", country: "조선", years: "1545 — 1598",

  { text: "하루라도 책을 읽지 않으면 입 안에 가시가 돋는다.", author: "안중근 (安重根)", country: "대한제국", years: "1879 — 1910",
    meaning: "여순 감옥에서 남긴 유묵(一日不讀書 口中生荊棘). 죽음 앞에서도 배움을 놓지 않았던 의지." },
  { text: "우리는 별의 물질로 이루어져 있다.", author: "칼 세이건 (Carl Sagan)", country: "미국", years: "1934 — 1996",

  { text: "성공이 끝이 아니고 실패가 끝이 아니다. 중요한 것은 계속하는 용기다.", author: "윈스턴 처칠 (Winston Churchill)", country: "영국", years: "1874 — 1965",

  { text: "물은 배를 띄우기도 하고 뒤집기도 한다.", author: "순자 (荀子)", country: "중국", years: "기원전 313경 — 238경",
    meaning: "나를 지지하는 기반이 동시에 나를 무너뜨릴 수도 있으니 항상 겸손하고 신중하라는 뜻." },
  { text: "훈련이 힘들수록 전투는 쉬워진다.", author: "알렉산드르 수보로프 (Alexander Suvorov)", country: "러시아 제국", years: "1729 — 1800",
    meaning: "평생 전투에서 패한 적 없는 장군. 평소의 혹독한 준비가 결정적 순간의 여유를 만들어. 400분 손글씨 훈련이 딱 이거지." },
  { text: "오래된 연못 —\n개구리 뛰어드는\n물소리", author: "마쓰오 바쇼 (松尾芭蕉)", country: "일본 에도시대", years: "1644 — 1694", type: "하이쿠",
    meaning: "세상에서 가장 유명한 하이쿠. 하이쿠는 5·7·5 열일곱 자로 한 순간을 붙잡는 일본의 짧은 시야. 설명하지 않고 장면만 툭 던지는데, 고요함이 오히려 소리 하나로 완성되지." },
  { text: "고요함이여 —\n바위에 스며드는\n매미의 소리", author: "마쓰오 바쇼 (松尾芭蕉)", country: "일본 에도시대", years: "1644 — 1694", type: "하이쿠",

  { text: "달팽이여,\n천천히 오르렴\n후지산을", author: "고바야시 잇사 (小林一茶)", country: "일본 에도시대", years: "1763 — 1828", type: "하이쿠",

  { text: "이슬의 세상은\n이슬의 세상이지만,\n그렇지만…", author: "고바야시 잇사 (小林一茶)", country: "일본 에도시대", years: "1763 — 1828", type: "하이쿠",
    meaning: "어린 딸을 잃고 쓴 구절. 인생이 이슬처럼 덧없다는 걸 머리로는 알아도, 마음은 '그렇지만'에서 멈춰버려. 그 미완성이 이 시의 전부야." },
  { text: "유채꽃이여 —\n달은 동쪽에\n해는 서쪽에", author: "요사 부손 (与謝蕪村)", country: "일본 에도시대", years: "1716 — 1784", type: "하이쿠",

  { text: "감을 먹는데\n종이 울리는구나,\n호류지", author: "마사오카 시키 (正岡子規)", country: "일본 메이지시대", years: "1867 — 1902", type: "하이쿠",

  { text: "나팔꽃 넝쿨에\n두레박을 빼앗겨\n물 얻으러 간다", author: "가가노 치요니 (加賀千代女)", country: "일본 에도시대", years: "1703 — 1775", type: "하이쿠",

  { text: "도둑이\n두고 갔구나 —\n창가의 달", author: "료칸 (良寛)", country: "일본 에도시대", years: "1758 — 1831", type: "하이쿠",

// ══════════════════════════════════════════
// 상태 & 유틸
// ══════════════════════════════════════════
const NOW = new Date();
const DAY_ANCHOR = new Date(2026, 0, 1);
function dayIdx() {
  const t = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
  return Math.round((t - DAY_ANCHOR) / 86400000);
}
function mod(n, m) { return ((n % m) + m) % m; }
function todayKey() { return `${NOW.getFullYear()}_${NOW.getMonth()}_${NOW.getDate()}`; }

const QUOTE_PHASE = 7, IDIOM_PHASE = 38, ENG_PHASE = 49, HANJA_PHASE = 34;

function ls(key, fallback = null) {
  try {
    const v = localStorage.getItem(key);
    return v !== null ? JSON.parse(v) : fallback;
  } catch { return fallback; }
}
function touchKey(key) {
  try {
    const raw = localStorage.getItem('_ts_index');
    const idx = raw ? JSON.parse(raw) : {};
    idx[key] = Date.now();
    localStorage.setItem('_ts_index', JSON.stringify(idx));
  } catch {}
}
function lsSet(key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));
    touchKey(key);
  } catch {}
}

function initDate() {
  const y = NOW.getFullYear();
  const m = String(NOW.getMonth() + 1).padStart(2, '0');
  const d = String(NOW.getDate()).padStart(2, '0');
  document.getElementById('headerDate').textContent = `${y}.${m}.${d}`;
  const days = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
  document.getElementById('headerDay').textContent = days[NOW.getDay()];
  document.getElementById('quoteDateLabel').textContent = `${m}.${d} 오늘의 명언`;
}

// ══════════════════════════════════════════
// 명언 — 날짜에 고정. 하루에 하나씩 순서대로 순환해서
// 전체를 다 돌기 전엔 같은 명언이 다시 안 나와.
// ══════════════════════════════════════════
function getCurrentQuoteIdx() {
  const offset = ls(`quote_offset_${todayKey()}`, 0);
  return mod(dayIdx() + QUOTE_PHASE + offset, QUOTES.length);
}
function renderQuote() {
  const idx = getCurrentQuoteIdx();
  const q = QUOTES[idx];
  document.getElementById('quoteText').textContent = q.type === '하이쿠' ? q.text : `"${q.text}"`;
  document.getElementById('quoteAuthor').textContent = q.author;
  document.getElementById('quoteMeta').textContent = `${q.country}  ·  ${q.years}`;
  document.getElementById('quoteMeaning').textContent = q.meaning;
  document.getElementById('quoteIndex').textContent = `${idx + 1} / ${QUOTES.length}`;
  const badge = document.getElementById('quoteBadge');
  if (q.type) { badge.textContent = q.type; badge.style.display = 'inline-block'; }
  else { badge.style.display = 'none'; }
  const box = document.getElementById('quoteMeaning');
  const btn = document.getElementById('meaningToggle');
  box.classList.remove('open'); btn.classList.remove('open'); btn.textContent = '의미 보기 ▾';
}
function nextQuote() { lsSet(`quote_offset_${todayKey()}`, ls(`quote_offset_${todayKey()}`, 0) + 1); renderQuote(); }
function prevQuote() { lsSet(`quote_offset_${todayKey()}`, ls(`quote_offset_${todayKey()}`, 0) - 1); renderQuote(); }
function toggleMeaning() {
  const box = document.getElementById('quoteMeaning');
  const btn = document.getElementById('meaningToggle');
  const open = box.classList.toggle('open');
  btn.classList.toggle('open', open);
  btn.textContent = open ? '의미 닫기 ▴' : '의미 보기 ▾';
}

// ══════════════════════════════════════════
// 사자성어
// ══════════════════════════════════════════
function getCurrentIdiomIdx() {
  const offset = ls(`idiom_offset_${todayKey()}`, 0);
  return mod(dayIdx() + IDIOM_PHASE + offset, IDIOMS.length);
}
function renderIdiom() {
  const idx = getCurrentIdiomIdx();
  const it = IDIOMS[idx];
  document.getElementById('idiomKor').textContent = it.kor;
  document.getElementById('idiomHanja').textContent = it.hanja;
  document.getElementById('idiomMeaning').textContent = it.meaning;
  document.getElementById('idiomStory').textContent = ' ' + it.story;
  document.getElementById('idiomIndex').textContent = `${idx + 1} / ${IDIOMS.length}`;
}
function nextIdiom() { lsSet(`idiom_offset_${todayKey()}`, ls(`idiom_offset_${todayKey()}`, 0) + 1); renderIdiom(); }
function prevIdiom() { lsSet(`idiom_offset_${todayKey()}`, ls(`idiom_offset_${todayKey()}`, 0) - 1); renderIdiom(); }

// ══════════════════════════════════════════
// 영어단어
// ══════════════════════════════════════════
function getCurrentWordIdx() {
  const offset = ls(`word_offset_${todayKey()}`, 0);
  return mod(dayIdx() + ENG_PHASE + offset, ENGLISH.length);
}
function renderEnglish() {
  const idx = getCurrentWordIdx();
  const w = ENGLISH[idx];
  document.getElementById('engWord').textContent = w.word;
  document.getElementById('engPos').textContent = w.pos;
  document.getElementById('engPron').textContent = w.pron;
  document.getElementById('engMeaning').textContent = w.meaning;
  document.getElementById('engExample').textContent = w.example;
  document.getElementById('engExampleKor').textContent = w.exampleKor;
  document.getElementById('engIndex').textContent = `${idx + 1} / ${ENGLISH.length}`;
}
function nextWord() { lsSet(`word_offset_${todayKey()}`, ls(`word_offset_${todayKey()}`, 0) + 1); renderEnglish(); }
function prevWord() { lsSet(`word_offset_${todayKey()}`, ls(`word_offset_${todayKey()}`, 0) - 1); renderEnglish(); }

// ══════════════════════════════════════════
// 한자 — 어제 / 오늘 / 내일
// ══════════════════════════════════════════
let hanjaShift = 0;
function getHanjaIdx(shift) { return mod(dayIdx() + HANJA_PHASE + shift, HANJA.length); }
function setHanjaShift(s) {
  hanjaShift = s;
  document.getElementById('tabPrev').classList.toggle('active', s === -1);
  document.getElementById('tabToday').classList.toggle('active', s === 0);
  document.getElementById('tabNext').classList.toggle('active', s === 1);
  renderHanja();
}
function renderHanja() {
  document.getElementById('tabPrevChar').textContent = HANJA[getHanjaIdx(-1)].char;
  document.getElementById('tabTodayChar').textContent = HANJA[getHanjaIdx(0)].char;
  document.getElementById('tabNextChar').textContent = HANJA[getHanjaIdx(1)].char;
  const h = HANJA[getHanjaIdx(hanjaShift)];
  document.getElementById('hanjaChar').textContent = h.char;
  document.getElementById('hanjaStroke').textContent = h.stroke;
  document.getElementById('hanjaKor').textContent = h.kor;
  document.getElementById('hanjaChi').textContent = h.chi;
  document.getElementById('hanjaMeaning').textContent = h.meaning;
  document.getElementById('hanjaGrade').textContent = h.grade === '사찰·비석' ? '🏯 사찰·비석 단골' : `한자검정 ${h.grade}`;
  document.getElementById('hanjaOrigin').textContent = h.origin;
  document.getElementById('hanjaExample').textContent = h.example;
  document.getElementById('hanjaStrokeLink').href = 'https://hanja.dict.naver.com/search?query=' + encodeURIComponent(h.char);
}
function toggleHanja() {
  const detail = document.getElementById('hanjaDetail');
  const btn = document.getElementById('hanjaBtn');
  const open = detail.classList.toggle('open');
  btn.textContent = open ? '유래 · 예시 · 획순 닫기 ▴' : '유래 · 예시 · 획순 보기 ▾';
}

// ══════════════════════════════════════════
// 방명록 — 날짜에 안 묶임. 계속 쌓이는 하나의 흐름.
// ══════════════════════════════════════════
let editingGbId = null;

function migrateToGuestbook() {
  if (ls('gb_migrated_v4')) return;
  const gb = ls('guestbook', []) || [];
  const have = new Set(gb.map(e => e.id));
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
  keys.forEach(k => {
    if (/^entries_\d+_\d+_\d+$/.test(k)) {
      const [y, m, d] = k.slice(8).split('_').map(Number);
      const arr = ls(k, []) || [];
      if (!Array.isArray(arr)) return;
      arr.forEach(e => {
        if (!e || !e.id || !e.text) return;
        const id = 'mig_' + e.id;
        if (have.has(id)) return;
        gb.push({ id, ts: e.ts || new Date(y, m, d, 12).getTime(), text: e.text, editedTs: e.editedTs, deleted: e.deleted, deletedTs: e.deletedTs });
        have.add(id);
      });
    } else if (/^memo_\d+_\d+_\d+$/.test(k)) {
      const [y, m, d] = k.slice(5).split('_').map(Number);
      const t = ls(k, '');
      if (t && String(t).trim()) {
        const id = 'migmemo_' + k;
        if (!have.has(id)) { gb.push({ id, ts: new Date(y, m, d, 12).getTime(), text: String(t) }); have.add(id); }
      }
    }
  });
  gb.sort((a, b) => (a.ts || 0) - (b.ts || 0));
  lsSet('guestbook', gb);
  lsSet('gb_migrated_v4', true);
}

function fmtGbDate(ts) {
  const d = new Date(ts);
  const days = ['일','월','화','수','목','금','토'];
  return `${d.getMonth() + 1}.${d.getDate()}(${days[d.getDay()]}) ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function submitGb() {
  const input = document.getElementById('gbInput');
  const text = input.value.trim();
  if (!text) return;
  const gb = ls('guestbook', []) || [];
  gb.push({ id: `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`, ts: Date.now(), text });
  lsSet('guestbook', gb);
  input.value = '';
  renderGb();
  showToast('방명록에 남김 ✓');
  syncAfterChange();
}
function startEditGb(id) { editingGbId = id; renderGb(); }
function cancelEditGb() { editingGbId = null; renderGb(); }
function saveEditGb(id, newTextRaw) {
  const newText = (newTextRaw || '').trim();
  if (!newText) return;
  const gb = ls('guestbook', []) || [];
  const i = gb.findIndex(x => x.id === id);
  if (i !== -1) { gb[i].text = newText; gb[i].editedTs = Date.now(); lsSet('guestbook', gb); }
  editingGbId = null;
  renderGb(); showToast('수정됨 ✓'); syncAfterChange();
}
function deleteGb(id) {
  if (!confirm('이 글을 삭제할까?')) return;
  const gb = ls('guestbook', []) || [];
  const i = gb.findIndex(x => x.id === id);
  if (i !== -1) { gb[i].deleted = true; gb[i].deletedTs = Date.now(); lsSet('guestbook', gb); }
  renderGb(); showToast('삭제됨 ✓'); syncAfterChange();
}

function renderGb() {
  const list = document.getElementById('gbList');
  const gb = (ls('guestbook', []) || []).filter(e => !e.deleted).sort((a, b) => (b.ts || 0) - (a.ts || 0));
  list.innerHTML = '';
  if (!gb.length) {
    list.innerHTML = `<div class="gb-empty">첫 글을 남겨봐. 여기 글은 계속 쌓여.</div>`;
    return;
  }
  gb.forEach(e => {
    const el = document.createElement('div');
    el.className = 'gb-item';
    if (editingGbId === e.id) {
      const row = document.createElement('div');
      row.className = 'gb-edit-row';
      const input = document.createElement('input');
      input.type = 'text'; input.className = 'gb-edit-input'; input.value = e.text;
      const saveBtn = document.createElement('button');
      saveBtn.className = 'gb-action-btn save'; saveBtn.textContent = '저장';
      saveBtn.addEventListener('click', () => saveEditGb(e.id, input.value));
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'gb-action-btn'; cancelBtn.textContent = '취소';
      cancelBtn.addEventListener('click', cancelEditGb);
      input.addEventListener('keydown', ev => {
        if (ev.key === 'Enter') { ev.preventDefault(); saveEditGb(e.id, input.value); }
        if (ev.key === 'Escape') { ev.preventDefault(); cancelEditGb(); }
      });
      row.appendChild(input); row.appendChild(saveBtn); row.appendChild(cancelBtn);
      el.appendChild(row); list.appendChild(el);
      setTimeout(() => { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }, 0);
      return;
    }
    const top = document.createElement('div');
    top.className = 'gb-item-top';
    const timeSpan = document.createElement('span');
    timeSpan.className = 'gb-time'; timeSpan.textContent = fmtGbDate(e.ts || 0);
    top.appendChild(timeSpan);
    if (e.editedTs) {
      const tag = document.createElement('span');
      tag.className = 'gb-edited-tag'; tag.textContent = '(수정됨)';
      top.appendChild(tag);
    }
    const actions = document.createElement('div');
    actions.className = 'gb-actions';
    const editBtn = document.createElement('button');
    editBtn.className = 'gb-action-btn'; editBtn.textContent = '수정';
    editBtn.addEventListener('click', () => startEditGb(e.id));
    const delBtn = document.createElement('button');
    delBtn.className = 'gb-action-btn danger'; delBtn.textContent = '삭제';
    delBtn.addEventListener('click', () => deleteGb(e.id));
    actions.appendChild(editBtn); actions.appendChild(delBtn);
    top.appendChild(actions);
    const textDiv = document.createElement('div');
    textDiv.className = 'gb-text'; textDiv.textContent = e.text;
    el.appendChild(top); el.appendChild(textDiv);
    list.appendChild(el);
  });
}

function jumpToGuestbook() {
  document.getElementById('gbSection').scrollIntoView({ behavior: 'smooth' });
  setTimeout(() => document.getElementById('gbInput').focus({ preventScroll: true }), 600);
}

document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('gbInput');
  if (input) input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); submitGb(); }
  });
});

// 토스트

let toastTimer = null;
function showToast(msg = '저장됨 ✓') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);

// ══════════════════════════════════════════
// 🐥 픽셀 농장
// ══════════════════════════════════════════
const PX = 3;
const PALETTE = { y:'#f2c744', d:'#c99a2e', b:'#3a2f1b', O:'#e8853a', o:'#b56a25', w:'#efe6d0', s:'#d9cdb0', p:'#d47f9e', g:'#5d7a42', G:'#48613a' };
const CHICK_MAP = [
  "..yyyy..",
  ".yyyyyy.",
  ".yyyyby.",
  ".yyyyyyO",
  "yyyyyyy.",
  ".dyyyyy.",
  "..yyyy..",
  "..o..o.."
];
const EGG_MAP = [
  "..ww..",
  ".wwww.",
  "wwwwww",
  "wwwwww",
  "wswwsw",
  ".wwww."
];
const FLOWER_MAP = [ "p.p", ".y.", "p.p", ".g.", ".g." ];
const GRASS_MAP = [ "g.g", "gGg" ];

function buildSprite(map, cls) {
  const wrap = document.createElement('div');
  wrap.className = 'pxwrap ' + (cls || '');
  const inner = document.createElement('div');
  inner.className = 'pxinner';
  const px = document.createElement('div');
  px.className = 'px';
  const shadows = [];
  map.forEach((row, y) => {
    [...row].forEach((c, x) => {
      if (PALETTE[c]) shadows.push(`${x * PX}px ${y * PX}px 0 ${PALETTE[c]}`);
    });
  });
  px.style.boxShadow = shadows.join(',');
  const w = map[0].length * PX, h = map.length * PX;
  wrap.style.width = w + 'px';
  wrap.style.height = h + 'px';
  inner.style.width = w + 'px';
  inner.style.height = h + 'px';
  inner.appendChild(px);
  wrap.appendChild(inner);
  return wrap;
}

function initFarm() {
  const farm = document.getElementById('farm');
  let W = farm.clientWidth;
  const rand = (a, b) => a + Math.random() * (b - a);

  for (let i = 0; i < 4; i++) {
    const g = buildSprite(GRASS_MAP, 'deco');
    g.style.left = rand(10, W - 20) + 'px';
    farm.appendChild(g);
  }
  for (let i = 0; i < 3; i++) {
    const f = buildSprite(FLOWER_MAP, 'deco');
    f.style.left = rand(20, W - 30) + 'px';
    farm.appendChild(f);
  }

  const egg = buildSprite(EGG_MAP, 'egg');
  egg.style.left = rand(W * 0.55, W * 0.8) + 'px';
  egg.title = '?';
  egg.addEventListener('click', () => {
    egg.classList.remove('wobble'); void egg.offsetWidth; egg.classList.add('wobble');
    showToast('…꼼틀 🥚');
  });
  farm.appendChild(egg);

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const chicks = [];
  for (let i = 0; i < 3; i++) {
    const el = buildSprite(CHICK_MAP, 'chick');
    el.title = '삐약';
    el.addEventListener('click', () => showToast('삐약! 🐥'));
    farm.appendChild(el);
    chicks.push({ el, x: rand(20, W - 50), dir: Math.random() < 0.5 ? 1 : -1, v: rand(0.35, 0.75), mode: 'walk', t: 0 });
  }
  const draw = c => { c.el.style.transform = `translateX(${c.x}px) scaleX(${c.dir})`; };
  chicks.forEach(draw);

  if (reduced) return;

  setInterval(() => {
    W = farm.clientWidth;
    chicks.forEach(c => {
      if (c.mode === 'walk') {
        c.x += c.dir * c.v;
        if (c.x < 6) { c.x = 6; c.dir = 1; }
        if (c.x > W - 32) { c.x = W - 32; c.dir = -1; }
        const r = Math.random();
        if (r < 0.015) { c.mode = 'peck'; c.t = 7; c.el.classList.add('peck'); }
        else if (r < 0.03) { c.mode = 'pause'; c.t = Math.floor(rand(8, 30)); }
        else if (r < 0.04) { c.el.classList.add('hop'); setTimeout(() => c.el.classList.remove('hop'), 180); }
      } else if (c.mode === 'peck') {
        if (--c.t <= 0) { c.el.classList.remove('peck'); c.mode = 'walk'; }
      } else if (c.mode === 'pause') {
        if (--c.t <= 0) { if (Math.random() < 0.5) c.dir *= -1; c.mode = 'walk'; }
      }
      draw(c);
    });
  }, 90);

  setInterval(() => {
    if (document.visibilityState !== 'visible') return;
    egg.classList.remove('wobble'); void egg.offsetWidth; egg.classList.add('wobble');
  }, 24000);
}

// ☁️ JSONBin 동기화 — 반드시 "받아서 합치기 → 올리기" 순서만 사용
// ══════════════════════════════════════════
const BIN_ID = '69e029c936566621a8ba3891';
const API_KEY = '$2a$10$GmXIwyo5n3LB7JIEvjSycumI89.62DFRm8UGsH4FBgJs4jBdm/kBq';
const AUTO_SYNC_INTERVAL = 60 * 60 * 1000;

function detectDevice() {
  const ua = navigator.userAgent;
  if (/iPhone/i.test(ua)) return '📱 아이폰';
  if (/iPad/i.test(ua)) return '📱 아이패드';
  if (/Android/i.test(ua)) return '📱 안드로이드';
  if (/Mac/i.test(ua)) return '💻 맥';
  if (/Windows/i.test(ua)) return '💻 PC';
  return '🌐 브라우저';
}
function setSyncUI(state) {
  const dot = document.getElementById('syncDot');
  const label = document.getElementById('syncLabel');
  dot.className = 'sync-dot';
  if (state === 'syncing') { dot.classList.add('syncing'); label.textContent = '동기화 중...'; }
  else if (state === 'synced') { dot.classList.add('synced'); label.textContent = '동기화됨'; }
  else { label.textContent = '동기화'; }
}

async function cloudPushRaw() {
  const data = { timestamp: Date.now(), device: detectDevice() };
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    try { data[k] = JSON.parse(localStorage.getItem(k)); }
    catch { data[k] = localStorage.getItem(k); }
  }
  await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
    body: JSON.stringify(data)
  });
  lsSet('last_sync_ts', Date.now());
}

// id 기반 병합 대상: 방명록 + (구버전) 날짜별 기록
function isMergedListKey(k) { return k === 'guestbook' || k.startsWith('entries_'); }

async function cloudPullMerge() {
  const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
    headers: { 'X-Master-Key': API_KEY }
  });
  const json = await res.json();
  const cloud = json.record;
  if (!cloud) return;

  const localIdx = ls('_ts_index', {}) || {};
  const cloudIdx = cloud['_ts_index'] || {};
  let idxChanged = false;

  Object.keys(cloud).forEach(k => {
    if (k === 'timestamp' || k === 'device' || k === '_ts_index') return;

    if (isMergedListKey(k)) {
      const localArr = ls(k, []) || [];
      const cloudArr = Array.isArray(cloud[k]) ? cloud[k] : [];
      const versionTime = e => Math.max(e.ts || 0, e.editedTs || 0, e.deletedTs || 0);
      const map = new Map();
      localArr.forEach(e => { if (e && e.id) map.set(e.id, e); });
      cloudArr.forEach(e => {
        if (!e || !e.id) return;
        const existing = map.get(e.id);
        if (!existing || versionTime(e) > versionTime(existing)) map.set(e.id, e);
      });
      const merged = Array.from(map.values()).sort((a, b) => (a.ts || 0) - (b.ts || 0));
      if (JSON.stringify(merged) !== JSON.stringify(localArr)) {
        try { localStorage.setItem(k, JSON.stringify(merged)); } catch {}
      }
      return;
    }

    const localExists = localStorage.getItem(k) !== null;
    const cloudTs = cloudIdx[k] || 0;
    const localTs = localIdx[k] || 0;
    if (!localExists || cloudTs > localTs) {
      try {
        localStorage.setItem(k, typeof cloud[k] === 'string' ? cloud[k] : JSON.stringify(cloud[k]));
        localIdx[k] = cloudTs || Date.now();
        idxChanged = true;
      } catch {}
    }
  });

  if (idxChanged) {
    try { localStorage.setItem('_ts_index', JSON.stringify(localIdx)); } catch {}
  }
}

async function syncAfterChange() {
  setSyncUI('syncing');
  try {
    await cloudPullMerge();
    migrateToGuestbook();
    renderGb();
    await cloudPushRaw();
    setSyncUI('synced');
  } catch {
    setSyncUI('idle');
  }
}
async function manualSync() { await syncAfterChange(); }

async function initialSync() {
  setSyncUI('syncing');
  try {
    await cloudPullMerge();
    migrateToGuestbook();
    renderGb();
    setSyncUI('synced');
    const last = ls('last_sync_ts', 0);
    if (Date.now() - last > AUTO_SYNC_INTERVAL) await cloudPushRaw();
  } catch {
    setSyncUI('idle');
  }
}
async function backgroundPull() {
  try {
    await cloudPullMerge();
    renderGb();
  } catch {}
}
