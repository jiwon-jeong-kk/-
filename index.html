<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="오늘의 행복">
<meta name="theme-color" content="#090912">
<title>오늘의 행복</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #090912;
  --surface: #111119;
  --card:    #16161f;
  --card2:   #1c1c27;
  --border:  rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --gold:    #c9a96e;
  --gold-dim: rgba(201,169,110,0.12);
  --blue:    #6baed6;
  --blue-dim: rgba(107,174,214,0.1);
  --hanja:   #d4846a;
  --hanja-dim: rgba(212,132,106,0.1);
  --green:   #6bbfa0;
  --green-dim: rgba(107,191,160,0.1);
  --text:    #ede9e0;
  --muted:   #5c5c72;
  --muted2:  #7a7a8f;
  --success: #6bbfa0;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 15% 10%, rgba(201,169,110,0.035) 0%, transparent 70%),
    radial-gradient(ellipse 50% 60% at 85% 90%, rgba(107,174,214,0.03) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}

.wrapper {
  position: relative; z-index: 1;
  max-width: 720px; margin: 0 auto;
  padding: 0 22px 100px;
}

/* ── 헤더 ── */
.header {
  padding: 44px 0 32px;
  display: flex; align-items: flex-start; justify-content: space-between;
  border-bottom: 1px solid var(--border);
  margin-bottom: 36px;
}
.header-left {}
.app-brand {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 10px; letter-spacing: 5px;
  color: var(--muted2); text-transform: uppercase;
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.app-brand-badge {
  background: var(--gold); color: #090912;
  font-size: 8px; font-weight: 700; letter-spacing: 1px;
  padding: 2px 6px; border-radius: 4px;
  font-family: 'Noto Sans KR', sans-serif;
}
.header-date {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 48px; font-weight: 800;
  color: var(--text); line-height: 1;
  letter-spacing: -1px;
}
.header-day {
  font-size: 12px; color: var(--muted2);
  font-weight: 300; letter-spacing: 3px;
  margin-top: 6px;
}
.header-right {
  display: flex; flex-direction: column;
  align-items: flex-end; gap: 8px; padding-top: 4px;
}
.sync-status {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--muted); cursor: pointer;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 100px;
  transition: all 0.2s;
}
.sync-status:hover { border-color: var(--border2); color: var(--muted2); }
.sync-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--muted); transition: background 0.3s;
}
.sync-dot.synced { background: var(--green); }
.sync-dot.syncing { background: var(--gold); animation: pulse 1s infinite; }
.cal-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted2); font-family: 'Noto Sans KR', sans-serif;
  font-size: 11px; padding: 6px 14px; border-radius: 100px;
  cursor: pointer; transition: all 0.2s; letter-spacing: 1px;
}
.cal-btn:hover { border-color: var(--gold); color: var(--gold); }

/* ── 섹션 라벨 ── */
.section-label {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 9px; letter-spacing: 5px;
  color: var(--muted); text-transform: uppercase;
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 12px;
}
.section-label::after {
  content: ''; flex: 1; height: 1px;
  background: var(--border);
}

/* ── 공용 nav (명언/사자성어/영어단어 공용) ── */
.quote-nav {
  display: flex; align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.quote-section-label {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 9px; letter-spacing: 4px;
  color: var(--gold);
}
.quote-arrows { display: flex; gap: 4px; }
.quote-arrow {
  background: none; border: 1px solid var(--border);
  color: var(--muted2); width: 28px; height: 28px;
  border-radius: 50%; cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; font-family: 'Noto Sans KR', sans-serif;
}
.quote-arrow:hover { border-color: var(--gold); color: var(--gold); }
.quote-index {
  text-align: right; margin-top: 12px;
  font-size: 10px; color: var(--muted);
  letter-spacing: 1px;
}

/* ── 명언 카드 ── */
.quote-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px; padding: 28px;
  margin-bottom: 16px;
  position: relative;
}
.quote-card::before {
  content: '"';
  position: absolute; top: 16px; left: 22px;
  font-family: 'Nanum Myeongjo', serif;
  font-size: 60px; color: var(--gold-dim);
  line-height: 1; pointer-events: none;
  font-weight: 800;
}
.quote-text {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 19px; font-weight: 700;
  color: var(--text); line-height: 1.7;
  margin-bottom: 18px; margin-top: 8px;
  padding-left: 2px;
}
.quote-author-row {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 12px;
}
.quote-author-block {}
.quote-author-name {
  font-size: 13px; font-weight: 600;
  color: var(--gold); margin-bottom: 2px;
}
.quote-author-meta {
  font-size: 11px; color: var(--muted2);
  font-weight: 300; letter-spacing: 0.5px;
}
.meaning-toggle {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted); font-family: 'Noto Sans KR', sans-serif;
  font-size: 10px; padding: 5px 12px; border-radius: 100px;
  cursor: pointer; transition: all 0.2s; white-space: nowrap;
  flex-shrink: 0;
}
.meaning-toggle:hover { border-color: var(--blue); color: var(--blue); }
.meaning-toggle.open { border-color: var(--blue); color: var(--blue); }
.quote-meaning {
  display: none;
  margin-top: 16px; padding: 16px 18px;
  background: var(--blue-dim);
  border: 1px solid rgba(107,174,214,0.15);
  border-radius: 10px;
  font-size: 13px; color: var(--muted2);
  line-height: 1.85; font-weight: 300;
  animation: fadeUp 0.25s ease;
}
.quote-meaning.open { display: block; }

/* ── 사자성어 카드 ── */
.idiom-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px; padding: 28px;
  margin-bottom: 16px;
}
.idiom-kor {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 27px; font-weight: 800;
  color: var(--green); margin-top: 10px; margin-bottom: 4px;
}
.idiom-hanja {
  font-size: 13px; color: var(--muted2);
  letter-spacing: 2px; margin-bottom: 16px;
}
.idiom-meaning {
  font-size: 14px; color: var(--text);
  line-height: 1.8; margin-bottom: 14px; font-weight: 400;
}
.idiom-usage {
  padding: 14px 16px;
  background: var(--green-dim);
  border: 1px solid rgba(107,191,160,0.18);
  border-radius: 10px;
  font-size: 13px; color: var(--muted2);
  line-height: 1.8; font-weight: 300;
}
.idiom-usage-label {
  color: var(--green); font-weight: 700; font-size: 11px;
  display: block; margin-bottom: 4px; letter-spacing: 0.5px;
}

/* ── 한자 카드 ── */
.hanja-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 16px;
}
.hanja-top { display: flex; gap: 0; }
.hanja-char-block {
  width: 130px; flex-shrink: 0;
  background: var(--hanja-dim);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 28px 16px;
  position: relative;
}
.hanja-char {
  font-family: 'Noto Serif SC', 'Nanum Myeongjo', serif;
  font-size: 86px; font-weight: 700;
  color: var(--hanja);
  line-height: 1;
  text-shadow: 0 0 40px rgba(212,132,106,0.25);
}
.hanja-stroke { font-size: 10px; color: var(--muted); letter-spacing: 1px; margin-top: 8px; }
.hanja-info { flex: 1; padding: 24px 22px; display: flex; flex-direction: column; gap: 6px; }
.hanja-info-row { display: flex; align-items: baseline; gap: 10px; }
.hanja-kor { font-family: 'Nanum Myeongjo', serif; font-size: 20px; font-weight: 700; color: var(--text); }
.hanja-chi { font-size: 13px; color: var(--muted2); font-style: italic; }
.hanja-meaning { font-size: 12px; color: var(--muted2); line-height: 1.6; margin-top: 2px; }
.hanja-grade {
  display: inline-block;
  background: rgba(212,132,106,0.12);
  border: 1px solid rgba(212,132,106,0.25);
  color: var(--hanja);
  font-size: 10px; font-weight: 700;
  padding: 2px 8px; border-radius: 4px;
  letter-spacing: 1px; margin-top: 6px;
}
.hanja-expand-btn {
  width: 100%; background: none; border: none;
  border-top: 1px solid var(--border);
  color: var(--muted2); font-family: 'Noto Sans KR', sans-serif;
  font-size: 11px; padding: 12px;
  cursor: pointer; transition: all 0.2s; letter-spacing: 1px;
}
.hanja-expand-btn:hover { background: var(--card2); color: var(--hanja); }
.hanja-detail { display: none; padding: 18px 22px; border-top: 1px solid var(--border); animation: fadeUp 0.25s ease; }
.hanja-detail.open { display: block; }
.hanja-detail-title { font-size: 10px; letter-spacing: 3px; color: var(--hanja); margin-bottom: 10px; font-family: 'Nanum Myeongjo', serif; }
.hanja-detail-text { font-size: 13px; color: var(--muted2); line-height: 1.9; font-weight: 300; margin-bottom: 12px; }
.hanja-example {
  background: var(--hanja-dim);
  border: 1px solid rgba(212,132,106,0.15);
  border-radius: 8px; padding: 10px 14px;
  font-size: 13px; color: var(--text);
  font-family: 'Nanum Myeongjo', serif;
  margin-bottom: 14px;
}
.hanja-stroke-link {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--hanja);
  border: 1px solid rgba(212,132,106,0.3);
  padding: 8px 14px; border-radius: 100px;
  text-decoration: none; transition: all 0.2s;
}
.hanja-stroke-link:hover { background: var(--hanja-dim); }
.hanja-stroke-note {
  font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.6; font-weight: 300;
}

/* ── 영어단어 카드 ── */
.eng-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px; padding: 28px;
  margin-bottom: 16px;
}
.eng-word-row { display: flex; align-items: baseline; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.eng-word { font-family: 'Nanum Myeongjo', serif; font-size: 28px; font-weight: 800; color: var(--blue); }
.eng-pos {
  font-size: 11px; color: var(--muted2);
  border: 1px solid var(--border); padding: 2px 9px; border-radius: 100px;
}
.eng-pron { font-size: 13px; color: var(--muted2); margin: 8px 0 16px; font-style: italic; }
.eng-meaning { font-size: 14px; color: var(--text); line-height: 1.8; margin-bottom: 14px; }
.eng-example {
  font-size: 13px; color: var(--text); line-height: 1.7;
  background: var(--blue-dim); border: 1px solid rgba(107,174,214,0.15);
  border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
}
.eng-example-kor { font-size: 12px; color: var(--muted2); padding: 0 2px; font-weight: 300; }

/* ── 오늘의 기록 ── */
.entries-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px; padding: 20px 22px;
  margin-bottom: 16px;
}
.entry-input-row { display: flex; gap: 8px; margin-bottom: 4px; }
.entry-input {
  flex: 1; min-width: 0; background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 100px; padding: 11px 18px;
  color: var(--text); font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px; outline: none; transition: border-color 0.2s;
}
.entry-input:focus { border-color: var(--gold); }
.entry-input::placeholder { color: var(--muted); }
.entry-submit {
  flex-shrink: 0;
  background: var(--gold); border: none;
  color: #090912; font-weight: 700;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 12px; padding: 0 16px;
  border-radius: 100px; cursor: pointer;
  transition: opacity 0.2s; white-space: nowrap;
}
.entry-submit:hover { opacity: 0.85; }
.entry-list {
  margin-top: 16px;
  display: flex; flex-direction: column; gap: 10px;
  max-height: 360px; overflow-y: auto;
  scrollbar-gutter: stable;
}
.entry-item {
  display: flex; flex-direction: column; gap: 6px;
  padding: 11px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  animation: fadeUp 0.25s ease;
}
.entry-item-top { display: flex; align-items: center; gap: 8px; }
.entry-time { font-size: 10px; color: var(--gold); font-weight: 700; letter-spacing: 0.5px; flex-shrink: 0; font-family: 'Noto Sans KR', sans-serif; }
.entry-edited-tag { font-size: 10px; color: var(--muted); font-weight: 300; }
.entry-actions { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; }
.entry-action-btn {
  background: none; border: 1px solid var(--border);
  color: var(--muted2); font-size: 10px; padding: 3px 10px;
  border-radius: 100px; cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.2s;
}
.entry-action-btn:hover { border-color: var(--blue); color: var(--blue); }
.entry-action-btn.danger:hover { border-color: var(--hanja); color: var(--hanja); }
.entry-action-btn.save { border-color: var(--gold); color: var(--gold); }
.entry-action-btn.save:hover { opacity: 0.85; }
.entry-edit-row { display: flex; gap: 6px; align-items: center; }
.entry-edit-input {
  flex: 1; min-width: 0;
  background: var(--card2); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 12px;
  color: var(--text); font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px; outline: none; transition: border-color 0.2s;
}
.entry-edit-input:focus { border-color: var(--gold); }
.entry-text { font-size: 13px; color: var(--text); line-height: 1.7; font-weight: 300; white-space: pre-wrap; word-break: break-word; }
.entry-empty { font-size: 12px; color: var(--muted); text-align: center; padding: 18px 0; }

/* ── 달력 모달 ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(8px);
  z-index: 100; display: none;
  align-items: center; justify-content: center;
  padding: 20px;
}
.modal-overlay.show { display: flex; animation: fadeUp 0.25s ease; }
.cal-modal {
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: 20px; padding: 28px 24px;
  width: 100%; max-width: 420px;
  max-height: 90vh; overflow-y: auto;
}
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
.cal-nav {
  background: none; border: 1px solid var(--border);
  color: var(--muted2); font-size: 14px;
  padding: 6px 13px; border-radius: 100px;
  cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.2s;
}
.cal-nav:hover { border-color: var(--gold); color: var(--gold); }
.cal-title { font-family: 'Nanum Myeongjo', serif; font-size: 17px; font-weight: 700; color: var(--text); }
.cal-close { background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; padding: 4px 8px; transition: color 0.2s; }
.cal-close:hover { color: var(--text); }
.cal-days-header {
  display: grid; grid-template-columns: repeat(7,1fr);
  text-align: center; font-size: 10px; color: var(--muted);
  margin-bottom: 8px; gap: 3px; letter-spacing: 1px;
}
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }
.cal-cell {
  aspect-ratio: 1; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.15s; color: var(--muted2);
}
.cal-cell:hover { background: var(--card2); color: var(--text); }
.cal-cell.empty { cursor: default; pointer-events: none; }
.cal-cell.today { border: 1px solid var(--gold); color: var(--gold); font-weight: 700; }
.cal-cell.has-memo { background: rgba(107,174,214,0.12); color: var(--blue); }
.cal-cell.has-memo.today { border-color: var(--gold); }
.cal-cell.selected { outline: 2px solid var(--blue); outline-offset: 1px; }
.cal-detail { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 18px; display: none; animation: fadeUp 0.2s ease; }
.cal-detail.show { display: block; }
.cal-detail-date { font-family: 'Nanum Myeongjo', serif; font-size: 12px; color: var(--gold); letter-spacing: 2px; margin-bottom: 12px; }
.cal-detail-empty { font-size: 12px; color: var(--muted); text-align: center; padding: 20px 0; }
.cal-detail-entries { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; }
.cal-detail-entry { display: flex; gap: 10px; align-items: flex-start; background: var(--card2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 13px; }
.cal-detail-entry-time { font-size: 10px; color: var(--gold); font-weight: 700; flex-shrink: 0; padding-top: 1px; }
.cal-detail-entry-text { font-size: 13px; color: var(--muted2); line-height: 1.7; font-weight: 300; white-space: pre-wrap; word-break: break-word; }

/* ── 토스트 ── */
.toast {
  position: fixed; bottom: 28px; right: 24px;
  background: var(--green); color: #090912;
  font-size: 11px; font-weight: 700; padding: 8px 16px;
  border-radius: 100px; opacity: 0; letter-spacing: 1px;
  transform: translateY(6px); transition: all 0.3s ease;
  pointer-events: none; z-index: 300;
  font-family: 'Noto Sans KR', sans-serif;
}
.toast.show { opacity: 1; transform: translateY(0); }

@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

@media (max-width: 600px) {
  .wrapper { padding: 0 16px 80px; }
  .header { padding: 28px 0 20px; }
  .header-date { font-size: 36px; }
  .hanja-char { font-size: 68px; }
  .hanja-char-block { width: 105px; }
  .quote-text { font-size: 16px; }
}
</style>
</head>
<body>

<div class="wrapper">

  <header class="header">
    <div class="header-left">
      <div class="app-brand" onclick="location.reload()" title="새로고침" style="cursor:pointer;">
        오늘의 행복
        <span class="app-brand-badge">v3</span>
      </div>
      <div class="header-date" id="headerDate"></div>
      <div class="header-day" id="headerDay"></div>
    </div>
    <div class="header-right">
      <div class="sync-status" id="syncStatus" onclick="manualSync()">
        <div class="sync-dot" id="syncDot"></div>
        <span id="syncLabel">동기화</span>
      </div>
      <button class="cal-btn" onclick="openCal()">📅 기록 달력</button>
    </div>
  </header>

  <!-- 사자성어 -->
  <div class="section-label">오늘의 사자성어</div>
  <div class="idiom-card">
    <div class="quote-nav">
      <div class="quote-section-label" style="color:var(--green);">FOUR-CHARACTER IDIOM</div>
      <div class="quote-arrows">
        <button class="quote-arrow" onclick="prevIdiom()" title="이전">‹</button>
        <button class="quote-arrow" onclick="nextIdiom()" title="다음">›</button>
      </div>
    </div>
    <div class="idiom-kor" id="idiomKor"></div>
    <div class="idiom-hanja" id="idiomHanja"></div>
    <div class="idiom-meaning" id="idiomMeaning"></div>
    <div class="idiom-usage"><span class="idiom-usage-label">💬 이럴 때 써봐</span><span id="idiomUsage"></span></div>
    <div class="quote-index" id="idiomIndex"></div>
  </div>

<script>
// ══════════════════════════════════════════
// 명언 데이터
// ══════════════════════════════════════════
const QUOTES = [
  { text: "나는 내가 아무것도 모른다는 것을 안다.", author: "소크라테스 (Socrates)", country: "고대 그리스", years: "기원전 470 — 399",
    meaning: "철학의 출발점으로 불리는 '무지의 지(無知의 知)'. 소크라테스는 아테네 현인들을 찾아다니며 대화했는데, 그들이 안다고 믿는 것들이 사실은 근거 없는 착각임을 하나씩 밝혀냈어. 스스로 모른다는 걸 아는 사람이 오히려 진짜 배울 준비가 된 사람이라는 뜻이야." },
  { text: "배우기만 하고 생각하지 않으면 헛되고, 생각만 하고 배우지 않으면 위태롭다.", author: "공자 (孔子, Confucius)", country: "중국", years: "기원전 551 — 479",
    meaning: "논어(論語) 위정편에 나오는 말이야. 학습과 사유는 수레의 두 바퀴 같아서, 하나만으로는 제대로 굴러가지 않아. 소방기술사 공부에도 딱 맞는 말이지 않아?" },
  { text: "자기 자신을 아는 것이 모든 지혜의 시작이다.", author: "아리스토텔레스 (Aristoteles)", country: "고대 그리스", years: "기원전 384 — 322",
    meaning: "플라톤의 제자이자 알렉산드로스 대왕의 스승. 이 말은 자기 강점과 약점, 욕구와 두려움을 냉정하게 직시하는 사람만이 올바른 선택을 내릴 수 있다는 뜻이야." },
  { text: "그대를 방해하는 것은 사물이 아니라, 사물에 대한 그대의 생각이다.", author: "에픽테토스 (Epictetus)", country: "로마 제국 (그리스인)", years: "서기 50경 — 135경",
    meaning: "노예 출신의 스토아 철학자. 외부 상황은 내가 바꿀 수 없지만, 그것을 어떻게 해석하고 반응하느냐는 언제나 내 선택이라는 것." },
  { text: "서둘러 살지 마라. 행복은 지금 여기에 있다.", author: "마르쿠스 아우렐리우스 (Marcus Aurelius)", country: "로마 제국", years: "121 — 180",
    meaning: "로마 황제이면서 철학자. 전쟁터에서 틈틈이 쓴 일기가 『명상록(Meditations)』이야. 성취에 집착하다 보면 정작 살아있는 지금을 잃어버린다는 경고야." },
  { text: "인생은 짧고, 기술은 길다.", author: "히포크라테스 (Hippocrates)", country: "고대 그리스", years: "기원전 460 — 370경",
    meaning: "의학의 아버지. 원문은 라틴어 'Ars longa, vita brevis.' 배워야 할 것은 평생이 지나도 다 배울 수 없을 만큼 방대한데, 우리에게 주어진 시간은 짧다는 뜻이야." },
  { text: "우리가 아직 살고 있는 한, 죽음은 없다. 죽음이 오면, 우리는 없다.", author: "에피쿠로스 (Epicurus)", country: "고대 그리스", years: "기원전 341 — 270",
    meaning: "쾌락주의 철학자로 오해받지만, 사실 그가 말한 쾌락은 '고통의 부재'에 가까워. 죽음을 두려워하는 것이 얼마나 무의미한지를 논리적으로 보여줘." },
  { text: "알면 알수록 모른다는 것이 많아진다.", author: "아이작 뉴턴 (Isaac Newton)", country: "영국", years: "1643 — 1727",
    meaning: "중력 법칙, 운동 법칙, 미적분학의 발명자. 노년의 뉴턴은 자신을 '해변에서 조개를 줍는 아이'에 비유했어. 진정한 앎은 겸손을 동반해." },
  { text: "상상력은 지식보다 중요하다. 지식은 한계가 있지만, 상상력은 세상을 품는다.", author: "알베르트 아인슈타인 (Albert Einstein)", country: "독일-미국", years: "1879 — 1955",
    meaning: "상대성이론의 창시자. 정해진 공식을 외우는 것보다 '왜?'라고 묻고 그림을 그리는 능력이 더 강하다는 뜻이야." },
  { text: "인간은 생각하는 갈대다.", author: "블레즈 파스칼 (Blaise Pascal)", country: "프랑스", years: "1623 — 1662",
    meaning: "갈대처럼 우주 앞에서 연약한 존재이지만, 생각할 수 있다는 것이 인간의 위엄이라는 뜻이야." },
  { text: "나는 생각한다, 고로 나는 존재한다.", author: "르네 데카르트 (René Descartes)", country: "프랑스", years: "1596 — 1650",
    meaning: "모든 것을 의심하던 데카르트가 끝내 의심할 수 없는 것 하나를 찾아낸 말이야. 존재의 가장 단단한 출발점." },
  { text: "독서는 완전한 사람을, 대화는 준비된 사람을, 글쓰기는 정확한 사람을 만든다.", author: "프랜시스 베이컨 (Francis Bacon)", country: "영국", years: "1561 — 1626",
    meaning: "경험주의 철학의 선구자. 읽어서 채우고, 말하면서 정리하고, 쓰면서 날카로워지는 것 — 공부의 세 단계를 이보다 깔끔하게 정리한 말이 없어." },
  { text: "가장 위대한 영광은 넘어지지 않는 데 있는 것이 아니라, 넘어질 때마다 일어서는 데 있다.", author: "넬슨 만델라 (Nelson Mandela)", country: "남아프리카공화국", years: "1918 — 2013",
    meaning: "27년간 감옥에 갇혀 있다가 나와서 대통령이 된 사람. 실패와 좌절이 없는 사람은 없어. 중요한 건 그것이 끝이 아니라는 걸 아는 것." },
  { text: "진정한 배움은 자기 자신에게서 온다. 스승은 방향을 가리킬 뿐이야.", author: "소크라테스 (Socrates)", country: "고대 그리스", years: "기원전 470 — 399",
    meaning: "소크라테스는 '산파술(Maieutics)'이라는 방법을 썼어. 지식은 주입받는 게 아니라 내면에서 발아하는 거야." },
  { text: "아는 사람은 말하지 않고, 말하는 사람은 알지 못한다.", author: "노자 (老子, Laozi)", country: "중국", years: "기원전 571경 — 471경",
    meaning: "도덕경(道德經) 56장에 나오는 말이야. 말이 많은 사람이 실은 불확실하기 때문에 말로 채우려 한다는 역설." },
  { text: "강은 앞으로만 흘러가지 않는다. 한 방울의 물이 바다가 된다.", author: "장자 (莊子, Zhuangzi)", country: "중국", years: "기원전 369 — 286",
    meaning: "도가 철학의 거장. 조금 더 멀리, 더 크게 보면 전혀 다른 길이 보이기도 해." },
  { text: "모든 것이 변한다. 같은 강물에 두 번 발을 담글 수 없다.", author: "헤라클레이토스 (Heraclitus)", country: "고대 그리스", years: "기원전 535 — 475경",
    meaning: "변화를 철학의 근본으로 삼은 철학자. 변화를 두려워하기보다 그 안에서 흐름을 읽는 것이 지혜라는 뜻이야." },
  { text: "인간은 자유롭게 태어났으나, 도처에서 쇠사슬에 묶여 있다.", author: "장자크 루소 (Jean-Jacques Rousseau)", country: "스위스-프랑스", years: "1712 — 1778",
    meaning: "사회계약론의 첫 문장이야. 당연하게 받아들이는 많은 제약들이 사실 누군가 만들어놓은 것이라는 거." },
  { text: "두 가지가 내 마음을 경외감으로 채운다. 내 머리 위의 별이 빛나는 하늘, 그리고 내 안의 도덕 법칙.", author: "임마누엘 칸트 (Immanuel Kant)", country: "독일 (프로이센)", years: "1724 — 1804",
    meaning: "순수이성비판의 저자. 외부 우주의 광대함과 내면 양심의 무게가 같은 깊이라는 이 문장은 그의 묘비에도 새겨져 있어." },
  { text: "모든 이론은 회색이고, 오직 생명의 황금 나무만이 녹색이다.", author: "요한 볼프강 폰 괴테 (Johann Wolfgang von Goethe)", country: "독일", years: "1749 — 1832",
    meaning: "파우스트에 나오는 대사. 배운 것을 실제로 써봐야 진짜 내 것이 돼. 책 속의 지식과 현장에서 몸으로 익힌 앎은 질적으로 달라." },
  { text: "인생을 이해하려면 뒤를 봐야 한다. 그러나 살아가려면 앞을 봐야 한다.", author: "쇠렌 키르케고르 (Søren Kierkegaard)", country: "덴마크", years: "1813 — 1855",
    meaning: "실존주의 철학의 아버지. 후회 없이 살기 위해 과거를 돌아보되, 그것에 발목 잡혀 앞을 못 가는 것도 경계해야 해." },
  { text: "나를 죽이지 못하는 것은 나를 더 강하게 만든다.", author: "프리드리히 니체 (Friedrich Nietzsche)", country: "독일", years: "1844 — 1900",
    meaning: "우상의 황혼에 나오는 문장. 힘든 경험을 통과한 사람은 그 전의 자신으로 돌아갈 수 없어 — 이미 더 강해졌으니까." },
  { text: "아름다움이 세상을 구원할 것이다.", author: "표도르 도스토옙스키 (Fyodor Dostoevsky)", country: "러시아", years: "1821 — 1881",
    meaning: "백치(The Idiot)에 나오는 말이야. 인간이 서로에게 진심 어린 선의를 보이고 진실되게 살아갈 때 세상은 나아진다는 믿음." },
  { text: "인간은 자유라는 형벌을 받았다.", author: "장폴 사르트르 (Jean-Paul Sartre)", country: "프랑스", years: "1905 — 1980",
    meaning: "실존주의 철학자. 우리는 태어날 때 정해진 목적이 없어. 스스로 선택하고 그 선택에 책임지며 의미를 만들어가야 해." },
  { text: "행복의 비결은 더 많은 것을 원하는 것이 아니라, 더 많이 사랑하는 능력이다.", author: "버트런드 러셀 (Bertrand Russell)", country: "영국", years: "1872 — 1970",
    meaning: "수학자이자 철학자, 노벨 문학상 수상자. 욕망을 키우는 것이 아니라 이미 있는 것들에 대한 사랑과 감사를 키우는 것이 진짜 행복이라는 뜻이야." },
  { text: "우주는 인간을 이해하도록 의무지워져 있지 않다.", author: "리처드 파인만 (Richard Feynman)", country: "미국", years: "1918 — 1988",
    meaning: "노벨 물리학상 수상자. 모른다는 것 자체를 편안하게 받아들이는 태도, 그게 진짜 과학 정신이야." },
  { text: "어제는 역사이고, 내일은 미스터리이지만, 오늘은 선물이다. 그래서 현재(present)라고 부른다.", author: "앨리스 얼 (Alice Morse Earle)", country: "미국", years: "1853 — 1911",
    meaning: "역사학자이자 작가. Present에는 '현재'와 '선물'이라는 두 가지 의미가 있어. 지금 이 순간을 충분히 살아내는 것이 가장 큰 선물이라는 뜻이야." },
  { text: "자기 자신을 극복하는 자가 가장 강한 자다.", author: "공자 (孔子, Confucius)", country: "중국", years: "기원전 551 — 479",
    meaning: "논어에서 '克己復禮(극기복례)'에서 비롯돼. 어제의 나보다 오늘의 내가 조금이라도 나은 사람이 되는 것, 그것이 진정한 승리야." },
  { text: "오늘 읽지 않는 사람은 어제 읽지 못한 사람보다 나을 것이 없다.", author: "마크 트웨인 (Mark Twain)", country: "미국", years: "1835 — 1910",
    meaning: "학교를 거의 다니지 않았지만 독서로 세상을 이해한 사람이야. 읽을 수 있는데 읽지 않는 것은 읽지 못하는 것과 결과가 같다는 따끔한 말." },
  { text: "철학은 죽음을 연습하는 것이다.", author: "플라톤 (Plato)", country: "고대 그리스", years: "기원전 428 — 348",
    meaning: "여기서 '죽음'은 육체적 욕망과 일상의 집착에서 벗어나는 것을 의미해. 잠깐 멈추고 진짜 중요한 것이 무엇인지 생각하는 것이 철학이야." },
  { text: "지식은 힘이다.", author: "프랜시스 베이컨 (Francis Bacon)", country: "영국", years: "1561 — 1626",
    meaning: "그냥 아는 것이 힘이 아니라, 그 앎으로 세상에 작용할 수 있을 때 진짜 힘이 돼. 체계적으로 관찰하고 검증하는 것이 지식을 힘으로 만드는 과정이야." },
  { text: "재능은 고독 속에서 만들어지고, 성격은 세상의 조류 속에서 형성된다.", author: "요한 볼프강 폰 괴테 (Johann Wolfgang von Goethe)", country: "독일", years: "1749 — 1832",
    meaning: "깊은 집중과 혼자 있는 시간이 진짜 실력을 키우고, 그것을 사람들 속에서 쓰는 과정이 인격을 다듬어." },
  { text: "지혜로운 자는 많은 것을 알지만, 배움을 멈추지 않는다.", author: "정약용 (丁若鏞)", country: "조선 (한국)", years: "1762 — 1836",
    meaning: "다산 정약용. 18년간의 유배 생활 중에도 500여 권의 책을 썼어. 많이 알수록 더 많이 모른다는 것을 알게 되는 것이 진짜 지혜라는 뜻이야." },
  { text: "천 리 길도 발 아래서 시작된다.", author: "노자 (老子, Laozi)", country: "중국", years: "기원전 571경 — 471경",
    meaning: "도덕경 64장. 먼 목표를 바라보며 압도되기보다는 지금 이 한 발 한 발에 집중하라는 뜻이야." },
  { text: "군자는 말은 더디 하고 행동은 민첩하게 한다.", author: "공자 (孔子, Confucius)", country: "중국", years: "기원전 551 — 479",
    meaning: "논어 이인편. 입으로 떠드는 것보다 실제로 해내는 것이 더 가치 있다는 말이야." },
  { text: "세상에서 가장 어려운 일은 자기 자신을 아는 것이고, 가장 쉬운 일은 남을 비판하는 것이다.", author: "탈레스 (Thales)", country: "고대 그리스", years: "기원전 624 — 546경",
    meaning: "최초의 철학자. 비판하기 전에 먼저 자신을 돌아보는 것이 지혜의 시작이야." },
  { text: "생각하는 것은 인간이 할 수 있는 가장 어려운 일이다. 아마 그래서 그것을 하는 사람이 극히 드물 것이다.", author: "헨리 포드 (Henry Ford)", country: "미국", years: "1863 — 1947",
    meaning: "자동차왕이지만 이 말은 꽤 철학적이야. 비판적으로 따져보고 연결하고 의문을 품는 것 — 그게 진짜 생각이야." },
  { text: "무지는 지식보다 더 자주 확신을 낳는다.", author: "찰스 다윈 (Charles Darwin)", country: "영국", years: "1809 — 1882",
    meaning: "진화론의 창시자. 던닝-크루거 효과를 100년 전에 꿰뚫어 본 말이야. 조금 알 때 가장 자신만만하고, 깊이 알수록 얼마나 모르는지 보이는 게 지식의 아이러니야." },
  { text: "위험을 무릅쓰고 나아가라. 인생 자체가 위험이다.", author: "헬렌 켈러 (Helen Keller)", country: "미국", years: "1880 — 1968",
    meaning: "보지 못하고 듣지 못했지만 글을 쓰고 강연을 하며 세상과 소통한 사람. 새로운 시도 앞에 두려움이 오는 건 당연해 — 그래도 가는 거야." },
  { text: "작은 사람들이 이 세상을 이루고 있다. 모든 위대한 것은 결국 그 작은 사람들의 모임이다.", author: "빅토르 위고 (Victor Hugo)", country: "프랑스", years: "1802 — 1885",
    meaning: "레미제라블의 작가. 이름 없이 하루하루 성실하게 살아가는 사람들이 세상을 떠받치고 있어. 매일 묵묵히 공부하는 사람이 언젠가 역사를 바꿔." },
  { text: "사람은 자기가 이해한 만큼만 보인다.", author: "요한 볼프강 폰 괴테 (Johann Wolfgang von Goethe)", country: "독일", years: "1749 — 1832",
    meaning: "아는 만큼 보인다는 말이야. 배움이 쌓일수록 이전에 보이지 않던 것들이 보이기 시작해." },
  { text: "인생에서 두려워할 것은 없다. 이해해야 할 것이 있을 뿐이다.", author: "마리 퀴리 (Marie Curie)", country: "폴란드-프랑스", years: "1867 — 1934",
    meaning: "여성 최초 노벨상 수상자이자 유일하게 두 분야(물리학·화학)에서 노벨상을 받은 과학자. 낯선 것을 두려워하기보다 이해하려는 태도로 다가가라는 뜻이야." },
  { text: "단순함이야말로 최고의 정교함이다.", author: "레오나르도 다빈치 (Leonardo da Vinci)", country: "이탈리아", years: "1452 — 1519",
    meaning: "정확한 출처는 불분명하지만 다빈치의 사상과 잘 어울려 널리 인용되는 말이야. 복잡하게 꾸미기보다 본질만 남기는 것이 진짜 실력이라는 뜻." },
  { text: "하늘이 장차 큰 임무를 맡기려 할 때는 반드시 먼저 그 마음을 괴롭게 한다.", author: "맹자 (孟子, Mencius)", country: "중국", years: "기원전 372 — 289",
    meaning: "고자하편에 나오는 말이야. 큰 사람이 되기 전에 반드시 시련이 따른다는 뜻으로, 지금의 고생이 헛되지 않다는 위로이기도 해." },
  { text: "아는 것에 투자하는 것이 가장 이자가 높다.", author: "벤저민 프랭클린 (Benjamin Franklin)", country: "미국", years: "1706 — 1790",
    meaning: "미국 건국의 아버지 중 한 명이자 다방면의 발명가. 자기계발에 쓰는 시간과 돈이 결국 가장 확실한 투자라는 뜻이야." },
  { text: "천재는 1%의 영감과 99%의 노력이다.", author: "토마스 에디슨 (Thomas Edison)", country: "미국", years: "1847 — 1931",
    meaning: "발명왕. 많은 사람들이 1% 영감에만 주목하지만, 정작 에디슨이 강조한 건 나머지 99%의 꾸준한 노력이었어." },
  { text: "당신의 시간은 한정되어 있다. 그러니 다른 사람의 삶을 사느라 시간을 낭비하지 마라.", author: "스티브 잡스 (Steve Jobs)", country: "미국", years: "1955 — 2011",
    meaning: "2005년 스탠퍼드 대학 졸업식 연설의 한 구절. 남의 기대에 맞춰 살기보다 자기 확신을 따라 살라는 메시지야." },
  { text: "위대한 일은 충동이 아니라 작은 일들이 모여 이루어진다.", author: "빈센트 반 고흐 (Vincent van Gogh)", country: "네덜란드", years: "1853 — 1890",
    meaning: "생전에는 인정받지 못했던 화가. 그가 동생 테오에게 보낸 편지에 담긴 말로, 꾸준한 작은 실천의 힘을 강조해." },
  { text: "나는 대리석 속에서 천사를 보았고, 천사가 자유로워질 때까지 조각했다.", author: "미켈란젤로 (Michelangelo)", country: "이탈리아", years: "1475 — 1564",
    meaning: "르네상스 최고의 조각가. 이미 그 안에 있는 가능성을 발견하고 불필요한 것을 덜어내는 것이 창작이라는 관점을 보여줘." },
  { text: "우리를 두렵게 하는 것은 대개 현실보다 상상이다.", author: "세네카 (Seneca)", country: "로마 제국", years: "기원전 4경 — 서기 65",
    meaning: "스토아 철학자이자 정치가. 걱정의 대부분은 실제로 일어나지 않는다는 뜻으로, 지금도 불안 관리에 자주 인용돼." },
  { text: "역경 속에서도 여전히 아름다움이 존재한다고 믿는다.", author: "안네 프랑크 (Anne Frank)", country: "독일-네덜란드", years: "1929 — 1945",
    meaning: "나치 점령 하에 은신하며 일기를 쓴 소녀. 가장 절망적인 상황에서도 희망을 놓지 않았던 태도가 담긴 문장이야." },
  { text: "사람들은 당신이 한 말은 잊어도, 당신이 준 느낌은 잊지 않는다.", author: "마야 안젤루 (Maya Angelou)", country: "미국", years: "1928 — 2014",
    meaning: "시인이자 인권운동가. 논리나 말솜씨보다 상대에게 남긴 마음이 더 오래 기억된다는 뜻이야." },
  { text: "죽고자 하면 살고, 살고자 하면 죽는다.", author: "이순신 (李舜臣)", country: "조선", years: "1545 — 1598",
    meaning: "명량해전을 앞두고 부하들에게 한 말(必死則生 必生則死). 절박한 상황일수록 각오를 다지는 태도가 오히려 살길을 만든다는 뜻이야." },
  { text: "네가 찾고 있는 것이 너를 찾고 있다.", author: "루미 (Rumi)", country: "페르시아", years: "1207 — 1273",
    meaning: "수피 신비주의 시인. 원문의 정확한 맥락은 학자마다 해석이 갈리지만, 간절히 구하는 것은 결국 서로 만나게 된다는 위로로 널리 사랑받는 말이야." },
  { text: "우리는 별의 물질로 이루어져 있다.", author: "칼 세이건 (Carl Sagan)", country: "미국", years: "1934 — 1996",
    meaning: "천문학자이자 과학 커뮤니케이터. 우리 몸을 이루는 원소들이 오래전 별의 핵융합에서 만들어졌다는 과학적 사실을 시적으로 표현한 말이야." },
  { text: "상상력이야말로 발견의 능력이다.", author: "에이다 러브레이스 (Ada Lovelace)", country: "영국", years: "1815 — 1852",
    meaning: "세계 최초의 프로그래머로 불리는 수학자. 논리만으로는 새로운 것을 발견할 수 없고, 상상력이 있어야 미지의 영역을 열 수 있다는 뜻이야." },
  { text: "성공이 끝이 아니고 실패가 끝이 아니다. 중요한 것은 계속하는 용기다.", author: "윈스턴 처칠 (Winston Churchill)", country: "영국", years: "1874 — 1965",
    meaning: "2차 세계대전을 이끈 영국 총리. 한 번의 성공이나 실패에 일희일비하지 말고 꾸준히 나아가는 것이 진짜 중요하다는 뜻이야." },
  { text: "하루라도 책을 읽지 않으면 입 안에 가시가 돋는다.", author: "안중근 (安重根)", country: "대한제국", years: "1879 — 1910",
    meaning: "여순 감옥에서 남긴 유묵(一日不讀書 口中生荊棘). 죽음을 앞둔 순간에도 배움을 놓지 않았던 의지가 담긴 말이야." },
  { text: "군자는 화합하되 같아지지 않는다.", author: "공자 (孔子, Confucius)", country: "중국", years: "기원전 551 — 479",
    meaning: "논어 자로편. 남과 잘 지내되 자기 소신까지 버리지는 않는 태도를 뜻해. 조직 생활할 때 곱씹어볼 만한 말이야." },
  { text: "습관은 제2의 천성이다.", author: "아리스토텔레스 (Aristoteles)", country: "고대 그리스", years: "기원전 384 — 322",
    meaning: "니코마코스 윤리학에 담긴 사상. 타고난 재능보다 반복된 행동이 결국 사람을 만든다는 뜻이야. 매일의 공부 루틴이 왜 중요한지 설명해줘." },
  { text: "고통 없이는 얻는 것도 없다.", author: "벤저민 프랭클린 (Benjamin Franklin)", country: "미국", years: "1706 — 1790",
    meaning: "원문 'No pain, no gain'의 원형으로 자주 인용되는 문장. 노력의 대가 없이 결과만 바랄 수 없다는 소박하지만 정확한 진리야." },
  { text: "낮은 자세로 오래 견디는 자가 결국 오른다.", author: "노자 (老子, Laozi)", country: "중국", years: "기원전 571경 — 471경",
    meaning: "도덕경의 물(水) 사상과 맞닿아 있어. 물은 가장 낮은 곳으로 흐르지만 결국 바다를 이룬다는 비유에서 나온 정신이야." },
  { text: "최고의 복수는 크게 성공하는 것이다.", author: "프랭크 시나트라 (Frank Sinatra)", country: "미국", years: "1915 — 1998",
    meaning: "가수이자 배우. 원한이나 다툼에 에너지를 쏟기보다, 자기 삶에서 실력으로 증명하라는 실용적인 조언이야." },
  { text: "훈련이 힘들수록 전투는 쉬워진다.", author: "알렉산드르 수보로프 (Alexander Suvorov)", country: "러시아 제국", years: "1729 — 1800",
    meaning: "평생 한 번도 전투에서 패배하지 않은 장군. 평소의 혹독한 준비가 결정적 순간의 여유를 만든다는 뜻이야. 시험 준비에도 그대로 적용돼." },
  { text: "고요함 속에 위대한 힘이 있다.", author: "노자 (老子, Laozi)", country: "중국", years: "기원전 571경 — 471경",
    meaning: "도덕경의 무위(無爲) 사상. 요란하게 애쓰는 것보다 차분히 중심을 지키는 것이 더 큰 힘을 발휘한다는 뜻이야." },
  { text: "실패는 성공으로 가는 길에 있는 하나의 사건일 뿐이다.", author: "오프라 윈프리 (Oprah Winfrey)", country: "미국", years: "1954 —",
    meaning: "빈곤과 학대를 딛고 미디어 거물이 된 방송인. 실패를 인생의 결론이 아니라 과정의 한 지점으로 바라보라는 뜻이야." },
  { text: "물은 배를 띄우기도 하고 뒤집기도 한다.", author: "순자 (荀子, Xunzi)", country: "중국", years: "기원전 313경 — 238경",
    meaning: "군주와 백성의 관계를 물과 배에 비유한 말. 나를 지지하는 기반이 동시에 나를 무너뜨릴 수도 있으니 항상 겸손하고 신중하라는 뜻이야." },
];

const IDIOMS = [
  { kor: "각주구검", hanja: "刻舟求劍", meaning: "배에 표시를 해두고 물에 빠진 칼을 찾으려 함 — 상황이 바뀐 줄도 모르고 옛 방식만 고집함.", usage: "시대나 상황이 변했는데도 예전 방식을 고집하는 사람을 지적할 때." },
  { kor: "감언이설", hanja: "甘言利說", meaning: "달콤한 말과 이로운 조건을 내세워 남을 꾐.", usage: "사기나 과한 유혹을 경계해야 할 때." },
  { kor: "개과천선", hanja: "改過遷善", meaning: "지난 잘못을 고치고 착하게 됨.", usage: "잘못을 뉘우치고 완전히 달라진 사람을 이야기할 때." },
  { kor: "거두절미", hanja: "去頭截尾", meaning: "머리와 꼬리를 잘라내고 요점만 남김.", usage: "군더더기 빼고 본론부터 말하자고 할 때." },

// 상태 & 유틸
// ══════════════════════════════════════════
const NOW = new Date();

function todayKey() { return `${NOW.getFullYear()}_${NOW.getMonth()}_${NOW.getDate()}`; }
function dateKey(y, m, d) { return `${y}_${m}_${d}`; }

function ls(key, fallback = null) {
  try {
    const v = localStorage.getItem(key);
    return v !== null ? JSON.parse(v) : fallback;
  } catch { return fallback; }
}

function touchKey(key) {
  try {
    const raw = localStorage.getItem('_ts_index');
    const idx = raw ? JSON.parse(raw) : {};
    idx[key] = Date.now();
    localStorage.setItem('_ts_index', JSON.stringify(idx));
  } catch {}
}

function lsSet(key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));
    touchKey(key);
  } catch {}
}

function initDate() {
  const y = NOW.getFullYear();
  const m = String(NOW.getMonth() + 1).padStart(2, '0');
  const d = String(NOW.getDate()).padStart(2, '0');
  document.getElementById('headerDate').textContent = `${y}.${m}.${d}`;
  const days = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
  document.getElementById('headerDay').textContent = days[NOW.getDay()];
}

function getBaseQuoteIdx() {
  const d = NOW;
  return (d.getFullYear() * 366 + d.getMonth() * 31 + d.getDate()) % QUOTES.length;
}
function getCurrentQuoteIdx() {
  const offset = ls(`quote_offset_${todayKey()}`, 0);
  return (getBaseQuoteIdx() + offset + QUOTES.length * 100) % QUOTES.length;
}
function renderQuote() {
  const idx = getCurrentQuoteIdx();
  const q = QUOTES[idx];
  document.getElementById('quoteText').textContent = `"${q.text}"`;
  document.getElementById('quoteAuthor').textContent = q.author;
  document.getElementById('quoteMeta').textContent = `${q.country}  ·  ${q.years}`;
  document.getElementById('quoteMeaning').textContent = q.meaning;
  document.getElementById('quoteIndex').textContent = `${idx + 1} / ${QUOTES.length}`;
  const box = document.getElementById('quoteMeaning');
  const btn = document.getElementById('meaningToggle');
  box.classList.remove('open'); btn.classList.remove('open'); btn.textContent = '의미 보기 ▾';
}
function nextQuote() { lsSet(`quote_offset_${todayKey()}`, ls(`quote_offset_${todayKey()}`, 0) + 1); renderQuote(); }
function prevQuote() { lsSet(`quote_offset_${todayKey()}`, ls(`quote_offset_${todayKey()}`, 0) - 1); renderQuote(); }
function toggleMeaning() {
  const box = document.getElementById('quoteMeaning');
  const btn = document.getElementById('meaningToggle');
  const open = box.classList.toggle('open');
  btn.classList.toggle('open', open);
  btn.textContent = open ? '의미 닫기 ▴' : '의미 보기 ▾';
}

function getHanjaIdx() {
  const start = new Date(2026, 5, 18);
  const diff = Math.floor((NOW - start) / 86400000);
  return ((diff % HANJA.length) + HANJA.length) % HANJA.length;
}
function renderHanja() {
  const h = HANJA[getHanjaIdx()];
  document.getElementById('hanjaChar').textContent = h.char;
  document.getElementById('hanjaStroke').textContent = h.stroke;
  document.getElementById('hanjaKor').textContent = h.kor;
  document.getElementById('hanjaChi').textContent = h.chi;
  document.getElementById('hanjaMeaning').textContent = h.meaning;
  document.getElementById('hanjaGrade').textContent = `한자검정 ${h.grade}`;
  document.getElementById('hanjaOrigin').textContent = h.origin;
  document.getElementById('hanjaExample').textContent = h.example;
  document.getElementById('hanjaStrokeLink').href = 'https://hanja.dict.naver.com/search?query=' + encodeURIComponent(h.char);
}
function toggleHanja() {
  const detail = document.getElementById('hanjaDetail');
  const btn = document.getElementById('hanjaBtn');
  const open = detail.classList.toggle('open');

// 오늘의 기록
// ══════════════════════════════════════════
function getEntriesForDisplay(y, m, d) {
  const dk = dateKey(y, m, d);
  const arr = ls(`entries_${dk}`, []);
  if (Array.isArray(arr) && arr.length) return arr.filter(e => !e.deleted);
  const oldMemo = ls(`memo_${dk}`, '');
  if (oldMemo && oldMemo.trim()) return [{ id: `legacy_${dk}`, time: '', text: oldMemo, ts: 0 }];
  return [];
}

function submitEntry() {
  const input = document.getElementById('entryInput');
  const text = input.value.trim();
  if (!text) return;
  const now = new Date();
  const entry = {
    id: `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
    time: `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`,
    text, ts: Date.now()
  };
  const arr = ls(`entries_${todayKey()}`, []);
  arr.push(entry);
  lsSet(`entries_${todayKey()}`, arr);
  input.value = '';
  renderEntries(true);
  showToast('기록 저장됨 ✓');
  syncAfterChange();
}

let editingEntryId = null;
function startEditEntry(id) { editingEntryId = id; renderEntries(); }
function cancelEditEntry() { editingEntryId = null; renderEntries(); }

function saveEditEntry(id, newTextRaw) {
  const newText = (newTextRaw || '').trim();
  if (!newText) return;
  const arr = ls(`entries_${todayKey()}`, []);
  const idx = arr.findIndex(x => x.id === id);
  if (idx !== -1) {
    arr[idx].text = newText;
    arr[idx].editedTs = Date.now();
    lsSet(`entries_${todayKey()}`, arr);
  }
  editingEntryId = null;
  renderEntries();
  showToast('수정됨 ✓');
  syncAfterChange();
}

function deleteEntry(id) {
  if (!confirm('이 기록을 삭제할까?')) return;
  const arr = ls(`entries_${todayKey()}`, []);
  const idx = arr.findIndex(x => x.id === id);
  if (idx !== -1) {
    arr[idx].deleted = true;
    arr[idx].deletedTs = Date.now();
    lsSet(`entries_${todayKey()}`, arr);
  }
  renderEntries();
  showToast('삭제됨 ✓');
  syncAfterChange();
}

function renderEntries(scrollToBottom = false) {
  const list = document.getElementById('entryList');
  const entries = getEntriesForDisplay(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
  list.innerHTML = '';

  if (!entries.length) {
    list.innerHTML = `<div class="entry-empty">아직 오늘 남긴 기록이 없어. 위에 적어봐.</div>`;
    return;
  }

  entries.forEach(e => {
    const el = document.createElement('div');
    el.className = 'entry-item';

    if (editingEntryId === e.id) {
      el.classList.add('editing');
      const row = document.createElement('div');
      row.className = 'entry-edit-row';
      const input = document.createElement('input');
      input.type = 'text'; input.className = 'entry-edit-input'; input.value = e.text;
      const saveBtn = document.createElement('button');
      saveBtn.className = 'entry-action-btn save'; saveBtn.textContent = '저장';
      saveBtn.addEventListener('click', () => saveEditEntry(e.id, input.value));
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'entry-action-btn'; cancelBtn.textContent = '취소';
      cancelBtn.addEventListener('click', cancelEditEntry);
      input.addEventListener('keydown', ev => {
        if (ev.key === 'Enter') { ev.preventDefault(); saveEditEntry(e.id, input.value); }
        if (ev.key === 'Escape') { ev.preventDefault(); cancelEditEntry(); }
      });
      row.appendChild(input); row.appendChild(saveBtn); row.appendChild(cancelBtn);
      el.appendChild(row); list.appendChild(el);
      setTimeout(() => { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }, 0);
      return;
    }

    const top = document.createElement('div');
    top.className = 'entry-item-top';
    if (e.time) {
      const timeSpan = document.createElement('span');
      timeSpan.className = 'entry-time'; timeSpan.textContent = e.time;
      top.appendChild(timeSpan);
    }
    if (e.editedTs) {
      const tag = document.createElement('span');
      tag.className = 'entry-edited-tag'; tag.textContent = '(수정됨)';
      top.appendChild(tag);
    }
    const actions = document.createElement('div');
    actions.className = 'entry-actions';
    const editBtn = document.createElement('button');
    editBtn.className = 'entry-action-btn'; editBtn.textContent = '수정';
    editBtn.addEventListener('click', () => startEditEntry(e.id));
    const delBtn = document.createElement('button');
    delBtn.className = 'entry-action-btn danger'; delBtn.textContent = '삭제';
    delBtn.addEventListener('click', () => deleteEntry(e.id));
    actions.appendChild(editBtn); actions.appendChild(delBtn);
    top.appendChild(actions);

    const textDiv = document.createElement('div');
    textDiv.className = 'entry-text'; textDiv.textContent = e.text;

    el.appendChild(top); el.appendChild(textDiv);
    list.appendChild(el);
  });

  if (scrollToBottom) list.scrollTop = list.scrollHeight;
}

document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('entryInput');
  if (input) {
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); submitEntry(); }
    });
  }
});

let calYear = NOW.getFullYear();
let calMonth = NOW.getMonth();

function openCal() {
  calYear = NOW.getFullYear(); calMonth = NOW.getMonth();
  document.getElementById('calDetail').classList.remove('show');
  renderCal();
  document.getElementById('calModal').classList.add('show');
}
function closeCal(e) { if (e.target === document.getElementById('calModal')) closeCalBtn(); }
function closeCalBtn() { document.getElementById('calModal').classList.remove('show'); }
function calPrev() { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCal(); document.getElementById('calDetail').classList.remove('show'); }
function calNext() { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCal(); document.getElementById('calDetail').classList.remove('show'); }

function renderCal() {
  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('calTitle').textContent = `${calYear}년 ${months[calMonth]}`;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  const first = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  for (let i = 0; i < first; i++) {
    const el = document.createElement('div'); el.className = 'cal-cell empty'; grid.appendChild(el);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const el = document.createElement('div');
    el.className = 'cal-cell'; el.textContent = d;
    const hasEntries = getEntriesForDisplay(calYear, calMonth, d).length > 0;
    const isToday = calYear === NOW.getFullYear() && calMonth === NOW.getMonth() && d === NOW.getDate();
    if (isToday) el.classList.add('today');
    if (hasEntries) el.classList.add('has-memo');
    el.addEventListener('click', () => showDayDetail(calYear, calMonth, d, el));
    grid.appendChild(el);
  }
}

function showDayDetail(y, m, d, cell) {
  document.querySelectorAll('.cal-cell.selected').forEach(c => c.classList.remove('selected'));
  if (cell) cell.classList.add('selected');
  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('calDetailDate').textContent = `${y}년 ${months[m]} ${d}일`;
  const entries = getEntriesForDisplay(y, m, d);
  const body = document.getElementById('calDetailBody');
  body.innerHTML = '';
  if (entries.length) {
    const wrap = document.createElement('div'); wrap.className = 'cal-detail-entries';
    entries.forEach(e => {
      const row = document.createElement('div'); row.className = 'cal-detail-entry';
      if (e.time) {
        const timeSpan = document.createElement('span');
        timeSpan.className = 'cal-detail-entry-time'; timeSpan.textContent = e.time;
        row.appendChild(timeSpan);
      }
      const textSpan = document.createElement('span');
      textSpan.className = 'cal-detail-entry-text'; textSpan.textContent = e.text;
      row.appendChild(textSpan);
      wrap.appendChild(row);
    });
    body.appendChild(wrap);
  } else {
    const isPast = new Date(y, m, d) < new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
    const empty = document.createElement('div');
    empty.className = 'cal-detail-empty';
    empty.textContent = isPast ? '이 날의 기록이 없어.' : '아직 기록이 없어. 오늘의 기록에 써봐 😊';
    body.appendChild(empty);
  }
  document.getElementById('calDetail').classList.add('show');
}

let toastTimer = null;
function showToast(msg = '저장됨 ✓') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ☁️ JSONBin 동기화 (수정판)
// ──────────────────────────────────────────
// 예전 버전의 문제: 앱을 켜자마자 "받아오기(pull)"와 "올리기(push)"가
// 동시에 따로 실행돼서, 받아오기 전에 push가 먼저 끝나버리면 다른 기기가
// 방금 남긴 기록을 덮어써서 사라지게 만들었음.
// → 이제는 반드시 "① 먼저 받아서 합치기 → ② 그 다음에 올리기" 순서만 사용.
// ══════════════════════════════════════════
const BIN_ID = '69e029c936566621a8ba3891';
const API_KEY = '$2a$10$GmXIwyo5n3LB7JIEvjSycumI89.62DFRm8UGsH4FBgJs4jBdm/kBq';
const AUTO_SYNC_INTERVAL = 60 * 60 * 1000; // 1시간

function detectDevice() {
  const ua = navigator.userAgent;
  if (/iPhone/i.test(ua)) return '📱 아이폰';
  if (/iPad/i.test(ua)) return '📱 아이패드';
  if (/Android/i.test(ua)) return '📱 안드로이드';
  if (/Mac/i.test(ua)) return '💻 맥';
  if (/Windows/i.test(ua)) return '💻 PC';
  return '🌐 브라우저';
}

function setSyncUI(state) {
  const dot = document.getElementById('syncDot');
  const label = document.getElementById('syncLabel');
  dot.className = 'sync-dot';
  if (state === 'syncing') { dot.classList.add('syncing'); label.textContent = '동기화 중...'; }
  else if (state === 'synced') { dot.classList.add('synced'); label.textContent = '동기화됨'; }
  else { label.textContent = '동기화'; }
}

// 클라우드로 현재 localStorage 전체를 올림 (병합은 이미 끝난 상태여야 함)
async function cloudPushRaw() {
  const data = { timestamp: Date.now(), device: detectDevice() };
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    try { data[k] = JSON.parse(localStorage.getItem(k)); }
    catch { data[k] = localStorage.getItem(k); }
  }
  await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
    body: JSON.stringify(data)
  });
  lsSet('last_sync_ts', Date.now());
}

// 클라우드에서 받아와서 로컬과 합침 (여기서는 절대 push 하지 않음)
async function cloudPullMerge() {
  const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
    headers: { 'X-Master-Key': API_KEY }
  });
  const json = await res.json();
  const cloud = json.record;
  if (!cloud) return;

  const localIdx = ls('_ts_index', {}) || {};
  const cloudIdx = cloud['_ts_index'] || {};
  let idxChanged = false;

  Object.keys(cloud).forEach(k => {
    if (k === 'timestamp' || k === 'device' || k === '_ts_index') return;

    // 오늘의 기록(entries_)은 항상 병합 — id 기준으로 더 최근 버전 채택
    if (k.startsWith('entries_')) {
      const localArr = ls(k, []) || [];
      const cloudArr = Array.isArray(cloud[k]) ? cloud[k] : [];
      const versionTime = e => Math.max(e.ts || 0, e.editedTs || 0, e.deletedTs || 0);
      const map = new Map();
      localArr.forEach(e => { if (e && e.id) map.set(e.id, e); });
      cloudArr.forEach(e => {
        if (!e || !e.id) return;
        const existing = map.get(e.id);
        if (!existing || versionTime(e) > versionTime(existing)) map.set(e.id, e);
      });
      const merged = Array.from(map.values()).sort((a, b) => (a.ts || 0) - (b.ts || 0));
      if (JSON.stringify(merged) !== JSON.stringify(localArr)) {
        try { localStorage.setItem(k, JSON.stringify(merged)); } catch {}
      }
      return;
    }

    // 그 외 일반 키 — 더 최신(타임스탬프가 큰) 쪽만 가져옴
    const localExists = localStorage.getItem(k) !== null;
    const cloudTs = cloudIdx[k] || 0;
    const localTs = localIdx[k] || 0;
    const shouldWrite = !localExists || cloudTs > localTs;

    if (shouldWrite) {
      try {
        localStorage.setItem(k, typeof cloud[k] === 'string' ? cloud[k] : JSON.stringify(cloud[k]));
        localIdx[k] = cloudTs || Date.now();
        idxChanged = true;
      } catch {}
    }
  });

  if (idxChanged) {
    try { localStorage.setItem('_ts_index', JSON.stringify(localIdx)); } catch {}
  }
}

// 기록을 새로 남기거나 수정·삭제했을 때: 반드시 이 순서로만 진행
// ① 클라우드에서 받아서 합치기 → ② 합쳐진 최종본을 클라우드에 올리기
async function syncAfterChange() {
  setSyncUI('syncing');
  try {
    await cloudPullMerge();
    renderEntries();
    await cloudPushRaw();
    setSyncUI('synced');
  } catch {
    setSyncUI('idle');
  }
}

async function manualSync() {
  await syncAfterChange();
  renderEntries();
}

// 앱 켤 때 최초 동기화: 먼저 받아서 합치고, 필요할 때만 올림 (동시 실행 금지)
async function initialSync() {
  setSyncUI('syncing');
  try {
    await cloudPullMerge();
    renderEntries();
    setSyncUI('synced');
    const last = ls('last_sync_ts', 0);
    if (Date.now() - last > AUTO_SYNC_INTERVAL) {
      await cloudPushRaw();
    }
  } catch {
    setSyncUI('idle');
  }
}

// 탭이 보일 때 / 주기적으로: 받아오기만 함 (push는 하지 않아 다른 기기 데이터를 절대 덮어쓰지 않음)
async function backgroundPull() {
  try {
    await cloudPullMerge();
    renderEntries();
  } catch {}
}
