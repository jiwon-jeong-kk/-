<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="오늘의 행복">
<meta name="theme-color" content="#0f0f13">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f0f13'/%3E%3Ctext y='.9em' font-size='72' x='12'%3E🌟%3C/text%3E%3C/svg%3E">
<title>오늘의 행복</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

:root {
  --bg: #0f0f13;
  --surface: #1a1a22;
  --card: #22222e;
  --accent: #e8c97a;
  --accent2: #7ab8e8;
  --accent3: #e87a9a;
  --text: #f0ede6;
  --muted: #888899;
  --success: #7ae8a8;
  --border: #333344;
  --xp-color: #b97ae8;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content:'';
  position:fixed; top:-50%; left:-50%;
  width:200%; height:200%;
  background: radial-gradient(ellipse at 30% 20%, rgba(232,201,122,0.04) 0%, transparent 50%),
              radial-gradient(ellipse at 70% 80%, rgba(122,184,232,0.04) 0%, transparent 50%);
  pointer-events:none; z-index:0;
}

.wrapper {
  position:relative; z-index:1;
  max-width:780px; margin:0 auto;
  padding:0 20px 80px;
}

/* ── 헤더 ── */
.header {
  padding:36px 0 24px;
  border-bottom:1px solid var(--border);
  margin-bottom:28px;
}

.header-top {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:16px;
}

.header-brand {
  font-family:'Nanum Myeongjo',serif;
  font-size:12px; letter-spacing:5px;
  color:var(--accent); text-transform:uppercase;
}

.header-cal-btn {
  background:var(--surface); border:1px solid var(--border);
  color:var(--muted); font-family:'Noto Sans KR',sans-serif;
  font-size:12px; padding:7px 14px; border-radius:100px;
  cursor:pointer; transition:all 0.2s; letter-spacing:1px;
}
.header-cal-btn:hover { border-color:var(--accent2); color:var(--accent2); }

.header-center { text-align:center; margin-bottom:16px; }

.header-date {
  font-family:'Nanum Myeongjo',serif;
  font-size:38px; font-weight:800;
  color:var(--text); line-height:1; margin-bottom:4px;
  cursor:pointer; transition:color 0.2s;
}
.header-date:hover { color:var(--accent); }

.header-day { font-size:14px; color:var(--muted); font-weight:300; letter-spacing:2px; }

/* ── 레벨 바 ── */
.level-bar-wrap {
  background:var(--surface); border:1px solid var(--border);
  border-radius:12px; padding:14px 18px;
  margin-bottom:24px;
  display:flex; align-items:center; gap:14px;
}

.level-badge {
  width:44px; height:44px; border-radius:50%;
  background:linear-gradient(135deg, var(--xp-color), #7ae8e8);
  display:flex; align-items:center; justify-content:center;
  font-family:'Nanum Myeongjo',serif;
  font-size:16px; font-weight:800; color:#0f0f13;
  flex-shrink:0; box-shadow:0 0 16px rgba(185,122,232,0.4);
}

.level-info { flex:1; }

.level-title {
  font-size:14px; font-weight:700; color:var(--text);
  margin-bottom:4px;
}

.level-sub { font-size:11px; color:var(--muted); margin-bottom:8px; }

.xp-bar-bg {
  background:var(--border); border-radius:100px;
  height:5px; overflow:hidden;
}

.xp-bar-fill {
  height:100%;
  background:linear-gradient(90deg, var(--xp-color), #7ae8e8);
  border-radius:100px; transition:width 0.5s ease;
}

.level-xp { font-size:11px; color:var(--xp-color); font-weight:700; margin-top:5px; }

/* ── 명언 ── */
.quote-card {
  background:var(--card);
  border:1px solid var(--border);
  border-left:4px solid var(--accent);
  border-radius:12px; padding:18px 22px;
  margin-bottom:24px;
}

.quote-label {
  font-size:10px; letter-spacing:4px;
  color:var(--accent); font-family:'Nanum Myeongjo',serif;
  margin-bottom:10px;
}

.quote-text {
  font-family:'Nanum Myeongjo',serif;
  font-size:18px; font-weight:700;
  color:var(--text); line-height:1.6; margin-bottom:6px;
}

.quote-author {
  font-size:12px; color:var(--muted); font-weight:300;
}

/* ── 요일 선택 ── */
.day-selector {
  display:flex; gap:7px; justify-content:center;
  flex-wrap:wrap; margin-bottom:28px;
}

.day-btn {
  background:var(--surface); border:1px solid var(--border);
  color:var(--muted); font-family:'Noto Sans KR',sans-serif;
  font-size:12px; font-weight:500;
  padding:8px 14px; border-radius:100px;
  cursor:pointer; transition:all 0.2s; letter-spacing:1px;
  position:relative;
}

.day-btn:hover { border-color:var(--accent); color:var(--accent); }

.day-btn.active {
  background:var(--accent); border-color:var(--accent);
  color:#0f0f13; font-weight:700;
}

.day-btn .done-dot {
  position:absolute; top:4px; right:4px;
  width:6px; height:6px; border-radius:50%;
  background:var(--success);
}

/* ── 배너 ── */
.today-banner {
  background:var(--card); border:1px solid var(--border);
  border-radius:12px; padding:18px 22px;
  margin-bottom:22px;
  display:flex; align-items:center; gap:14px;
}

.today-emoji { font-size:30px; }
.today-info h2 {
  font-family:'Nanum Myeongjo',serif;
  font-size:19px; font-weight:700; color:var(--text); margin-bottom:3px;
}
.today-info p { font-size:12px; color:var(--muted); font-weight:300; }

/* ── 레벨 업그레이드 배지 ── */
.upgrade-badge {
  background:rgba(185,122,232,0.12);
  border:1px solid var(--xp-color);
  border-radius:8px; padding:10px 14px;
  font-size:12px; color:var(--xp-color);
  margin-bottom:14px; display:flex; align-items:center; gap:8px;
}

/* ── 섹션 ── */
.section { margin-bottom:24px; }

.section-header {
  display:flex; align-items:center; gap:12px; margin-bottom:8px;
}

.section-label {
  font-family:'Nanum Myeongjo',serif;
  font-size:10px; letter-spacing:4px;
  color:var(--accent); text-transform:uppercase;
}

.section-line { flex:1; height:1px; background:var(--border); }

/* ── 운동 아이템 ── */
.exercise-list { display:flex; flex-direction:column; gap:7px; }

.exercise-item {
  background:var(--card); border:1px solid var(--border);
  border-radius:10px; overflow:hidden;
  cursor:pointer; transition:all 0.2s; user-select:none;
}

.exercise-item:hover { border-color:var(--accent2); }
.exercise-item.done { border-color:var(--success); background:rgba(122,232,168,0.06); }
.exercise-item.warm-item { opacity:0.65; }

.exercise-main {
  padding:13px 16px;
  display:flex; align-items:center; gap:12px;
}

.check-circle {
  width:21px; height:21px; border-radius:50%;
  border:2px solid var(--border); flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; transition:all 0.2s;
}

.exercise-item.done .check-circle {
  background:var(--success); border-color:var(--success); color:#0f0f13;
}

.exercise-name {
  font-size:14px; font-weight:500; color:var(--text); flex:1;
  transition:all 0.2s;
}

.exercise-item.done .exercise-name {
  text-decoration:line-through; color:var(--muted);
}

.exercise-meta { font-size:11px; color:var(--muted); text-align:right; }

.detail-btn {
  background:none; border:1px solid var(--border);
  color:var(--muted); font-size:10px; padding:2px 8px;
  border-radius:100px; cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;
  transition:all 0.2s; letter-spacing:0.5px;
  display:block; margin-top:4px; margin-left:auto;
}
.detail-btn:hover { border-color:var(--accent2); color:var(--accent2); }

.exercise-detail {
  display:none; background:var(--surface);
  border-top:1px solid var(--border);
  padding:12px 16px 12px 49px;
  font-size:12px; color:var(--muted); line-height:1.8; font-weight:300;
}

.exercise-item.expanded .exercise-detail { display:block; }

/* 진행률 */
.progress-bar-wrap {
  background:var(--surface); border-radius:100px;
  height:3px; margin-top:12px; overflow:hidden;
}

.progress-bar-fill {
  height:100%;
  background:linear-gradient(90deg, var(--accent2), var(--success));
  border-radius:100px; transition:width 0.4s ease;
}

.progress-text { font-size:11px; color:var(--muted); text-align:right; margin-top:5px; }

/* 완료 축하 */
.congrats {
  background:linear-gradient(135deg, rgba(122,232,168,0.08), rgba(122,184,232,0.08));
  border:1px solid var(--success); border-radius:10px;
  padding:16px 20px; text-align:center;
  display:none; margin-top:12px; animation:fadeIn 0.4s ease;
}
.congrats.show { display:block; }
.congrats h3 { font-family:'Nanum Myeongjo',serif; font-size:18px; color:var(--success); margin-bottom:4px; }
.congrats p { font-size:12px; color:var(--muted); }

/* 손글씨 */
.writing-card {
  background:var(--card); border:1px solid var(--border);
  border-left:4px solid var(--accent3); border-radius:12px;
  padding:18px 22px;
}

.writing-steps { display:flex; flex-direction:column; gap:8px; margin-top:12px; }

.writing-step {
  display:flex; align-items:center; gap:10px;
  cursor:pointer; padding:7px 0; transition:all 0.2s;
}

.writing-step.done .step-text { text-decoration:line-through; color:var(--muted); }

.step-num {
  width:24px; height:24px; border-radius:50%;
  background:var(--surface); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  font-size:10px; font-weight:700; color:var(--accent3);
  flex-shrink:0; transition:all 0.2s;
}

.writing-step.done .step-num {
  background:var(--accent3); border-color:var(--accent3); color:#0f0f13;
}

.step-text { font-size:13px; color:var(--text); flex:1; }
.step-time { font-size:11px; color:var(--muted); font-weight:300; }

/* 맨발걷기 */
.walk-card {
  background:var(--card); border:1px solid var(--border);
  border-left:4px solid #7ae87a;
  border-radius:12px; padding:14px 18px;
  display:flex; align-items:center; gap:14px;
  cursor:pointer; transition:all 0.2s; margin-bottom:8px;
}
.walk-card:hover { border-color:#7ae87a; }
.walk-card.done { background:rgba(122,232,122,0.06); }
.walk-card.done .walk-name { text-decoration:line-through; color:var(--muted); }
.walk-name { font-size:14px; font-weight:500; color:var(--text); flex:1; }
.walk-meta { font-size:12px; color:var(--muted); }

/* 타이머 */
.timer-section {
  background:var(--surface); border:1px solid var(--border);
  border-radius:12px; padding:22px; text-align:center; margin-top:12px;
}

.timer-label {
  font-size:11px; letter-spacing:3px; color:var(--muted);
  font-family:'Nanum Myeongjo',serif; margin-bottom:10px;
}

.timer-display {
  font-family:'Nanum Myeongjo',serif;
  font-size:52px; font-weight:800;
  color:var(--accent); letter-spacing:4px;
  margin-bottom:14px; line-height:1; transition:color 0.3s;
}
.timer-display.running { color:var(--success); }
.timer-display.done-color { color:var(--muted); }

.timer-btns { display:flex; gap:8px; justify-content:center; }

.timer-btn {
  background:transparent; border:1px solid var(--border);
  color:var(--text); font-family:'Noto Sans KR',sans-serif;
  font-size:13px; font-weight:500; padding:9px 22px;
  border-radius:100px; cursor:pointer; transition:all 0.2s; letter-spacing:1px;
}
.timer-btn.primary {
  background:var(--accent); border-color:var(--accent);
  color:#0f0f13; font-weight:700;
}
.timer-btn:hover { opacity:0.8; }

/* 메모 */
.memo-section { margin-top:24px; }
.memo-box {
  background:var(--card); border:1px solid var(--border);
  border-radius:12px; padding:16px 18px;
}
.memo-label {
  font-size:10px; letter-spacing:3px; color:var(--accent);
  font-family:'Nanum Myeongjo',serif; margin-bottom:8px;
}
.memo-input {
  width:100%; background:transparent; border:none;
  color:var(--text); font-family:'Noto Sans KR',sans-serif;
  font-size:13px; font-weight:300; line-height:1.9;
  resize:none; outline:none; min-height:80px;
}
.memo-input::placeholder { color:var(--border); }

/* 휴식일 */
.rest-card {
  background:var(--card); border:1px solid var(--border);
  border-radius:14px; padding:44px 24px; text-align:center;
}
.rest-emoji { font-size:46px; margin-bottom:14px; }
.rest-card h2 {
  font-family:'Nanum Myeongjo',serif;
  font-size:22px; font-weight:700; color:var(--text); margin-bottom:8px;
}
.rest-card p { font-size:13px; color:var(--muted); line-height:1.9; font-weight:300; }

/* ── 달력 모달 ── */
.modal-overlay {
  position:fixed; inset:0;
  background:rgba(0,0,0,0.7); backdrop-filter:blur(6px);
  z-index:100; display:none;
  align-items:center; justify-content:center;
}
.modal-overlay.show { display:flex; animation:fadeIn 0.2s ease; }

.cal-modal {
  background:var(--card); border:1px solid var(--border);
  border-radius:16px; padding:28px; width:360px; max-width:94vw;
}

.cal-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:20px;
}

.cal-title {
  font-family:'Nanum Myeongjo',serif;
  font-size:18px; font-weight:800; color:var(--text);
}

.cal-nav {
  background:none; border:1px solid var(--border);
  color:var(--muted); font-size:14px; padding:5px 12px;
  border-radius:100px; cursor:pointer; font-family:'Noto Sans KR',sans-serif;
  transition:all 0.2s;
}
.cal-nav:hover { border-color:var(--accent); color:var(--accent); }

.cal-close {
  background:none; border:none; color:var(--muted);
  font-size:18px; cursor:pointer; padding:4px 8px;
  transition:color 0.2s;
}
.cal-close:hover { color:var(--text); }

.cal-days-header {
  display:grid; grid-template-columns:repeat(7,1fr);
  text-align:center; font-size:11px; color:var(--muted);
  margin-bottom:8px; gap:2px;
}

.cal-grid {
  display:grid; grid-template-columns:repeat(7,1fr);
  gap:4px;
}

.cal-cell {
  aspect-ratio:1; border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; position:relative; cursor:default;
  font-family:'Noto Sans KR',sans-serif;
}

.cal-cell.empty { }
.cal-cell.today { border:1px solid var(--accent); color:var(--accent); font-weight:700; }
.cal-cell.done-day { background:rgba(122,232,168,0.2); color:var(--success); }
.cal-cell.partial-day { background:rgba(232,201,122,0.15); color:var(--accent); }
.cal-cell.missed { color:var(--muted); }

.cal-legend {
  display:flex; gap:14px; margin-top:16px;
  font-size:11px; color:var(--muted); flex-wrap:wrap;
}

.cal-legend-item { display:flex; align-items:center; gap:6px; }
.legend-dot {
  width:10px; height:10px; border-radius:3px; flex-shrink:0;
}

/* ── 모바일 최적화 ── */
@media (max-width: 600px) {
  .wrapper { padding: 0 14px 100px; }
  .header { padding: 24px 0 18px; }
  .header-date { font-size: 30px; }
  .header-day { font-size: 13px; }
  .level-bar-wrap { padding: 12px 14px; gap: 10px; }
  .level-badge { width: 38px; height: 38px; font-size: 14px; }
  .level-title { font-size: 13px; }
  .level-sub { font-size: 10px; }
  .quote-text { font-size: 16px; }
  .day-selector { gap: 5px; }
  .day-btn { font-size: 11px; padding: 7px 11px; }
  .today-banner { padding: 14px 16px; gap: 10px; }
  .today-emoji { font-size: 24px; }
  .today-info h2 { font-size: 16px; }
  .exercise-main { padding: 11px 13px; gap: 10px; }
  .exercise-name { font-size: 13px; }
  .exercise-meta { font-size: 10px; }
  .exercise-detail { padding: 10px 13px 10px 43px; font-size: 11px; }
  .timer-display { font-size: 44px; }
  .timer-btn { font-size: 12px; padding: 8px 18px; }
  .memo-input { font-size: 14px; }
  .walk-card { padding: 12px 14px; }
  .walk-name { font-size: 13px; }
  .writing-card { padding: 14px 16px; }
  .step-text { font-size: 12px; }
  .cal-modal { padding: 20px 16px; }
  .cal-cell { font-size: 11px; border-radius: 6px; }
  .rest-card { padding: 32px 16px; }
  .rest-card h2 { font-size: 20px; }
}

/* iOS 홈 화면 추가 안내 배너 */
.install-banner {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 16px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--muted);
}
.install-banner .install-icon { font-size: 20px; flex-shrink: 0; }
.install-banner .install-close {
  background: none; border: none;
  color: var(--muted); cursor: pointer;
  font-size: 14px; margin-left: auto;
  padding: 2px 6px;
}

.save-toast {
  position:fixed; bottom:24px; right:24px;
  background:var(--success); color:#0f0f13;
  font-size:12px; font-weight:700; padding:9px 18px;
  border-radius:100px; opacity:0;
  transform:translateY(8px); transition:all 0.3s ease;
  pointer-events:none; letter-spacing:1px;
  font-family:'Noto Sans KR',sans-serif;
}
.save-toast.show { opacity:1; transform:translateY(0); }

/* ── 레벨업 팝업 ── */
.levelup-popup {
  position:fixed; inset:0;
  background:rgba(0,0,0,0.8);
  z-index:200; display:none;
  align-items:center; justify-content:center;
}
.levelup-popup.show { display:flex; }
.levelup-card {
  background:var(--card); border:1px solid var(--xp-color);
  border-radius:20px; padding:40px 32px;
  text-align:center; max-width:320px;
  box-shadow:0 0 60px rgba(185,122,232,0.3);
  animation:popIn 0.4s ease;
}
.levelup-emoji { font-size:56px; margin-bottom:16px; }
.levelup-title {
  font-family:'Nanum Myeongjo',serif;
  font-size:28px; font-weight:800;
  color:var(--xp-color); margin-bottom:8px;
}
.levelup-sub { font-size:14px; color:var(--text); margin-bottom:6px; }
.levelup-desc { font-size:12px; color:var(--muted); line-height:1.7; margin-bottom:24px; }
.levelup-btn {
  background:var(--xp-color); border:none; color:#0f0f13;
  font-family:'Noto Sans KR',sans-serif;
  font-size:14px; font-weight:700;
  padding:12px 32px; border-radius:100px; cursor:pointer;
  letter-spacing:1px;
}

@keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
@keyframes popIn { from{opacity:0;transform:scale(0.85)} to{opacity:1;transform:scale(1)} }
.fade-in { animation:fadeIn 0.3s ease forwards; }
</style>
</head>
<body>

<div class="wrapper">

  <!-- iOS 홈 화면 안내 (처음 1번만) -->
  <div class="install-banner" id="installBanner" style="display:none">
    <span class="install-icon">📲</span>
    <span>Safari → <b>공유 버튼</b> → <b>홈 화면에 추가</b> 하면 앱처럼 쓸 수 있어!</span>
    <button class="install-close" onclick="dismissInstall()">✕</button>
  </div>

  <!-- 헤더 -->
  <div class="header">
    <div class="header-top">
      <div class="header-brand">오늘의 행복</div>
      <button class="header-cal-btn" onclick="openCal()">📅 기록 달력</button>
      <button class="header-cal-btn" onclick="pushData()" style="background:var(--success);border-color:var(--success);color:#0f0f13;font-weight:700;">☁️ 동기화</button>
    </div>
    <div class="header-center">
      <div class="header-date" id="headerDate" onclick="openCal()"></div>
      <div class="header-day" id="headerDay"></div>
    </div>
  </div>

  <!-- 레벨 바 -->

<script>
// ════════════════════════════
// 데이터
// ════════════════════════════

const QUOTES = [
  { text: "시작이 반이다.", author: "아리스토텔레스 (그리스 철학자, BC 384~322)", meaning: "무언가를 시작하는 것 자체가 이미 절반을 해낸 것이나 다름없다. 망설임과 두려움을 내려놓고 일단 시작하는 용기가 중요하다." },
  { text: "천 리 길도 한 걸음부터.", author: "노자 (도덕경, BC 6세기)", meaning: "아무리 먼 목표도 결국 지금 이 한 걸음에서 시작된다. 오늘 하루의 작은 실천이 쌓여 큰 변화를 만든다." },
  { text: "오늘 할 수 있는 일을 내일로 미루지 마라.", author: "벤자민 프랭클린 (미국 건국의 아버지, 1706~1790)", meaning: "미루는 습관은 가장 큰 적이다. 지금 이 순간 할 수 있는 것을 하는 것이 성공의 핵심이다." },
  { text: "땀은 거짓말을 하지 않는다.", author: "보 잭슨 (미국 운동선수)", meaning: "노력은 반드시 결과로 나타난다. 화려한 말보다 조용히 흘린 땀이 더 정직한 진실을 말해준다." },
  { text: "작은 것들이 완벽함을 만든다.", author: "미켈란젤로 (이탈리아 예술가, 1475~1564)", meaning: "완벽함은 거창한 것에서 오지 않는다. 매일의 작은 디테일에 집중하는 태도가 결국 위대한 결과를 만들어낸다." },
  { text: "고통은 일시적이다. 포기는 영원하다.", author: "랜스 암스트롱 (사이클 선수)", meaning: "지금 느끼는 힘듦은 언젠가 끝난다. 하지만 포기한 순간은 평생 후회로 남는다. 조금만 더 버텨라." },
  { text: "멈추지 않는 한, 속도는 문제가 되지 않는다.", author: "공자 (중국 사상가, BC 551~479)", meaning: "빠르게 가는 것보다 멈추지 않는 것이 더 중요하다. 느려도 괜찮다. 오늘도 계속 나아가고 있다는 것이 핵심이다." },
  { text: "실패란 더 현명하게 다시 시작할 기회다.", author: "헨리 포드 (포드 창업자, 1863~1947)", meaning: "실패는 끝이 아니라 배움의 시작이다. 무너진 자리에서 무엇을 배웠는지가 다음 성공을 결정한다." },
  { text: "우리는 우리가 반복적으로 하는 것의 산물이다.", author: "아리스토텔레스 (그리스 철학자)", meaning: "탁월함은 한 번의 행동이 아니라 습관에서 나온다. 매일 반복하는 루틴이 결국 나라는 사람을 만든다." },
  { text: "당신 자신을 남과 비교하지 마라. 그것은 자신을 모욕하는 행위다.", author: "빌 게이츠 (마이크로소프트 창업자)", meaning: "비교는 행복을 빼앗아간다. 어제의 나와 오늘의 나를 비교하는 것. 그것만이 의미 있는 경쟁이다." },
  { text: "불가능이란 아무것도 아니다.", author: "무하마드 알리 (권투 선수, 1942~2016)", meaning: "불가능은 능력이 없는 사람의 선언이 아니라, 아직 해보지 않은 사람의 변명이다. 도전하기 전까지는 아무도 모른다." },
  { text: "나는 실패를 받아들일 수 있다. 하지만 시도하지 않는 것은 받아들일 수 없다.", author: "마이클 조던 (NBA 농구 선수)", meaning: "결과보다 과정이 중요하다. 해보고 실패하는 것은 부끄럽지 않다. 두려워서 시도조차 하지 않는 것이 진짜 실패다." },
  { text: "매일 조금씩. 그것이 전부다.", author: "로버트 콜리어 (미국 작가, 1885~1950)", meaning: "위대한 변화는 매일의 작은 행동에서 비롯된다. 오늘 하루를 충실히 사는 것이 인생을 바꾸는 유일한 방법이다." },
  { text: "건강한 몸에 건강한 정신이 깃든다.", author: "유베날리스 (로마 시인, 1~2세기)", meaning: "몸과 마음은 분리되지 않는다. 몸을 단련하면 정신도 강해진다. 운동이 단순한 체력 관리가 아닌 이유다." },
  { text: "한계는 종종 스스로 만든 것이다.", author: "마이클 조던 (NBA 농구 선수)", meaning: "우리가 '못 한다'고 생각하는 순간, 그것이 진짜 한계가 된다. 그 한계는 대부분 외부가 아닌 자신의 마음속에 있다." },
  { text: "꿈을 꾸고 있는 한, 인생은 충분히 가치 있다.", author: "빈센트 반 고흐 (화가, 1853~1890)", meaning: "무언가를 바라고 나아가는 사람에게 인생은 의미를 가진다. 목표를 가진 하루는 아무것도 없는 하루와 다르다." },
  { text: "오늘의 땀이 내일의 나를 만든다.", author: "무명 (스포츠 격언)", meaning: "지금 이 순간 흘리는 땀은 절대 낭비가 아니다. 그것이 쌓여 미래의 더 나은 나를 만드는 재료가 된다." },
  { text: "변명을 멈추는 순간, 인생이 시작된다.", author: "스티브 잡스 (애플 창업자, 1955~2011)", meaning: "변명은 현실을 합리화하는 도구다. 변명을 내려놓고 책임을 받아들이는 순간, 비로소 진짜 성장이 시작된다." },
  { text: "어제보다 나은 오늘이면 충분하다.", author: "무명 (일본 무도 격언)", meaning: "완벽할 필요가 없다. 어제의 자신보다 조금이라도 성장했다면, 오늘은 성공한 하루다." },
  { text: "포기하지 않는 한, 실패는 없다.", author: "크리스토퍼 콜럼버스 (탐험가, 1451~1506)", meaning: "진짜 실패는 넘어지는 것이 아니라 일어나기를 포기하는 것이다. 계속 시도하는 사람은 결국 이긴다." },
  { text: "인내는 쓰나 열매는 달다.", author: "장 자크 루소 (프랑스 철학자, 1712~1778)", meaning: "힘든 과정을 견딘 사람만이 그 결실의 달콤함을 안다. 지금의 고통은 나중의 기쁨을 더욱 크게 만든다." },
  { text: "당신이 할 수 있다고 믿든 없다고 믿든, 당신이 옳다.", author: "헨리 포드 (포드 창업자, 1863~1947)", meaning: "믿음이 현실을 만든다. '할 수 있다'는 확신은 행동을 만들고, 행동이 쌓여 결과가 된다." },
  { text: "나무는 폭풍 속에서 뿌리를 내린다.", author: "돌로레스 이바루리 (스페인 정치인)", meaning: "위기와 고난이 오히려 더 깊은 성장을 만든다. 힘든 시간이 나를 더 단단하게 만들고 있다." },
  { text: "몸은 마음이 가는 곳으로 따라온다.", author: "스포츠 심리학 격언", meaning: "정신력이 먼저다. 마음을 강하게 먹으면 몸도 따라온다. 오늘 하기 싫다는 마음을 이기는 것이 진짜 훈련이다." },
  { text: "지금 이 순간은 다시 오지 않는다.", author: "세네카 (로마 철학자, BC 4~AD 65)", meaning: "오늘 이 하루는 두 번 다시 없다. 지금을 허비하는 것은 인생을 허비하는 것과 같다." },
  { text: "자유는 규율에서 온다.", author: "조코 윌링크 (미국 해군 특수부대 지휘관)", meaning: "아이러니하게도 엄격한 루틴과 자기 규율이 오히려 더 큰 자유를 준다. 규칙이 없는 자유는 혼돈이다." },
  { text: "성공은 매일 반복되는 작은 노력의 합이다.", author: "로버트 콜리어 (미국 작가)", meaning: "화려한 순간은 평범한 날들의 축적으로 만들어진다. 오늘의 평범한 노력이 내일의 특별함이 된다." },
  { text: "쉬는 것도 훈련이다.", author: "스포츠 과학 원칙", meaning: "회복 없이는 성장도 없다. 쉬는 것은 게으름이 아니라 다음 훈련을 위한 준비다. 몸에게 회복의 시간을 줘라." },
  { text: "불편함이 성장의 통화다.", author: "브레네 브라운 (미국 연구교수)", meaning: "편안함 속에서는 성장하기 어렵다. 불편하고 힘든 상황이 바로 내가 성장하고 있다는 신호다." },
  { text: "작은 씨앗도 올바른 환경에서는 큰 나무가 된다.", author: "중국 속담", meaning: "지금 당장 결과가 보이지 않아도 괜찮다. 꾸준히 좋은 환경과 습관을 만들어가면 반드시 크게 성장한다." },
  { text: "천천히 가도 괜찮다. 멈추지만 않으면.", author: "마틴 루터 킹 (미국 인권운동가, 1929~1968)", meaning: "속도보다 방향이 중요하다. 느려도 포기하지 않고 나아가는 사람이 결국 목적지에 닿는다." },
  { text: "오늘 걷지 않으면 내일은 뛰어야 한다.", author: "한국 속담", meaning: "지금의 작은 노력이 나중의 큰 부담을 덜어준다. 오늘 미루면 내일 더 힘들어진다." },
  { text: "당신이 포기하고 싶은 그 순간이 바로 전환점이다.", author: "밥 피트먼 (미국 기업인)", meaning: "가장 힘든 순간이 사실 가장 중요한 순간이다. 지금 버티는 것이 성공과 실패를 가르는 분기점이다." },
  { text: "두려움은 꿈을 죽이는 가장 큰 적이다.", author: "오프라 윈프리 (방송인)", meaning: "실패가 두려워 시작하지 않는 것이 진짜 실패다. 두려움을 인정하되, 그것에 지배당하지 마라." },
  { text: "매일 1%씩 나아지면 1년 후 37배가 된다.", author: "제임스 클리어 (원자적 습관 저자)", meaning: "작은 개선의 복리 효과는 상상을 초월한다. 오늘 1%의 노력이 쌓여 엄청난 차이를 만들어낸다." },
  { text: "나를 죽이지 못하는 것은 나를 더 강하게 만든다.", author: "프리드리히 니체 (철학자, 1844~1900)", meaning: "역경은 파괴하거나 단련시킨다. 살아남은 모든 고난은 결국 나를 더 강한 사람으로 만들어왔다." },
  { text: "탁월함은 행위가 아니라 습관이다.", author: "윌 듀란트 (아리스토텔레스 해석)", meaning: "한 번의 훌륭한 행동이 아니라, 매일의 꾸준한 반복이 탁월한 사람을 만든다." },
  { text: "지금 이 고통이 훗날 너의 힘이 된다.", author: "세네카 (로마 철학자)", meaning: "지금 느끼는 힘듦은 사라지지 않는다. 나중에 힘이 필요할 때 꺼낼 수 있는 경험으로 쌓인다." },
  { text: "배움에는 지름길이 없다. 하지만 올바른 길은 있다.", author: "베벌리 실스 (성악가)", meaning: "빠른 방법은 없지만 효율적인 방법은 있다. 제대로 된 방향으로 꾸준히 가는 것이 가장 빠른 길이다." },
  { text: "실천 없는 비전은 단순한 꿈이다.", author: "조엘 바커 (미래학자)", meaning: "머릿속의 계획은 행동으로 옮겨야만 의미가 있다. 오늘 하루를 실천으로 채워라." },
  { text: "자신을 극복하는 자가 가장 강한 자다.", author: "공자 (중국 사상가, BC 551~479)", meaning: "진짜 싸움은 남과의 경쟁이 아니라 자기 자신과의 싸움이다. 오늘의 나를 이기는 것이 진정한 승리다." },
  { text: "피로는 성취의 증거다.", author: "스포츠 격언", meaning: "힘든 것은 열심히 했다는 뜻이다. 오늘의 피로가 쌓여 내일의 실력이 된다." },
  { text: "좋은 습관은 만들기 어렵고, 나쁜 습관은 깨기 어렵다. 그래서 오늘이 중요하다.", author: "아리스토텔레스 (그리스 철학자)", meaning: "습관의 형성과 파괴 모두 의식적인 노력이 필요하다. 오늘 하루의 선택이 내일의 나를 결정한다." },
  { text: "성공한 사람들은 남들이 쉬는 시간에도 한다.", author: "무명", meaning: "차이는 결정적인 순간이 아니라 아무도 보지 않는 평범한 날에 만들어진다." },

let currentDay = 0;
let calYear, calMonth;
let state = {};
let timerInterval = null;
let timerSeconds = 10 * 60;
let timerRunning = false;
const now = new Date();

function getTodayKey() {
  return `${now.getFullYear()}_${now.getMonth()}_${now.getDate()}`;
}

function getDayKey(d) {
  return `habit_${d}_d${currentDay}`;
}

function loadState() {
  try {
    const saved = localStorage.getItem(getDayKey(getTodayKey()));
    state = saved ? JSON.parse(saved) : { exercises:{}, writing:{}, walk:false, memo:'' };
  } catch { state = { exercises:{}, writing:{}, walk:false, memo:'' }; }
}

function saveState() {
  try {
    localStorage.setItem(getDayKey(getTodayKey()), JSON.stringify(state));
    markDayRecord();
    showToast();
  } catch {}
}

function markDayRecord() {
  // 오늘 완료 여부 기록
  const lv = getCurrentLevel();
  const routine = getExercises(currentDay, lv.lv);
  let total = 0, done = 0;
  if (routine) {
    total += routine.exercises.length;
    done += routine.exercises.filter((_,i) => state.exercises[i]).length;
  }
  const wSteps = writingStepsByLevel[lv.lv];
  total += wSteps.length;
  done += wSteps.filter((_,i) => state.writing[i]).length;
  if (state.walk) done++, total++;

  const key = `record_${getTodayKey()}`;
  const pct = total > 0 ? done / total : 0;
  localStorage.setItem(key, JSON.stringify({ pct, done, total }));
}

// XP 계산
function getTotalXP() {
  let xp = 0;
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('record_')) {
      try {
        const rec = JSON.parse(localStorage.getItem(k));
        xp += Math.round((rec.pct || 0) * 10);
      } catch {}
    }
  }
  return xp;
}

function getCurrentLevel() {
  const xp = getTotalXP();
  let lv = LEVELS[0];
  for (const l of LEVELS) {
    if (xp >= l.xpNeeded) lv = l;
  }
  return lv;
}

function getNextLevel() {
  const xp = getTotalXP();
  for (let i = 1; i < LEVELS.length; i++) {
    if (xp < LEVELS[i].xpNeeded) return LEVELS[i];
  }
  return null;
}

function initDate() {
  const y = now.getFullYear();
  const m = String(now.getMonth()+1).padStart(2,'0');
  const d = String(now.getDate()).padStart(2,'0');
  document.getElementById('headerDate').textContent = `${y}.${m}.${d}`;
  const days = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
  document.getElementById('headerDay').textContent = days[now.getDay()];
  const map = {0:6,1:0,2:1,3:2,4:3,5:4,6:5};
  currentDay = map[now.getDay()] ?? 0;
  calYear = now.getFullYear();
  calMonth = now.getMonth();
}

function initQuote() {
  const idx = (now.getDate() + now.getMonth() * 31) % QUOTES.length;
  const q = QUOTES[idx];
  document.getElementById('quoteText').textContent = `"${q.text}"`;
  document.getElementById('quoteAuthor').textContent = `— ${q.author}`;
  document.getElementById('meaningBox').textContent = q.meaning || '';
}

function toggleMeaning() {
  const box = document.getElementById('meaningBox');
  const btn = document.getElementById('meaningBtn');
  const isHidden = box.style.display === 'none';
  box.style.display = isHidden ? 'block' : 'none';
  btn.textContent = isHidden ? '의미 닫기 ▲' : '의미 보기 ▼';
  btn.style.borderColor = isHidden ? 'var(--accent)' : 'var(--border)';
  btn.style.color = isHidden ? 'var(--accent)' : 'var(--muted)';
}

function updateLevelUI() {
  const xp = getTotalXP();
  const lv = getCurrentLevel();
  const next = getNextLevel();
  document.getElementById('levelBadge').textContent = lv.lv;
  document.getElementById('levelTitle').textContent = `Lv.${lv.lv} — ${lv.name}`;
  document.getElementById('levelSub').textContent = lv.sub;
  const pct = next ? Math.round(((xp - lv.xpNeeded) / (next.xpNeeded - lv.xpNeeded)) * 100) : 100;
  document.getElementById('xpFill').style.width = Math.min(pct,100) + '%';
  document.getElementById('xpText').textContent = next ? `${xp} XP → 다음 레벨까지 ${next.xpNeeded - xp} XP` : `${xp} XP — 최고 레벨 달성!`;
}

    const cg = document.createElement('div');
    cg.className = 'congrats'; cg.id = 'congrats';
    cg.innerHTML = `<h3>🎉 운동 완주!</h3><p>기록이 쌓이고 있어. XP +10 획득!</p>`;
    sec.appendChild(cg);

    container.appendChild(sec);
    updateProgress(routine, sec);
  } else if (isRest) {
    const card = document.createElement('div');
    card.className = 'rest-card';
    card.innerHTML = `
      <div class="rest-emoji">${currentDay===3 ? '🛌' : '☀️'}</div>
      <h2>완전 휴식</h2>
      <p>${currentDay===3 ? '근육은 쉴 때 자란다.<br>오늘은 맨발걷기만. 몸을 회복시켜.' : '이번 주 수고했어.<br>오늘은 진짜 쉬어. 다음 주도 잘 하자.'}</p>
    `;
    container.appendChild(card);
  }

  // 맨발걷기 (매일)
  const walkSec = document.createElement('div');
  walkSec.className = 'section';
  walkSec.innerHTML = `<div class="section-header"><span class="section-label" style="color:#7ae87a">맨발걷기</span><div class="section-line"></div></div>`;

  const walkCard = document.createElement('div');
  walkCard.className = 'walk-card' + (state.walk ? ' done' : '');
  walkCard.innerHTML = `
    <div class="check-circle" style="${state.walk ? 'background:#7ae87a;border-color:#7ae87a;color:#0f0f13' : 'border-color:#7ae87a'}">${state.walk ? '✓' : ''}</div>
    <span class="walk-name">봉서산 맨발걷기</span>
    <span class="walk-meta">20~30분</span>
  `;
  walkCard.addEventListener('click', () => {
    state.walk = !state.walk;
    walkCard.classList.toggle('done', state.walk);
    const cc = walkCard.querySelector('.check-circle');
    cc.textContent = state.walk ? '✓' : '';
    cc.style.cssText = state.walk ? 'background:#7ae87a;border-color:#7ae87a;color:#0f0f13;width:21px;height:21px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;' : 'border-color:#7ae87a;width:21px;height:21px;border-radius:50%;border:2px solid #7ae87a;display:flex;align-items:center;justify-content:center;font-size:11px;';
    saveState(); updateLevelUI();
  });
  walkSec.appendChild(walkCard);
  container.appendChild(walkSec);

  // 손글씨 섹션
  const writeSec = document.createElement('div');
  writeSec.className = 'section';
  writeSec.innerHTML = `<div class="section-header"><span class="section-label" style="color:var(--accent3)">손글씨 훈련</span><div class="section-line"></div></div>`;

  const wCard = document.createElement('div');
  wCard.className = 'writing-card';
  wCard.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
      <span style="font-size:15px;font-weight:700;">✍️ Lv.${lv.lv} 훈련 — 매일 10분</span>
      <span style="font-size:11px;color:var(--muted)">오전, 공부 전에</span>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:2px;">팔꿈치 책상 · 손목 일자 · 펜 45도 · 힘 빼기</div>
  `;

  const wSteps = writingStepsByLevel[lv.lv];
  const steps = document.createElement('div');
  steps.className = 'writing-steps';
  wSteps.forEach((s, i) => {
    const step = document.createElement('div');
    step.className = 'writing-step' + (state.writing[i] ? ' done' : '');
    step.innerHTML = `<div class="step-num">${state.writing[i] ? '✓' : i+1}</div><span class="step-text">${s.text}</span><span class="step-time">${s.time}</span>`;
    step.addEventListener('click', () => {
      state.writing[i] = !state.writing[i];
      step.classList.toggle('done', state.writing[i]);
      step.querySelector('.step-num').textContent = state.writing[i] ? '✓' : i+1;
      saveState(); updateLevelUI();
    });
    steps.appendChild(step);
  });
  wCard.appendChild(steps);
  writeSec.appendChild(wCard);

  // 타이머
  const timerSec = document.createElement('div');
  timerSec.className = 'timer-section';
  timerSec.innerHTML = `
    <div class="timer-label">손글씨 타이머</div>
    <div class="timer-display" id="timerDisplay">10:00</div>
    <div class="timer-btns">
      <button class="timer-btn primary" onclick="toggleTimer()">시작</button>
      <button class="timer-btn" onclick="resetTimer()">초기화</button>
    </div>
  `;
  writeSec.appendChild(timerSec);
  container.appendChild(writeSec);

  // 메모
  const memoSec = document.createElement('div');
  memoSec.className = 'memo-section';
  memoSec.innerHTML = `
    <div class="memo-box">
      <div class="memo-label">오늘의 기록</div>
      <textarea class="memo-input" id="memoInput" placeholder="오늘 느낀 점, 힘들었던 것, 잘 한 것을 자유롭게 써봐...">${state.memo||''}</textarea>
    </div>
  `;
  container.appendChild(memoSec);

  document.getElementById('memoInput').addEventListener('input', e => {
    state.memo = e.target.value; saveState();
  });

  updateTimerDisplay();
}

function toggleDetail(e, btn) {
  e.stopPropagation();
  const item = btn.closest('.exercise-item');
  item.classList.toggle('expanded');
  btn.textContent = item.classList.contains('expanded') ? '닫기' : '설명';
}

function updateProgress(routine, sec) {
  const total = routine.exercises.length;
  const done = routine.exercises.filter((_,i) => state.exercises[i]).length;
  const pct = Math.round((done/total)*100);
  const fill = document.getElementById('progFill');
  const text = document.getElementById('progText');
  const cg = document.getElementById('congrats');
  if (fill) fill.style.width = pct+'%';
  if (text) text.textContent = `${done} / ${total} 완료`;
  if (cg) cg.classList.toggle('show', done===total);
}

// ════════════════════════════
// 달력
// ════════════════════════════

function openCal() {
  calYear = now.getFullYear(); calMonth = now.getMonth();
  renderCal();
  document.getElementById('calModal').classList.add('show');
}

function closeCal(e) {
  if (e.target === document.getElementById('calModal')) closeCalBtn();
}
function closeCalBtn() { document.getElementById('calModal').classList.remove('show'); }
function calPrev() { calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCal(); }
function calNext() { calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCal(); }

function renderCal() {
  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('calTitle').textContent = `${calYear}년 ${months[calMonth]}`;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();

  for (let i = 0; i < firstDay; i++) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell empty';
    grid.appendChild(cell);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell';

    const key = `record_${calYear}_${calMonth}_${d}`;
    const rec = (() => { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } })();

    const isToday = calYear===now.getFullYear() && calMonth===now.getMonth() && d===now.getDate();
    if (isToday) cell.classList.add('today');

    if (rec) {
      if (rec.pct >= 0.85) cell.classList.add('done-day');
      else if (rec.pct > 0) cell.classList.add('partial-day');
    } else if (!isToday && new Date(calYear, calMonth, d) < now) {
      cell.classList.add('missed');
    }

    cell.textContent = d;
    if (rec) cell.title = `${rec.done}/${rec.total} 완료`;
    grid.appendChild(cell);
  }
}

// ════════════════════════════
// 타이머
// ════════════════════════════

function toggleTimer() {
  const btn = document.querySelector('.timer-btn.primary');
  if (!btn) return;
  if (timerRunning) {
    clearInterval(timerInterval); timerRunning = false;
    btn.textContent = '계속';
    document.getElementById('timerDisplay')?.classList.remove('running');
  } else {
    if (timerSeconds <= 0) { resetTimer(); return; }
    timerRunning = true; btn.textContent = '일시정지';
    document.getElementById('timerDisplay')?.classList.add('running');
    timerInterval = setInterval(() => {
      timerSeconds--;
      updateTimerDisplay();
      if (timerSeconds <= 0) {
        clearInterval(timerInterval); timerRunning = false;
        btn.textContent = '완료!';
        const disp = document.getElementById('timerDisplay');
        if (disp) { disp.classList.remove('running'); disp.classList.add('done-color'); disp.textContent = '완료! ✓'; }
      }
    }, 1000);
  }
}

function resetTimer() {
  clearInterval(timerInterval); timerRunning = false; timerSeconds = 10*60;
  const disp = document.getElementById('timerDisplay');
  if (disp) { disp.classList.remove('running','done-color'); }
  const btn = document.querySelector('.timer-btn.primary');
  if (btn) btn.textContent = '시작';
  updateTimerDisplay();
}

function updateTimerDisplay() {
  const disp = document.getElementById('timerDisplay');
  if (!disp || disp.classList.contains('done-color')) return;
  const m = Math.floor(timerSeconds/60);
  const s = timerSeconds % 60;
  disp.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function checkLevelup() {
  const prevXP = parseInt(localStorage.getItem('prev_xp') || '0');
  const currXP = getTotalXP();
  const prevLv = (() => { let l=LEVELS[0]; for(const ll of LEVELS){ if(prevXP>=ll.xpNeeded)l=ll; } return l; })();
  const currLv = getCurrentLevel();
  if (currLv.lv > prevLv.lv) {
    document.getElementById('levelupTitle').textContent = `Lv.${currLv.lv} 달성!`;
    document.getElementById('levelupSub').textContent = currLv.name;
    document.getElementById('levelupDesc').textContent = `🔓 ${currLv.unlock} 해금!\n${currLv.sub}`;
    document.getElementById('levelupPopup').classList.add('show');
  }
  localStorage.setItem('prev_xp', currXP);
}

function closeLevelup() {
  document.getElementById('levelupPopup').classList.remove('show');
  updateLevelUI(); renderMain();
}

const BIN_ID = '69e029c936566621a8ba3891';
const API_KEY = '$2a$10$GmXIwyo5n3LB7JIEvjSycumI89.62DFRm8UGsH4FBgJs4jBdm/kBq'; // ← 여기에 메모장의 API 키 붙여넣기

async function cloudSave(data) {
  try {
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
      body: JSON.stringify(data)
    });
  } catch(e) { console.log('동기화 실패', e); }
}

async function cloudLoad() {
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
      headers: { 'X-Master-Key': API_KEY }
    });
    const json = await res.json();
    return json.record;
  } catch(e) { return null; }
}

async function syncData() {
  const cloud = await cloudLoad();
  if (!cloud) return;
  Object.keys(cloud).forEach(k => {
    if (k !== 'timestamp') localStorage.setItem(k, JSON.stringify(cloud[k]));
  });
}

async function pushData() {
  const data = { timestamp: Date.now() };
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    try { data[k] = JSON.parse(localStorage.getItem(k)); } catch { data[k] = localStorage.getItem(k); }
  }
  await cloudSave(data);
  showToast();
}
