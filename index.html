<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="오늘의 행복">
<meta name="theme-color" content="#f3eee3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16151b" media="(prefers-color-scheme: dark)">
<title>오늘의 행복</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ── v9 · 새벽 한지 ─────────────────────────
   아침에 가장 먼저 보는 종이 한 장.
   상자·화살표·해설 없이, 글귀만 숨 쉬게.
──────────────────────────────────────────── */
:root {
  --bg:     #f3eee3;
  --bg2:    #ece6d8;
  --ink:    #2a2622;
  --ink2:   #4f4942;
  --muted:  #857c70;
  --muted2: #b0a699;
  --line:   rgba(42,38,34,0.12);
  --line2:  rgba(42,38,34,0.22);
  --red:    #b2443a;   /* 주사(朱砂) — 낙관 색 */
  --lotus:  #9a5f7b;   /* 연꽃 — 불교 말씀 */
  --moss:   #5e7a53;   /* 이끼 — 사실은 그랬다 */
  --indigo: #4a5f84;   /* 쪽빛 — 시험 영어 */
  --paper-shadow: rgba(42,38,34,0.06);
  --toast-bg: #2a2622;
  --toast-ink: #f3eee3;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:     #16151b;
    --bg2:    #1d1c23;
    --ink:    #ebe5d8;
    --ink2:   #cfc7b8;
    --muted:  #978f82;
    --muted2: #635c53;
    --line:   rgba(235,229,216,0.12);
    --line2:  rgba(235,229,216,0.22);
    --red:    #d2695e;
    --lotus:  #c58aa8;
    --moss:   #8fb07f;
    --indigo: #8ea3cc;
    --paper-shadow: rgba(0,0,0,0.3);
    --toast-bg: #ebe5d8;
    --toast-ink: #16151b;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

.wrapper {
  max-width: 560px;
  margin: 0 auto;
  padding: calc(26px + env(safe-area-inset-top)) 22px calc(120px + env(safe-area-inset-bottom));
}

/* ── 머리 ── */
.header {
  display: flex; justify-content: space-between; align-items: flex-end;
  padding: 10px 0 40px;
}
.brand {
  font-size: 11px; letter-spacing: 0.22em; color: var(--muted);
  font-weight: 400; cursor: pointer; margin-bottom: 8px;
}
.brand b { font-weight: 400; color: var(--red); margin-left: 6px; letter-spacing: 0.1em; }
.date {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 34px; font-weight: 700; letter-spacing: 0.02em; line-height: 1;
  color: var(--ink);
}
.date-sub {
  margin-top: 8px; font-size: 13px; color: var(--muted);
  display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
}
.date-sub .season { color: var(--ink2); }
.date-sub .season::before { content: "·"; color: var(--muted2); margin-right: 10px; }
.season { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.season-panel {
  display: none; margin: 0 0 30px; padding: 14px 16px; border-radius: 10px;
  background: var(--bg2); font-size: 13.5px; line-height: 1.75; color: var(--ink2); word-break: keep-all;
}
.season-panel.open { display: block; animation: fadeUp .3s ease both; }
.season-panel .sp-row + .sp-row { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.season-panel b { font-weight: 500; color: var(--ink); font-family: 'Nanum Myeongjo', serif; }
.season-panel .hanja { color: var(--muted); margin-left: 6px; font-size: 12px; }
.season-panel .when { color: var(--muted); font-size: 12px; margin-left: 6px; }

/* ── 고양이 무대 — 화면 전체 (v9: 선으로 그린 고양이) ── */
.wrapper { position: relative; }
.stage { position: absolute; inset: 0; pointer-events: none; z-index: 40; overflow: visible; }
.stage svg { position: absolute; left: 0; top: 0; overflow: visible; will-change: transform; }
.stage .zz { font-family: 'Noto Sans KR', sans-serif; font-weight: 400; fill: var(--muted); }

/* ── 글귀 ── */
.piece { padding: 6px 0 40px; animation: fadeUp .6s ease both; }
.piece { border-top: 1px solid var(--line); padding-top: 34px; }
.label {
  font-size: 11px; letter-spacing: 0.2em; color: var(--muted);
  font-weight: 400; margin-bottom: 18px; display: flex; align-items: center; gap: 10px;
}
.label::before { content: ""; width: 10px; height: 1px; background: var(--red); }
.piece.lotus .label::before { background: var(--lotus); }
.piece.moss  .label::before { background: var(--moss); }
.piece.indigo .label::before { background: var(--indigo); }

.verse {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 20px; line-height: 1.9; color: var(--ink);
  white-space: pre-line; word-break: keep-all;
}
.verse.big { font-size: 21px; }
.by {
  margin-top: 18px; font-size: 13px; color: var(--ink2); font-weight: 400;
}
.by .meta { display: block; margin-top: 3px; font-size: 11.5px; color: var(--muted); font-weight: 300; }
.tag {
  display: inline-block; margin-left: 8px; padding: 1px 6px; border-radius: 3px;
  border: 1px solid var(--line2); font-size: 10px; color: var(--muted); vertical-align: 1px;
}

/* 시험 영어 */
.eng-word { font-family: 'Nanum Myeongjo', serif; font-size: 26px; font-weight: 700; color: var(--ink); letter-spacing: 0.01em; }
.eng-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.eng-cat { font-size: 11px; color: var(--indigo); letter-spacing: 0.1em; }
.eng-pron { margin-top: 4px; font-size: 13px; color: var(--muted); }
.eng-mean { margin-top: 14px; font-size: 15px; line-height: 1.75; color: var(--ink2); word-break: keep-all; }
.eng-tip-btn {
  margin-top: 14px; background: none; border: none; color: var(--muted); font-size: 12px;
  cursor: pointer; font-family: 'Noto Sans KR', sans-serif; padding: 0; letter-spacing: 0.05em;
}
.eng-tip { display: none; margin-top: 10px; font-size: 13.5px; line-height: 1.7; color: var(--ink2);
  padding-left: 12px; border-left: 2px solid var(--indigo); word-break: keep-all; }
.eng-tip.open { display: block; }

/* 방명록 */
.gb-row { display: flex; gap: 8px; }
.gb-input {
  flex: 1; min-width: 0; background: var(--bg2); border: 1px solid var(--line);
  border-radius: 10px; padding: 12px 14px; color: var(--ink); font-size: 15px;
  font-family: 'Noto Sans KR', sans-serif; outline: none;
}
.gb-input:focus { border-color: var(--line2); }
.gb-input::placeholder { color: var(--muted2); }
.gb-submit {
  flex-shrink: 0; background: var(--ink); color: var(--bg); border: none; border-radius: 10px;
  padding: 0 16px; font-size: 14px; font-family: 'Noto Sans KR', sans-serif; cursor: pointer;
}
.gb-list { margin-top: 18px; }
.gb-item { padding: 12px 0; border-top: 1px dashed var(--line); }
.gb-item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.gb-time { font-size: 11px; color: var(--muted); letter-spacing: 0.05em; }
.gb-edited-tag { font-size: 10px; color: var(--muted2); margin-left: 6px; }
.gb-actions { display: flex; gap: 10px; }
.gb-action-btn { background: none; border: none; font-size: 11px; color: var(--muted2); cursor: pointer; font-family: 'Noto Sans KR', sans-serif; padding: 2px 0; }
.gb-action-btn.danger { color: var(--red); opacity: .7; }
.gb-action-btn.save { color: var(--moss); }
.gb-text { font-size: 15px; line-height: 1.7; color: var(--ink); white-space: pre-wrap; word-break: break-word; }
.gb-edit-row { display: flex; gap: 6px; align-items: center; }
.gb-edit-input { flex: 1; min-width: 0; background: var(--bg2); border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px; font-size: 14px; color: var(--ink); font-family: 'Noto Sans KR', sans-serif; outline: none; }
.gb-empty { font-size: 13px; color: var(--muted2); padding: 14px 0; }
.gb-more { display: none; }
.gb-more.open { display: block; }
.gb-toggle {
  margin-top: 14px; background: none; border: none; color: var(--muted); font-size: 12px;
  cursor: pointer; font-family: 'Noto Sans KR', sans-serif; padding: 4px 0; letter-spacing: 0.05em;
}

.toast {
  position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
  background: var(--toast-bg); color: var(--toast-ink); padding: 9px 16px; border-radius: 999px;
  font-size: 13px; opacity: 0; transition: .25s; pointer-events: none; z-index: 50; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.foot { margin-top: 10px; font-size: 11px; color: var(--muted2); letter-spacing: 0.08em; text-align: center; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none;} }
@keyframes pulse { 0%,100% { opacity: 1;} 50% { opacity: .3;} }

@media (max-width: 380px) {
  .date { font-size: 30px; }
  .verse { font-size: 18.5px; }
}
@media (prefers-reduced-motion: reduce) {
  .piece { animation: none; }
}
</style>
</head>
<body>
<div class="wrapper">

  <header class="header">
    <div>
      <div class="brand" onclick="location.reload()">오늘의 행복<b>v9</b></div>
      <div class="date" id="headerDate"></div>
      <div class="date-sub"><span id="headerDay"></span><span class="season" id="headerSeason" onclick="toggleSeason()"></span></div>
    </div>
  </header>
  <div class="season-panel" id="seasonPanel"></div>

  <!-- 1. 오늘의 명언 -->
  <section class="piece red">
    <div class="label" id="quoteDateLabel">오늘의 명언</div>
    <div class="verse big" id="quoteText"></div>
    <div class="by"><span id="quoteAuthor"></span><span class="tag" id="quoteBadge" style="display:none;"></span><span class="meta" id="quoteMeta"></span></div>
  </section>

  <!-- 2. 오늘의 불교 말씀 -->
  <section class="piece lotus">
    <div class="label">오늘의 불교 말씀</div>
    <div class="verse" id="budText"></div>
    <div class="by"><span class="meta" id="budSrc" style="margin-top:0;"></span></div>
  </section>

  <!-- 3. 사실은 그랬다 -->
  <section class="piece moss">
    <div class="label">사실은 그랬다</div>
    <div class="verse" id="factText"></div>
    <div class="by"><span class="meta" id="factTopic" style="margin-top:0;"></span></div>
  </section>

  <!-- 4. 오늘의 시험 영어 -->
  <section class="piece indigo">
    <div class="label">오늘의 시험 영어</div>
    <div class="eng-row"><div class="eng-word" id="engWord"></div><div class="eng-cat" id="engCat"></div></div>
    <div class="eng-pron" id="engPron"></div>
    <div class="eng-mean" id="engMeaning"></div>
    <button class="eng-tip-btn" id="engTipBtn" onclick="toggleEngTip()">답안 TIP 보기 ▾</button>
    <div class="eng-tip" id="engTip"></div>
  </section>

  <!-- 5. 방명록 -->
  <section class="piece red" id="gbSection">
    <div class="label">방명록</div>
    <div class="gb-row">
      <input type="text" class="gb-input" id="gbInput" placeholder="한 줄 남기고 가">
      <button class="gb-submit" onclick="submitGb()">남기기</button>
    </div>
    <div class="gb-list" id="gbList"></div>
    <div class="gb-list gb-more" id="gbMore"></div>
    <button class="gb-toggle" id="gbToggle" onclick="toggleGbMore()" style="display:none;"></button>
  </section>

  <div class="foot" id="foot"></div>
  <div class="stage" id="stage"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════
// 명언 v8 — 작게, 가볍게, 아침에.
// 주제: 새벽 · 보는 눈 · 작은 반복 · 아름다움 · 질문.
// 출처를 확인해 실었고, 흔히 떠도는 말이라도 출처가 불확실한 건 뺐어.
// [AI 창작] 배지가 붙은 것은 AI 언어모델 클로드가 쓴 문장이야.
// ══════════════════════════════════════════
const QUOTES = [
  { text: "새벽에 일어나기 싫을 때 스스로에게 말하라.\n나는 사람의 일을 하러 일어나는 것이다.", author: "마르쿠스 아우렐리우스", meta: "로마 · 황제이자 스토아 철학자 — 『명상록』 5권", years: "121 — 180" },
  { text: "일 년의 계획은 봄에 있고,\n하루의 계획은 새벽에 있다.", author: "『명심보감』 입교편", meta: "고려 말 엮음 — 공자의 '삼계도'를 옮긴 구절", years: "" },
  { text: "인간 영혼이 이 세상에서 하는 가장 위대한 일은\n무언가를 보는 것이다.\n그리고 본 것을 꾸밈없이 말하는 것이다.", author: "존 러스킨 (John Ruskin)", meta: "영국 · 미술비평가 — 『근대 화가론』", years: "1819 — 1900" },
  { text: "아름다움이 세상을 구원할 것이다.", author: "표도르 도스토옙스키", meta: "러시아 · 소설가 — 『백치』 속 미쉬킨 공작의 말", years: "1821 — 1881" },
  { text: "세상에서 가장 좋고 아름다운 것은\n보이지도 만져지지도 않는다.\n마음으로 느껴야 한다.", author: "헬렌 켈러 (Helen Keller)", meta: "미국 · 작가, 사회운동가", years: "1880 — 1968" },
  { text: "내가 고양이와 놀 때,\n사실은 고양이가 나를 데리고 노는 것인지\n누가 알겠는가.", author: "미셸 드 몽테뉴", meta: "프랑스 · 사상가 — 『수상록』 2권", years: "1533 — 1592" },
  { text: "위대한 일은\n작은 일들이 모여 이루어진다.", author: "빈센트 반 고흐", meta: "네덜란드 · 화가 — 동생 테오에게 보낸 편지, 1882", years: "1853 — 1890" },
  { text: "바위를 백 번 두드려도 금 하나 가지 않다가\n백한 번째에 둘로 갈라진다.\n그 한 번이 아니라, 앞의 백 번이 쪼갠 것이다.", author: "제이콥 리스 (Jacob Riis)", meta: "덴마크계 미국 · 사진기자 — 석공 이야기", years: "1849 — 1914" },
  { text: "가장 느린 사람이라도 목표를 잃지 않으면,\n목표 없이 헤매는 가장 빠른 사람보다 빠르다.", author: "고트홀트 레싱 (G. E. Lessing)", meta: "독일 · 극작가, 철학자", years: "1729 — 1781" },
  { text: "아는 것만으로는 충분하지 않다. 써야 한다.\n마음먹는 것만으로는 충분하지 않다. 해야 한다.", author: "요한 볼프강 폰 괴테", meta: "독일 · 작가 — 『빌헬름 마이스터의 편력시대』", years: "1749 — 1832" },
  { text: "우리에게 시간이 적은 것이 아니다.\n잃어버리는 시간이 많은 것이다.", author: "세네카 (Seneca)", meta: "로마 · 스토아 철학자 — 『인생의 짧음에 관하여』", years: "BC 4 — AD 65" },
  { text: "먼저 네가 어떤 사람이 되려는지\n스스로에게 말하라.\n그런 다음, 해야 할 일을 하라.", author: "에픽테토스 (Epictetus)", meta: "그리스 · 스토아 철학자 — 『담화록』 3권", years: "55 — 135" },
  { text: "질문 자체를 사랑하라.\n지금은 답을 찾지 말라.\n언젠가 먼 미래에, 자기도 모르는 사이에\n답 속으로 걸어 들어가 살게 될 것이다.", author: "라이너 마리아 릴케", meta: "오스트리아 · 시인 — 『젊은 시인에게 보내는 편지』", years: "1875 — 1926" },
  { text: "중요한 것은 질문을 멈추지 않는 것이다.\n호기심은 그 자체로 존재할 이유가 있다.", author: "알베르트 아인슈타인", meta: "독일계 미국 · 물리학자 — LIFE 인터뷰, 1955", years: "1879 — 1955" },
  { text: "인간의 모든 불행은 단 하나에서 온다.\n방 안에 조용히 머물 줄 모르는 것.", author: "블레즈 파스칼 (Blaise Pascal)", meta: "프랑스 · 수학자, 철학자 — 『팡세』", years: "1623 — 1662" },
  { text: "우리는 가진 것은 거의 생각하지 않고,\n없는 것만 늘 생각한다.", author: "아르투어 쇼펜하우어", meta: "독일 · 철학자 — 『소품과 부록』", years: "1788 — 1860" },
  { text: "왜 사는지를 아는 사람은\n거의 어떤 상황도 견뎌 낸다.", author: "프리드리히 니체", meta: "독일 · 철학자 — 『우상의 황혼』", years: "1844 — 1900" },
  { text: "한겨울에 나는 마침내 알았다.\n내 안에 꺾이지 않는 여름이 있다는 것을.", author: "알베르 카뮈 (Albert Camus)", meta: "프랑스 · 작가 — 『여름』 '티파사로 돌아오다'", years: "1913 — 1960" },
  { text: "다시 해 보라. 다시 실패하라.\n더 낫게 실패하라.", author: "사뮈엘 베케트 (Samuel Beckett)", meta: "아일랜드 · 극작가 — 『워스트워드 호』", years: "1906 — 1989" },
  { text: "기회는 준비된 마음에게만 찾아온다.", author: "루이 파스퇴르 (Louis Pasteur)", meta: "프랑스 · 미생물학자 — 릴 대학 연설, 1854", years: "1822 — 1895" },
  { text: "옛사람의 자취를 좇지 말고,\n옛사람이 구하던 것을 구하라.", author: "마쓰오 바쇼 (松尾芭蕉)", meta: "일본 · 하이쿠 시인 — 「허육이별사」", years: "1644 — 1694" },
  { text: "바람이 성긴 대숲에 불어와도\n지나가면 소리를 남기지 않고,\n기러기가 차가운 못을 건너도\n지나가면 그림자를 남기지 않는다.", author: "『채근담』", meta: "명나라 · 홍자성 — 風來疏竹 風過而竹不留聲", years: "" },

  { text: "산을 쌓다가 한 삼태기가 모자라 그만두어도\n내가 그만둔 것이다.\n땅을 고르다가 한 삼태기를 부어 나아가도\n내가 나아간 것이다.", author: "공자 — 『논어』 자한편", meta: "譬如爲山 未成一簣 止 吾止也", years: "BC 551 — BC 479" },
  { text: "우물을 아홉 길이나 팠더라도\n샘에 닿지 못하면\n우물을 버린 것과 같다.", author: "맹자 — 『맹자』 진심 상", meta: "掘井九軔 而不及泉 猶爲棄井也", years: "BC 372 — BC 289" },
  { text: "처음 배우는 사람은\n먼저 뜻을 세워야 한다.", author: "율곡 이이 — 『격몽요결』 입지장", meta: "조선 · 初學 先須立志", years: "1536 — 1584" },
  { text: "너희에게 물려줄 밭이 없어\n'근(勤)'과 '검(儉)' 두 글자를 준다.\n이것은 기름진 땅보다 낫다.", author: "다산 정약용", meta: "조선 · 유배지에서 두 아들에게 보낸 편지", years: "1762 — 1836" },
  { text: "반드시 죽고자 하면 살고,\n반드시 살고자 하면 죽는다.", author: "이순신 — 『난중일기』", meta: "조선 · 1597년 9월 15일, 명량 전날", years: "1545 — 1598" },
  { text: "오늘 아침 네가 본 가장 예쁜 것을\n하나만 기억해 두어라.\n저녁이 되면 그것이 하루 전체가 된다.", author: "클로드 (Claude)", meta: "AI 언어모델 · Anthropic", years: "", ai: true },
  { text: "외우려 하지 마라.\n자주 만나면 알게 된다.\n사람도 문장도 그렇다.", author: "클로드 (Claude)", meta: "AI 언어모델 · Anthropic", years: "", ai: true },
  { text: "손이 느린 날은 손이 느린 대로 쓴다.\n글씨는 속도가 아니라\n종이에 닿은 시간으로 남는다.", author: "클로드 (Claude)", meta: "AI 언어모델 · Anthropic", years: "", ai: true },
  { text: "창밖의 고양이는 시험을 모른다.\n그래도 해는 뜨고, 너는 일어난다.\n그게 전부고, 그게 충분하다.", author: "클로드 (Claude)", meta: "AI 언어모델 · Anthropic", years: "", ai: true },

  { word: "RTI", cat: "수계 소화", kor: "[알티아이]", meaning: "반응시간지수(Response Time Index). 헤드 감열부의 열적 민감도. τ=RTI/√u 관계.", tip: "130·129·122회 3회 기출(불티 SP-001). 정의식 RTI=τ√u, 등급값(조기≤50/특수≤80/표준≤350) 필수 암기." },
  { word: "K-factor", cat: "수계 소화", kor: "[케이팩터]", meaning: "방출계수. Q=K√P의 K값. 오리피스 구경이 클수록 큼(K80, K115, K160, K200…).", tip: "135·125회 기출(불티 SP-004). 계산문제 단골 — 단위(LPM/bar^0.5)를 틀리면 감점이니 단위까지 세트로." },
  { word: "ESFR", cat: "수계 소화", kor: "[이에스에프알]", meaning: "화재조기진압형 스프링클러(Early Suppression Fast Response). 랙크식 창고 등에 적용.", tip: "131·123·120회 기출(불티 SP-009). 3요소(RTI·K·설치위치)와 RDD/ADD 개념이 반드시 함께 나와." },
  { word: "RDD / ADD", cat: "수계 소화", kor: "[알디디 / 에이디디]", meaning: "필요살수밀도(Required Delivered Density) / 실제도달살수밀도(Actual Delivered Density). ADD>RDD면 진압 성공.", tip: "ESFR 진압이론의 핵심. 시간에 따른 RDD 상승·ADD 하락 그래프 하나가 답안의 승부처야." },
  { word: "Skipping", cat: "수계 소화", kor: "[스키핑]", meaning: "먼저 개방된 헤드의 살수가 인접 헤드를 냉각시켜 개방을 방해하는 현상.", tip: "헤드 간 최소이격거리(1.8m)의 이유를 묻는 문제의 정답 키워드. 짧은 용어 하나로 논리가 완성되는 케이스." },
  { word: "Cold Soldering", cat: "수계 소화", kor: "[콜드 솔더링]", meaning: "살수된 물이 감열부를 적셔 인접 헤드의 개방을 지연·방해하는 현상. Skipping과 유사 맥락.", tip: "ESFR·라지드롭 헤드의 배치기준 근거로 함께 언급하면 채점자가 '실무를 아는 답안'으로 읽어." },
  { word: "Cavitation", cat: "수계 소화", kor: "[캐비테이션]", meaning: "공동현상 — 펌프 흡입측 압력이 포화증기압 이하로 떨어져 기포가 생성·붕괴되는 현상.", tip: "135·128·125·120회 4회 기출(불티 SP-007) 최다빈출급. 정의→발생조건→영향→방지대책(NPSHav>NPSHre) 순서로." },
  { word: "NPSH", cat: "수계 소화", kor: "[엔피에스에이치]", meaning: "유효흡입수두(Net Positive Suction Head). NPSHav(이용가능)>NPSHre(필요)여야 공동현상 방지.", tip: "Cavitation 문제의 결론부 필수 수식. 'NPSHav ≥ NPSHre×1.3' 여유율까지 쓰면 실무형 답안 완성." },
  { word: "Water Hammer", cat: "수계 소화", kor: "[워터 해머]", meaning: "수격현상 — 밸브 급폐쇄 등으로 유속이 급변하며 압력파가 발생하는 현상.", tip: "122·128회 기출(불티 SP-008). Joukowsky 충격파식(ΔP=ρcΔv)을 쓰면 계산 근거가 생겨. 방지: 완폐쇄·수격방지기·에어챔버." },
  { word: "Interlock", cat: "수계 소화", kor: "[인터록]", meaning: "준비작동식 밸브 개방조건 방식. Single(감지기), Non(감지기 또는 헤드), Double(감지기 그리고 헤드).", tip: "138·137회 기출(불티 SP-010). 3방식 비교표(개방조건·오작동/실작동 리스크·적용장소)가 그대로 답안이 돼." },
  { word: "Trip Time", cat: "수계 소화", kor: "[트립 타임]", meaning: "건식밸브 개방 소요시간. 이후 물이 말단까지 도달하는 시간은 Transit Time. NFPA 13은 60초 기준.", tip: "132·125회 기출(불티 SP-011). 국내기준과 NFPA 60초 룰 비교가 논점 — 미국기준 비교형 문제의 전형이야." },
  { word: "Churn Pressure", cat: "수계 소화", kor: "[천 프레셔]", meaning: "체절압력 — 토출량 0 상태(체절운전)의 펌프 압력. 정격토출압의 140% 이하여야 함.", tip: "127·123·120회 기출(불티 SP-006). 성능시험 3운전점(체절 140%/정격 100%/최대 150% 유량 시 65%)과 함께." },
  { word: "Slenderness Ratio", cat: "수계 소화", kor: "[슬렌더니스 레이쇼]", meaning: "세장비(λ=L/r) — 흔들림방지버팀대 설계에서 300 이하로 제한되는 값.", tip: "139·133·124회 기출(불티 SP-012) 내진설계 계산문제. 좌굴 방지가 목적이라는 '이유'까지 쓰는 게 포인트." },
  { word: "Clean Agent", cat: "가스 소화", kor: "[클린 에이전트]", meaning: "청정소화약제 — 방출 후 잔류물이 없는 할로겐화합물·불활성기체 소화약제(NFPA 2001).", tip: "약제 분류 문제의 대분류 용어. 할로겐화합물(냉각·부촉매) vs 불활성기체(질식)의 소화원리 구분이 첫 논점." },
  { word: "Soaking Time", cat: "가스 소화", kor: "[소킹 타임]", meaning: "설계농도유지시간 — 재발화 방지를 위해 소화농도를 유지해야 하는 시간.", tip: "5회 기출(불티 GS-002) 최다빈출. 확보 방안(개구부 자동폐쇄·누설 최소화)과 영향요소를 세트로. 원어 표기가 표준이야." },
  { word: "Enclosure Integrity", cat: "가스 소화", kor: "[인클로저 인테그리티]", meaning: "방호구역 밀폐도. Door Fan Test로 누설면적을 측정해 약제 유지시간을 예측.", tip: "137·126·121회 기출(불티 GS-003) — f7 대문제급. 시험 원리(가압/감압)·절차·판정을 그림과 함께 정리해둬." },
  { word: "NOAEL / LOAEL", cat: "가스 소화", kor: "[노아엘 / 로아엘]", meaning: "무독성농도/최소독성농도. 할로겐화합물 약제의 인체 안전 기준 — 상주공간은 NOAEL 이하 설계.", tip: "약제 최대허용설계농도의 근거를 묻는 문제의 핵심. 심장 민감화(Cardiac Sensitization) 개념과 함께 쓰면 완성." },
  { word: "Stack Effect", cat: "제연", kor: "[스택 이펙트]", meaning: "연돌효과 — 실내외 온도차에 의한 밀도차로 수직 샤프트에 상승(겨울)·하강(여름) 기류가 형성되는 현상.", tip: "132·122회 기출(불티 SM-003). 중성대(Neutral Plane) 개념, 초고층 문제점, 대책(구획·방풍실·가압)까지 한 세트." },
  { word: "Plugholing", cat: "제연", kor: "[플러그홀링]", meaning: "배연구에서 연기층 아래의 신선공기까지 함께 빨려 들어가 배연효율이 떨어지는 현상.", tip: "138·121회 기출(불티 SM-002). NFPA 92의 최대배출량식과 방지대책(배연구 분산·연기층 두께 확보)이 표준 구성." },
  { word: "Backlayering", cat: "제연", kor: "[백레이어링]", meaning: "터널 화재에서 연기가 종류식 환기 기류를 거슬러 상류로 역류하는 현상.", tip: "129·128회 기출(불티 SM-005). 방지 조건이 임계풍속(Critical Velocity) — 두 용어는 반드시 한 문장에 같이 나와야 해." },
  { word: "Critical Velocity", cat: "제연", kor: "[크리티컬 벨로시티]", meaning: "임계풍속 — Backlayering을 방지할 수 있는 최소 종방향 풍속(통상 2~3m/s 수준).", tip: "터널 제연 문제의 결론 키워드. Kennedy식 언급하면 가점. HRR·터널높이의 함수라는 점까지." },
  { word: "Stratification", cat: "제연", kor: "[스트래티피케이션]", meaning: "연기 성층화 — 아트리움 등에서 연기가 특정 높이에 층을 이뤄 정체, 상부 감지기가 작동하지 못하는 현상.", tip: "131·128회 기출(불티 SM-006). 원인(온도역전층)과 대응(빔감지기 다단 설치·공기흡입형)이 논점이야." },
  { word: "Make-up Air", cat: "제연", kor: "[메이크업 에어]", meaning: "보충공기 — 배연량에 상응해 하부로 공급하는 급기. 유입풍속이 과하면 연기층을 교란함.", tip: "거실제연 설계 문제에서 '급기(Make-up Air) 유속 1m/s 수준 제한'을 언급하면 NFPA 92를 아는 답안이 돼." },
  { word: "Door Closing Force", cat: "제연", kor: "[도어 클로징 포스]", meaning: "부속실 가압 시 출입문 개방에 필요한 힘. 110N 이하로 제한.", tip: "139·135회 등 6회 기출(불티 SM-001) 최다빈출 주제의 4대 수치 중 하나 — 차압 40Pa·유입풍속 0.7m/s·110N·방연풍속 세트로." },
  { word: "ASET / RSET", cat: "피난", kor: "[에이셋 / 알셋]", meaning: "허용피난시간(Available Safe Egress Time) / 필요피난시간(Required Safe Egress Time). ASET>RSET이면 안전.", tip: "136·126회 기출(불티 EV-001). RSET 구성(감지+통보+지연+이동)을 시간축 그림으로 그리는 게 정석. 성능위주설계의 뼈대야." },
  { word: "Tenability", cat: "피난", kor: "[테너빌리티]", meaning: "거주가능성 — ASET 판정 기준. 호흡한계선 1.8m에서 온도 60℃·가시거리·CO농도 등의 한계값.", tip: "124·125회 기출(불티 EV-002). 인명안전기준 수치와 함께, 'Tenability Criteria'로 원어 표기하는 게 표준." },
  { word: "Egress", cat: "피난", kor: "[이그레스]", meaning: "피난. Means of Egress(피난경로)는 피난접근로(Exit Access)·피난로(Exit)·피난출구부(Exit Discharge) 3구성.", tip: "NFPA 101 비교형 문제의 기본 용어. 국내법의 '직통계단·피난계단' 체계와 대비시키면 미국기준 비교 답안이 완성돼." },
  { word: "PBD", cat: "피난·설계", kor: "[피비디]", meaning: "성능위주설계(Performance-Based Design). 공학적 해석으로 안전목표 달성을 검증하는 설계 방식.", tip: "130·127·123회 기출(불티 LW-003). 사양위주(Prescriptive)와의 비교, 대상물 기준, 시나리오 유형까지 3단 구성으로." },
  { word: "Design Fire", cat: "피난·설계", kor: "[디자인 파이어]", meaning: "설계화재 — PBD에서 가정하는 화재 시나리오의 HRR 성장곡선(αt² 등).", tip: "화재성장속도 4단계(Slow~Ultrafast)의 α값과 t² 곡선 그래프는 PBD 문제 어디에나 재사용 가능한 만능 부품이야." },
  { word: "HAZOP", cat: "위험성평가", kor: "[해좁]", meaning: "위험과 운전분석(Hazard and Operability Study). 가이드워드로 공정 이탈을 체계적으로 도출하는 정성적 기법.", tip: "134·127회 기출(불티 HZ-007). K-PSR과의 비교, 가이드워드(No/More/Less…) 예시를 표로 만들면 그대로 답안." },
  { word: "FTA / ETA", cat: "위험성평가", kor: "[에프티에이 / 이티에이]", meaning: "결함수분석(연역적, Top-down) / 사건수분석(귀납적, Bottom-up). 정량적 위험성평가의 두 축.", tip: "136·128회 기출(불티 HZ-008). '연역 vs 귀납' 방향성 비교가 핵심 논점 — AND/OR 게이트 그림 하나 곁들이면 좋아." },
  { word: "F-N Curve", cat: "위험성평가", kor: "[에프엔 커브]", meaning: "사고빈도(F)와 사망자수(N)의 관계 곡선. 사회적 위험도(Societal Risk)의 허용기준 판정에 사용.", tip: "QRA 절차의 마지막 단계. ALARP 영역(허용불가/조건부허용/광범위허용) 3구간 그림과 함께 쓰는 게 정석이야." },
  { word: "ALARP", cat: "위험성평가", kor: "[알랍]", meaning: "합리적으로 실행 가능한 최저 수준(As Low As Reasonably Practicable). 위험 허용기준의 핵심 원칙.", tip: "리스크 관리 문제의 결론부 단골. '비용 대비 편익이 현저히 불균형하지 않은 한 저감'이라는 정의를 정확히." },
  { word: "Domino Effect", cat: "위험성평가", kor: "[도미노 이펙트]", meaning: "한 설비의 사고가 인접 설비의 연쇄 사고를 유발하는 현상. 복사열·폭풍압·비산물이 매개.", tip: "위험물 시설 배치·이격거리 문제에서 '연쇄확대(Domino Effect) 방지'가 설계 목적으로 등장해. 짧지만 강한 키워드." },
  { word: "Arc", cat: "전기", kor: "[아크]", meaning: "전기불꽃 방전. 직렬아크(접촉불량)·병렬아크(절연파괴)로 구분되며 전기화재의 주요 발화원.", tip: "139·130회 기출(불티 EL-004). 아크차단기(AFCI)의 검출 원리(고주파 파형 분석)까지 쓰면 전기 파트 상위 답안." },
  { word: "Tracking", cat: "전기", kor: "[트래킹]", meaning: "절연물 표면의 오염·습기로 미소방전이 반복되어 탄화도전로가 형성, 발화에 이르는 현상.", tip: "발생 3단계(오염부착→건조대 형성·미소방전→탄화로 형성)를 순서대로 쓰는 것이 정석. 흑연화(Graphite)현상과 구분 필수." },
  { word: "Migration", cat: "전기", kor: "[마이그레이션]", meaning: "은(Ag) 이온이 절연물 표면을 이동해 석출, 절연저하와 발열·발화를 일으키는 현상.",  tip: "139·136회 기출(불티 EL-005). 은 이온화→이동→석출·수지상 성장의 메커니즘 순서 + 발생조건(직류·습기·은)." },
  { word: "Thermal Runaway", cat: "전기·신기술", kor: "[써멀 런어웨이]", meaning: "리튬이온 배터리의 열폭주 — 내부 발열이 연쇄 반응을 일으켜 제어 불가능하게 온도가 상승하는 현상.", tip: "ESS·전기차 화재는 최신 출제 경향의 중심. 발생 메커니즘(SEI 분해→분리막 붕괴→양극 분해)과 Off-gassing 연계로." },
  { word: "Off-gassing", cat: "전기·신기술", kor: "[오프개싱]", meaning: "열폭주 전 단계에서 배터리 내부 전해액이 분해되어 가연성 가스를 방출하는 현상.", tip: "ESS 화재 '조기감지' 대책의 근거 — 오프가스 감지기가 연기감지기보다 앞선 단계라는 논리로 답안을 세워." },

  const t = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
  return Math.round((t - DAY_ANCHOR) / 86400000);
}
function mod(n, m) { return ((n % m) + m) % m; }

function ls(key, fallback = null) {
  try {
    const v = localStorage.getItem(key);
    return v !== null ? JSON.parse(v) : fallback;
  } catch { return fallback; }
}
function touchKey(key) {
  try {
    const raw = localStorage.getItem('_ts_index');
    const idx = raw ? JSON.parse(raw) : {};
    idx[key] = Date.now();
    localStorage.setItem('_ts_index', JSON.stringify(idx));
  } catch {}
}
function lsSet(key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));
    touchKey(key);
  } catch {}
}

// 절기 한 줄: "한로 지나 · 상강까지 9일"
function seasonLine() {
  const y = NOW.getFullYear();
  const today = new Date(y, NOW.getMonth(), NOW.getDate());
  const list = [];
  [y - 1, y, y + 1].forEach(yy => SEASONS.forEach(([m, d, n]) => list.push({ d: new Date(yy, m - 1, d), n })));
  list.sort((a, b) => a.d - b.d);
  let prev = null, next = null;
  for (const s of list) { if (s.d <= today) prev = s; else { next = s; break; } }
  if (!prev || !next) return '';
  const gap = Math.round((next.d - today) / 86400000);
  const since = Math.round((today - prev.d) / 86400000);
  SEASON_CUR = { prev, next, gap, since };
  if (since === 0) return `오늘은 ${prev.n}`;
  if (gap === 1) return `내일 ${next.n}`;
  return `${prev.n} 지나 · ${next.n}까지 ${gap}일`;
}
let SEASON_CUR = null;
function toggleSeason() {
  const p = document.getElementById('seasonPanel');
  if (p.classList.contains('open')) { p.classList.remove('open'); return; }
  if (!SEASON_CUR) return;
  const fmt = d => `${d.getMonth() + 1}.${d.getDate()}`;
  const row = (s, when) => {
    const info = SEASON_INFO[s.n] || ['', ''];
    return `<div class="sp-row"><b>${s.n}</b><span class="hanja">${info[0]}</span><span class="when">${when} · ${fmt(s.d)}</span><br>${info[1]}</div>`;
  };
  p.innerHTML = row(SEASON_CUR.prev, SEASON_CUR.since === 0 ? '오늘' : `${SEASON_CUR.since}일 전`) + row(SEASON_CUR.next, `${SEASON_CUR.gap}일 뒤`);
  p.classList.add('open');
}

let editingGbId = null;

function migrateToGuestbook() {
  if (ls('gb_migrated_v4')) return;
  const gb = ls('guestbook', []) || [];
  const have = new Set(gb.map(e => e.id));
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
  keys.forEach(k => {
    if (/^entries_\d+_\d+_\d+$/.test(k)) {
      const [y, m, d] = k.slice(8).split('_').map(Number);
      const arr = ls(k, []) || [];
      if (!Array.isArray(arr)) return;
      arr.forEach(e => {
        if (!e || !e.id || !e.text) return;
        const id = 'mig_' + e.id;
        if (have.has(id)) return;
        gb.push({ id, ts: e.ts || new Date(y, m, d, 12).getTime(), text: e.text, editedTs: e.editedTs, deleted: e.deleted, deletedTs: e.deletedTs });
        have.add(id);
      });
    } else if (/^memo_\d+_\d+_\d+$/.test(k)) {
      const [y, m, d] = k.slice(5).split('_').map(Number);
      const t = ls(k, '');
      if (t && String(t).trim()) {
        const id = 'migmemo_' + k;
        if (!have.has(id)) { gb.push({ id, ts: new Date(y, m, d, 12).getTime(), text: String(t) }); have.add(id); }
      }
    }
  });
  gb.sort((a, b) => (a.ts || 0) - (b.ts || 0));
  lsSet('guestbook', gb);
  lsSet('gb_migrated_v4', true);
}

function fmtGbDate(ts) {
  const d = new Date(ts);
  const days = ['일','월','화','수','목','금','토'];
  return `${d.getMonth() + 1}.${d.getDate()}(${days[d.getDay()]}) ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function submitGb() {
  const input = document.getElementById('gbInput');
  const text = input.value.trim();
  if (!text) return;
  const gb = ls('guestbook', []) || [];
  gb.push({ id: `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`, ts: Date.now(), text });
  lsSet('guestbook', gb);
  input.value = '';
  renderGb();
  showToast('방명록에 남김 ✓');
  syncAfterChange();
}
function startEditGb(id) { editingGbId = id; renderGb(); }
function cancelEditGb() { editingGbId = null; renderGb(); }
function saveEditGb(id, newTextRaw) {
  const newText = (newTextRaw || '').trim();
  if (!newText) return;
  const gb = ls('guestbook', []) || [];
  const i = gb.findIndex(x => x.id === id);
  if (i !== -1) { gb[i].text = newText; gb[i].editedTs = Date.now(); lsSet('guestbook', gb); }
  editingGbId = null;
  renderGb(); showToast('수정됨 ✓'); syncAfterChange();
}
function deleteGb(id) {
  if (!confirm('이 글을 삭제할까?')) return;
  const gb = ls('guestbook', []) || [];
  const i = gb.findIndex(x => x.id === id);
  if (i !== -1) { gb[i].deleted = true; gb[i].deletedTs = Date.now(); lsSet('guestbook', gb); }
  renderGb(); showToast('삭제됨 ✓'); syncAfterChange();
}

let gbMoreOpen = false;
function toggleGbMore() { gbMoreOpen = !gbMoreOpen; renderGb(); }
function gbItem(e) {
  const el = document.createElement('div');
  el.className = 'gb-item';
  if (editingGbId === e.id) {
    const row = document.createElement('div');
    row.className = 'gb-edit-row';
    const input = document.createElement('input');
    input.type = 'text'; input.className = 'gb-edit-input'; input.value = e.text;
    const saveBtn = document.createElement('button');
    saveBtn.className = 'gb-action-btn save'; saveBtn.textContent = '저장';
    saveBtn.addEventListener('click', () => saveEditGb(e.id, input.value));
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'gb-action-btn'; cancelBtn.textContent = '취소';
    cancelBtn.addEventListener('click', cancelEditGb);
    input.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); saveEditGb(e.id, input.value); }
      if (ev.key === 'Escape') { ev.preventDefault(); cancelEditGb(); }
    });
    row.appendChild(input); row.appendChild(saveBtn); row.appendChild(cancelBtn);
    el.appendChild(row);
    setTimeout(() => { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }, 0);
    return el;
  }
  const top = document.createElement('div');
  top.className = 'gb-item-top';
  const timeSpan = document.createElement('span');
  timeSpan.className = 'gb-time'; timeSpan.textContent = fmtGbDate(e.ts || 0);
  top.appendChild(timeSpan);
  if (e.editedTs) {
    const tag = document.createElement('span');
    tag.className = 'gb-edited-tag'; tag.textContent = '(수정됨)';
    top.appendChild(tag);
  }
  const actions = document.createElement('div');
  actions.className = 'gb-actions';
  const editBtn = document.createElement('button');
  editBtn.className = 'gb-action-btn'; editBtn.textContent = '수정';
  editBtn.addEventListener('click', () => startEditGb(e.id));
  const delBtn = document.createElement('button');
  delBtn.className = 'gb-action-btn danger'; delBtn.textContent = '삭제';
  delBtn.addEventListener('click', () => deleteGb(e.id));
  actions.appendChild(editBtn); actions.appendChild(delBtn);
  top.appendChild(actions);
  const textDiv = document.createElement('div');
  textDiv.className = 'gb-text'; textDiv.textContent = e.text;
  el.appendChild(top); el.appendChild(textDiv);
  return el;
}
// 최근 3일치만 펼쳐 두고, 나머지는 접어 둠.
function renderGb() {
  const list = document.getElementById('gbList');
  const more = document.getElementById('gbMore');
  const toggle = document.getElementById('gbToggle');
  const gb = (ls('guestbook', []) || []).filter(e => !e.deleted).sort((a, b) => (b.ts || 0) - (a.ts || 0));
  list.innerHTML = ''; more.innerHTML = '';
  if (!gb.length) {
    list.innerHTML = `<div class="gb-empty">첫 글을 남겨봐. 여기 글은 계속 쌓여.</div>`;
    toggle.style.display = 'none';
    return;
  }
  const cutoff = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate() - 2).getTime();
  const recent = gb.filter(e => (e.ts || 0) >= cutoff);
  const older = gb.filter(e => (e.ts || 0) < cutoff);
  if (!recent.length) list.innerHTML = `<div class="gb-empty">최근 3일은 조용했어.</div>`;
  recent.forEach(e => list.appendChild(gbItem(e)));
  older.forEach(e => more.appendChild(gbItem(e)));
  more.classList.toggle('open', gbMoreOpen);
  if (older.length) {
    toggle.style.display = 'block';
    toggle.textContent = gbMoreOpen ? '이전 글 접기 ▴' : `이전 글 ${older.length}개 펼치기 ▾`;
  } else toggle.style.display = 'none';
}

// ── 이번 순간의 자세 계산 ──
function poseOf(c, dt, t) {

  const cp = c.p;
  for (const key of PK) cp[key] += (goal[key] - cp[key]) * k;
  const p = Object.assign({}, cp);

      p.ky += (a + 0.2) * Math.sin(w * 2 + 0.7) * m; p.ty += a * Math.sin(w * 2) * m;
    }

  }

  const s1 = Math.sin(t * 1.3 + c.seed);
  switch (c.anim) {
    case 'eat':   { const n = Math.sin(t * 9); p.ky += 0.7 * n; p.kr += 3 * n; p.tc += 8 * s1; break; }
    case 'groom': { const n = Math.sin(t * 7.5); p.ky += 1.3 * n; p.kr += 6 * n; p.nfy += 0.8 * n; p.tc += 6 * s1; break; }
    case 'wiggle':{ p.hx += 1.0 * Math.sin(t * 27); p.tc += 22 * Math.sin(t * 13); break; }
    case 'watch': { p.tc += 26 * Math.sin(t * 9); break; }
    case 'bat':   { const u = Math.sin(Math.PI * c.batU); p.nfx += 8.5 * u; p.nfy -= 6.5 * u; p.sy += 1.2 * u; p.ky += 1.5 * u; p.kx += 1 * u; break; }
    case 'sleep': { const b = Math.sin(t * 1.7 + c.seed); p.br *= 1 + 0.04 * b; p.hy -= 0.3 * b; p.sy -= 0.3 * b; break; }
    case 'loaf':  { const b = Math.sin(t * 1.9 + c.seed); p.br *= 1 + 0.025 * b; p.tc += 10 * s1; break; }
    case 'sit':   { p.tc += 16 * s1; p.kr += 3 * Math.sin(t * 0.6 + c.seed * 2); break; }
    case 'stretch': { p.tc += 8 * s1; break; }
    default: { p.tc += 9 * s1; }
  }

  c.blink -= dt;
  if (c.blink < 0) c.blink = rnd(2.5, 7);
  if (c.blink < 0.13 || (c.anim === 'loaf' && Math.sin(t * 0.35 + c.seed) > 0.55)) p.eye = 0;
  return p;
}

function drawLeg(leg, paw, jx, jy, fx, fy, bow, lg) {

function renderCat(c, dt, t) {

// ── 동작 ── 고양이마다 "할 일 목록(q)"이 있고, 앞에서부터 하나씩 해.
// 돌아서기 — 한 번 돌면 0.5초 동안은 다시 돌지 않아 (제자리에서 좌우로 떨리는 것 방지)

  if (!force && c.sinceTurn < 0.5) return false;
  c.face = dir; c.sinceTurn = 0;
  return true;
}
const P = (pose, dur, extra) => Object.assign({ k: 'pose', pose, dur }, extra || {});

  const g = GAITS[gait], dx = tx - c.x, step = g.speed * CAT_S * dt;
  if (Math.abs(dx) <= step + 0.3) { c.x = tx; c.moving = false; return true; }

function planTo(c, floor) {            // 지금 있는 곳에서 floor 줄의 땅까지
  let acts = [], fl = c.floor, x = c.x;
  if (c.perch >= 0) { acts = climbActs(c.perch, -1); fl = 0; x = tower.x + TOWER_GX; }
  return acts.concat(floorActs(fl, x, floor));
}
const randX = f => f === 0 ? rnd(78, Math.max(90, tower.x - 16)) : rnd(16, stageW() - 16);

function stepAct(c, a, dt, t) {
  if (!a.on) {
    a.on = true; a.el = 0;
    if (a.k === 'pose') {
      if (a.toPerch !== undefined) { const tx = a.toPerch >= 0 ? tower.x + PERCH[a.toPerch].cx : tower.x + TOWER_GX; if (Math.abs(tx - c.x) > 2) turn(c, tx > c.x ? 1 : -1, true); }
      if (a.face) turn(c, a.face, true);
      if (a.pose === 'sit' && c.perch < 0 && !a.face && Math.random() < 0.3) turn(c, -c.face);
    }
    if (a.k === 'go') a.tx = val(a.x);          // 갈 곳은 출발할 때 한 번만 정함 (매 순간 다시 정하면 좌우로 떨림)
    if (a.k === 'jump') {
      a.fx = c.x; a.ff = c.floor; a.fp = c.perch;
      a.tx = a.perch >= 0 ? tower.x + PERCH[a.perch].cx : (a.x !== undefined ? val(a.x) : tower.x + TOWER_GX);
      const dy = groundY(a.floor, a.perch) - groundY(a.ff, a.fp);
      a.T = 0.34 + 0.0022 * Math.hypot(a.tx - a.fx, dy);
      a.h = a.h || (11 + 0.16 * Math.abs(dy));
      if (Math.abs(a.tx - a.fx) > 2) turn(c, a.tx > a.fx ? 1 : -1, true);
    }
    if (a.k === 'yarn') { a.s = 'chase'; a.pounce = Math.random() < 0.45; }
  }
  a.el += dt;
  switch (a.k) {
    case 'pose':
      c.moving = false; c.goal = a.pose; c.anim = a.anim || a.pose; c.snap = a.pose === 'crouch' ? 16 : 9;
      return a.el >= a.dur;
    case 'go':
      return moveToward(c, a.tx, a.gait, dt);
    case 'call':
      a.fn(c); return true;
    case 'jump': {
      const u = Math.min(1, a.el / a.T);
      const y0 = groundY(a.ff, a.fp), y1 = groundY(a.floor, a.perch);
      c.moving = false; c.goal = 'jump'; c.anim = 'jump'; c.snap = 22; c.air = true;
      c.x = a.fx + (a.tx - a.fx) * u;
      c.airY = y0 + (y1 - y0) * u - a.h * 4 * u * (1 - u);
      const vy = (y1 - y0) - a.h * 4 * (1 - 2 * u), vx = Math.abs(a.tx - a.fx) + 26;
      c.pitch = clamp(Math.atan2(vy, vx) * 180 / Math.PI * 0.75, -38, 38);
      if (u >= 1) { c.air = false; c.pitch = 0; c.floor = a.floor; c.perch = a.perch; c.x = a.tx; c.goal = 'crouch'; c.snap = 16; return true; }
      return false;
    }
    case 'yarn': {
      const W = stageW();
      if (a.sub) {                                         // 덮치는 중
        if (stepAct(c, a.sub, dt, t)) { a.sub = null; yarn.v = c.face * rnd(140, 220); a.s = 'watch'; a.w = rnd(0.3, 0.6); }
        return false;
      }
      if (a.el >= a.dur && a.s !== 'bat') { c.moving = false; c.batU = 0; return true; }
      const dx = yarn.x - c.x, ad = Math.abs(dx), dir = dx >= 0 ? 1 : -1;
      if (a.s === 'bat') {                                 // 앞발로 톡
        a.b += dt / 0.26; c.moving = false; c.goal = 'stand'; c.anim = 'bat'; c.snap = 11; c.batU = Math.min(1, a.b);
        if (!a.hit && a.b >= 0.5) { a.hit = true; yarn.v = c.face * rnd(80, 200); }
        if (a.b >= 1) { c.batU = 0; a.s = 'watch'; a.w = rnd(0.25, 0.7); }
        return false;
      }
      if (a.s === 'watch') {                               // 굴러가는 걸 지켜봄
        c.moving = false; c.goal = 'crouch'; c.anim = 'watch'; c.snap = 14; if (ad > 10) turn(c, dir); a.w -= dt;
        if (a.w <= 0) { a.s = 'chase'; a.pounce = Math.random() < 0.45; }
        return false;
      }
      if (a.s === 'stalk') {                               // 엉덩이 흔들기 → 덮치기
        c.moving = false; c.goal = 'crouch'; c.anim = 'wiggle'; c.snap = 14; if (ad > 10) turn(c, dir); a.w -= dt;
        if (a.w <= 0) { a.sub = { k: 'jump', x: clamp(yarn.x - c.face * 9, 12, W - 12), floor: c.floor, perch: -1, h: 13 }; a.s = 'chase'; a.pounce = false; }
        return false;
      }
      if (ad <= 17) {                                      // 발 닿는 거리 — 뒷걸음질하지 않고 그 자리에서
        c.moving = false;
        if (ad > 5 && !turn(c, dir)) return false;         // 공이 등 뒤에 있으면 돌아설 때까지 기다림
        if (Math.abs(yarn.v) < 45) { a.s = 'bat'; a.b = 0; a.hit = false; }
        else { c.goal = 'crouch'; c.anim = 'watch'; c.snap = 14; }
        return false;
      }
      if (a.pounce && ad > 36 && ad < 82 && Math.abs(yarn.v) < 8) { a.s = 'stalk'; a.w = rnd(0.6, 1.1); c.moving = false; return false; }
      moveToward(c, yarn.x - dir * 14, ad > 75 ? 'run' : 'trot', dt);
      return false;
    }
    case 'chase': {
      const o = a.o, dx = o.x - c.x;
      if (a.el > a.dur || o.floor !== c.floor || o.perch >= 0 || Math.abs(dx) < 30) { c.moving = false; return true; }
      moveToward(c, o.x, 'run', dt);
      return false;
    }
  }
  return true;
}

// ── 다음에 뭘 할지 고르기 ──
function idleNow(o) { return o.perch < 0 && !o.air && o.q.length === 1 && o.q[0].k === 'pose' && o.q[0].pose !== 'sleep' && !o.q[0].hidden; }
function choose(c) {
  const night = isNight(), W = stageW();
  const lazy = c.mood === 'lazy', playful = c.mood === 'playful';
  const o = cats.find(k => k !== c);
  const push = (...items) => items.forEach(x => Array.isArray(x) ? c.q.push(...x) : c.q.push(x));
  const nap = () => night ? rnd(120, 400) : rnd(20, 60);
  const fresh = !night && performance.now() < 90000 ? 0.3 : 1;   // 막 켰을 땐 덜 자고 더 움직임

  // 타워 위에 있을 때
  if (c.perch >= 0) {
    const r = Math.random();
    if (r < (night ? 0.8 : lazy ? 0.3 : 0.12)) push(P('sleep', nap()), P('sit', rnd(2, 4)));
    else if (r < 0.4) push(P('loaf', rnd(8, 22)));
    else if (r < 0.5) push(P('groom', rnd(4, 9)), P('sit', rnd(1, 3)));
    else if (r < 0.6) push(P('sit', rnd(5, 12)));
    else if (r < 0.72) { const to = (c.perch + 1 + Math.floor(Math.random() * 2)) % 3; push(climbActs(c.perch, to), P('sit', rnd(4, 10))); }
    else push(climbActs(c.perch, -1), G(() => randX(0), 'walk'), P('sit', rnd(2, 5)));
    return;
  }

  // 보고 있는 줄로 슬슬 따라옴
  const vis = visibleFloors();
  if (!night && vis.length && !vis.includes(c.floor) && Math.random() < 0.7) {
    const f = vis[Math.floor(Math.random() * vis.length)];
    push(planTo(c, f), G(() => randX(f), 'walk'), P('sit', rnd(2, 6)));
    return;
  }

  const bowlBusy = cats.some(k => k !== c && k.q[0] && k.q.some(a => a.pose === 'eat'));
  const canChase = !night && idleNow(o) && o.floor === c.floor;
  const opts = [
    ['sleep', night ? 0.6 : (lazy ? 0.2 : playful ? 0.04 : 0.09) * fresh],
    ['loaf',  night ? 0.14 : 0.09 * fresh],
    ['sit',   0.11],
    ['groom', 0.1],
    ['walk',  night ? 0.06 : 0.2],
    ['eat',   bowlBusy || night ? 0.02 : 0.1],
    ['yarn',  night ? 0.01 : playful ? 0.22 : lazy ? 0.07 : 0.15],
    ['tower', night ? 0.05 : 0.13],
    ['zoom',  night ? 0 : playful ? 0.1 : lazy ? 0.02 : 0.05],
    ['chase', !canChase ? 0 : playful ? 0.25 : lazy ? 0.06 : 0.12],
  ];
  const total = opts.reduce((s, [, v]) => s + v, 0);
  let r = Math.random() * total, pickd = 'sit';
  for (const [k, v] of opts) { if (r < v) { pickd = k; break; } r -= v; }

  if (pickd === 'sleep') push(P('sleep', nap()), P('stretch', 1.7), P('sit', rnd(1.5, 4)));
  else if (pickd === 'loaf') push(P('loaf', rnd(8, 22)));
  else if (pickd === 'sit') push(P('sit', rnd(4, 11)));
  else if (pickd === 'groom') push(P('sit', 0.7), P('groom', rnd(4, 9)), P('sit', rnd(1, 3)));
  else if (pickd === 'walk') {
    let f = c.floor;
    if (floors.length > 1 && Math.random() < 0.3) {
      const pool = vis.length && Math.random() < 0.75 ? vis : floors.map((_, i) => i);
      f = pool[Math.floor(Math.random() * pool.length)];
    }
    push(planTo(c, f), G(() => randX(f), 'walk'), P(Math.random() < 0.5 ? 'sit' : 'stand', rnd(1.5, 5)));
  }
  else if (pickd === 'eat') {
    const water = Math.random() < 0.4;
    push(planTo(c, 0), G((water ? BOWL_WATER_X : BOWL_FOOD_X) + 22, 'trot'), P('stand', 0.25, { face: -1 }),
         P('eat', rnd(6, 12), { face: -1 }), P('stand', 0.6), G(() => randX(0), 'walk'), P('sit', 1), P('groom', rnd(2.5, 5)), P('sit', rnd(1, 3)));
  }
  else if (pickd === 'yarn') {
    push(planTo(c, yarn.floor), { k: 'yarn', dur: rnd(9, 18) }, P('sit', rnd(2, 5)));
    // 옆에서 쉬던 녀석도 가끔 끼어듦
    if (idleNow(o) && Math.random() < (o.mood === 'playful' ? 0.6 : o.mood === 'lazy' ? 0.15 : 0.35))
      o.q = [P('stand', rnd(0.8, 2.5))].concat(planTo(o, yarn.floor), [{ k: 'yarn', dur: rnd(7, 14) }, P('sit', rnd(2, 5))]);
  }
  else if (pickd === 'tower') {
    const to = Math.floor(Math.random() * 3);
    const rest = Math.random();
    push(planTo(c, 0), G(() => tower.x + TOWER_GX, 'trot'), climbActs(-1, to),
         rest < 0.35 ? P('loaf', rnd(12, 30)) : rest < 0.55 ? P('sleep', nap()) : P('sit', rnd(8, 22)));
  }
  else if (pickd === 'zoom') {
    const lo = 16, hi = c.floor === 0 ? tower.x - 14 : W - 16;
    let right = c.x < (lo + hi) / 2;
    const n = 2 + Math.floor(Math.random() * 2);
    for (let i = 0; i < n; i++) {
      push(G(right ? rnd(Math.max(lo, hi - 70), hi) : rnd(lo, Math.min(hi, lo + 70)), 'run'));
      if (i < n - 1) push(P('crouch', rnd(0.6, 1.3), { anim: 'wiggle' }));
      right = !right;
    }
    push(P('stand', 0.6), P('sit', rnd(2, 5)));
  }
  else if (pickd === 'chase') {
    const lo = 16, hi = c.floor === 0 ? tower.x - 14 : W - 16;
    const away = o.x > c.x ? hi : lo;
    o.q = [P('crouch', 0.16, { face: o.x > c.x ? 1 : -1 }), G(away, 'run'), G(away === hi ? Math.max(lo, hi - rnd(60, 140)) : Math.min(hi, lo + rnd(60, 140)), 'trot'), P('sit', rnd(3, 7))];
    push({ k: 'chase', o, dur: 6 }, P('stand', 0.5), P('sit', rnd(2, 5)));
  }
}

// ── 한 순간 ──
function stepYarn(dt) {
  const W = stageW();
  if (yarn.v) {
    yarn.x += yarn.v * dt;
    yarn.rot += yarn.v * dt / 6.5 * 180 / Math.PI;
    yarn.v *= Math.exp(-1.5 * dt);
    if (yarn.x < 9) { yarn.x = 9; yarn.v = Math.abs(yarn.v) * 0.6; }
    if (yarn.x > W - 9) { yarn.x = W - 9; yarn.v = -Math.abs(yarn.v) * 0.6; }
    if (Math.abs(yarn.v) < 4) yarn.v = 0;
  }
  yarn.lag += (yarn.x - yarn.lag) * (1 - Math.exp(-dt * 3));
  const d = clamp(yarn.lag - yarn.x, -24, 24) || -12;
  place(yarn.el, PAD + yarn.x - 10, groundY(yarn.floor, -1) - 16.5);
  yarn.ball.setAttribute('transform', `rotate(${R1(yarn.rot)})`);
  yarn.thread.setAttribute('d', `M0 5.5 Q${R1(d * 0.4)} ${d > 0 ? 3 : 3} ${R1(d * 0.7)} 5.6 T${R1(d)} 5.8`);
}
let catClock = 0;
function frameCats(ts) {
  requestAnimationFrame(frameCats);
  if (ts - catClock < 30) return;                       // 1초에 서른 번쯤
  const dt = Math.min(0.06, (ts - catClock) / 1000); catClock = ts;
  const t = ts / 1000;
  if (!floors.length) return;
  stepYarn(dt);
  if (tower.toy) tower.toy.setAttribute('transform', `rotate(${R1(Math.sin(t * 1.4) * 5)} 24 -96.5)`);
  cats.forEach(c => {
    if (!c.q.length) choose(c);
    if (c.q.length && stepAct(c, c.q[0], dt, t)) c.q.shift();
    renderCat(c, dt, t);
  });
}

function initCats() {
  const stage = document.getElementById('stage');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  tower.el = buildTower(stage);
  cats.push(makeCat(0));
  cats.push(makeCat(1));
  bowls.food = buildBowl(stage, false);     // 그릇·실뭉치는 고양이 앞에 그려야 밥에 입을 대는 것처럼 보여
  bowls.water = buildBowl(stage, true);
  yarn.el = buildYarn(stage);
  measureFloors();
  const W = stageW();
  yarn.floor = Math.min(1, floors.length - 1);
  yarn.x = yarn.lag = rnd(60, W - 60);

  // 첫 장면 — 켜자마자 보이는 줄에서 뭔가 하고 있게.
  const top = visibleFloors(); if (!top.length) top.push(0);
  const anyTop = () => top[Math.floor(Math.random() * top.length)];
  const settle = (c, pose) => { Object.assign(c.p, POSES[pose]); c.goal = pose; c.anim = pose; };
  if (isNight() || reduced) {
    cats.forEach((c, i) => {
      c.floor = anyTop(); c.x = randX(c.floor); c.face = Math.random() < 0.5 ? 1 : -1; c.fc = c.face;
      if (i === 1 && Math.random() < 0.4) { c.floor = 0; c.perch = 2; c.x = tower.x + PERCH[2].cx; }
      settle(c, 'sleep'); c.q = [P('sleep', reduced ? 1e9 : rnd(120, 400)), P('sit', 3)];
    });
  } else {
    const mover = cats[Math.floor(Math.random() * 2)], other = cats.find(c => c !== mover);
    const r = Math.random();
    if (r < 0.35) {            // 걸어 들어오는 중
      mover.floor = anyTop(); mover.x = -EDGE; mover.face = mover.fc = 1;
      const f = mover.floor; mover.q = [G(() => randX(f), 'walk'), P('sit', rnd(3, 8))];
    } else if (r < 0.7) {      // 실뭉치
      mover.floor = yarn.floor; mover.x = clamp(yarn.x + (Math.random() < 0.5 ? -90 : 90), 16, W - 16);
      mover.q = [{ k: 'yarn', dur: rnd(10, 18) }, P('sit', rnd(2, 5))];
    } else {                   // 밥
      mover.floor = 0; mover.x = rnd(110, Math.max(120, tower.x - 30)); mover.face = mover.fc = -1;
      mover.q = [G(BOWL_FOOD_X + 22, 'trot'), P('eat', rnd(7, 12), { face: -1 }), P('stand', 0.6), G(() => randX(0), 'walk'), P('sit', 1), P('groom', 4), P('sit', 2)];
    }
    const r2 = Math.random();
    if (r2 < 0.4) {            // 타워 위
      other.floor = 0; other.perch = Math.floor(Math.random() * 3); other.x = tower.x + PERCH[other.perch].cx;
      other.face = other.fc = other.perch === 1 ? -1 : 1;
      const pz = Math.random() < 0.5 ? 'loaf' : 'sit'; settle(other, pz); other.q = [P(pz, rnd(12, 30))];
    } else {
      other.floor = anyTop(); other.x = randX(other.floor); other.face = other.fc = Math.random() < 0.5 ? 1 : -1;
      const pz = r2 < 0.6 ? 'groom' : r2 < 0.8 ? 'sleep' : 'loaf';
      settle(other, pz === 'groom' ? 'sit' : pz);
      other.q = pz === 'sleep' ? [P('sleep', rnd(40, 100)), P('stretch', 1.7), P('sit', 3)] : pz === 'groom' ? [P('groom', rnd(6, 12)), P('sit', 3)] : [P('loaf', rnd(12, 30))];
    }
  }

  // 첫 그림은 바로 그려 둠 (움직임 줄이기 설정이면 이 그림 그대로 둠)
  stepYarn(0);
  cats.forEach(c => { stepAct(c, c.q[0], 0, 0); renderCat(c, 0.05, 0); });
  if (!reduced) requestAnimationFrame(ts => { catClock = ts; requestAnimationFrame(frameCats); });
  window.addEventListener('resize', measureFloors);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureFloors);
  if (window.ResizeObserver) new ResizeObserver(measureFloors).observe(document.querySelector('.wrapper'));
  setInterval(measureFloors, 4000); // 그래도 혹시 몰라
}

const BIN_ID = '69e029c936566621a8ba3891';

const AUTO_SYNC_INTERVAL = 60 * 60 * 1000;

function detectDevice() {
  const ua = navigator.userAgent;
  if (/iPhone/i.test(ua)) return '📱 아이폰';
  if (/iPad/i.test(ua)) return '📱 아이패드';
  if (/Android/i.test(ua)) return '📱 안드로이드';
  if (/Mac/i.test(ua)) return '💻 맥';
  if (/Windows/i.test(ua)) return '💻 PC';
  return '🌐 브라우저';
}
function setSyncUI(state) {
  const dot = document.getElementById('syncDot');
  const label = document.getElementById('syncLabel');
  if (!dot || !label) return; // v8: 동기화 표시는 화면에서 뺐어. 조용히 돌아감.
  dot.className = 'sync-dot';
  if (state === 'syncing') { dot.classList.add('syncing'); label.textContent = '동기화 중...'; }
  else if (state === 'synced') { dot.classList.add('synced'); label.textContent = '동기화됨'; }
  else { label.textContent = '동기화'; }
}

async function cloudPushRaw() {
  const data = { timestamp: Date.now(), device: detectDevice() };
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    try { data[k] = JSON.parse(localStorage.getItem(k)); }
    catch { data[k] = localStorage.getItem(k); }
  }
  await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
    body: JSON.stringify(data)
  });
  lsSet('last_sync_ts', Date.now());
}

// id 기반 병합 대상: 방명록 + (구버전) 날짜별 기록
function isMergedListKey(k) { return k === 'guestbook' || k.startsWith('entries_'); }

async function cloudPullMerge() {
  const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
    headers: { 'X-Master-Key': API_KEY }
  });
  const json = await res.json();
  const cloud = json.record;
  if (!cloud) return;

  const localIdx = ls('_ts_index', {}) || {};
  const cloudIdx = cloud['_ts_index'] || {};
  let idxChanged = false;

  Object.keys(cloud).forEach(k => {
    if (k === 'timestamp' || k === 'device' || k === '_ts_index') return;

    if (isMergedListKey(k)) {
      const localArr = ls(k, []) || [];
      const cloudArr = Array.isArray(cloud[k]) ? cloud[k] : [];
      const versionTime = e => Math.max(e.ts || 0, e.editedTs || 0, e.deletedTs || 0);
      const map = new Map();
      localArr.forEach(e => { if (e && e.id) map.set(e.id, e); });
      cloudArr.forEach(e => {
        if (!e || !e.id) return;
        const existing = map.get(e.id);
        if (!existing || versionTime(e) > versionTime(existing)) map.set(e.id, e);
      });
      const merged = Array.from(map.values()).sort((a, b) => (a.ts || 0) - (b.ts || 0));
      if (JSON.stringify(merged) !== JSON.stringify(localArr)) {
        try { localStorage.setItem(k, JSON.stringify(merged)); } catch {}
      }
      return;
    }

    const localExists = localStorage.getItem(k) !== null;
    const cloudTs = cloudIdx[k] || 0;
    const localTs = localIdx[k] || 0;
    if (!localExists || cloudTs > localTs) {
      try {
        localStorage.setItem(k, typeof cloud[k] === 'string' ? cloud[k] : JSON.stringify(cloud[k]));
        localIdx[k] = cloudTs || Date.now();
        idxChanged = true;
      } catch {}
    }
  });

  if (idxChanged) {
    try { localStorage.setItem('_ts_index', JSON.stringify(localIdx)); } catch {}
  }
}

  try {

    renderGb();
    await cloudPushRaw();
    setSyncUI('synced');
  } catch {
    setSyncUI('idle');
  }
}
async function manualSync() { await syncAfterChange(); }

async function initialSync() {
  setSyncUI('syncing');
  try {
    await cloudPullMerge();
    migrateToGuestbook();
    renderGb();
    setSyncUI('synced');
    const last = ls('last_sync_ts', 0);
    if (Date.now() - last > AUTO_SYNC_INTERVAL) await cloudPushRaw();
  } catch {
    setSyncUI('idle');
  }
}
async function backgroundPull() {
  try {
    await cloudPullMerge();
    renderGb();
  } catch {}
}
