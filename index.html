<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="오늘의 행복">
<meta name="theme-color" content="#090912">
<title>오늘의 행복</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #090912;
  --surface: #111119;
  --card:    #16161f;
  --card2:   #1c1c27;
  --border:  rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --gold:    #c9a96e;
  --gold-dim: rgba(201,169,110,0.12);
  --blue:    #6baed6;
  --blue-dim: rgba(107,174,214,0.1);
  --hanja:   #d4846a;
  --hanja-dim: rgba(212,132,106,0.1);
  --green:   #6bbfa0;
  --text:    #ede9e0;
  --muted:   #5c5c72;
  --muted2:  #7a7a8f;
  --success: #6bbfa0;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* 배경 텍스처 */
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 15% 10%, rgba(201,169,110,0.035) 0%, transparent 70%),
    radial-gradient(ellipse 50% 60% at 85% 90%, rgba(107,174,214,0.03) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}

.wrapper {
  position: relative; z-index: 1;
  max-width: 720px; margin: 0 auto;
  padding: 0 22px 100px;
}

/* ── 헤더 ── */
.header {
  padding: 44px 0 32px;
  display: flex; align-items: flex-start; justify-content: space-between;
  border-bottom: 1px solid var(--border);
  margin-bottom: 36px;
}

.header-left {}

.app-brand {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 10px; letter-spacing: 5px;
  color: var(--muted2); text-transform: uppercase;
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.app-brand-badge {
  background: var(--gold); color: #090912;
  font-size: 8px; font-weight: 700; letter-spacing: 1px;
  padding: 2px 6px; border-radius: 4px;
  font-family: 'Noto Sans KR', sans-serif;
}

.header-date {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 48px; font-weight: 800;
  color: var(--text); line-height: 1;
  letter-spacing: -1px;
}

.header-day {
  font-size: 12px; color: var(--muted2);
  font-weight: 300; letter-spacing: 3px;
  margin-top: 6px;
}

.header-right {
  display: flex; flex-direction: column;
  align-items: flex-end; gap: 8px; padding-top: 4px;
}

.sync-status {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--muted); cursor: pointer;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 100px;
  transition: all 0.2s;
}
.sync-status:hover { border-color: var(--border2); color: var(--muted2); }
.sync-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--muted); transition: background 0.3s;
}
.sync-dot.synced { background: var(--green); }
.sync-dot.syncing { background: var(--gold); animation: pulse 1s infinite; }

.cal-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted2); font-family: 'Noto Sans KR', sans-serif;
  font-size: 11px; padding: 6px 14px; border-radius: 100px;
  cursor: pointer; transition: all 0.2s; letter-spacing: 1px;
}
.cal-btn:hover { border-color: var(--gold); color: var(--gold); }

/* ── 습관 스트릭 ── */
.streak-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px; padding: 20px 24px;
  margin-bottom: 16px;
}
.streak-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.streak-label {
  font-size: 10px; letter-spacing: 4px;
  color: var(--gold); font-family: 'Nanum Myeongjo', serif;
}
.streak-count {
  font-size: 11px; color: var(--muted2); font-weight: 300;
}
.streak-count span { color: var(--green); font-weight: 700; }

.streak-days {
  display: flex; gap: 8px; justify-content: space-between;
}
.streak-day {
  flex: 1; text-align: center;
}
.streak-day-label {
  font-size: 9px; color: var(--muted); letter-spacing: 1px;
  margin-bottom: 6px; font-weight: 500;
}
.streak-day-dot {
  width: 100%; aspect-ratio: 1;
  border-radius: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; transition: all 0.3s;
}
.streak-day-dot.visited {
  background: rgba(107,191,160,0.15);
  border-color: var(--green);
}
.streak-day-dot.today {
  border-color: var(--gold);
  background: var(--gold-dim);
}
.streak-day-dot.today.visited {
  background: rgba(107,191,160,0.2);
  border-color: var(--green);
  box-shadow: 0 0 12px rgba(107,191,160,0.2);
}

/* ── 섹션 ── */
.section-label {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 9px; letter-spacing: 5px;
  color: var(--muted); text-transform: uppercase;
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 12px;
}
.section-label::after {
  content: ''; flex: 1; height: 1px;
  background: var(--border);
}

/* ── 명언 카드 ── */
.quote-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px; padding: 28px;
  margin-bottom: 16px;
  position: relative;
}
.quote-card::before {
  content: '"';
  position: absolute; top: 16px; left: 22px;
  font-family: 'Nanum Myeongjo', serif;
  font-size: 60px; color: var(--gold-dim);
  line-height: 1; pointer-events: none;
  font-weight: 800;
}

.quote-nav {
  display: flex; align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.quote-section-label {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 9px; letter-spacing: 4px;
  color: var(--gold);
}
.quote-arrows {
  display: flex; gap: 4px;
}
.quote-arrow {
  background: none; border: 1px solid var(--border);
  color: var(--muted2); width: 28px; height: 28px;
  border-radius: 50%; cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; font-family: 'Noto Sans KR', sans-serif;
}
.quote-arrow:hover { border-color: var(--gold); color: var(--gold); }

.quote-text {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 19px; font-weight: 700;
  color: var(--text); line-height: 1.7;
  margin-bottom: 18px; margin-top: 8px;
  padding-left: 2px;
}

.quote-author-row {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 12px;
}

.quote-author-block {}
.quote-author-name {
  font-size: 13px; font-weight: 600;
  color: var(--gold); margin-bottom: 2px;
}
.quote-author-meta {
  font-size: 11px; color: var(--muted2);
  font-weight: 300; letter-spacing: 0.5px;
}

.meaning-toggle {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted); font-family: 'Noto Sans KR', sans-serif;
  font-size: 10px; padding: 5px 12px; border-radius: 100px;
  cursor: pointer; transition: all 0.2s; white-space: nowrap;
  flex-shrink: 0;
}
.meaning-toggle:hover { border-color: var(--blue); color: var(--blue); }
.meaning-toggle.open { border-color: var(--blue); color: var(--blue); }

.quote-meaning {
  display: none;
  margin-top: 16px; padding: 16px 18px;
  background: var(--blue-dim);
  border: 1px solid rgba(107,174,214,0.15);
  border-radius: 10px;
  font-size: 13px; color: var(--muted2);
  line-height: 1.85; font-weight: 300;
  animation: fadeUp 0.25s ease;
}
.quote-meaning.open { display: block; }

.quote-index {
  text-align: right; margin-top: 12px;
  font-size: 10px; color: var(--muted);
  letter-spacing: 1px;
}

/* ── 한자 카드 ── */
.hanja-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 16px;
}

.hanja-top {
  display: flex; gap: 0;
}

.hanja-char-block {
  width: 130px; flex-shrink: 0;
  background: var(--hanja-dim);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 28px 16px;
  position: relative;
}

.hanja-char {
  font-family: 'Noto Serif SC', 'Nanum Myeongjo', serif;
  font-size: 86px; font-weight: 700;
  color: var(--hanja);
  line-height: 1;
  text-shadow: 0 0 40px rgba(212,132,106,0.25);
}

.hanja-stroke {
  font-size: 10px; color: var(--muted);
  letter-spacing: 1px; margin-top: 8px;
}

.hanja-info {
  flex: 1; padding: 24px 22px;
  display: flex; flex-direction: column; gap: 6px;
}

.hanja-info-row {
  display: flex; align-items: baseline; gap: 10px;
}

.hanja-kor {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 20px; font-weight: 700; color: var(--text);
}
.hanja-chi {
  font-size: 13px; color: var(--muted2);
  font-style: italic;
}

.hanja-meaning {
  font-size: 12px; color: var(--muted2);
  line-height: 1.6; margin-top: 2px;
}

.hanja-grade {
  display: inline-block;
  background: rgba(212,132,106,0.12);
  border: 1px solid rgba(212,132,106,0.25);
  color: var(--hanja);
  font-size: 10px; font-weight: 700;
  padding: 2px 8px; border-radius: 4px;
  letter-spacing: 1px; margin-top: 6px;
}

.hanja-expand-btn {
  width: 100%;
  background: none;
  border: none;
  border-top: 1px solid var(--border);
  color: var(--muted2);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 11px; padding: 12px;
  cursor: pointer; transition: all 0.2s;
  letter-spacing: 1px;
}
.hanja-expand-btn:hover { background: var(--card2); color: var(--hanja); }

.hanja-detail {
  display: none;
  padding: 18px 22px;
  border-top: 1px solid var(--border);
  animation: fadeUp 0.25s ease;
}
.hanja-detail.open { display: block; }
.hanja-detail-title {
  font-size: 10px; letter-spacing: 3px;
  color: var(--hanja); margin-bottom: 10px;
  font-family: 'Nanum Myeongjo', serif;
}
.hanja-detail-text {
  font-size: 13px; color: var(--muted2);
  line-height: 1.9; font-weight: 300;
  margin-bottom: 12px;
}
.hanja-example {
  background: var(--hanja-dim);
  border: 1px solid rgba(212,132,106,0.15);
  border-radius: 8px; padding: 10px 14px;
  font-size: 13px; color: var(--text);
  font-family: 'Nanum Myeongjo', serif;
}

/* ── 오늘의 기록 (덧글 형태) ── */
.entries-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px; padding: 20px 22px;
  margin-bottom: 16px;
}
.entry-input-row {
  display: flex; gap: 8px; margin-bottom: 4px;
}
.entry-input {
  flex: 1; min-width: 0; background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 100px; padding: 11px 18px;
  color: var(--text); font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px; outline: none; transition: border-color 0.2s;
}
.entry-input:focus { border-color: var(--gold); }
.entry-input::placeholder { color: var(--muted); }
.entry-submit {
  flex-shrink: 0;
  background: var(--gold); border: none;
  color: #090912; font-weight: 700;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 12px; padding: 0 16px;
  border-radius: 100px; cursor: pointer;
  transition: opacity 0.2s; white-space: nowrap;
}
.entry-submit:hover { opacity: 0.85; }

.entry-list {
  margin-top: 16px;
  display: flex; flex-direction: column; gap: 10px;
  max-height: 360px; overflow-y: auto;
  scrollbar-gutter: stable;
}
.entry-item {
  display: flex; flex-direction: column; gap: 6px;
  padding: 11px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  animation: fadeUp 0.25s ease;
}
.entry-item-top {
  display: flex; align-items: center; gap: 8px;
}
.entry-time {
  font-size: 10px; color: var(--gold);
  font-weight: 700; letter-spacing: 0.5px;
  flex-shrink: 0;
  font-family: 'Noto Sans KR', sans-serif;
}
.entry-edited-tag {
  font-size: 10px; color: var(--muted);
  font-weight: 300;
}
.entry-actions {
  margin-left: auto; display: flex; gap: 6px; flex-shrink: 0;
}
.entry-action-btn {
  background: none; border: 1px solid var(--border);
  color: var(--muted2); font-size: 10px; padding: 3px 10px;
  border-radius: 100px; cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.2s;
}
.entry-action-btn:hover { border-color: var(--blue); color: var(--blue); }
.entry-action-btn.danger:hover { border-color: var(--hanja); color: var(--hanja); }
.entry-action-btn.save { border-color: var(--gold); color: var(--gold); }
.entry-action-btn.save:hover { opacity: 0.85; }

.entry-edit-row {
  display: flex; gap: 6px; align-items: center;
}
.entry-edit-input {
  flex: 1; min-width: 0;
  background: var(--card2); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 12px;
  color: var(--text); font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px; outline: none; transition: border-color 0.2s;
}
.entry-edit-input:focus { border-color: var(--gold); }

.entry-text {
  font-size: 13px; color: var(--text);
  line-height: 1.7; font-weight: 300;
  white-space: pre-wrap; word-break: break-word;
}
.entry-empty {
  font-size: 12px; color: var(--muted);
  text-align: center; padding: 18px 0;
}

/* ── 달력 모달 ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(8px);
  z-index: 100; display: none;
  align-items: center; justify-content: center;
  padding: 20px;
}
.modal-overlay.show { display: flex; animation: fadeUp 0.25s ease; }

.cal-modal {
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: 20px; padding: 28px 24px;
  width: 100%; max-width: 420px;
  max-height: 90vh; overflow-y: auto;
}

.cal-header {
  display: flex; align-items: center;
  justify-content: space-between; margin-bottom: 22px;
}
.cal-nav {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted2); font-size: 14px;
  padding: 6px 13px; border-radius: 100px;
  cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.2s;
}
.cal-nav:hover { border-color: var(--gold); color: var(--gold); }
.cal-title {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 17px; font-weight: 700; color: var(--text);
}
.cal-close {
  background: none; border: none;
  color: var(--muted); font-size: 16px;
  cursor: pointer; padding: 4px 8px; transition: color 0.2s;
}
.cal-close:hover { color: var(--text); }

.cal-days-header {
  display: grid; grid-template-columns: repeat(7,1fr);
  text-align: center; font-size: 10px; color: var(--muted);
  margin-bottom: 8px; gap: 3px; letter-spacing: 1px;
}

.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }

.cal-cell {
  aspect-ratio: 1; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.15s; color: var(--muted2);
}
.cal-cell:hover { background: var(--card2); color: var(--text); }
.cal-cell.empty { cursor: default; pointer-events: none; }
.cal-cell.today { border: 1px solid var(--gold); color: var(--gold); font-weight: 700; }
.cal-cell.has-memo { background: rgba(107,174,214,0.12); color: var(--blue); }
.cal-cell.has-memo.today { border-color: var(--gold); }
.cal-cell.selected { outline: 2px solid var(--blue); outline-offset: 1px; }

/* 날짜 상세 (달력 아래) */
.cal-detail {
  margin-top: 20px;
  border-top: 1px solid var(--border);
  padding-top: 18px;
  display: none; animation: fadeUp 0.2s ease;
}
.cal-detail.show { display: block; }
.cal-detail-date {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 12px; color: var(--gold);
  letter-spacing: 2px; margin-bottom: 12px;
}
.cal-detail-empty {
  font-size: 12px; color: var(--muted);
  text-align: center; padding: 20px 0;
}
.cal-detail-memo {
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px;
  font-size: 13px; color: var(--muted2);
  line-height: 1.8; font-weight: 300;
  white-space: pre-wrap;
}
.cal-detail-entries {
  display: flex; flex-direction: column; gap: 8px;
  max-height: 280px; overflow-y: auto;
}
.cal-detail-entry {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 13px;
}
.cal-detail-entry-time {
  font-size: 10px; color: var(--gold);
  font-weight: 700; flex-shrink: 0; padding-top: 1px;
}
.cal-detail-entry-text {
  font-size: 13px; color: var(--muted2);
  line-height: 1.7; font-weight: 300;
  white-space: pre-wrap; word-break: break-word;
}

/* ── 토스트 ── */
.toast {
  position: fixed; bottom: 28px; right: 24px;
  background: var(--green); color: #090912;
  font-size: 11px; font-weight: 700; padding: 8px 16px;
  border-radius: 100px; opacity: 0; letter-spacing: 1px;
  transform: translateY(6px); transition: all 0.3s ease;
  pointer-events: none; z-index: 300;
  font-family: 'Noto Sans KR', sans-serif;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* ── 애니메이션 ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.4; }
}

/* ── 반응형 ── */
@media (max-width: 600px) {
  .wrapper { padding: 0 16px 80px; }
  .header { padding: 28px 0 20px; }
  .header-date { font-size: 36px; }
  .hanja-char { font-size: 68px; }
  .hanja-char-block { width: 105px; }
  .quote-text { font-size: 16px; }
  .streak-days { gap: 5px; }
}
</style>
</head>
<body>

<div class="wrapper">

  <!-- 헤더 -->
  <header class="header">
    <div class="header-left">
      <div class="app-brand" onclick="location.reload()" title="새로고침" style="cursor:pointer;">
        오늘의 행복
        <span class="app-brand-badge">v2</span>
      </div>
      <div class="header-date" id="headerDate"></div>
      <div class="header-day" id="headerDay"></div>
    </div>
    <div class="header-right">
      <div class="sync-status" id="syncStatus" onclick="manualSync()">
        <div class="sync-dot" id="syncDot"></div>
        <span id="syncLabel">동기화</span>
      </div>
      <button class="cal-btn" onclick="openCal()">📅 기록 달력</button>
    </div>
  </header>

  <!-- 습관 스트릭 -->
  <div class="streak-card">
    <div class="streak-header">
      <div class="streak-label">이번 주 출석</div>
      <div class="streak-count">연속 <span id="streakCount">0</span>일째</div>
    </div>
    <div class="streak-days" id="streakDays"></div>
  </div>

  <!-- 명언 -->
  <div class="section-label">오늘의 명언</div>
  <div class="quote-card">
    <div class="quote-nav">
      <div class="quote-section-label">QUOTE OF THE DAY</div>
      <div class="quote-arrows">
        <button class="quote-arrow" onclick="prevQuote()" title="이전 명언">‹</button>
        <button class="quote-arrow" onclick="nextQuote()" title="다음 명언">›</button>
      </div>
    </div>

// 상태 & 유틸
// ══════════════════════════════════════════
const NOW = new Date();

function todayKey() {
  return `${NOW.getFullYear()}_${NOW.getMonth()}_${NOW.getDate()}`;
}
function dateKey(y, m, d) { return `${y}_${m}_${d}`; }

function ls(key, fallback = null) {
  try {
    const v = localStorage.getItem(key);
    return v !== null ? JSON.parse(v) : fallback;
  } catch { return fallback; }
}

// 마지막으로 이 키를 수정한 시각을 기록 — 동기화 시 "더 최신 데이터"를 가려내는 기준
function touchKey(key) {
  try {
    const raw = localStorage.getItem('_ts_index');
    const idx = raw ? JSON.parse(raw) : {};
    idx[key] = Date.now();
    localStorage.setItem('_ts_index', JSON.stringify(idx));
  } catch {}
}

function lsSet(key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));
    touchKey(key);
  } catch {}
}

function initDate() {
  const y = NOW.getFullYear();
  const m = String(NOW.getMonth() + 1).padStart(2, '0');
  const d = String(NOW.getDate()).padStart(2, '0');
  document.getElementById('headerDate').textContent = `${y}.${m}.${d}`;
  const days = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
  document.getElementById('headerDay').textContent = days[NOW.getDay()];
}

// ══════════════════════════════════════════
// 습관 스트릭
// ══════════════════════════════════════════
function markTodayVisit() {
  lsSet(`visit_${todayKey()}`, true);
}

function renderStreak() {
  const container = document.getElementById('streakDays');
  container.innerHTML = '';

  // 이번 주 월요일부터 오늘까지 (또는 7일)
  const dayNames = ['일','월','화','수','목','금','토'];
  const result = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(NOW);
    d.setDate(d.getDate() - i);
    result.push(d);
  }

  let streak = 0;
  // 연속 방문 계산 (오늘부터 역순)
  for (let i = 0; i < 7; i++) {
    const d = new Date(NOW);
    d.setDate(d.getDate() - i);
    const k = `visit_${d.getFullYear()}_${d.getMonth()}_${d.getDate()}`;
    if (ls(k)) streak++;
    else break;
  }
  document.getElementById('streakCount').textContent = streak;

  result.forEach(d => {
    const isToday = d.toDateString() === NOW.toDateString();
    const k = `visit_${d.getFullYear()}_${d.getMonth()}_${d.getDate()}`;
    const visited = ls(k);

    const el = document.createElement('div');
    el.className = 'streak-day';

    const label = document.createElement('div');
    label.className = 'streak-day-label';
    label.textContent = dayNames[d.getDay()];

    const dot = document.createElement('div');
    dot.className = 'streak-day-dot';
    if (visited) dot.classList.add('visited');
    if (isToday) dot.classList.add('today');
    dot.textContent = visited ? '✓' : (isToday ? '·' : '');

    el.appendChild(label);
    el.appendChild(dot);
    container.appendChild(el);
  });
}

function getBaseQuoteIdx() {
  const d = NOW;
  return (d.getFullYear() * 366 + d.getMonth() * 31 + d.getDate()) % QUOTES.length;
}

function getCurrentQuoteIdx() {
  const offset = ls(`quote_offset_${todayKey()}`, 0);
  return (getBaseQuoteIdx() + offset + QUOTES.length) % QUOTES.length;
}

function renderQuote() {
  const idx = getCurrentQuoteIdx();
  const q = QUOTES[idx];
  document.getElementById('quoteText').textContent = `"${q.text}"`;
  document.getElementById('quoteAuthor').textContent = q.author;
  document.getElementById('quoteMeta').textContent = `${q.country}  ·  ${q.years}`;
  document.getElementById('quoteMeaning').textContent = q.meaning;
  document.getElementById('quoteIndex').textContent = `${idx + 1} / ${QUOTES.length}`;

  // 의미 닫기
  const box = document.getElementById('quoteMeaning');
  const btn = document.getElementById('meaningToggle');
  box.classList.remove('open');
  btn.classList.remove('open');
  btn.textContent = '의미 보기 ▾';
}

function nextQuote() {
  const offset = ls(`quote_offset_${todayKey()}`, 0);
  lsSet(`quote_offset_${todayKey()}`, offset + 1);
  renderQuote();
}
function prevQuote() {
  const offset = ls(`quote_offset_${todayKey()}`, 0);
  lsSet(`quote_offset_${todayKey()}`, offset - 1);
  renderQuote();
}

function toggleMeaning() {
  const box = document.getElementById('quoteMeaning');
  const btn = document.getElementById('meaningToggle');
  const open = box.classList.toggle('open');
  btn.classList.toggle('open', open);
  btn.textContent = open ? '의미 닫기 ▴' : '의미 보기 ▾';
}

function getHanjaIdx() {
  const start = new Date(2026, 5, 18); // 앱 시작일 기준
  const diff = Math.floor((NOW - start) / 86400000);
  return ((diff % HANJA.length) + HANJA.length) % HANJA.length;
}

function renderHanja() {
  const h = HANJA[getHanjaIdx()];
  document.getElementById('hanjaChar').textContent = h.char;
  document.getElementById('hanjaStroke').textContent = h.stroke;
  document.getElementById('hanjaKor').textContent = h.kor;
  document.getElementById('hanjaChi').textContent = h.chi;
  document.getElementById('hanjaMeaning').textContent = h.meaning;
  document.getElementById('hanjaGrade').textContent = `한자검정 ${h.grade}`;
  document.getElementById('hanjaOrigin').textContent = h.origin;
  document.getElementById('hanjaExample').textContent = h.example;
}

function toggleHanja() {
  const detail = document.getElementById('hanjaDetail');
  const btn = document.getElementById('hanjaBtn');
  const open = detail.classList.toggle('open');
  btn.textContent = open ? '유래 · 예시 닫기 ▴' : '유래 · 예시 보기 ▾';
}

// 과거 메모(단일 텍스트) 데이터를 화면에 표시할 때만 자동으로 덧글 형태로 변환
// → 실제로 저장 형식을 바꾸진 않고, 보여줄 때만 합쳐서 보여줌 (예전 기록도 그대로 보이게)
function getEntriesForDisplay(y, m, d) {
  const dk = dateKey(y, m, d);
  const arr = ls(`entries_${dk}`, []);
  if (Array.isArray(arr) && arr.length) {
    return arr.filter(e => !e.deleted);
  }
  const oldMemo = ls(`memo_${dk}`, '');
  if (oldMemo && oldMemo.trim()) {
    return [{ id: `legacy_${dk}`, time: '', text: oldMemo, ts: 0 }];
  }
  return [];
}

function submitEntry() {
  const input = document.getElementById('entryInput');
  const text = input.value.trim();
  if (!text) return;

  const now = new Date();
  const entry = {
    id: `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
    time: `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`,
    text,
    ts: Date.now()
  };

  const arr = ls(`entries_${todayKey()}`, []);
  arr.push(entry);
  lsSet(`entries_${todayKey()}`, arr);

  input.value = '';
  renderEntries(true);
  showToast('기록 저장됨 ✓');
  // 1시간 기다리지 않고 바로 클라우드에 올림
  cloudPush();
}

let editingEntryId = null;

function startEditEntry(id) {
  editingEntryId = id;
  renderEntries();
}

function cancelEditEntry() {
  editingEntryId = null;
  renderEntries();
}

function saveEditEntry(id, newTextRaw) {
  const newText = (newTextRaw || '').trim();
  if (!newText) return; // 빈 값으로는 저장하지 않음 (편집 상태 유지)
  const arr = ls(`entries_${todayKey()}`, []);
  const idx = arr.findIndex(x => x.id === id);
  if (idx !== -1) {
    arr[idx].text = newText;
    arr[idx].editedTs = Date.now();
    lsSet(`entries_${todayKey()}`, arr);
  }
  editingEntryId = null;
  renderEntries();
  showToast('수정됨 ✓');
  cloudPush();
}

function deleteEntry(id) {
  if (!confirm('이 기록을 삭제할까?')) return;
  const arr = ls(`entries_${todayKey()}`, []);
  const idx = arr.findIndex(x => x.id === id);
  if (idx !== -1) {
    // 실제로 지우지 않고 "삭제됨" 표시만 남김 — 다른 기기와 동기화할 때 되살아나지 않도록
    arr[idx].deleted = true;
    arr[idx].deletedTs = Date.now();
    lsSet(`entries_${todayKey()}`, arr);
  }
  renderEntries();
  showToast('삭제됨 ✓');
  cloudPush();
}

function renderEntries(scrollToBottom = false) {
  const list = document.getElementById('entryList');
  const entries = getEntriesForDisplay(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
  list.innerHTML = '';

  if (!entries.length) {
    list.innerHTML = `<div class="entry-empty">아직 오늘 남긴 기록이 없어. 위에 적어봐.</div>`;
    return;
  }

  entries.forEach(e => {
    const el = document.createElement('div');
    el.className = 'entry-item';

    // 편집 중인 항목이면 입력창 형태로 보여줌
    if (editingEntryId === e.id) {
      el.classList.add('editing');
      const row = document.createElement('div');
      row.className = 'entry-edit-row';

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'entry-edit-input';
      input.value = e.text;

      const saveBtn = document.createElement('button');
      saveBtn.className = 'entry-action-btn save';
      saveBtn.textContent = '저장';
      saveBtn.addEventListener('click', () => saveEditEntry(e.id, input.value));

      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'entry-action-btn';
      cancelBtn.textContent = '취소';
      cancelBtn.addEventListener('click', cancelEditEntry);

      input.addEventListener('keydown', ev => {
        if (ev.key === 'Enter') { ev.preventDefault(); saveEditEntry(e.id, input.value); }
        if (ev.key === 'Escape') { ev.preventDefault(); cancelEditEntry(); }
      });

      row.appendChild(input);
      row.appendChild(saveBtn);
      row.appendChild(cancelBtn);
      el.appendChild(row);
      list.appendChild(el);

      setTimeout(() => {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }, 0);
      return;
    }

    // 일반 표시
    const top = document.createElement('div');
    top.className = 'entry-item-top';

    if (e.time) {
      const timeSpan = document.createElement('span');
      timeSpan.className = 'entry-time';
      timeSpan.textContent = e.time;
      top.appendChild(timeSpan);
    }
    if (e.editedTs) {
      const tag = document.createElement('span');
      tag.className = 'entry-edited-tag';
      tag.textContent = '(수정됨)';
      top.appendChild(tag);
    }

    const actions = document.createElement('div');
    actions.className = 'entry-actions';

    const editBtn = document.createElement('button');
    editBtn.className = 'entry-action-btn';
    editBtn.textContent = '수정';
    editBtn.addEventListener('click', () => startEditEntry(e.id));

    const delBtn = document.createElement('button');
    delBtn.className = 'entry-action-btn danger';
    delBtn.textContent = '삭제';
    delBtn.addEventListener('click', () => deleteEntry(e.id));

    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    top.appendChild(actions);

    const textDiv = document.createElement('div');
    textDiv.className = 'entry-text';
    textDiv.textContent = e.text; // XSS 방지 위해 textContent 사용

    el.appendChild(top);
    el.appendChild(textDiv);
    list.appendChild(el);
  });

  // 새로 글을 남겼을 때만 가장 아래로 스크롤 (자동 동기화로 인한 불필요한 스크롤 깜빡임 방지)
  if (scrollToBottom) {
    list.scrollTop = list.scrollHeight;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('entryInput');
  if (input) {
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitEntry();
      }
    });
  }
});

let calYear = NOW.getFullYear();
let calMonth = NOW.getMonth();

function openCal() {
  calYear = NOW.getFullYear(); calMonth = NOW.getMonth();
  document.getElementById('calDetail').classList.remove('show');
  renderCal();
  document.getElementById('calModal').classList.add('show');
}
function closeCal(e) { if (e.target === document.getElementById('calModal')) closeCalBtn(); }
function closeCalBtn() { document.getElementById('calModal').classList.remove('show'); }
function calPrev() { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCal(); document.getElementById('calDetail').classList.remove('show'); }
function calNext() { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCal(); document.getElementById('calDetail').classList.remove('show'); }

function renderCal() {
  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('calTitle').textContent = `${calYear}년 ${months[calMonth]}`;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const first = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

  for (let i = 0; i < first; i++) {
    const el = document.createElement('div');
    el.className = 'cal-cell empty';
    grid.appendChild(el);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const el = document.createElement('div');
    el.className = 'cal-cell';
    el.textContent = d;

    const hasEntries = getEntriesForDisplay(calYear, calMonth, d).length > 0;
    const isToday = calYear === NOW.getFullYear() && calMonth === NOW.getMonth() && d === NOW.getDate();

    if (isToday) el.classList.add('today');
    if (hasEntries) el.classList.add('has-memo');

    el.addEventListener('click', () => showDayDetail(calYear, calMonth, d, el));
    grid.appendChild(el);
  }
}

function showDayDetail(y, m, d, cell) {
  document.querySelectorAll('.cal-cell.selected').forEach(c => c.classList.remove('selected'));
  if (cell) cell.classList.add('selected');

  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('calDetailDate').textContent = `${y}년 ${months[m]} ${d}일`;

  const entries = getEntriesForDisplay(y, m, d);
  const body = document.getElementById('calDetailBody');
  body.innerHTML = '';

  if (entries.length) {
    const wrap = document.createElement('div');
    wrap.className = 'cal-detail-entries';
    entries.forEach(e => {
      const row = document.createElement('div');
      row.className = 'cal-detail-entry';
      if (e.time) {
        const timeSpan = document.createElement('span');
        timeSpan.className = 'cal-detail-entry-time';
        timeSpan.textContent = e.time;
        row.appendChild(timeSpan);
      }
      const textSpan = document.createElement('span');
      textSpan.className = 'cal-detail-entry-text';
      textSpan.textContent = e.text;
      row.appendChild(textSpan);
      wrap.appendChild(row);
    });
    body.appendChild(wrap);
  } else {
    const isPast = new Date(y, m, d) < new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
    const empty = document.createElement('div');
    empty.className = 'cal-detail-empty';
    empty.textContent = isPast ? '이 날의 기록이 없어.' : '아직 기록이 없어. 오늘의 기록에 써봐 😊';
    body.appendChild(empty);
  }

  document.getElementById('calDetail').classList.add('show');
}

// ☁️ JSONBin 자동 동기화
// ══════════════════════════════════════════
const BIN_ID = '69e029c936566621a8ba3891';
const API_KEY = '$2a$10$GmXIwyo5n3LB7JIEvjSycumI89.62DFRm8UGsH4FBgJs4jBdm/kBq';
const AUTO_SYNC_INTERVAL = 60 * 60 * 1000; // 1시간

function detectDevice() {
  const ua = navigator.userAgent;
  if (/iPhone/i.test(ua)) return '📱 아이폰';
  if (/iPad/i.test(ua)) return '📱 아이패드';
  if (/Android/i.test(ua)) return '📱 안드로이드';
  if (/Mac/i.test(ua)) return '💻 맥';
  if (/Windows/i.test(ua)) return '💻 PC';
  return '🌐 브라우저';
}

function setSyncUI(state) {
  const dot = document.getElementById('syncDot');
  const label = document.getElementById('syncLabel');
  dot.className = 'sync-dot';
  if (state === 'syncing') { dot.classList.add('syncing'); label.textContent = '동기화 중...'; }
  else if (state === 'synced') { dot.classList.add('synced'); label.textContent = '동기화됨'; }
  else { label.textContent = '동기화'; }
}

async function cloudPush() {
  setSyncUI('syncing');
  try {
    const data = { timestamp: Date.now(), device: detectDevice() };
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      try { data[k] = JSON.parse(localStorage.getItem(k)); }
      catch { data[k] = localStorage.getItem(k); }
    }
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
      body: JSON.stringify(data)
    });
    lsSet('last_sync_ts', Date.now());
    setSyncUI('synced');
    showToast('동기화 완료 ☁️');
  } catch {
    setSyncUI('idle');
  }
}

async function cloudPull(overwrite = false) {
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
      headers: { 'X-Master-Key': API_KEY }
    });
    const json = await res.json();
    const cloud = json.record;
    if (!cloud) return;

    const localIdx = ls('_ts_index', {}) || {};
    const cloudIdx = cloud['_ts_index'] || {};
    let idxChanged = false;

    Object.keys(cloud).forEach(k => {
      if (k === 'timestamp' || k === 'device' || k === '_ts_index') return;

      // 덧글(entries_) 데이터는 절대 통째로 덮어쓰지 않고 항상 "합치기"
      // → 같은 id가 양쪽에 있으면 더 최근에 수정·삭제된 버전을 채택 (수정/삭제가 기기 간에 제대로 반영되도록)
      if (k.startsWith('entries_')) {
        const localArr = ls(k, []) || [];
        const cloudArr = Array.isArray(cloud[k]) ? cloud[k] : [];
        const versionTime = e => Math.max(e.ts || 0, e.editedTs || 0, e.deletedTs || 0);
        const map = new Map();
        localArr.forEach(e => { if (e && e.id) map.set(e.id, e); });
        cloudArr.forEach(e => {
          if (!e || !e.id) return;
          const existing = map.get(e.id);
          if (!existing || versionTime(e) > versionTime(existing)) map.set(e.id, e);
        });
        const merged = Array.from(map.values()).sort((a, b) => (a.ts || 0) - (b.ts || 0));
        if (JSON.stringify(merged) !== JSON.stringify(localArr)) {
          try { localStorage.setItem(k, JSON.stringify(merged)); } catch {}
        }
        return;
      }

      // 그 외 일반 키 — 더 최신(타임스탬프가 큰) 쪽만 가져옴. 둘 다 없으면 비교 자체를 건너뜀
      const localExists = localStorage.getItem(k) !== null;
      const cloudTs = cloudIdx[k] || 0;
      const localTs = localIdx[k] || 0;

      let shouldWrite;
      if (!localExists) shouldWrite = true;          // 로컬에 아예 없으면 무조건 받아옴
      else if (overwrite) shouldWrite = cloudTs > localTs; // 더 최신일 때만 덮어씀
      else shouldWrite = false;

      if (shouldWrite) {
        try {
          localStorage.setItem(k, typeof cloud[k] === 'string' ? cloud[k] : JSON.stringify(cloud[k]));
          localIdx[k] = cloudTs || Date.now();
          idxChanged = true;
        } catch {}
      }
    });

    if (idxChanged) {
      try { localStorage.setItem('_ts_index', JSON.stringify(localIdx)); } catch {}
    }
  } catch {}
}

async function manualSync() {
  await cloudPush();
  await cloudPull(true);
  renderEntries();
  renderStreak();
}

async function autoSync() {
  // 마지막 동기화로부터 1시간 이상 지났으면 자동 push
  const last = ls('last_sync_ts', 0);
  if (Date.now() - last > AUTO_SYNC_INTERVAL) {
    await cloudPush();
  } else {
    setSyncUI('synced');
  }
}
