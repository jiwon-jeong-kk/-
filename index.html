<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="오늘의 행복">
<meta name="theme-color" content="#0f0f13">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f0f13'/%3E%3Ctext y='.9em' font-size='72' x='12'%3E🌟%3C/text%3E%3C/svg%3E">
<title>오늘의 행복</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

:root {
  --bg: #0f0f13;
  --surface: #1a1a22;
  --card: #22222e;
  --accent: #e8c97a;
  --accent2: #7ab8e8;
  --accent3: #e87a9a;
  --text: #f0ede6;
  --muted: #888899;
  --success: #7ae8a8;
  --border: #333344;
  --xp-color: #b97ae8;
  --walk-color: #7ae87a;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content:'';
  position:fixed; top:-50%; left:-50%;
  width:200%; height:200%;
  background: radial-gradient(ellipse at 30% 20%, rgba(232,201,122,0.04) 0%, transparent 50%),
              radial-gradient(ellipse at 70% 80%, rgba(122,184,232,0.04) 0%, transparent 50%);
  pointer-events:none; z-index:0;
}

.wrapper {
  position:relative; z-index:1;
  max-width:780px; margin:0 auto;
  padding:0 20px 80px;
}

/* ── 헤더 ── */
.header {
  padding:36px 0 24px;
  border-bottom:1px solid var(--border);
  margin-bottom:28px;
}

.header-top {
  display:flex; align-items:flex-start; justify-content:space-between;
  margin-bottom:16px; gap:8px; flex-wrap:wrap;
}

.header-brand {
  font-family:'Nanum Myeongjo',serif;
  font-size:12px; letter-spacing:5px;
  color:var(--accent); text-transform:uppercase;
  padding-top:4px;
}

.header-btns { display:flex; flex-direction:column; gap:4px; align-items:flex-end; }

.header-cal-btn {
  background:var(--surface); border:1px solid var(--border);
  color:var(--muted); font-family:'Noto Sans KR',sans-serif;
  font-size:12px; padding:7px 14px; border-radius:100px;
  cursor:pointer; transition:all 0.2s; letter-spacing:1px;
}
.header-cal-btn:hover { border-color:var(--accent2); color:var(--accent2); }

.sync-btn {
  background:var(--success); border:1px solid var(--success);
  color:#0f0f13; font-weight:700;
  font-family:'Noto Sans KR',sans-serif;
  font-size:12px; padding:7px 14px; border-radius:100px;
  cursor:pointer; transition:all 0.2s; letter-spacing:1px;
  position:relative;
}
.sync-btn:hover { opacity:0.85; transform:scale(1.02); }
.sync-btn:disabled { opacity:0.6; cursor:not-allowed; }

.sync-time {
  font-size:10px; color:var(--muted);
  text-align:right; letter-spacing:0.5px;
}

.header-center { text-align:center; margin-bottom:16px; }

.header-date {
  font-family:'Nanum Myeongjo',serif;
  font-size:38px; font-weight:800;
  color:var(--text); line-height:1; margin-bottom:4px;
  cursor:pointer; transition:color 0.2s;
}
.header-date:hover { color:var(--accent); }

.header-day { font-size:14px; color:var(--muted); font-weight:300; letter-spacing:2px; }

/* ── 레벨 바 ── */
.level-bar-wrap {
  background:var(--surface); border:1px solid var(--border);
  border-radius:12px; padding:14px 18px;
  margin-bottom:24px;
  display:flex; align-items:center; gap:14px;
}
.level-badge {
  width:44px; height:44px; border-radius:50%;
  background:linear-gradient(135deg, var(--xp-color), #7ae8e8);
  display:flex; align-items:center; justify-content:center;
  font-family:'Nanum Myeongjo',serif;
  font-size:16px; font-weight:800; color:#0f0f13;
  flex-shrink:0; box-shadow:0 0 16px rgba(185,122,232,0.4);
}
.level-info { flex:1; }
.level-title { font-size:14px; font-weight:700; color:var(--text); margin-bottom:4px; }
.level-sub { font-size:11px; color:var(--muted); margin-bottom:8px; }
.xp-bar-bg { background:var(--border); border-radius:100px; height:5px; overflow:hidden; }
.xp-bar-fill {
  height:100%;
  background:linear-gradient(90deg, var(--xp-color), #7ae8e8);
  border-radius:100px; transition:width 0.5s ease;
}
.level-xp { font-size:11px; color:var(--xp-color); font-weight:700; margin-top:5px; }

/* ── 명언 ── */
.quote-card {
  background:var(--card); border:1px solid var(--border);
  border-left:4px solid var(--accent);
  border-radius:12px; padding:18px 22px; margin-bottom:24px;
}
.quote-label { font-size:10px; letter-spacing:4px; color:var(--accent); font-family:'Nanum Myeongjo',serif; margin-bottom:10px; }
.quote-text { font-family:'Nanum Myeongjo',serif; font-size:18px; font-weight:700; color:var(--text); line-height:1.6; margin-bottom:6px; }
.quote-author { font-size:12px; color:var(--muted); font-weight:300; }

/* ── 요일 선택 ── */
.day-selector {
  display:flex; gap:7px; justify-content:center;
  flex-wrap:wrap; margin-bottom:28px;
}
.day-btn {
  background:var(--surface); border:1px solid var(--border);
  color:var(--muted); font-family:'Noto Sans KR',sans-serif;
  font-size:12px; font-weight:500;
  padding:8px 14px; border-radius:100px;
  cursor:pointer; transition:all 0.2s; letter-spacing:1px;
  position:relative;
}
.day-btn:hover { border-color:var(--accent); color:var(--accent); }
.day-btn.active { background:var(--accent); border-color:var(--accent); color:#0f0f13; font-weight:700; }
.day-btn .done-dot {
  position:absolute; top:4px; right:4px;
  width:6px; height:6px; border-radius:50%;
  background:var(--success);
}

/* ── 배너 ── */
.today-banner {
  background:var(--card); border:1px solid var(--border);
  border-radius:12px; padding:18px 22px; margin-bottom:12px;
  display:flex; align-items:center; gap:14px;
}
.today-emoji { font-size:30px; }
.today-info h2 { font-family:'Nanum Myeongjo',serif; font-size:19px; font-weight:700; color:var(--text); margin-bottom:3px; }
.today-info p { font-size:12px; color:var(--muted); font-weight:300; }

/* ── 상황 변경 ── */
.situation-bar {
  display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;
}
.sit-btn {
  background:var(--surface); border:1px solid var(--border);
  color:var(--muted); font-family:'Noto Sans KR',sans-serif;
  font-size:11px; padding:6px 13px; border-radius:100px;
  cursor:pointer; transition:all 0.2s;
}
.sit-btn:hover { border-color:var(--accent3); color:var(--accent3); }
.sit-btn.active { background:rgba(232,122,154,0.15); border-color:var(--accent3); color:var(--accent3); font-weight:700; }
.sit-btn.reset-btn { border-color:var(--muted); color:var(--muted); }
.sit-btn.reset-btn:hover { border-color:var(--text); color:var(--text); }

/* ── 플랜 선택기 ── */
.plan-picker {
  background:var(--card); border:1px solid var(--accent3);
  border-radius:12px; padding:16px 18px; margin-bottom:16px;
  animation:fadeIn 0.2s ease;
}
.plan-picker-title {
  font-family:'Nanum Myeongjo',serif;
  font-size:13px; color:var(--accent3); letter-spacing:2px;
  margin-bottom:12px; font-weight:700;
}
.plan-option {
  background:var(--surface); border:1px solid var(--border);
  border-radius:10px; padding:12px 14px; margin-bottom:8px;
  cursor:pointer; transition:all 0.2s;
}
.plan-option:hover { border-color:var(--accent2); background:rgba(122,184,232,0.06); }
.plan-option:last-child { margin-bottom:0; }
.plan-option-top {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:4px;
}
.plan-option-name { font-size:14px; font-weight:700; color:var(--text); }
.plan-option-xp {
  background:rgba(185,122,232,0.15);
  border:1px solid var(--xp-color); color:var(--xp-color);
  font-size:11px; font-weight:700; padding:2px 10px;
  border-radius:100px;
}
.plan-option-intro { font-size:12px; color:var(--muted); line-height:1.5; margin-bottom:4px; }
.plan-option-items { font-size:11px; color:var(--accent2); font-weight:600; }

/* ── 대체 플랜 진행 패널 ── */
.alt-plan-panel {
  background:var(--card); border:1px solid var(--accent3);
  border-left:4px solid var(--accent3);
  border-radius:12px; padding:16px 18px; margin-bottom:20px;
  animation:fadeIn 0.3s ease;
}
.alt-plan-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:6px;
}
.alt-plan-label {
  font-family:'Nanum Myeongjo',serif;
  font-size:16px; font-weight:700; color:var(--text);
}
.alt-plan-xp {
  background:rgba(185,122,232,0.15);
  border:1px solid var(--xp-color); color:var(--xp-color);
  font-size:12px; font-weight:700; padding:3px 12px;
  border-radius:100px;
}
.alt-plan-intro { font-size:12px; color:var(--muted); margin-bottom:12px; line-height:1.6; }
.alt-plan-progress {
  background:var(--surface); border-radius:100px;
  height:5px; overflow:hidden; margin-bottom:6px;
}
.alt-plan-progress-bar {
  height:100%;
  background:linear-gradient(90deg, var(--accent3), var(--success));
  border-radius:100px; transition:width 0.4s ease;
}
.alt-plan-progress-text {
  font-size:11px; color:var(--muted); text-align:right;
  margin-bottom:14px; font-weight:600;
}
.alt-plan-items { display:flex; flex-direction:column; gap:7px; }
.alt-plan-item {
  background:var(--surface); border:1px solid var(--border);
  border-radius:10px; overflow:hidden;
  cursor:pointer; transition:all 0.2s;
}
.alt-plan-item:hover { border-color:var(--accent2); }
.alt-plan-item.done { border-color:var(--success); background:rgba(122,232,168,0.08); }
.alt-plan-item-main {
  padding:12px 14px;
  display:flex; align-items:flex-start; gap:12px;
}
.alt-plan-item-body { flex:1; }
.alt-plan-item-name { font-size:13px; font-weight:600; color:var(--text); margin-bottom:3px; }
.alt-plan-item.done .alt-plan-item-name { text-decoration:line-through; color:var(--muted); }
.alt-plan-item-desc { font-size:11px; color:var(--muted); line-height:1.6; }

.alt-complete-banner {
  background:linear-gradient(135deg,rgba(122,232,168,0.12),rgba(122,184,232,0.12));
  border:1px solid var(--success); border-radius:10px;
  padding:12px 16px; margin-top:14px; font-size:13px;
  color:var(--success); text-align:center; font-weight:700;
}

/* ── 레벨업 배지 ── */
.upgrade-badge {
  background:rgba(185,122,232,0.12); border:1px solid var(--xp-color);
  border-radius:8px; padding:10px 14px;
  font-size:12px; color:var(--xp-color);
  margin-bottom:14px; display:flex; align-items:center; gap:8px;
}

/* ── 섹션 ── */
.section { margin-bottom:24px; }
.section-header { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
.section-label { font-family:'Nanum Myeongjo',serif; font-size:10px; letter-spacing:4px; color:var(--accent); text-transform:uppercase; }
.section-line { flex:1; height:1px; background:var(--border); }

/* ── 운동 아이템 ── */
.exercise-list { display:flex; flex-direction:column; gap:7px; }
.exercise-item {
  background:var(--card); border:1px solid var(--border);
  border-radius:10px; overflow:hidden;
  cursor:pointer; transition:all 0.2s; user-select:none;
}
.exercise-item:hover { border-color:var(--accent2); }
.exercise-item.done { border-color:var(--success); background:rgba(122,232,168,0.06); }
.exercise-item.warm-item { opacity:0.65; }

.exercise-main { padding:13px 16px; display:flex; align-items:center; gap:12px; }

.check-circle {
  width:21px; height:21px; border-radius:50%;
  border:2px solid var(--border); flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; transition:all 0.2s;
}
.exercise-item.done .check-circle { background:var(--success); border-color:var(--success); color:#0f0f13; }

.exercise-name { font-size:14px; font-weight:500; color:var(--text); flex:1; transition:all 0.2s; }
.exercise-item.done .exercise-name { text-decoration:line-through; color:var(--muted); }
.exercise-meta { font-size:11px; color:var(--muted); text-align:right; }

.detail-btn {
  background:none; border:1px solid var(--border);
  color:var(--muted); font-size:10px; padding:2px 8px;
  border-radius:100px; cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;
  transition:all 0.2s; letter-spacing:0.5px;
  display:block; margin-top:4px; margin-left:auto;
}
.detail-btn:hover { border-color:var(--accent2); color:var(--accent2); }

.interval-btn {
  background:none; border:1px solid var(--xp-color);
  color:var(--xp-color); font-size:10px; padding:2px 8px;
  border-radius:100px; cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;
  transition:all 0.2s; letter-spacing:0.5px;
  display:block; margin-top:4px; margin-left:auto;
}
.interval-btn:hover { background:rgba(185,122,232,0.15); }

.exercise-detail {
  display:none; background:var(--surface);
  border-top:1px solid var(--border);
  padding:12px 16px 12px 49px;
  font-size:12px; color:var(--muted); line-height:1.8; font-weight:300;
}
.exercise-item.expanded .exercise-detail { display:block; }

/* 진행률 */
.progress-bar-wrap { background:var(--surface); border-radius:100px; height:3px; margin-top:12px; overflow:hidden; }
.progress-bar-fill { height:100%; background:linear-gradient(90deg, var(--accent2), var(--success)); border-radius:100px; transition:width 0.4s ease; }
.progress-text { font-size:11px; color:var(--muted); text-align:right; margin-top:5px; }

.congrats {
  background:linear-gradient(135deg, rgba(122,232,168,0.08), rgba(122,184,232,0.08));
  border:1px solid var(--success); border-radius:10px;
  padding:16px 20px; text-align:center;
  display:none; margin-top:12px; animation:fadeIn 0.4s ease;
}
.congrats.show { display:block; }
.congrats h3 { font-family:'Nanum Myeongjo',serif; font-size:18px; color:var(--success); margin-bottom:4px; }
.congrats p { font-size:12px; color:var(--muted); }

/* ── 손글씨 ── */
.writing-card {
  background:var(--card); border:1px solid var(--border);
  border-left:4px solid var(--accent3); border-radius:12px;
  padding:18px 22px;
}
.writing-posture {
  background:var(--surface); border-radius:8px; padding:10px 14px;
  margin-bottom:12px; font-size:12px; color:var(--muted); line-height:1.9;
}
.writing-posture strong { color:var(--accent3); font-weight:600; }

.writing-steps { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
.writing-step {
  display:flex; align-items:center; gap:10px;
  cursor:pointer; padding:7px 0; transition:all 0.2s;
}
.writing-step.done .step-text { text-decoration:line-through; color:var(--muted); }
.step-num {
  width:24px; height:24px; border-radius:50%;
  background:var(--surface); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  font-size:10px; font-weight:700; color:var(--accent3);
  flex-shrink:0; transition:all 0.2s;
}
.writing-step.done .step-num { background:var(--accent3); border-color:var(--accent3); color:#0f0f13; }
.step-text { font-size:13px; color:var(--text); flex:1; }
.step-time { font-size:11px; color:var(--muted); font-weight:300; }

/* ── 타이머 (손글씨) ── */
.timer-inline {
  background:var(--surface); border:1px solid var(--border);
  border-radius:10px; padding:14px 16px;
  margin-top:14px; display:flex; align-items:center; gap:14px;
}
.timer-display-sm {
  font-family:'Nanum Myeongjo',serif;
  font-size:28px; font-weight:800;
  color:var(--accent); letter-spacing:3px;
  transition:color 0.3s; min-width:70px;
}
.timer-display-sm.running { color:var(--success); }
.timer-display-sm.done-color { color:var(--muted); }
.timer-btns-sm { display:flex; gap:6px; }
.timer-btn-sm {
  background:transparent; border:1px solid var(--border);
  color:var(--text); font-family:'Noto Sans KR',sans-serif;
  font-size:12px; font-weight:500; padding:7px 16px;
  border-radius:100px; cursor:pointer; transition:all 0.2s;
}
.timer-btn-sm.primary { background:var(--accent); border-color:var(--accent); color:#0f0f13; font-weight:700; }
.timer-btn-sm:hover { opacity:0.8; }

/* ── 맨발걷기 ── */
.walk-card {
  background:var(--card); border:1px solid var(--border);
  border-left:4px solid var(--walk-color);
  border-radius:12px; padding:14px 18px;
  margin-bottom:8px;
}
.walk-top {
  display:flex; align-items:center; gap:14px;
  cursor:pointer; margin-bottom:0; transition:all 0.2s;
}
.walk-card.done .walk-name { text-decoration:line-through; color:var(--muted); }
.walk-name { font-size:14px; font-weight:500; color:var(--text); flex:1; }
.walk-meta { font-size:12px; color:var(--muted); }

.walk-timer-row {
  display:flex; align-items:center; gap:10px;
  margin-top:12px; padding-top:10px;
  border-top:1px solid var(--border);
}
.walk-timer-disp {
  font-family:'Nanum Myeongjo',serif;
  font-size:24px; font-weight:800;
  color:var(--walk-color); letter-spacing:2px; min-width:65px;
}
.walk-kcal-disp {
  font-size:13px; font-weight:700; color:var(--accent);
  background:rgba(232,201,122,0.1); border:1px solid rgba(232,201,122,0.3);
  padding:4px 10px; border-radius:100px; letter-spacing:0.5px;
}
.walk-info-row {
  margin-top:10px; padding-top:10px;
  border-top:1px dashed var(--border);
  font-size:11px; color:var(--muted); line-height:1.5;
  text-align:center;
}
.walk-timer-btn {
  background:var(--walk-color); border:none; color:#0f0f13;
  font-family:'Noto Sans KR',sans-serif;
  font-size:12px; font-weight:700; padding:7px 16px;
  border-radius:100px; cursor:pointer; transition:all 0.2s;
}
.walk-timer-btn.stop { background:var(--accent3); }
.walk-timer-btn:hover { opacity:0.85; }
.walk-tip { font-size:11px; color:var(--muted); flex:1; line-height:1.5; }

/* ── 메모 ── */
.memo-section { margin-top:24px; }
.memo-box { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; }
.memo-label { font-size:10px; letter-spacing:3px; color:var(--accent); font-family:'Nanum Myeongjo',serif; margin-bottom:8px; }
.memo-input {
  width:100%; background:transparent; border:none;
  color:var(--text); font-family:'Noto Sans KR',sans-serif;
  font-size:13px; font-weight:300; line-height:1.9;
  resize:none; outline:none; min-height:80px;
}
.memo-input::placeholder { color:var(--border); }

/* ── 휴식일 ── */
.rest-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:44px 24px; text-align:center; }
.rest-emoji { font-size:46px; margin-bottom:14px; }
.rest-card h2 { font-family:'Nanum Myeongjo',serif; font-size:22px; font-weight:700; color:var(--text); margin-bottom:8px; }
.rest-card p { font-size:13px; color:var(--muted); line-height:1.9; font-weight:300; }

/* ── 달력 모달 ── */
.modal-overlay {
  position:fixed; inset:0;
  background:rgba(0,0,0,0.7); backdrop-filter:blur(6px);
  z-index:100; display:none;
  align-items:center; justify-content:center;
}
.modal-overlay.show { display:flex; animation:fadeIn 0.2s ease; }

.cal-modal {
  background:var(--card); border:1px solid var(--border);
  border-radius:16px; padding:28px; width:380px; max-width:94vw;
  max-height:90vh; overflow-y:auto;
}
.cal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
.cal-title { font-family:'Nanum Myeongjo',serif; font-size:18px; font-weight:800; color:var(--text); }
.cal-nav {
  background:none; border:1px solid var(--border);
  color:var(--muted); font-size:14px; padding:5px 12px;
  border-radius:100px; cursor:pointer; font-family:'Noto Sans KR',sans-serif;
  transition:all 0.2s;
}
.cal-nav:hover { border-color:var(--accent); color:var(--accent); }
.cal-close { background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; padding:4px 8px; transition:color 0.2s; }
.cal-close:hover { color:var(--text); }

.cal-days-header { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; color:var(--muted); margin-bottom:8px; gap:2px; }

.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.cal-cell {
  aspect-ratio:1; border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; position:relative; cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;
  transition:all 0.15s;
}
.cal-cell:hover { background:var(--surface); }
.cal-cell.empty { cursor:default; }
.cal-cell.empty:hover { background:transparent; }
.cal-cell.today { border:1px solid var(--accent); color:var(--accent); font-weight:700; }
.cal-cell.done-day { background:rgba(122,232,168,0.2); color:var(--success); }
.cal-cell.partial-day { background:rgba(232,201,122,0.15); color:var(--accent); }
.cal-cell.missed { color:var(--muted); opacity:0.5; }
.cal-cell.selected { outline:2px solid var(--accent2); outline-offset:1px; }

.cal-legend { display:flex; gap:14px; margin-top:16px; font-size:11px; color:var(--muted); flex-wrap:wrap; }
.cal-legend-item { display:flex; align-items:center; gap:6px; }
.legend-dot { width:10px; height:10px; border-radius:3px; flex-shrink:0; }

/* 날짜 상세 */
.cal-day-detail {
  margin-top:16px; border-top:1px solid var(--border);
  padding-top:14px; display:none; animation:fadeIn 0.2s ease;
}
.cal-day-detail.show { display:block; }
.cal-detail-date { font-size:12px; color:var(--accent2); letter-spacing:2px; font-family:'Nanum Myeongjo',serif; margin-bottom:10px; }
.cal-detail-row { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text); margin-bottom:6px; }
.cal-detail-memo { font-size:12px; color:var(--muted); background:var(--surface); border-radius:6px; padding:8px 12px; margin-top:8px; line-height:1.7; }

/* ── 인터벌 타이머 모달 ── */
.interval-modal {
  position:fixed; inset:0;
  background:rgba(0,0,0,0.85); backdrop-filter:blur(8px);
  z-index:150; display:none;
  align-items:center; justify-content:center;
}
.interval-modal.show { display:flex; animation:fadeIn 0.2s ease; }
.interval-card {
  background:var(--card); border:1px solid var(--xp-color);
  border-radius:20px; padding:32px; width:320px; max-width:90vw;
  text-align:center;
}
.interval-title { font-family:'Nanum Myeongjo',serif; font-size:16px; font-weight:700; color:var(--text); margin-bottom:6px; }
.interval-ex-name { font-size:13px; color:var(--muted); margin-bottom:20px; }

.interval-phase {
  font-size:11px; letter-spacing:3px; color:var(--xp-color);
  font-family:'Nanum Myeongjo',serif; margin-bottom:8px;
  transition:color 0.3s;
}
.interval-phase.rest-phase { color:var(--accent2); }

.interval-count {
  font-family:'Nanum Myeongjo',serif;
  font-size:72px; font-weight:800;
  color:var(--xp-color); line-height:1;
  margin-bottom:8px; transition:color 0.3s;
}
.interval-count.rest-count { color:var(--accent2); }

.interval-sets { font-size:13px; color:var(--muted); margin-bottom:20px; }

.interval-settings { display:flex; gap:8px; margin-bottom:20px; justify-content:center; }
.interval-setting-box {
  background:var(--surface); border:1px solid var(--border);
  border-radius:8px; padding:8px 12px; text-align:center;
}
.interval-setting-label { font-size:10px; color:var(--muted); margin-bottom:4px; }
.interval-setting-val { display:flex; align-items:center; gap:6px; }
.interval-adj-btn {
  background:none; border:1px solid var(--border); color:var(--muted);
  width:22px; height:22px; border-radius:50%; cursor:pointer;
  font-size:12px; display:flex; align-items:center; justify-content:center;
  transition:all 0.2s;
}
.interval-adj-btn:hover { border-color:var(--xp-color); color:var(--xp-color); }
.interval-num { font-size:14px; font-weight:700; color:var(--text); min-width:28px; }

.interval-btns { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
.interval-ctrl-btn {
  background:var(--xp-color); border:none; color:#0f0f13;
  font-family:'Noto Sans KR',sans-serif;
  font-size:13px; font-weight:700; padding:10px 24px;
  border-radius:100px; cursor:pointer; transition:all 0.2s;
}
.interval-ctrl-btn:hover { opacity:0.85; }
.interval-close-btn {
  background:none; border:1px solid var(--border); color:var(--muted);
  font-family:'Noto Sans KR',sans-serif;
  font-size:13px; padding:10px 20px;
  border-radius:100px; cursor:pointer; transition:all 0.2s;
}
.interval-close-btn:hover { border-color:var(--text); color:var(--text); }

/* ── 레벨업 팝업 ── */
.levelup-popup {
  position:fixed; inset:0; background:rgba(0,0,0,0.8);
  z-index:200; display:none; align-items:center; justify-content:center;
}
.levelup-popup.show { display:flex; }
.levelup-card {
  background:var(--card); border:1px solid var(--xp-color);
  border-radius:20px; padding:40px 32px;
  text-align:center; max-width:320px;
  box-shadow:0 0 60px rgba(185,122,232,0.3);
  animation:popIn 0.4s ease;
}
.levelup-emoji { font-size:56px; margin-bottom:16px; }
.levelup-title { font-family:'Nanum Myeongjo',serif; font-size:28px; font-weight:800; color:var(--xp-color); margin-bottom:8px; }
.levelup-sub { font-size:14px; color:var(--text); margin-bottom:6px; }
.levelup-desc { font-size:12px; color:var(--muted); line-height:1.7; margin-bottom:24px; }
.levelup-btn {
  background:var(--xp-color); border:none; color:#0f0f13;
  font-family:'Noto Sans KR',sans-serif;
  font-size:14px; font-weight:700; padding:12px 32px;
  border-radius:100px; cursor:pointer;
}

/* ── 토스트 ── */
.save-toast {
  position:fixed; bottom:24px; right:24px;
  background:var(--success); color:#0f0f13;
  font-size:12px; font-weight:700; padding:9px 18px;
  border-radius:100px; opacity:0;
  transform:translateY(8px); transition:all 0.3s ease;
  pointer-events:none; letter-spacing:1px;
  font-family:'Noto Sans KR',sans-serif; z-index:300;
}
.save-toast.show { opacity:1; transform:translateY(0); }

.install-banner {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 16px; margin-bottom: 16px;
  display: flex; align-items: center; gap: 10px;
  font-size: 12px; color: var(--muted);
}
.install-banner .install-icon { font-size: 20px; flex-shrink: 0; }
.install-banner .install-close {
  background: none; border: none; color: var(--muted);
  cursor: pointer; font-size: 14px; margin-left: auto; padding: 2px 6px;
}

@media (max-width: 600px) {
  .wrapper { padding: 0 14px 100px; }
  .header { padding: 24px 0 18px; }
  .header-date { font-size: 30px; }
  .level-badge { width: 38px; height: 38px; font-size: 14px; }
  .quote-text { font-size: 16px; }
  .day-btn { font-size: 11px; padding: 7px 11px; }
  .today-banner { padding: 14px 16px; gap: 10px; }
  .today-emoji { font-size: 24px; }
  .today-info h2 { font-size: 16px; }
  .timer-display-sm { font-size: 24px; }
  .interval-count { font-size: 58px; }
}

@keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
@keyframes popIn { from{opacity:0;transform:scale(0.85)} to{opacity:1;transform:scale(1)} }
.fade-in { animation:fadeIn 0.3s ease forwards; }
</style>
</head>
<body>

<div class="wrapper">

  <div class="install-banner" id="installBanner" style="display:none">
    <span class="install-icon">📲</span>
    <span>Safari → <b>공유 버튼</b> → <b>홈 화면에 추가</b> 하면 앱처럼 쓸 수 있어!</span>

  <!-- 헤더 -->
  <div class="header">
    <div class="header-top">
      <div class="header-brand">오늘의 행복</div>
      <div class="header-btns">
        <div style="display:flex;gap:6px;">
          <button class="header-cal-btn" onclick="openCal()">📅 기록 달력</button>
          <button class="sync-btn" id="syncBtn" onclick="pushData()">☁️ 동기화</button>
        </div>
        <div class="sync-time" id="syncTimeLabel"></div>
      </div>
    </div>
    <div class="header-center">
      <div class="header-date" id="headerDate" onclick="openCal()"></div>

  <!-- 레벨 바 -->
  <div class="level-bar-wrap">
    <div class="level-badge" id="levelBadge">1</div>
    <div class="level-info">
      <div class="level-title" id="levelTitle">Lv.1 — 시작하는 자</div>
      <div class="level-sub" id="levelSub">꾸준함이 모든 것의 시작이야</div>
      <div class="xp-bar-bg"><div class="xp-bar-fill" id="xpFill" style="width:0%"></div></div>
      <div class="level-xp" id="xpText">0 XP</div>
    </div>
  </div>

  <!-- 명언 -->
  <div class="quote-card">
    <div class="quote-label">오늘의 명언 — 필사해봐</div>
    <div class="quote-text" id="quoteText"></div>
    <div class="quote-author" id="quoteAuthor"></div>
    <div style="margin-top:10px;">
      <button onclick="toggleMeaning()" id="meaningBtn" style="background:none;border:1px solid var(--border);color:var(--muted);font-family:'Noto Sans KR',sans-serif;font-size:11px;padding:5px 14px;border-radius:100px;cursor:pointer;letter-spacing:1px;transition:all 0.2s;">의미 보기 ▼</button>
    </div>
    <div id="meaningBox" style="display:none;margin-top:12px;padding:12px 14px;background:var(--surface);border-radius:8px;font-size:13px;color:var(--muted);line-height:1.8;font-weight:300;"></div>
  </div>

  <!-- 요일 선택 -->
  <div class="day-selector" id="daySelector">
    <button class="day-btn" onclick="selectDay(0)">월 · 상체</button>
    <button class="day-btn" onclick="selectDay(1)">화 · 걷기</button>
    <button class="day-btn" onclick="selectDay(2)">수 · 하체</button>

    <button class="day-btn" onclick="selectDay(4)">금 · 서킷</button>
    <button class="day-btn" onclick="selectDay(5)">토 · 보강</button>
    <button class="day-btn" onclick="selectDay(6)">일 · 휴식</button>
  </div>

  <!-- 메인 콘텐츠 -->
  <div id="mainContent"></div>

</div>

<!-- 달력 모달 -->
<div class="modal-overlay" id="calModal" onclick="closeCal(event)">
  <div class="cal-modal">
    <div class="cal-header">
      <button class="cal-nav" onclick="calPrev()">‹</button>
      <div class="cal-title" id="calTitle"></div>
      <button class="cal-nav" onclick="calNext()">›</button>
      <button class="cal-close" onclick="closeCalBtn()">✕</button>
    </div>
    <div class="cal-days-header">
      <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-legend">
      <div class="cal-legend-item"><div class="legend-dot" style="background:rgba(122,232,168,0.3)"></div>완주</div>
      <div class="cal-legend-item"><div class="legend-dot" style="background:rgba(232,201,122,0.2)"></div>부분 완료</div>
      <div class="cal-legend-item"><div class="legend-dot" style="border:1px solid var(--accent)"></div>오늘</div>
    </div>
    <!-- 날짜 상세 (클릭 시 표시) -->
    <div class="cal-day-detail" id="calDayDetail">
      <div class="cal-detail-date" id="calDetailDate"></div>
      <div id="calDetailContent"></div>
    </div>
  </div>
</div>

<!-- 인터벌 타이머 모달 -->
<div class="interval-modal" id="intervalModal">
  <div class="interval-card">
    <div class="interval-title">인터벌 타이머</div>
    <div class="interval-ex-name" id="intervalExName">철봉 매달리기</div>

    <div class="interval-settings">
      <div class="interval-setting-box">
        <div class="interval-setting-label">운동 시간</div>
        <div class="interval-setting-val">
          <button class="interval-adj-btn" onclick="adjustInterval('work',-5)">−</button>
          <div class="interval-num" id="workSecDisplay">30</div>
          <button class="interval-adj-btn" onclick="adjustInterval('work',5)">+</button>
        </div>
        <div style="font-size:10px;color:var(--muted);">초</div>
      </div>
      <div class="interval-setting-box">
        <div class="interval-setting-label">휴식 시간</div>
        <div class="interval-setting-val">
          <button class="interval-adj-btn" onclick="adjustInterval('rest',-5)">−</button>
          <div class="interval-num" id="restSecDisplay">15</div>
          <button class="interval-adj-btn" onclick="adjustInterval('rest',5)">+</button>
        </div>
        <div style="font-size:10px;color:var(--muted);">초</div>
      </div>
      <div class="interval-setting-box">
        <div class="interval-setting-label">세트</div>
        <div class="interval-setting-val">
          <button class="interval-adj-btn" onclick="adjustInterval('sets',-1)">−</button>
          <div class="interval-num" id="setsDisplay">3</div>

        <div style="font-size:10px;color:var(--muted);">세트</div>
      </div>

    <div class="interval-phase" id="intervalPhase">준비</div>
    <div class="interval-count" id="intervalCount">--</div>
    <div class="interval-sets" id="intervalSetsInfo">세트 준비</div>

    <div class="interval-btns">
      <button class="interval-ctrl-btn" id="intervalStartBtn" onclick="toggleIntervalTimer()">시작</button>
      <button class="interval-close-btn" onclick="closeIntervalModal()">닫기</button>
    </div>
  </div>
</div>

<!-- 레벨업 팝업 -->
<div class="levelup-popup" id="levelupPopup">
  <div class="levelup-card">

</div>

<div class="save-toast" id="saveToast">저장됨 ✓</div>

<script>
// ════════════════════════════════════
// 데이터
// ════════════════════════════════════

const QUOTES = [
  { text: "시작이 반이다.", author: "아리스토텔레스", meaning: "무언가를 시작하는 것 자체가 이미 절반을 해낸 것이나 다름없다." },
  { text: "천 리 길도 한 걸음부터.", author: "노자 (도덕경)", meaning: "아무리 먼 목표도 결국 지금 이 한 걸음에서 시작된다." },
  { text: "오늘 할 수 있는 일을 내일로 미루지 마라.", author: "벤자민 프랭클린", meaning: "미루는 습관은 가장 큰 적이다. 지금 할 수 있는 것을 하라." },
  { text: "땀은 거짓말을 하지 않는다.", author: "보 잭슨", meaning: "노력은 반드시 결과로 나타난다." },
  { text: "작은 것들이 완벽함을 만든다.", author: "미켈란젤로", meaning: "매일의 작은 디테일에 집중하는 태도가 위대한 결과를 만든다." },
  { text: "고통은 일시적이다. 포기는 영원하다.", author: "랜스 암스트롱", meaning: "지금 느끼는 힘듦은 언젠가 끝난다. 하지만 포기한 순간은 평생 후회로 남는다." },
  { text: "멈추지 않는 한, 속도는 문제가 되지 않는다.", author: "공자", meaning: "느려도 괜찮다. 포기하지 않고 나아가는 것이 핵심이다." },
  { text: "실패란 더 현명하게 다시 시작할 기회다.", author: "헨리 포드", meaning: "실패는 끝이 아니라 배움의 시작이다." },
  { text: "우리는 우리가 반복적으로 하는 것의 산물이다.", author: "아리스토텔레스", meaning: "매일 반복하는 루틴이 결국 나라는 사람을 만든다." },
  { text: "당신 자신을 남과 비교하지 마라. 그것은 자신을 모욕하는 행위다.", author: "빌 게이츠", meaning: "어제의 나와 오늘의 나를 비교하는 것만이 의미 있는 경쟁이다." },
  { text: "불가능이란 아무것도 아니다.", author: "무하마드 알리", meaning: "도전하기 전까지는 아무도 모른다." },
  { text: "나는 실패를 받아들일 수 있다. 하지만 시도하지 않는 것은 받아들일 수 없다.", author: "마이클 조던", meaning: "두려워서 시도조차 하지 않는 것이 진짜 실패다." },
  { text: "매일 조금씩. 그것이 전부다.", author: "로버트 콜리어", meaning: "위대한 변화는 매일의 작은 행동에서 비롯된다." },
  { text: "건강한 몸에 건강한 정신이 깃든다.", author: "유베날리스", meaning: "몸을 단련하면 정신도 강해진다." },
  { text: "한계는 종종 스스로 만든 것이다.", author: "마이클 조던", meaning: "우리가 못 한다고 생각하는 순간, 그것이 진짜 한계가 된다." },
  { text: "오늘의 땀이 내일의 나를 만든다.", author: "스포츠 격언", meaning: "지금 이 순간 흘리는 땀은 절대 낭비가 아니다." },
  { text: "변명을 멈추는 순간, 인생이 시작된다.", author: "스티브 잡스", meaning: "책임을 받아들이는 순간 진짜 성장이 시작된다." },
  { text: "어제보다 나은 오늘이면 충분하다.", author: "일본 무도 격언", meaning: "조금이라도 성장했다면 오늘은 성공한 하루다." },
  { text: "포기하지 않는 한, 실패는 없다.", author: "크리스토퍼 콜럼버스", meaning: "진짜 실패는 일어나기를 포기하는 것이다." },
  { text: "인내는 쓰나 열매는 달다.", author: "장 자크 루소", meaning: "힘든 과정을 견딘 사람만이 그 결실의 달콤함을 안다." },
  { text: "당신이 할 수 있다고 믿든 없다고 믿든, 당신이 옳다.", author: "헨리 포드", meaning: "믿음이 현실을 만든다." },
  { text: "몸은 마음이 가는 곳으로 따라온다.", author: "스포츠 심리학 격언", meaning: "정신력이 먼저다. 마음을 강하게 먹으면 몸도 따라온다." },

let walkTimerInterval = null;
let walkStartTs = 0;       // 시작 시각 (밀리초)
let walkSeconds = 0;       // 현재 표시되는 초
let walkTimerRunning = false;
const WALK_MAX_SEC = 7200; // 2시간 자동 정지

// 인터벌 타이머
let intervalTimerInterval = null;
let intervalRunning = false;
let intervalWorkSec = 30;
let intervalRestSec = 15;
let intervalTotalSets = 3;
let intervalCurrentSet = 1;

// 상황 변경 상태는 state.altPlan / state.pendingSituation으로 관리

const now = new Date();

function getTodayKey() {
  return `${now.getFullYear()}_${now.getMonth()}_${now.getDate()}`;
}

function getDayKey(d) {
  return `habit_${d}_d${currentDay}`;
}

function loadState() {
  try {
    const saved = localStorage.getItem(getDayKey(getTodayKey()));
    state = saved ? JSON.parse(saved) : { exercises:{}, writing:{}, walk:false, walkSec:0, walkStartTs:0, walkRunning:false, memo:'', altPlan:null, altItems:{} };
    // 이전 버전 호환
    if (state.altCompleted && !state.altPlan) {
      // 구버전 altCompleted는 무시하고 초기화
      state.altPlan = null;
      state.altItems = {};
    }
    if (!state.altItems) state.altItems = {};
    if (state.altPlan === undefined) state.altPlan = null;
  } catch { state = { exercises:{}, writing:{}, walk:false, walkSec:0, walkStartTs:0, walkRunning:false, memo:'', altPlan:null, altItems:{} }; }
}

function saveState() {
  try {
    localStorage.setItem(getDayKey(getTodayKey()), JSON.stringify(state));
    markDayRecord();
    showToast();
  } catch {}
}

function markDayRecord() {
  const lv = getCurrentLevel();
  const routine = getExercises(currentDay, lv.lv);
  let total = 0, done = 0;

  // 원래 운동 또는 대체 플랜
  if (state.altPlan && ALT_PLANS[state.altPlan]) {
    const plan = ALT_PLANS[state.altPlan];
    total += plan.items.length;
    done += plan.items.filter((_,i) => state.altItems[i]).length;
  } else if (routine) {
    total += routine.exercises.length;
    done += routine.exercises.filter((_,i) => state.exercises[i]).length;
  }

  // 손글씨 + 걷기
  const wSteps = writingStepsByLevel[lv.lv];
  total += wSteps.length + 1;
  done += wSteps.filter((_,i) => state.writing[i]).length;
  if (state.walk) done++;

  const key = `record_${getTodayKey()}`;
  const pct = total > 0 ? done / total : 0;

  // 대체운동 XP — 완료한 항목 수 비율에 따라 차등
  let altXP = 0;
  if (state.altPlan && ALT_PLANS[state.altPlan]) {
    const plan = ALT_PLANS[state.altPlan];
    const doneCount = plan.items.filter((_,i) => state.altItems[i]).length;
    const ratio = doneCount / plan.items.length;
    altXP = Math.round(plan.totalXp * ratio);
  }

  localStorage.setItem(key, JSON.stringify({
    pct, done, total,
    memo: state.memo || '',
    altPlan: state.altPlan,
    altPlanLabel: state.altPlan && ALT_PLANS[state.altPlan] ? ALT_PLANS[state.altPlan].label : null,
    altItemsDone: state.altPlan && ALT_PLANS[state.altPlan] ?
      ALT_PLANS[state.altPlan].items.filter((_,i) => state.altItems[i]).length : 0,
    altItemsTotal: state.altPlan && ALT_PLANS[state.altPlan] ? ALT_PLANS[state.altPlan].items.length : 0,
    altXP,
    walkSec: state.walkSec || 0,
    walkKcal: calcWalkCalories(state.walkSec || 0),
  }));
}

function getTotalXP() {
  let xp = 0;
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('record_')) {
      try {
        const rec = JSON.parse(localStorage.getItem(k));
        xp += Math.round((rec.pct || 0) * 10);
        xp += (rec.altXP || 0);
      } catch {}
    }
  }
  return xp;
}

function getCurrentLevel() {
  const xp = getTotalXP();
  let lv = LEVELS[0];
  for (const l of LEVELS) { if (xp >= l.xpNeeded) lv = l; }
  return lv;
}

function getNextLevel() {
  const xp = getTotalXP();
  for (let i = 1; i < LEVELS.length; i++) { if (xp < LEVELS[i].xpNeeded) return LEVELS[i]; }
  return null;
}

function initDate() {
  const y = now.getFullYear();
  const m = String(now.getMonth()+1).padStart(2,'0');
  const d = String(now.getDate()).padStart(2,'0');
  document.getElementById('headerDate').textContent = `${y}.${m}.${d}`;
  const days = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
  document.getElementById('headerDay').textContent = days[now.getDay()];
  const map = {0:6,1:0,2:1,3:2,4:3,5:4,6:5};
  currentDay = map[now.getDay()] ?? 0;
  calYear = now.getFullYear();
  calMonth = now.getMonth();
}

function initQuote() {
  const idx = (now.getDate() + now.getMonth() * 31) % QUOTES.length;
  const q = QUOTES[idx];
  document.getElementById('quoteText').textContent = `"${q.text}"`;
  document.getElementById('quoteAuthor').textContent = `— ${q.author}`;
  document.getElementById('meaningBox').textContent = q.meaning || '';
}

function toggleMeaning() {
  const box = document.getElementById('meaningBox');
  const btn = document.getElementById('meaningBtn');
  const isHidden = box.style.display === 'none';
  box.style.display = isHidden ? 'block' : 'none';
  btn.textContent = isHidden ? '의미 닫기 ▲' : '의미 보기 ▼';
  btn.style.borderColor = isHidden ? 'var(--accent)' : 'var(--border)';
  btn.style.color = isHidden ? 'var(--accent)' : 'var(--muted)';
}

function updateLevelUI() {
  const xp = getTotalXP();
  const lv = getCurrentLevel();
  const next = getNextLevel();
  document.getElementById('levelBadge').textContent = lv.lv;
  document.getElementById('levelTitle').textContent = `Lv.${lv.lv} — ${lv.name}`;
  document.getElementById('levelSub').textContent = lv.sub;
  const pct = next ? Math.round(((xp - lv.xpNeeded) / (next.xpNeeded - lv.xpNeeded)) * 100) : 100;
  document.getElementById('xpFill').style.width = Math.min(pct,100) + '%';
  document.getElementById('xpText').textContent = next ? `${xp} XP → 다음 레벨까지 ${next.xpNeeded - xp} XP` : `${xp} XP — 최고 레벨 달성!`;
}

function updateSyncTimeLabel() {
  const ts = parseInt(localStorage.getItem('last_push_ts') || '0');
  const device = localStorage.getItem('last_push_device') || '';
  const el = document.getElementById('syncTimeLabel');
  if (!el || !ts) { if(el) el.textContent=''; return; }
  const diff = Date.now() - ts;
  const mins = Math.floor(diff / 60000);
  const hrs = Math.floor(diff / 3600000);
  const days = Math.floor(diff / 86400000);
  let timeText;
  if (mins < 1) timeText = '방금 전';
  else if (mins < 60) timeText = `${mins}분 전`;
  else if (hrs < 24) timeText = `${hrs}시간 전`;
  else timeText = `${days}일 전`;
  el.textContent = device ? `${timeText} · ${device}` : `${timeText} 동기화`;
}

// 기기 종류 감지
function detectDevice() {
  const ua = navigator.userAgent;
  if (/iPhone/i.test(ua)) return '📱 아이폰';
  if (/iPad/i.test(ua)) return '📱 아이패드';
  if (/Android/i.test(ua)) return '📱 안드로이드';
  if (/Mac/i.test(ua)) return '💻 맥';
  if (/Windows/i.test(ua)) return '💻 PC';
  return '🌐 브라우저';
}

        let metaHtml = '';

          metaHtml = `<button class="interval-btn" onclick="event.stopPropagation(); openIntervalModal(event,'${item.name.replace(/'/g,"\\'")}')">⏱ 인터벌</button>`;
        }

        itemEl.innerHTML = `

function selectSituation(key) {

  if (!sit) return;
  // 같은 상황 중 다른 플랜 진행 중이면 초기화

    state.altItems = {};
    state.pendingSituation = null;
    saveState(); renderMain();
    return;
  }
  // 플랜 1개면 바로 시작

function renderCal() {
  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

  // 해당 날짜의 habit 상태 찾기 (어느 요일 탭이든)

function formatWalkTime(sec) {
  const m = Math.floor(sec/60);
  const s = sec % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function toggleWalkTimer() {
  if (state.walk && !walkTimerRunning) return; // 이미 완료

  if (walkTimerRunning) {
    // 중지 → 완료 처리
    clearInterval(walkTimerInterval);
    walkTimerRunning = false;
    const elapsed = Math.floor((Date.now() - walkStartTs) / 1000);
    walkSeconds = Math.min(elapsed, WALK_MAX_SEC);
    state.walk = true;
    state.walkSec = walkSeconds;
    state.walkStartTs = 0;
    saveState(); updateLevelUI();
    renderMain();
    return;
  }

  // 시작 — 시작 시각 저장
  walkStartTs = Date.now();
  walkSeconds = 0;
  walkTimerRunning = true;
  state.walkStartTs = walkStartTs; // 페이지 닫혀도 복원 가능
  state.walkRunning = true;
  saveState();

  let warned20 = false, warned30 = false;

  walkTimerInterval = setInterval(() => {
    // ★ 핵심: setInterval 카운트가 아니라 타임스탬프 차이로 계산
    // → 다른 앱 갔다 와도 시간은 계속 흐름
    const elapsed = Math.floor((Date.now() - walkStartTs) / 1000);
    walkSeconds = elapsed;

    const disp = document.getElementById('walkTimerDisp');
    if (disp) disp.textContent = formatWalkTime(walkSeconds);

    // 칼로리 표시 업데이트
    const calDisp = document.getElementById('walkCalDisp');
    if (calDisp) calDisp.textContent = calcWalkCalories(walkSeconds) + ' kcal';

    // 20분, 30분 경과 알림음 (한 번씩만)
    if (!warned20 && walkSeconds >= 20*60) {
      warned20 = true;
      beep(660, 200); setTimeout(() => beep(880, 300), 250);
    }
    if (!warned30 && walkSeconds >= 30*60) {
      warned30 = true;
      beep(880, 200); setTimeout(() => beep(1100, 400), 250);
    }

    // 2시간 자동 정지
    if (walkSeconds >= WALK_MAX_SEC) {
      walkSeconds = WALK_MAX_SEC;
      clearInterval(walkTimerInterval);
      walkTimerRunning = false;
      state.walk = true;
      state.walkSec = walkSeconds;
      state.walkStartTs = 0;
      state.walkRunning = false;
      saveState(); updateLevelUI();
      beep(1100, 300); setTimeout(() => beep(880, 400), 350);
      renderMain();
    }
  }, 1000);

  const btn = document.getElementById('walkTimerBtn');
  if (btn) { btn.textContent = '🔴 중지·완료'; btn.classList.add('stop'); }
}

// 페이지 복귀 시 진행 중이던 걷기 복원
function restoreWalkTimer() {
  if (state.walkRunning && state.walkStartTs) {
    const elapsed = Math.floor((Date.now() - state.walkStartTs) / 1000);
    if (elapsed < WALK_MAX_SEC) {
      // 아직 진행 중인 걷기 복원
      walkStartTs = state.walkStartTs;
      walkSeconds = elapsed;
      walkTimerRunning = true;
      // 재시작
      walkTimerInterval = setInterval(() => {
        walkSeconds = Math.floor((Date.now() - walkStartTs) / 1000);
        const disp = document.getElementById('walkTimerDisp');
        if (disp) disp.textContent = formatWalkTime(walkSeconds);
        const calDisp = document.getElementById('walkCalDisp');
        if (calDisp) calDisp.textContent = calcWalkCalories(walkSeconds) + ' kcal';
        if (walkSeconds >= WALK_MAX_SEC) {
          walkSeconds = WALK_MAX_SEC;
          clearInterval(walkTimerInterval);
          walkTimerRunning = false;
          state.walk = true;
          state.walkSec = walkSeconds;
          state.walkStartTs = 0;
          state.walkRunning = false;
          saveState(); updateLevelUI(); renderMain();
        }
      }, 1000);
    } else {
      // 2시간 넘었음 — 자동 완료 처리
      walkSeconds = WALK_MAX_SEC;
      walkTimerRunning = false;
      state.walk = true;
      state.walkSec = WALK_MAX_SEC;
      state.walkStartTs = 0;
      state.walkRunning = false;
      saveState();
    }
  }
}

// J 체중 기준 맨발걷기 칼로리 계산 (MET 3.8 기준)
// 공식: 칼로리 = MET × 체중(kg) × 시간(시간) × 1.05
const USER_WEIGHT_KG = 97;
const MET_BAREFOOT_WALK = 3.8; // 얕은 산·맨발걷기 평균값
function calcWalkCalories(seconds) {
  const hours = seconds / 3600;
  const kcal = MET_BAREFOOT_WALK * USER_WEIGHT_KG * hours * 1.05;
  return Math.round(kcal);
}

function stopWalkTimer() {
  clearInterval(walkTimerInterval);
  walkTimerRunning = false;
  walkSeconds = state.walkSec || 0;
  walkStartTs = 0;

function adjustInterval(type, delta) {
  if (type === 'work') { intervalWorkSec = Math.max(5, intervalWorkSec + delta); document.getElementById('workSecDisplay').textContent = intervalWorkSec; }
  if (type === 'rest') { intervalRestSec = Math.max(5, intervalRestSec + delta); document.getElementById('restSecDisplay').textContent = intervalRestSec; }
  if (type === 'sets') { intervalTotalSets = Math.max(1, Math.min(10, intervalTotalSets + delta)); document.getElementById('setsDisplay').textContent = intervalTotalSets; }
  if (!intervalRunning) resetIntervalTimer();
}

function resetIntervalTimer() {
  stopIntervalTimer();
  intervalCurrentSet = 1;
  intervalPhase = 'work';
  intervalRemaining = intervalWorkSec;
  updateIntervalUI();
}

function stopIntervalTimer() {
  clearInterval(intervalTimerInterval);
  intervalRunning = false;
  const btn = document.getElementById('intervalStartBtn');
  if (btn) btn.textContent = '시작';
}

function toggleIntervalTimer() {
  if (intervalRunning) {
    stopIntervalTimer();
    return;
  }
  if (intervalCurrentSet > intervalTotalSets) { resetIntervalTimer(); return; }
  intervalRunning = true;
  document.getElementById('intervalStartBtn').textContent = '일시정지';

  intervalTimerInterval = setInterval(() => {
    intervalRemaining--;
    if (intervalRemaining <= 0) {
      if (intervalPhase === 'work') {
        // 운동 끝 → 휴식 시작
        beep(440, 150); setTimeout(() => beep(440, 150), 200); setTimeout(() => beep(660, 300), 400);
        intervalPhase = 'rest';
        intervalRemaining = intervalRestSec;
      } else {
        // 휴식 끝 → 다음 세트
        intervalCurrentSet++;
        if (intervalCurrentSet > intervalTotalSets) {
          // 완료
          stopIntervalTimer();
          beep(880, 200); setTimeout(() => beep(880, 200), 250); setTimeout(() => beep(1100, 500), 500);
          document.getElementById('intervalPhase').textContent = '완료! 수고했어 🎉';
          document.getElementById('intervalCount').textContent = '✓';
          document.getElementById('intervalSetsInfo').textContent = '모든 세트 완료';
          document.getElementById('intervalStartBtn').textContent = '다시';
          return;
        }
        beep(880, 300);
        intervalPhase = 'work';
        intervalRemaining = intervalWorkSec;
      }
    }
    updateIntervalUI();
  }, 1000);
}

function updateIntervalUI() {
  const phaseEl = document.getElementById('intervalPhase');
  const countEl = document.getElementById('intervalCount');
  const setsEl = document.getElementById('intervalSetsInfo');

  if (phaseEl) {
    phaseEl.textContent = intervalPhase === 'work' ? '운동' : '휴식';
    phaseEl.className = 'interval-phase' + (intervalPhase === 'rest' ? ' rest-phase' : '');
  }
  if (countEl) {
    countEl.textContent = intervalRemaining;
    countEl.className = 'interval-count' + (intervalPhase === 'rest' ? ' rest-count' : '');
  }
  if (setsEl) setsEl.textContent = `${intervalCurrentSet} / ${intervalTotalSets} 세트`;
}

function beep(freq = 800, duration = 200, vol = 0.3) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration/1000);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + duration/1000);
  } catch(e) {}
}

async function cloudSave(data) {
  try {
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
      body: JSON.stringify(data)
    });
  } catch(e) { console.log('동기화 실패', e); }
}

async function cloudLoad() {
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
      headers: { 'X-Master-Key': API_KEY }
    });
    const json = await res.json();
    return json.record;
  } catch(e) { return null; }
}

// ★ 버그 수정: 자동 로드 시 로컬 데이터 덮어쓰지 않음
async function syncData() {
  const cloud = await cloudLoad();
  if (!cloud) return;
  // 클라우드의 동기화 시간·기기 정보는 덮어쓰기 (최신 기준)
  if (cloud.last_push_ts) localStorage.setItem('last_push_ts', cloud.last_push_ts);
  if (cloud.last_push_device) localStorage.setItem('last_push_device', cloud.last_push_device);
  // 나머지는 로컬에 없는 것만 채움 (오늘 기록 보호)
  Object.keys(cloud).forEach(k => {
    if (k === 'timestamp' || k === 'last_push_ts' || k === 'last_push_device') return;
    if (!localStorage.getItem(k)) {
      try {
        const val = typeof cloud[k] === 'string' ? cloud[k] : JSON.stringify(cloud[k]);
        localStorage.setItem(k, val);
      } catch {}
    }
  });
}

async function pushData() {
  const btn = document.getElementById('syncBtn');
  if (btn) { btn.textContent = '⏳ 동기화 중...'; btn.disabled = true; }

  const device = detectDevice();
  const ts = Date.now();

  const data = { timestamp: ts, last_push_device: device };
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    try { data[k] = JSON.parse(localStorage.getItem(k)); }
    catch { data[k] = localStorage.getItem(k); }
  }
  // 기기 정보도 포함시켜서 클라우드에 저장
  data.last_push_ts = ts;
  data.last_push_device = device;

  await cloudSave(data);

  localStorage.setItem('last_push_ts', ts);
  localStorage.setItem('last_push_device', device);
  updateSyncTimeLabel();

  if (btn) { btn.textContent = '☁️ 동기화'; btn.disabled = false; }
  showToast();
}

initDate();

loadState();
restoreWalkTimer(); // 진행 중이던 걷기 복원
updateLevelUI();
renderMain();

document.querySelectorAll('.day-btn').forEach((b,i) => b.classList.toggle('active', i===currentDay));

// 자동 클라우드 동기화 (로컬 보호 버전)
syncData().then(() => {
  loadState(); updateLevelUI(); renderMain();
});

// 동기화 시간 레이블 주기 갱신 (1분마다)
setInterval(updateSyncTimeLabel, 60000);

// iOS 홈 화면 추가 안내
function dismissInstall() {
  localStorage.setItem('install_dismissed', '1');
  document.getElementById('installBanner').style.display = 'none';
}
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = window.navigator.standalone;
const dismissed = localStorage.getItem('install_dismissed');
if (isIOS && !isStandalone && !dismissed) {
  document.getElementById('installBanner').style.display = 'flex';
}
