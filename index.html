<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="오늘의 행복">
<meta name="theme-color" content="#090912">
<title>오늘의 행복</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #090912;
  --surface: #111119;
  --card:    #16161f;
  --card2:   #1c1c27;
  --border:  rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --gold:    #c9a96e;
  --gold-dim: rgba(201,169,110,0.12);
  --blue:    #6baed6;
  --blue-dim: rgba(107,174,214,0.1);
  --cn:      #d4846a;
  --green:   #6bbfa0;
  --green-dim: rgba(107,191,160,0.1);
  --bud:     #cf8fae;
  --bud-dim: rgba(207,143,174,0.1);
  --text:    #ede9e0;
  --muted:   #5c5c72;
  --muted2:  #7a7a8f;
  --success: #6bbfa0;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 15% 10%, rgba(201,169,110,0.035) 0%, transparent 70%),
    radial-gradient(ellipse 50% 60% at 85% 90%, rgba(107,174,214,0.03) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}

.wrapper {
  position: relative; z-index: 1;
  max-width: 720px; margin: 0 auto;
  padding: 0 22px 100px;
}

/* ── 헤더 ── */
.header {
  padding: 44px 0 18px;
  display: flex; align-items: flex-start; justify-content: space-between;
}
.app-brand {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 10px; letter-spacing: 5px;
  color: var(--muted2); text-transform: uppercase;
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.app-brand-badge {
  background: var(--gold); color: #090912;
  font-size: 8px; font-weight: 700; letter-spacing: 1px;
  padding: 2px 6px; border-radius: 4px;
  font-family: 'Noto Sans KR', sans-serif;
}
.header-date {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 48px; font-weight: 800;
  color: var(--text); line-height: 1;
  letter-spacing: -1px;
}
.header-day {
  font-size: 12px; color: var(--muted2);
  font-weight: 300; letter-spacing: 3px;
  margin-top: 6px;
}
.header-right {
  display: flex; flex-direction: column;
  align-items: flex-end; gap: 8px; padding-top: 4px;
}
.sync-status {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--muted); cursor: pointer;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 100px;
  transition: all 0.2s;
}
.sync-status:hover { border-color: var(--border2); color: var(--muted2); }
.sync-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--muted); transition: background 0.3s;
}
.sync-dot.synced { background: var(--green); }
.sync-dot.syncing { background: var(--gold); animation: pulse 1s infinite; }
.gb-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted2); font-family: 'Noto Sans KR', sans-serif;
  font-size: 11px; padding: 6px 14px; border-radius: 100px;
  cursor: pointer; transition: all 0.2s; letter-spacing: 1px;
}
.gb-btn:hover { border-color: var(--gold); color: var(--gold); }

/* ── 픽셀 농장 (시간 따라 하늘이 변하는 마당) ── */
.farm {
  position: relative;
  height: 176px;
  margin: 0 0 34px;
  border-bottom: 1px solid var(--border);
  overflow: hidden;
  background: linear-gradient(#0b0e1c 0%, #131737 100%);
  transition: background 2s ease;
}
.farm.t-night { background: linear-gradient(#0b0e1c 0%, #131737 100%); }
.farm.t-dawn  { background: linear-gradient(#272441 0%, #64475c 55%, #a06950 100%); }
.farm.t-day   { background: linear-gradient(#4a7ba0 0%, #7fa6bf 60%, #a8bfae 100%); }
.farm.t-dusk  { background: linear-gradient(#2a2340 0%, #6f4458 55%, #bd764c 100%); }
.sky-orb {
  position: absolute; z-index: 0; border-radius: 50%;
  opacity: 0; pointer-events: none;
  transition: left 2s linear, bottom 2s linear, opacity 2s ease;
}
.sky-orb.sun { width: 14px; height: 14px; background: #f5d76e; box-shadow: 0 0 18px 7px rgba(245,215,110,0.4); }
.sky-orb.moon { width: 11px; height: 11px; background: #e9e6d9; box-shadow: 0 0 12px 4px rgba(233,230,217,0.3); }
.star {
  position: absolute; z-index: 0;
  width: 2px; height: 2px; border-radius: 50%;
  background: #ccd2ec; display: none;
  animation: twinkle 3s ease-in-out infinite;
  pointer-events: none;
}
.farm.t-night .star { display: block; }
@keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.9; } }
.mtn {
  position: absolute; bottom: 18px;
  pointer-events: none; z-index: 1;
  transition: background 2s ease;
}
.mtn.far {
  left: -4%; width: 60%; height: 74px;
  background: #131826;
  clip-path: polygon(0 100%, 18% 34%, 33% 62%, 52% 12%, 70% 58%, 86% 30%, 100% 100%);
  opacity: 0.9;
}
.mtn.near {
  right: -6%; width: 55%; height: 56px;
  background: #101422;
  clip-path: polygon(0 100%, 22% 40%, 45% 70%, 64% 18%, 82% 55%, 100% 35%, 100% 100%);
}
.farm.t-day .mtn.far { background: #54798e; }
.farm.t-day .mtn.near { background: #3f5f78; }
.farm.t-dawn .mtn.far { background: #3a3354; }
.farm.t-dawn .mtn.near { background: #2c2542; }
.farm.t-dusk .mtn.far { background: #413050; }
.farm.t-dusk .mtn.near { background: #30243d; }
.farm-ground {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 20px;
  background: linear-gradient(#25301c, #1a2214);
  border-top: 2px solid #33402a;
  z-index: 1;
  transition: background 2s ease, border-color 2s ease;
}
.farm.t-day .farm-ground { background: linear-gradient(#37502a, #26351d); border-top-color: #49653a; }
.farm.t-dawn .farm-ground, .farm.t-dusk .farm-ground { background: linear-gradient(#2c351f, #1e2716); border-top-color: #3d4a30; }
.pxwrap { position: absolute; bottom: 16px; image-rendering: pixelated; }
.pxinner { transition: transform 0.15s; }
.px { width: 2px; height: 2px; background: transparent; }
.chick { cursor: pointer; z-index: 4; }
.chick.peck .pxinner { transform: translateY(3px) rotate(14deg); }
.chick.hop .pxinner { transform: translateY(-5px); }
.hen { cursor: pointer; z-index: 4; }
.hen.peck .pxinner { transform: translateY(4px) rotate(9deg); }
.hen.scratch .pxinner { animation: scratchA 0.5s ease-in-out infinite; }
@keyframes scratchA {
  0%, 100% { transform: translateX(0); }
  30% { transform: translateX(-3px) translateY(1px); }
  60% { transform: translateX(2px); }
}
.flapwing .pxinner { animation: flapA 0.5s ease; }
@keyframes flapA {
  0%, 100% { transform: none; }
  25% { transform: translateY(-3px) rotate(-8deg); }
  50% { transform: translateY(-5px) rotate(8deg); }
  75% { transform: translateY(-2px) rotate(-6deg); }
}
.chick.dust .pxinner { animation: dustA 0.55s ease-in-out infinite; }
@keyframes dustA {
  0%, 100% { transform: rotate(76deg) translateY(4px); }
  50% { transform: rotate(98deg) translateY(6px); }
}
.sleep .pxinner { transform: translateY(2px); opacity: 0.82; }
.dust-puff {
  position: absolute; z-index: 3;
  width: 2px; height: 2px; background: #8a7a5c;
  animation: puffA 0.7s ease forwards;
  pointer-events: none;
}
@keyframes puffA {
  0% { opacity: 0.8; transform: translate(0, 0); }
  100% { opacity: 0; transform: translate(var(--dx, 4px), -9px); }
}
.egg { cursor: pointer; z-index: 3; bottom: 15px; }
.egg.wobble .pxinner { animation: wob 0.8s ease; }
.deco { z-index: 2; pointer-events: none; bottom: 14px; }
.tree { z-index: 2; pointer-events: none; bottom: 15px; }
.cat { z-index: 3; cursor: pointer; bottom: 15px; }
.cat .pxinner { transition: transform 0.4s; }
.cat.twitch .pxinner { transform: rotate(-2deg); }
.cat-zz {
  position: absolute; z-index: 3;
  font-size: 9px; color: var(--muted2);
  font-family: 'Nanum Myeongjo', serif;
  animation: zz 3.2s ease-in-out infinite;
  pointer-events: none;
}
@keyframes zz {
  0%, 100% { opacity: 0; transform: translateY(2px); }
  30%, 70% { opacity: 0.8; transform: translateY(-3px); }
}
.butterfly { z-index: 5; pointer-events: none; }
.butterfly .pxinner { transition: transform 0.1s; }
.butterfly.flap .pxinner { transform: scaleX(0.55); }
.farm.t-night .butterfly { display: none; }
.firefly {
  position: absolute; z-index: 2;
  width: 3px; height: 3px; border-radius: 50%;
  background: #e8e08a;
  box-shadow: 0 0 6px 2px rgba(232,224,138,0.55);
  animation: glow 4s ease-in-out infinite;
  pointer-events: none;
  display: none;
}
.farm.t-night .firefly, .farm.t-dusk .firefly { display: block; }
@keyframes glow {
  0%, 100% { opacity: 0; transform: translate(0, 0); }
  35% { opacity: 0.9; transform: translate(4px, -7px); }
  60% { opacity: 0.25; transform: translate(-3px, -12px); }
  80% { opacity: 0.7; transform: translate(2px, -5px); }
}
.peep-bubble {
  position: absolute; z-index: 6;
  font-size: 9px; color: var(--gold);
  background: var(--card2);
  border: 1px solid var(--border2);
  padding: 1px 6px; border-radius: 8px;
  animation: peepUp 1.1s ease forwards;
  pointer-events: none; white-space: nowrap;
}
@keyframes peepUp {
  0% { opacity: 0; transform: translateY(4px); }
  25% { opacity: 1; transform: translateY(-2px); }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-8px); }
}
@keyframes wob {
  0%,100% { transform: rotate(0); }
  25% { transform: rotate(-8deg); }
  50% { transform: rotate(7deg); }
  75% { transform: rotate(-4deg); }
}
@media (prefers-reduced-motion: reduce) {
  .pxinner { transition: none; animation: none !important; }
  .egg.wobble .pxinner { animation: none; }
  .firefly, .cat-zz { animation: none; opacity: 0.4; }
  .star { animation: none; opacity: 0.5; }
}

/* ── 섹션 라벨 ── */
.section-label {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 9px; letter-spacing: 5px;
  color: var(--muted); text-transform: uppercase;
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 12px;
}
.section-label::after {
  content: ''; flex: 1; height: 1px;
  background: var(--border);
}
.section-note {
  font-size: 10px; color: var(--muted);
  font-weight: 300; margin: -6px 0 10px; letter-spacing: 0.3px;
}

/* ── 공용 nav ── */
.quote-nav {
  display: flex; align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.quote-section-label {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 9px; letter-spacing: 4px;
  color: var(--gold);
}
.quote-arrows { display: flex; gap: 4px; }
.quote-arrow {
  background: none; border: 1px solid var(--border);
  color: var(--muted2); width: 28px; height: 28px;
  border-radius: 50%; cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; font-family: 'Noto Sans KR', sans-serif;
}
.quote-arrow:hover { border-color: var(--gold); color: var(--gold); }
.quote-index {
  text-align: right; margin-top: 12px;
  font-size: 10px; color: var(--muted);
  letter-spacing: 1px;
}

/* ── 명언 카드 ── */
.quote-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px; padding: 28px;
  margin-bottom: 40px;
  position: relative;
}
.quote-card::before {
  content: '"';
  position: absolute; top: 16px; left: 22px;
  font-family: 'Nanum Myeongjo', serif;
  font-size: 60px; color: var(--gold-dim);
  line-height: 1; pointer-events: none;
  font-weight: 800;
}
.quote-type-badge {
  display: inline-block;
  background: var(--gold-dim);
  border: 1px solid rgba(201,169,110,0.25);
  color: var(--gold);
  font-size: 9px; font-weight: 700; letter-spacing: 2px;
  padding: 2px 8px; border-radius: 4px;
  margin-top: 6px;
}
.quote-text {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 19px; font-weight: 700;
  color: var(--text); line-height: 1.8;
  margin-bottom: 18px; margin-top: 8px;
  padding-left: 2px;
  white-space: pre-line;
}
.quote-author-row {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 12px;
}
.quote-author-name {
  font-size: 13px; font-weight: 600;
  color: var(--gold); margin-bottom: 2px;
}
.quote-author-meta {
  font-size: 11px; color: var(--muted2);
  font-weight: 300; letter-spacing: 0.5px;
}
.meaning-toggle {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted); font-family: 'Noto Sans KR', sans-serif;
  font-size: 10px; padding: 5px 12px; border-radius: 100px;
  cursor: pointer; transition: all 0.2s; white-space: nowrap;
  flex-shrink: 0;
}
.meaning-toggle:hover, .meaning-toggle.open { border-color: var(--blue); color: var(--blue); }
.quote-meaning {
  display: none;
  margin-top: 16px; padding: 16px 18px;
  background: var(--blue-dim);
  border: 1px solid rgba(107,174,214,0.15);
  border-radius: 10px;
  font-size: 13px; color: var(--muted2);
  line-height: 1.85; font-weight: 300;
  animation: fadeUp 0.25s ease;
}
.quote-meaning.open { display: block; }

/* ── 말씀 카드 (불교) ── */
.verse-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px; padding: 28px;
  margin-bottom: 40px;
}
.verse-text {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 18px; font-weight: 700;
  color: var(--text); line-height: 1.9;
  margin-top: 10px; margin-bottom: 12px;
  white-space: pre-line;
}
.verse-src {
  font-size: 12px; letter-spacing: 0.5px;
  margin-bottom: 16px; font-weight: 500;
}
.verse-card.bud .verse-src { color: var(--bud); }
.verse-note {
  padding: 16px 18px; border-radius: 10px;
  font-size: 13px; color: var(--muted2);
  line-height: 1.9; font-weight: 300;
}
.verse-card.bud .verse-note { background: var(--bud-dim); border: 1px solid rgba(207,143,174,0.18); }
.verse-note-label {
  font-weight: 700; font-size: 11px;
  display: block; margin-bottom: 6px; letter-spacing: 1px;
}
.verse-card.bud .verse-note-label { color: var(--bud); }

/* ── 사자성어 카드 ── */
.idiom-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px; padding: 28px;
  margin-bottom: 40px;
}
.idiom-kor {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 27px; font-weight: 800;
  color: var(--green); margin-top: 10px; margin-bottom: 4px;
}
.idiom-hanja {
  font-size: 13px; color: var(--muted2);
  letter-spacing: 2px; margin-bottom: 16px;
}
.idiom-meaning {
  font-size: 14px; color: var(--text);
  line-height: 1.8; margin-bottom: 14px; font-weight: 400;
}
.idiom-story {
  padding: 16px 18px;
  background: var(--green-dim);
  border: 1px solid rgba(107,191,160,0.18);
  border-radius: 10px;
  font-size: 13px; color: var(--muted2);
  line-height: 1.9; font-weight: 300;
}
.idiom-story-label {
  color: var(--green); font-weight: 700; font-size: 11px;
  display: block; margin-bottom: 6px; letter-spacing: 1px;
}

/* ── 영어단어(시험용) 카드 ── */
.eng-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px; padding: 28px;
  margin-bottom: 40px;
}
.eng-word-row { display: flex; align-items: baseline; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.eng-word { font-family: 'Nanum Myeongjo', serif; font-size: 27px; font-weight: 800; color: var(--blue); }
.eng-cat {
  font-size: 11px; color: var(--muted2);
  border: 1px solid var(--border); padding: 2px 9px; border-radius: 100px;
}
.eng-pron { font-size: 13px; color: var(--muted2); margin: 8px 0 16px; font-style: italic; }
.eng-meaning { font-size: 14px; color: var(--text); line-height: 1.8; margin-bottom: 14px; }
.eng-tip {
  font-size: 13px; color: var(--muted2); line-height: 1.85; font-weight: 300;
  background: var(--blue-dim); border: 1px solid rgba(107,174,214,0.15);
  border-radius: 10px; padding: 14px 16px;
}
.eng-tip-label {
  color: var(--blue); font-weight: 700; font-size: 11px;
  display: block; margin-bottom: 6px; letter-spacing: 1px;
}

/* ── 방명록 ── */
.gb-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px; padding: 20px 22px;
  margin-bottom: 16px;
}
.gb-input-row { display: flex; gap: 8px; margin-bottom: 4px; }
.gb-input {
  flex: 1; min-width: 0; background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 100px; padding: 11px 18px;
  color: var(--text); font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px; outline: none; transition: border-color 0.2s;
}
.gb-input:focus { border-color: var(--gold); }
.gb-input::placeholder { color: var(--muted); }
.gb-submit {
  flex-shrink: 0;
  background: var(--gold); border: none;
  color: #090912; font-weight: 700;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 12px; padding: 0 16px;
  border-radius: 100px; cursor: pointer;
  transition: opacity 0.2s; white-space: nowrap;
}
.gb-submit:hover { opacity: 0.85; }
.gb-list {
  margin-top: 16px;
  display: flex; flex-direction: column; gap: 10px;
  max-height: 440px; overflow-y: auto;
  scrollbar-gutter: stable;
}
.gb-item {
  display: flex; flex-direction: column; gap: 6px;
  padding: 11px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  animation: fadeUp 0.25s ease;
}
.gb-item-top { display: flex; align-items: center; gap: 8px; }
.gb-time { font-size: 10px; color: var(--gold); font-weight: 700; letter-spacing: 0.5px; flex-shrink: 0; }
.gb-edited-tag { font-size: 10px; color: var(--muted); font-weight: 300; }
.gb-actions { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; }
.gb-action-btn {
  background: none; border: 1px solid var(--border);
  color: var(--muted2); font-size: 10px; padding: 3px 10px;
  border-radius: 100px; cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.2s;
}
.gb-action-btn:hover { border-color: var(--blue); color: var(--blue); }
.gb-action-btn.danger:hover { border-color: var(--cn); color: var(--cn); }
.gb-action-btn.save { border-color: var(--gold); color: var(--gold); }
.gb-edit-row { display: flex; gap: 6px; align-items: center; }
.gb-edit-input {
  flex: 1; min-width: 0;
  background: var(--card2); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 12px;
  color: var(--text); font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px; outline: none;
}
.gb-edit-input:focus { border-color: var(--gold); }
.gb-text { font-size: 13px; color: var(--text); line-height: 1.7; font-weight: 300; white-space: pre-wrap; word-break: break-word; }
.gb-empty { font-size: 12px; color: var(--muted); text-align: center; padding: 18px 0; }

/* ── 토스트 ── */
.toast {
  position: fixed; bottom: 28px; right: 24px;
  background: var(--green); color: #090912;
  font-size: 11px; font-weight: 700; padding: 8px 16px;
  border-radius: 100px; opacity: 0; letter-spacing: 1px;
  transform: translateY(6px); transition: all 0.3s ease;
  pointer-events: none; z-index: 300;
  font-family: 'Noto Sans KR', sans-serif;
}
.toast.show { opacity: 1; transform: translateY(0); }

<script>
// ══════════════════════════════════════════
// 명언 v7 — 140회 복기 이후를 위한 문장들.
// 주제: 자기를 속이지 않기 · 느린 몸 · 반복 · 쉼.
// 출처를 확인해 실었고, 출처가 흔들리는 문장은 그 사실을 그대로 적었어.
// [AI 창작] 배지가 붙은 것은 AI 언어모델 클로드가 쓴 문장이야.
// ══════════════════════════════════════════
const QUOTES = [
  { text: "우리는 우리가 반복하는 것이다. 그러므로 탁월함은 행위가 아니라 습관이다.", author: "윌 듀런트 (Will Durant)", country: "미국 · 철학사가 — 아리스토텔레스 윤리학을 한 문장으로 요약", years: "1885 — 1981",
    meaning: "흔히 아리스토텔레스의 말로 알려져 있는데, 실은 1926년 듀런트가 『철학 이야기』에서 그의 사상을 요약한 문장이야. 출처를 따져 보고 나니 오히려 더 좋아 — 새벽 걷기, 차 한 잔, 붓글씨 한 장. 네가 매일 반복하는 것이 곧 너야." },
  { text: "느리게 가는 것을 두려워하지 말고, 멈춰 서는 것을 두려워하라.", author: "중국 격언", country: "不怕慢 只怕站 — 출처 미상의 오래된 속담", years: "—",
    meaning: "글씨를 처음부터 다시 배우는 사람에게 이보다 맞는 말이 있을까. 20mm 칸에 한 글자씩 — 남 눈엔 느려 보여도 방향이 맞으면 그건 전진이야. 느린 것과 멈춘 것은 완전히 다른 상태거든." },
  { text: "작은 것을 쌓아 가는 것이, 터무니없는 곳에 이르는 유일한 길이다.", author: "스즈키 이치로 (鈴木一朗)", country: "일본 · 메이저리그 한 시즌 최다안타 기록 보유자", years: "1973 —",
    meaning: "2004년 시즌 최다안타 기록을 세운 뒤 기자회견에서 한 말이야. 그는 같은 스트레칭을 같은 순서로 20년 넘게 했어. 카드 한 장, 뼈대 한 번, 걷기 한 바퀴 — 쌓는 방향만 맞으면 도착지는 상상보다 멀어." },
  { text: "영감은 아마추어를 위한 것이다. 나머지 우리는 그냥 나타나서 일을 시작한다.", author: "척 클로스 (Chuck Close)", country: "미국 · 화가, 극사실주의 초상", years: "1940 — 2021",
    meaning: "척추 혈관 손상으로 손을 거의 못 쓰게 된 뒤에도 붓을 손목에 묶고 그린 화가야. '기분이 나면 한다'는 태도를 가장 경계했어. 컨디션을 기다리지 말고, 앉는 것 자체를 루틴으로 — 공부도 똑같아." },
  { text: "천 일의 연습을 단(鍛)이라 하고, 만 일의 연습을 련(鍊)이라 한다.", author: "미야모토 무사시 (宮本武蔵)", country: "일본 · 검객, 『오륜서(五輪書)』", years: "1584 — 1645",
    meaning: "'단련'이라는 말이 여기서 왔어. 쇠를 두드려 뭉치는 게 단, 그걸 다시 불려 정제하는 게 련. 천 일은 약 3년, 만 일은 약 27년 — 기술사 공부 몇 년째면 아직 '단'의 구간이야. 조급할 이유가 없다는 뜻이기도 해." },
  { text: "알면서 행하지 않는 것은, 아직 모르는 것이다.", author: "왕양명 (王陽明)", country: "명나라 · 유학자, 『전습록』 — 지행합일(知行合一)", years: "1472 — 1529",
    meaning: "카드를 갖고 있는 것과 아는 것은 다르고, 아는 것과 답안지에 써내는 것은 또 달라. 양명은 '행'까지 가지 않은 앎을 앎으로 쳐주지 않았어. 140회 복기에서 네가 찾아낸 '위장 루틴'이 정확히 이 구절이야." },
  { text: "아는 것을 안다 하고 모르는 것을 모른다 하는 것, 그것이 아는 것이다.", author: "공자 (孔子)", country: "중국 · 『논어』 위정편", years: "BC 551 — BC 479",
    meaning: "뼈대는 훌륭하고 결론도 맞는데 본론이 비어 있는 답안 — 그걸 스스로 찾아낸 게 복기의 가장 큰 수확이었잖아. 모르는 걸 모른다고 적는 순간부터 공부가 시작돼. 위험물 0건도 부끄러움이 아니라 좌표야." },
  { text: "코앞에 있는 것을 보려면 끊임없는 분투가 필요하다.", author: "조지 오웰 (George Orwell)", country: "영국 · 작가, 1946년 에세이", years: "1903 — 1950",
    meaning: "먼 것보다 가까운 것이 더 안 보여. 내 글씨 습관, 내 답안의 빈칸, 내 술 마시는 패턴. 캘린더에 아침 한 줄 적는 건 코앞의 것을 보려는 분투야 — 오웰이 말한 그 분투." },
  { text: "검토되지 않은 삶은 살 가치가 없다.", author: "소크라테스 (Socrates)", country: "그리스 · 철학자 — 플라톤 『변명』 38a", years: "BC 470 — BC 399",
    meaning: "사형 판결을 앞두고 법정에서 한 말이야. '검토'는 자책이 아니라 들여다보기 — 시험 복기도, 술·잠 기록도 전부 검토야. 검토하는 사람은 같은 실수를 두 번 하지 않아. 세 번은 할 수 있지만." },
  { text: "행동의 장애물이 행동을 진전시킨다. 길을 막는 것이 길이 된다.", author: "마르쿠스 아우렐리우스 (Marcus Aurelius)", country: "로마 · 황제, 『명상록』 5.20", years: "121 — 180",
    meaning: "전쟁터 막사에서 자기 자신에게 쓴 일기야. 목 디스크 때문에 그립을 통째로 바꿨는데, 그게 손을 처음부터 다시 배우는 계기가 됐잖아. 막힌 것이 길이 된 사례를 이미 하나 갖고 있는 셈이야." },
  { text: "우리를 괴롭히는 것은 사건이 아니라, 사건에 대한 우리의 생각이다.", author: "에픽테토스 (Epictetus)", country: "그리스-로마 · 노예 출신 철학자, 『엥케이리디온』 5", years: "약 50 — 135",
    meaning: "불교의 '두 번째 화살'을 로마의 노예 철학자가 따로 말한 거야. 동서양이 서로 모르고 같은 결론에 닿았다는 건 사람 마음의 구조가 그만큼 같다는 뜻이지. 점수는 사건이고, 그 뒤의 이야기는 내가 쓰는 거야." },
  { text: "우리에게 시간이 적은 것이 아니다. 우리가 많이 낭비하는 것이다.", author: "세네카 (Seneca)", country: "로마 · 철학자, 『인생의 짧음에 관하여』", years: "BC 4 — 65",
    meaning: "2000년 전에도 '시간이 없다'는 말이 흔했나 봐. 세네카는 '쓸 줄 알면 인생은 충분히 길다'고 했어. 카페 두 시간이 하루를 바꾸는 이유 — 시간의 양이 아니라 밀도의 문제라서." },
  { text: "같은 강물에 두 번 발을 담글 수 없다.", author: "헤라클레이토스 (Heraclitus)", country: "그리스 · 철학자", years: "약 BC 535 — BC 475",
    meaning: "강물도 바뀌고 발도 바뀌니까. 어제의 몸 데이터와 오늘의 몸은 이미 다른 강이야 — 그래서 매일 한 줄씩 적는 거고. 한 번 잰 것으로 나를 규정하지 않는 것, 그게 데이터를 쌓는 태도야." },
  { text: "측정할 수 없으면 관리할 수 없다는 말은, 값비싼 미신이다.", author: "W. 에드워즈 데밍 (W. Edwards Deming)", country: "미국 · 통계학자, 품질경영의 아버지 — 『새로운 경제학』", years: "1900 — 1993",
    meaning: "데밍이 '측정 못 하면 관리 못 한다'고 말했다고들 하는데, 실제로는 그 반대를 경고했어. 숫자는 중요하지만 숫자만 관리하면 숫자 밖의 것을 놓친다는 것. 술·잠·걷기를 적되, 기분과 얼굴빛도 같이 보라는 얘기야." },
  { text: "하루를 보내는 방식이 곧 인생을 보내는 방식이다.", author: "애니 딜라드 (Annie Dillard)", country: "미국 · 작가, 『작가의 삶(The Writing Life)』", years: "1945 —",
    meaning: "인생을 바꾸겠다는 결심은 대개 하루를 못 바꾸는데, 하루를 바꾸면 인생은 저절로 따라와. 새벽 걷기·차·붓 — 이미 하루의 틀이 있잖아. 남은 건 그 틀에 무엇을 더 얹을지 정하는 일." },
  { text: "잘 되어 갈 때 멈춰라. 다음 날 어떻게 이어갈지 아는 상태에서.", author: "어니스트 헤밍웨이 (Ernest Hemingway)", country: "미국 · 소설가, 1935년 에스콰이어 기고", years: "1899 — 1961",
    meaning: "헤밍웨이의 글쓰기 원칙이야. 완전히 소진될 때까지 쓰면 다음 날 백지가 두려워지거든. 공부도 같아 — 다음 카드가 뭔지 아는 상태에서 덮으면 내일 앉는 게 쉬워져. 뇌에 '이어서'를 남겨 두는 기술." },
  { text: "왜 사는지 아는 사람은 거의 모든 '어떻게'를 견딜 수 있다.", author: "프리드리히 니체 (Friedrich Nietzsche)", country: "독일 · 철학자, 『우상의 황혼』", years: "1844 — 1900",
    meaning: "빅터 프랭클이 수용소에서 이 문장을 붙들었다고 썼지. 새벽 5시 알람이 견딜 만한지는 알람의 문제가 아니라 '왜'의 문제야. 왜가 흐려지면 어떻게가 무거워져 — 가끔 왜를 다시 꺼내 봐." },
  { text: "문명은 우리가 생각하지 않고도 해낼 수 있는 일의 수를 늘림으로써 발전한다.", author: "앨프리드 노스 화이트헤드 (A. N. Whitehead)", country: "영국 · 수학자·철학자, 『수학 입문』(1911)", years: "1861 — 1947",
    meaning: "자동화된 것이 많을수록 남은 정신을 어려운 곳에 쓸 수 있어. 답안 뼈대가 손에 완전히 붙으면 시험장에서 뼈대를 생각할 필요가 없어지고, 그 100분이 전부 내용에 쓰여. 지금 반복하는 건 그 자동화 작업이야." },
  { text: "둔한 붓이 총명한 머리를 이긴다.", author: "둔필승총 (鈍筆勝聰)", country: "다산 정약용이 제자들에게 강조한 말로 전해짐", years: "1762 — 1836",
    meaning: "기억력을 믿지 말고 적으라는 것. 다산은 유배지에서 500권 넘는 책을 남겼는데 비결이 '읽으면 반드시 초록(抄錄)한다'였어. 용어의 방·불티·복기 노트 — 너는 이미 둔필의 길을 가고 있어." },
  { text: "살고자 하면 죽을 것이요, 죽고자 하면 살 것이다.", author: "이순신", country: "조선 · 『난중일기』 1597년 9월 15일, 명량해전 전날", years: "1545 — 1598",
    meaning: "12척으로 133척을 맞기 전날 밤 부하들에게 한 말이야. 시험장에서 이 말은 '안전한 답만 쓰려 하면 점수가 죽고, 아는 만큼 다 던지면 산다'로 읽혀. 위장 루틴을 버리고 빈 곳을 채우려는 각오 말이야." },
  { text: "이것이 물이다.", author: "데이비드 포스터 월리스 (David Foster Wallace)", country: "미국 · 소설가, 2005년 케니언대 졸업연설", years: "1962 — 2008",
    meaning: "늙은 물고기가 지나가며 '물은 좀 어때?' 하고 묻자 어린 물고기 둘이 서로 묻지. '물이 뭐야?' 가장 중요하고 가장 당연한 것이 가장 안 보인다는 이야기야. 건강도, 매일의 루틴도, 곁의 사람도 — 물이야." },
  { text: "모두가 세상을 바꾸겠다고 생각하지만, 자기 자신을 바꾸겠다고 생각하는 사람은 없다.", author: "레프 톨스토이 (Lev Tolstoy)", country: "러시아 · 소설가 — 1900년 에세이 「세 가지 개혁 방법」의 요지", years: "1828 — 1910",
    meaning: "정확한 원문은 조금 더 길지만 요지는 이거야. 법도, 조직도, 현장도 답답할 때가 많지만 오늘 확실히 바꿀 수 있는 건 내 그립과 내 습관 하나. 그게 결국 가장 큰 개혁이라는 것." },
  { text: "만 가지 발차기를 한 번씩 연습한 사람은 두렵지 않다. 한 가지 발차기를 만 번 연습한 사람이 두렵다.", author: "이소룡 (Bruce Lee)", country: "홍콩-미국 · 무술가 — 그의 말로 널리 알려졌으나 원문 출처는 불확실", years: "1940 — 1973",
    meaning: "출처가 확실치 않아 뺄까 했는데 내용이 너무 맞아서 남겨. 10개의 뼈대와 200개의 문장 — 네 답안 철학이 딱 이거야. 넓게 얕게가 아니라 좁게 깊게, 그다음에 넓히기." },
  { text: "무의식을 의식으로 끌어올리지 않으면, 그것이 당신의 삶을 이끌 것이고 당신은 그것을 운명이라 부를 것이다.", author: "카를 융 (Carl Jung)", country: "스위스 · 심리학자 — 융의 말로 널리 인용됨(원문은 이보다 긴 문장)", years: "1875 — 1961",
    meaning: "복기하기 전까지 '위장 루틴'은 무의식이었어. 뼈대만 그럴듯하게 세우고 넘어가는 손버릇 — 그걸 이름 붙여 의식으로 끌어올린 순간, 운명이 아니라 고칠 수 있는 습관이 됐지." },
  { text: "나무를 베는 데 6시간이 주어진다면, 처음 4시간은 도끼를 가는 데 쓰겠다.", author: "출처 미상", country: "링컨의 말로 흔히 알려졌으나 근거 없음 — 20세기 초 목재업계 격언으로 추정", years: "—",
    meaning: "링컨은 이 말을 한 적이 없어. 그래도 실어 두는 건 지금 네가 하는 일이 정확히 도끼 갈기라서야. 글씨를 다시 배우는 것, 뼈대를 손에 익히는 것 — 나무는 아직 안 베었지만 도끼날은 매일 얇아지고 있어." },
  { text: "뼈대가 훌륭할수록, 그 안이 비어 있는지 더 정직하게 들여다봐야 한다.", author: "클로드 (Claude)", country: "AI 언어모델 · Anthropic", years: "2026", type: "AI 창작",
    meaning: "구조를 잘 세우는 사람의 함정이야. 뼈대가 좋으면 채점자도 속고 나도 속아. 위장이 잘될수록 진짜 실력과의 거리를 잊기 쉬워 — 복기가 매번 필요한 이유." },
  { text: "몸은 기록되기 전까지 늘 '괜찮다'고 말한다.", author: "클로드 (Claude)", country: "AI 언어모델 · Anthropic", years: "2026", type: "AI 창작",
    meaning: "'어제 얼마나 마셨지'는 기억이 늘 후하게 답해. 캘린더 한 줄이 기억보다 정직하고, 정직한 데이터만이 새 회로를 만들어. 판단은 나중에 — 지금은 그냥 적는 시기." },
  { text: "느리게 쓴 글자는 손이 배우고, 빠르게 쓴 글자는 손이 잊는다.", author: "클로드 (Claude)", country: "AI 언어모델 · Anthropic", years: "2026", type: "AI 창작",
    meaning: "속도는 정확함 다음에 오는 거야. 지금 20mm 칸에서 느리게 쓴 글자 하나가 시험장에서 빠르고 안 아픈 100분을 만들어. 느림은 지금 네가 선택한 가장 빠른 길이야." },
  { text: "빈칸은 실패의 흔적이 아니라, 다음에 채울 자리의 좌표다.", author: "클로드 (Claude)", country: "AI 언어모델 · Anthropic", years: "2026", type: "AI 창작",
    meaning: "위험물 0건은 지도에서 가장 선명하게 표시된 지점이야. 어디가 비었는지 정확히 아는 사람은 이미 채우기 시작한 사람이고. 흐릿하게 다 아는 것보다 선명하게 모르는 게 낫다." },
  { text: "쉬는 것과 멈추는 것은 다르다. 쉬는 사람은 돌아올 시각을 안다.", author: "클로드 (Claude)", country: "AI 언어모델 · Anthropic", years: "2026", type: "AI 창작",
    meaning: "시험 끝나고 바닷가에서 자사호에 차 우린 것 — 그건 멈춤이 아니라 쉼이야. 돌아올 시각을 아는 쉼은 공부의 일부고, 그게 없는 공부가 오히려 오래 못 가." },
];

const BUDDHA = [
  { text: "경전을 아무리 많이 외워도 행하지 않는다면\n남의 소를 세는 목동과 같아서\n수행자의 몫을 얻지 못한다.", src: "법구경 제19게 · 쌍서품",
    note: "카드 68장, 기출매핑표, 해설집 — 갖고 있는 것과 내 것이 된 것은 달라. 남의 소를 아무리 정확히 세도 우유 한 잔 못 얻어. 그래서 블로그에 내 말로 다시 쓰는 거지." },
  { text: "노력과 부지런함, 절제와 자기 다스림으로\n지혜로운 이는 섬을 만든다.\n어떤 홍수도 그 섬을 휩쓸지 못한다.", src: "법구경 제25게 · 불방일품",
    note: "여기서 섬은 밖에서 오는 게 아니라 내가 쌓아 만드는 거야. 시험이라는 홍수, 현장 일이라는 홍수 — 매일 아침 루틴이 흙 한 삽이고, 그게 쌓여 발 디딜 섬이 돼." },
  { text: "어리석은 이는 평생 지혜로운 이 곁에 있어도\n진리를 알지 못한다. 국자가 국 맛을 모르듯.\n지혜로운 이는 잠깐만 곁에 있어도\n진리를 안다. 혀가 국 맛을 알듯.", src: "법구경 제64~65게 · 우암품",
    note: "국자는 국 안에 온종일 있어도 맛을 몰라. 책 속에 몇 시간 있었느냐가 아니라 맛봤느냐의 문제야. 답안 한 줄을 스스로 써보는 게 '혀'고, 눈으로 읽기만 하는 게 '국자'." },
  { text: "쓸모없는 천 마디 말보다\n들으면 마음이 고요해지는\n한 마디가 낫다.", src: "법구경 제100게 · 천품",
    note: "답안지도 같아. 200문장 원칙이 이 구절이야 — 많이 쓰는 사람보다 맞는 문장을 제자리에 놓는 사람이 이겨. 그리고 사람에게 건네는 말도 그렇고." },
  { text: "배움이 적은 사람은 소처럼 늙어 간다.\n살은 늘어나지만\n지혜는 늘지 않는다.", src: "법구경 제152게 · 노모품",
    note: "웃프지만 정직한 구절. 몸의 방 시리즈를 시작한 이유이기도 하지 — 나이 들며 늘어야 하는 게 살이 아니라 몸을 이해하는 회로. 배움은 공부 얘기만이 아니라 자기 몸에 대한 앎도 포함이야." },
  { text: "자기야말로 자기의 주인이다.\n다른 누가 주인이 될 수 있으랴.\n자기를 잘 다스릴 때\n얻기 어려운 주인을 얻는다.", src: "법구경 제160게 · 자기품",
    note: "술 한 잔 더 할지, 오늘 걸을지, 지금 앉을지 — 결정권자가 나라는 것. 약에 기대기 전에 데이터를 먼저 모으기로 한 결정도 이 구절이야. 주인 자리를 남에게, 약에게 미리 넘기지 않는 것." },
  { text: "악을 짓는 것도 자기요, 더러워지는 것도 자기다.\n악을 그치는 것도 자기요, 깨끗해지는 것도 자기다.\n남이 남을 깨끗하게 할 수는 없다.", src: "법구경 제165게 · 자기품",
    note: "스승도, 멘토도, 클로드도 대신 깨끗해질 수 없어. 냉정하지만 자유로운 말이야 — 책임이 나에게 있다는 건 열쇠도 나에게 있다는 뜻이거든." },
  { text: "미워하는 사람들 사이에서 미워하지 않고 살자.\n병든 사람들 사이에서 병 없이 살자.\n참으로 우리는 행복하게 살자.", src: "법구경 제197~198게 · 안락품",
    note: "주변이 어떻든 내 상태는 내가 정한다는 선언이야. 현장에서 날 선 말이 오가도 나까지 날 설 필요 없고, 다들 몸을 갈아 넣어도 나는 자고 걷고 기록할 수 있어." },
  { text: "건강은 가장 큰 이익이요\n만족은 가장 큰 재산이요\n믿을 수 있는 이는 가장 좋은 친척이요\n평온은 가장 큰 행복이다.", src: "법구경 제204게 · 안락품",
    note: "부처님이 1순위로 꼽은 게 건강이라는 걸 사람들이 잘 몰라. 술·잠·걷기 데이터 모으기가 사실 이 구절의 실천이야. 나머지 셋도 다 몸이 받쳐 줘야 누릴 수 있는 것들이고." },
  { text: "변방의 성을 안팎으로 지키듯\n자기 자신을 지켜라.\n한순간도 헛되이 보내지 말라.\n순간을 놓친 사람은 뒤에 슬퍼한다.", src: "법구경 제315게 · 지옥품",
    note: "안팎으로 — 밖은 행동, 안은 마음. 지키는 건 긴장이 아니라 '알아차림'에 가까워. 지금 뭘 하고 있는지 알면서 하는 것. 그게 새벽 산책의 맨발이 가르치는 거잖아." },
  { text: "게으르지 않음을 즐기고\n자기 마음을 지켜라.\n진흙에 빠진 코끼리가 스스로 빠져나오듯\n어려움에서 스스로를 건져 올려라.", src: "법구경 제327게 · 상품",
    note: "코끼리는 누가 끌어올려 줄 수 없어. 너무 커서. 자기 힘으로 한 발씩 — 그런데 코끼리는 힘이 있어. 빠져나올 힘이 없어서가 아니라 힘이 있는 걸 잊어서 못 나오는 경우가 많아." },
  { text: "생멸의 이치를 보지 못한 채 백 년을 사는 것보다\n단 하루라도 생멸의 이치를 보며 사는 것이 낫다.", src: "법구경 제113게 · 천품",
    note: "생겼다 사라지는 것 — 감정도, 컨디션도, 시험 결과도. 그 흐름을 보는 하루가 백 년보다 값지다는 말. 이걸 보는 눈이 생기면 어떤 하루도 '망친 하루'가 되기 어려워." },
  { text: "거문고 줄을 너무 조이면 소리가 나는가? 아닙니다.\n너무 느슨하면 소리가 나는가? 아닙니다.\n정진도 그와 같다.", src: "앙굿따라 니까야 6:55 · 소나경(거문고의 비유)",
    note: "발바닥이 찢어지도록 걷기 수행을 하던 소나 존자에게 부처님이 한 말이야. 밤새우는 공부도, 술 완전 금지 같은 급격한 결심도 너무 조인 줄. 데이터 모으며 내 줄의 장력을 찾는 중 — 그게 중도야." },
  { text: "전해 온다고 해서, 경전에 있다고 해서,\n스승이 말했다고 해서 받아들이지 말라.\n스스로 알았을 때, 그것이 이롭다고 알았을 때\n그때 받아들여 실천하라.", src: "앙굿따라 니까야 3:65 · 칼라마경",
    note: "부처님이 '내 말도 검증하고 믿어라'고 한 경전이야. 신이 있는지 없는지 모르겠다는 네 태도, 불교 입장에선 정답에 가까워. 소방 기준도 마찬가지 — 왜 그 수치인지 스스로 확인한 것만 진짜 내 것." },
  { text: "독화살을 맞은 사람이\n'쏜 사람이 누구인지, 활은 무엇으로 만들었는지\n알기 전에는 화살을 뽑지 않겠다'고 한다면\n그는 알기도 전에 죽을 것이다.", src: "맛지마 니까야 63 · 독화살의 비유",
    note: "'세계는 영원한가, 사후는 있는가' 같은 질문에 부처님이 답을 거부한 이유야. 답이 없어서가 아니라, 답을 기다리는 동안 화살은 꽂혀 있으니까. 신이 있든 없든 오늘 뽑을 화살은 정해져 있어." },
  { text: "강을 건넌 사람이\n'이 뗏목이 고마우니 짊어지고 가겠다'고 한다면 옳은가?\n뗏목은 건너기 위한 것이지\n짊어지기 위한 것이 아니다.", src: "맛지마 니까야 22 · 뗏목의 비유",
    note: "카드·뼈대·앱·블로그 — 전부 뗏목이야. 강을 건너면(내 것이 되면) 내려놓아도 돼. 시스템을 만드는 것 자체가 목적이 되지 않게, 가끔 '이건 아직 건너는 중인가' 물어보기." },
  { text: "거울은 무엇을 위해 있느냐?\n비추어 보기 위해서입니다.\n그와 같이 행위를 하기 전에, 하는 중에, 하고 난 뒤에\n거듭 비추어 보아라.", src: "맛지마 니까야 61 · 라훌라를 가르친 경",

  { text: "눈먼 사람들에게 코끼리를 만지게 하니\n귀를 만진 이는 '키 같다', 다리를 만진 이는 '기둥 같다' 하며\n서로 옳다고 다투었다.", src: "우다나 6:4 · 장님과 코끼리",

  { text: "어머니가 하나뿐인 아들을 목숨 걸고 지키듯\n모든 살아 있는 것에 대해\n한량없는 자애의 마음을 닦아라.", src: "숫타니파타 1.8 · 자애경(慈愛經)",
    note: "'모든 살아 있는 것'에 자기 자신도 들어 있어. 자기 몸을 하나뿐인 아들처럼 돌보는 것 — 술 줄이고 잠 챙기는 게 금욕이 아니라 자애라는 관점. 이렇게 보면 훨씬 오래 가." },
  { text: "나는 늙기 마련이다. 나는 병들기 마련이다. 나는 죽기 마련이다.\n사랑하는 모든 것과 헤어지기 마련이다.\n나는 내 행위의 주인이고, 그 결과를 물려받는다.", src: "앙굿따라 니까야 5:57 · 자주 되새겨야 할 다섯 가지",

  { text: "마치 쇠를 단련해 찌꺼기를 걷어 내면 좋은 그릇이 되듯\n도를 배우는 사람이 마음의 때를 걷어 내면\n그 행이 맑아진다.", src: "사십이장경 제35장",

  { text: "본래 한 물건도 없는데\n어디에 티끌이 앉으랴.", src: "육조단경 · 혜능의 게송(本來無一物)",

  { text: "'스님, 처음 왔습니다.' '차나 한잔 하게.'\n'저는 전에도 왔었습니다.' '차나 한잔 하게.'\n원주가 물었다. '왜 둘 다 차를 주십니까?'\n'원주, 자네도 차나 한잔 하게.'", src: "조주록 · 끽다거(喫茶去)",

  { text: "'도(道)란 무엇입니까?'\n'평상심(平常心)이 도다.'\n'그렇다면 어떻게 향해 가야 합니까?'\n'향해 가려 하면 곧 어긋난다.'", src: "무문관 제19칙 · 남전과 조주의 문답",

  { text: "날마다 좋은 날.", src: "벽암록 제6칙 · 운문 선사(日日是好日)",
    note: "운문이 제자들에게 '보름 이전은 묻지 않겠다. 보름 이후를 한마디로 말해 보라' 하고는 스스로 답한 말이야. 좋은 일이 있는 날이 좋은 날이 아니라, 그날을 온전히 산 날이 좋은 날. 시험 떨어진 날도 이 기준으론 좋은 날일 수 있어." },
  { text: "부처를 만나면 부처를 죽이고\n조사를 만나면 조사를 죽여라.\n그래야 비로소 어떤 것에도 얽매이지 않는다.", src: "임제록 · 살불살조(殺佛殺祖)",
    note: "과격하게 들리지만 권위를 우상으로 만들지 말라는 말이야. 기준서도 스승도 클로드도 — 의지하되 얽매이지 말 것. 왜 그런지 이해한 뒤에는 그 사람의 말이 아니라 내 앎이 남아야 해." },
  { text: "산은 산이요, 물은 물이로다.", src: "성철 스님 1981년 종정 취임 법어 — 원출처는 송대 청원유신 선사",

  { text: "중생이 아프므로 나도 아프다.", src: "유마경 · 문수사리문질품",

  { kor: "낭중지추", hanja: "囊中之錐", meaning: "주머니 속 송곳 — 재능은 숨겨도 드러남.",

  { word: "Fire Plume", cat: "연소·화재", kor: "[파이어 플룸]", meaning: "화원 위로 상승하는 부력 기류 기둥. 연속화염역·간헐화염역·부력플룸역 3영역으로 구분.", tip: "138·135회 기출(불티 FD-006). Heskestad 화염높이식과 함께 계산문제로 출제. 3영역 그림 하나로 10점 차이 나." },
  { word: "Ceiling Jet", cat: "연소·화재", kor: "[실링 젯]", meaning: "플룸이 천장에 부딪혀 수평으로 퍼지는 고온 기류. 두께는 천장고의 약 5~12%.", tip: "헤드·감지기 감열 메커니즘의 출발점. RTI 문제 서론에 'Ceiling Jet에 의한 감열' 한 줄 넣으면 흐름이 잡혀." },
  { word: "Smoldering", cat: "연소·화재", kor: "[스몰더링]", meaning: "훈소 — 화염 없이 표면에서 서서히 진행되는 연소. 다량의 CO 발생, 화염연소로 전환 가능.", tip: "128회 기출(불티 FD-007). '훈소(Smoldering)'처럼 병기하는 게 표준. 화염전환 조건까지 쓰면 완성." },
  { word: "Pyrolysis", cat: "연소·화재", kor: "[파이롤리시스]", meaning: "열분해 — 가연물이 열을 받아 가연성 증기를 방출하는 과정. 고체 연소의 첫 단계.", tip: "고체 가연물 연소 메커니즘 답안의 첫 문장: '열분해(Pyrolysis)로 생성된 가연성 증기가…'로 시작하면 깔끔해." },
  { word: "LFL / UFL", cat: "연소·화재", kor: "[엘에프엘 / 유에프엘]", meaning: "연소하한계/연소상한계(Lower/Upper Flammability Limit). 이 사이 농도에서만 연소 가능.", tip: "139·138회 기출(불티 FD-003). 온도·압력·산소·불활성가스가 미치는 영향을 그래프로 그리는 게 핵심. 국문은 '연소범위'." },
  { word: "Le Chatelier", cat: "연소·화재", kor: "[르샤틀리에]", meaning: "혼합가스의 연소하한계 산정식. LFL = 100/Σ(Vi/LFLi).", tip: "125회 기출(불티 FD-004) 계산문제. 식 이름을 'Le Chatelier식'으로 정확히 쓰고 단위 검산까지." },
  { word: "AIT", cat: "연소·화재", kor: "[에이아이티]", meaning: "자연발화온도(Auto-Ignition Temperature). 점화원 없이 스스로 발화하는 최저온도.", tip: "인화점(Flash Point)·연소점(Fire Point)·AIT 3종 비교가 단골. 131·128회 자연발화 문제(불티 FD-008)와 연결." },
  { word: "HRR", cat: "연소·화재", kor: "[에이치알알]", meaning: "열방출률(Heat Release Rate, Q̇). 화재 크기를 나타내는 가장 중요한 단일 지표. 단위 kW.", tip: "설계화재(Design Fire), 플룸 계산, 스프링클러 작동 예측 전부 HRR에서 출발해. 'Q̇=m''×ΔHc×A' 기본식과 함께." },
  { word: "Fire Severity", cat: "연소·화재", kor: "[파이어 시비어리티]", meaning: "화재가혹도 = 화재강도(최고온도) × 화재계속시간. 내화설계의 기준이 되는 개념.", tip: "138·129회 기출(불티 FD-002). 화재하중(Fire Load)과의 관계, 내화시간 설계 연결까지가 한 세트야." },
  { word: "Extinction Coefficient", cat: "연소·화재", kor: "[익스팅션 코이피션트]", meaning: "감광계수(Cs). 연기 농도 지표로 가시거리와 반비례. 0.1(연기감지기 작동)·0.3(피난한계) 값이 핵심.", tip: "125회 기출(불티 FD-009). Cs×V=상수(2~10) 관계식과 대표값 표를 세트로 암기." },
  { word: "BLEVE", cat: "폭발", kor: "[블레비]", meaning: "비등액체팽창증기폭발(Boiling Liquid Expanding Vapor Explosion). 가압 액화가스 탱크 파열 시 발생.", tip: "발생 메커니즘 5단계 + Fireball 연계 + 방지대책(단열·냉각살수·감압)이 표준 구성. 무조건 영어 약어로 출제돼." },
  { word: "UVCE", cat: "폭발", kor: "[유브이씨이]", meaning: "개방공간 증기운폭발(Unconfined Vapor Cloud Explosion). 누출된 증기운이 개방공간에서 폭발.", tip: "BLEVE와의 비교(발생장소·메커니즘·피해양상)가 단골. TNT 당량법 언급하면 가점 요소." },
  { word: "Boil-over", cat: "폭발", kor: "[보일오버]", meaning: "중질유 탱크 화재에서 열파가 하부 수층에 도달, 물이 급격히 비등하며 유류를 분출시키는 현상.", tip: "Slop-over(포 방사 시 표면 분출)·Froth-over와 3종 비교표가 표준. 위험물 탱크화재 문제의 핵심 용어." },
  { word: "Deflagration", cat: "폭발", kor: "[데플러그레이션]", meaning: "폭연 — 화염전파속도가 음속 미만인 폭발. 음속 이상은 Detonation(폭굉).", tip: "폭연·폭굉 비교(전파속도·압력파·메커니즘)는 언제든 나올 수 있는 기본기. DDT(폭연→폭굉 전이)까지 쓰면 상위권." },
  { word: "MOC", cat: "폭발", kor: "[엠오씨]", meaning: "최소산소농도(Minimum Oxygen Concentration). 연소에 필요한 최저 산소농도. MOC=LFL×산소양론계수.", tip: "137·134·123회 기출(불티 HZ-005). 불활성화(Inerting) 설계의 기준값. 퍼지 4방식과 한 세트로." },
  { word: "Purge / Inerting", cat: "폭발", kor: "[퍼지 / 이너팅]", meaning: "불활성가스로 산소농도를 MOC 이하로 낮추는 조작. 진공·압력·스위프·사이펀 4방식.", tip: "4방식의 원리·장단점 비교표가 표준 답안. '치환(Purge)'처럼 국문과 병기하면 안정적이야." },
  { word: "MESG", cat: "폭발", kor: "[엠이에스지]", meaning: "최대안전틈새(Maximum Experimental Safe Gap). 화염이 틈새를 통과하지 못하는 최대 간극.", tip: "방폭구조 등급 분류(IIA/IIB/IIC)의 기준. 내압방폭 원리 문제에서 핵심 키워드." },
  { word: "RTI", cat: "수계 소화", kor: "[알티아이]", meaning: "반응시간지수(Response Time Index). 헤드 감열부의 열적 민감도. τ=RTI/√u 관계.", tip: "130·129·122회 3회 기출(불티 SP-001). 정의식 RTI=τ√u, 등급값(조기≤50/특수≤80/표준≤350) 필수 암기." },
  { word: "K-factor", cat: "수계 소화", kor: "[케이팩터]", meaning: "방출계수. Q=K√P의 K값. 오리피스 구경이 클수록 큼(K80, K115, K160, K200…).", tip: "135·125회 기출(불티 SP-004). 계산문제 단골 — 단위(LPM/bar^0.5)를 틀리면 감점이니 단위까지 세트로." },
  { word: "ESFR", cat: "수계 소화", kor: "[이에스에프알]", meaning: "화재조기진압형 스프링클러(Early Suppression Fast Response). 랙크식 창고 등에 적용.", tip: "131·123·120회 기출(불티 SP-009). 3요소(RTI·K·설치위치)와 RDD/ADD 개념이 반드시 함께 나와." },
  { word: "RDD / ADD", cat: "수계 소화", kor: "[알디디 / 에이디디]", meaning: "필요살수밀도(Required Delivered Density) / 실제도달살수밀도(Actual Delivered Density). ADD>RDD면 진압 성공.", tip: "ESFR 진압이론의 핵심. 시간에 따른 RDD 상승·ADD 하락 그래프 하나가 답안의 승부처야." },
  { word: "Skipping", cat: "수계 소화", kor: "[스키핑]", meaning: "먼저 개방된 헤드의 살수가 인접 헤드를 냉각시켜 개방을 방해하는 현상.", tip: "헤드 간 최소이격거리(1.8m)의 이유를 묻는 문제의 정답 키워드. 짧은 용어 하나로 논리가 완성되는 케이스." },
  { word: "Cold Soldering", cat: "수계 소화", kor: "[콜드 솔더링]", meaning: "살수된 물이 감열부를 적셔 인접 헤드의 개방을 지연·방해하는 현상. Skipping과 유사 맥락.", tip: "ESFR·라지드롭 헤드의 배치기준 근거로 함께 언급하면 채점자가 '실무를 아는 답안'으로 읽어." },
  { word: "Cavitation", cat: "수계 소화", kor: "[캐비테이션]", meaning: "공동현상 — 펌프 흡입측 압력이 포화증기압 이하로 떨어져 기포가 생성·붕괴되는 현상.", tip: "135·128·125·120회 4회 기출(불티 SP-007) 최다빈출급. 정의→발생조건→영향→방지대책(NPSHav>NPSHre) 순서로." },
  { word: "NPSH", cat: "수계 소화", kor: "[엔피에스에이치]", meaning: "유효흡입수두(Net Positive Suction Head). NPSHav(이용가능)>NPSHre(필요)여야 공동현상 방지.", tip: "Cavitation 문제의 결론부 필수 수식. 'NPSHav ≥ NPSHre×1.3' 여유율까지 쓰면 실무형 답안 완성." },
  { word: "Water Hammer", cat: "수계 소화", kor: "[워터 해머]", meaning: "수격현상 — 밸브 급폐쇄 등으로 유속이 급변하며 압력파가 발생하는 현상.", tip: "122·128회 기출(불티 SP-008). Joukowsky 충격파식(ΔP=ρcΔv)을 쓰면 계산 근거가 생겨. 방지: 완폐쇄·수격방지기·에어챔버." },
  { word: "Interlock", cat: "수계 소화", kor: "[인터록]", meaning: "준비작동식 밸브 개방조건 방식. Single(감지기), Non(감지기 또는 헤드), Double(감지기 그리고 헤드).", tip: "138·137회 기출(불티 SP-010). 3방식 비교표(개방조건·오작동/실작동 리스크·적용장소)가 그대로 답안이 돼." },
  { word: "Trip Time", cat: "수계 소화", kor: "[트립 타임]", meaning: "건식밸브 개방 소요시간. 이후 물이 말단까지 도달하는 시간은 Transit Time. NFPA 13은 60초 기준.", tip: "132·125회 기출(불티 SP-011). 국내기준과 NFPA 60초 룰 비교가 논점 — 미국기준 비교형 문제의 전형이야." },
  { word: "Churn Pressure", cat: "수계 소화", kor: "[천 프레셔]", meaning: "체절압력 — 토출량 0 상태(체절운전)의 펌프 압력. 정격토출압의 140% 이하여야 함.", tip: "127·123·120회 기출(불티 SP-006). 성능시험 3운전점(체절 140%/정격 100%/최대 150% 유량 시 65%)과 함께." },
  { word: "Slenderness Ratio", cat: "수계 소화", kor: "[슬렌더니스 레이쇼]", meaning: "세장비(λ=L/r) — 흔들림방지버팀대 설계에서 300 이하로 제한되는 값.", tip: "139·133·124회 기출(불티 SP-012) 내진설계 계산문제. 좌굴 방지가 목적이라는 '이유'까지 쓰는 게 포인트." },
  { word: "Clean Agent", cat: "가스 소화", kor: "[클린 에이전트]", meaning: "청정소화약제 — 방출 후 잔류물이 없는 할로겐화합물·불활성기체 소화약제(NFPA 2001).", tip: "약제 분류 문제의 대분류 용어. 할로겐화합물(냉각·부촉매) vs 불활성기체(질식)의 소화원리 구분이 첫 논점." },
  { word: "Soaking Time", cat: "가스 소화", kor: "[소킹 타임]", meaning: "설계농도유지시간 — 재발화 방지를 위해 소화농도를 유지해야 하는 시간.", tip: "5회 기출(불티 GS-002) 최다빈출. 확보 방안(개구부 자동폐쇄·누설 최소화)과 영향요소를 세트로. 원어 표기가 표준이야." },
  { word: "Enclosure Integrity", cat: "가스 소화", kor: "[인클로저 인테그리티]", meaning: "방호구역 밀폐도. Door Fan Test로 누설면적을 측정해 약제 유지시간을 예측.", tip: "137·126·121회 기출(불티 GS-003) — f7 대문제급. 시험 원리(가압/감압)·절차·판정을 그림과 함께 정리해둬." },
  { word: "NOAEL / LOAEL", cat: "가스 소화", kor: "[노아엘 / 로아엘]", meaning: "무독성농도/최소독성농도. 할로겐화합물 약제의 인체 안전 기준 — 상주공간은 NOAEL 이하 설계.", tip: "약제 최대허용설계농도의 근거를 묻는 문제의 핵심. 심장 민감화(Cardiac Sensitization) 개념과 함께 쓰면 완성." },
  { word: "Stack Effect", cat: "제연", kor: "[스택 이펙트]", meaning: "연돌효과 — 실내외 온도차에 의한 밀도차로 수직 샤프트에 상승(겨울)·하강(여름) 기류가 형성되는 현상.", tip: "132·122회 기출(불티 SM-003). 중성대(Neutral Plane) 개념, 초고층 문제점, 대책(구획·방풍실·가압)까지 한 세트." },
  { word: "Plugholing", cat: "제연", kor: "[플러그홀링]", meaning: "배연구에서 연기층 아래의 신선공기까지 함께 빨려 들어가 배연효율이 떨어지는 현상.", tip: "138·121회 기출(불티 SM-002). NFPA 92의 최대배출량식과 방지대책(배연구 분산·연기층 두께 확보)이 표준 구성." },
  { word: "Backlayering", cat: "제연", kor: "[백레이어링]", meaning: "터널 화재에서 연기가 종류식 환기 기류를 거슬러 상류로 역류하는 현상.", tip: "129·128회 기출(불티 SM-005). 방지 조건이 임계풍속(Critical Velocity) — 두 용어는 반드시 한 문장에 같이 나와야 해." },
  { word: "Critical Velocity", cat: "제연", kor: "[크리티컬 벨로시티]", meaning: "임계풍속 — Backlayering을 방지할 수 있는 최소 종방향 풍속(통상 2~3m/s 수준).", tip: "터널 제연 문제의 결론 키워드. Kennedy식 언급하면 가점. HRR·터널높이의 함수라는 점까지." },
  { word: "Stratification", cat: "제연", kor: "[스트래티피케이션]", meaning: "연기 성층화 — 아트리움 등에서 연기가 특정 높이에 층을 이뤄 정체, 상부 감지기가 작동하지 못하는 현상.", tip: "131·128회 기출(불티 SM-006). 원인(온도역전층)과 대응(빔감지기 다단 설치·공기흡입형)이 논점이야." },

const NOW = new Date();
const DAY_ANCHOR = new Date(2026, 0, 1);
function dayIdx() {
  const t = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
  return Math.round((t - DAY_ANCHOR) / 86400000);
}
function mod(n, m) { return ((n % m) + m) % m; }
function todayKey() { return `${NOW.getFullYear()}_${NOW.getMonth()}_${NOW.getDate()}`; }

// v7 시작일(2026-09-09)에 각 목록의 첫 항목이 나오도록 위상을 맞춰 뒀어.
const QUOTE_PHASE = 19, BUD_PHASE = 19, IDIOM_PHASE = 22, ENG_PHASE = 49;

function ls(key, fallback = null) {
  try {
    const v = localStorage.getItem(key);
    return v !== null ? JSON.parse(v) : fallback;
  } catch { return fallback; }
}
function touchKey(key) {
  try {
    const raw = localStorage.getItem('_ts_index');
    const idx = raw ? JSON.parse(raw) : {};
    idx[key] = Date.now();
    localStorage.setItem('_ts_index', JSON.stringify(idx));
  } catch {}
}
function lsSet(key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));
    touchKey(key);
  } catch {}
}

function initDate() {
  const y = NOW.getFullYear();
  const m = String(NOW.getMonth() + 1).padStart(2, '0');
  const d = String(NOW.getDate()).padStart(2, '0');
  document.getElementById('headerDate').textContent = `${y}.${m}.${d}`;
  const days = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
  document.getElementById('headerDay').textContent = days[NOW.getDay()];
  document.getElementById('quoteDateLabel').textContent = `${m}.${d} 오늘의 명언`;
}

// ══════════════════════════════════════════
function getCurrentQuoteIdx() {
  const offset = ls(`quote_offset_${todayKey()}`, 0);
  return mod(dayIdx() + QUOTE_PHASE + offset, QUOTES.length);
}
function renderQuote() {
  const idx = getCurrentQuoteIdx();
  const q = QUOTES[idx];
  document.getElementById('quoteText').textContent = `"${q.text}"`;
  document.getElementById('quoteAuthor').textContent = q.author;
  document.getElementById('quoteMeta').textContent = `${q.country}  ·  ${q.years}`;
  document.getElementById('quoteMeaning').textContent = q.meaning;
  document.getElementById('quoteIndex').textContent = `${idx + 1} / ${QUOTES.length}`;
  const badge = document.getElementById('quoteBadge');
  if (q.type) { badge.textContent = q.type; badge.style.display = 'inline-block'; }
  else { badge.style.display = 'none'; }
  const box = document.getElementById('quoteMeaning');
  const btn = document.getElementById('meaningToggle');
  box.classList.remove('open'); btn.classList.remove('open'); btn.textContent = '의미 보기 ▾';
}
function nextQuote() { lsSet(`quote_offset_${todayKey()}`, ls(`quote_offset_${todayKey()}`, 0) + 1); renderQuote(); }
function prevQuote() { lsSet(`quote_offset_${todayKey()}`, ls(`quote_offset_${todayKey()}`, 0) - 1); renderQuote(); }
function toggleMeaning() {
  const box = document.getElementById('quoteMeaning');
  const btn = document.getElementById('meaningToggle');
  const open = box.classList.toggle('open');
  btn.classList.toggle('open', open);
  btn.textContent = open ? '의미 닫기 ▴' : '의미 보기 ▾';
}

// ══════════════════════════════════════════
// 방명록 — 날짜에 안 묶임. 계속 쌓이는 하나의 흐름.
// ══════════════════════════════════════════
let editingGbId = null;

function migrateToGuestbook() {
  if (ls('gb_migrated_v4')) return;
  const gb = ls('guestbook', []) || [];
  const have = new Set(gb.map(e => e.id));
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
  keys.forEach(k => {
    if (/^entries_\d+_\d+_\d+$/.test(k)) {
      const [y, m, d] = k.slice(8).split('_').map(Number);
      const arr = ls(k, []) || [];
      if (!Array.isArray(arr)) return;
      arr.forEach(e => {
        if (!e || !e.id || !e.text) return;
        const id = 'mig_' + e.id;
        if (have.has(id)) return;
        gb.push({ id, ts: e.ts || new Date(y, m, d, 12).getTime(), text: e.text, editedTs: e.editedTs, deleted: e.deleted, deletedTs: e.deletedTs });
        have.add(id);
      });
    } else if (/^memo_\d+_\d+_\d+$/.test(k)) {
      const [y, m, d] = k.slice(5).split('_').map(Number);
      const t = ls(k, '');
      if (t && String(t).trim()) {
        const id = 'migmemo_' + k;
        if (!have.has(id)) { gb.push({ id, ts: new Date(y, m, d, 12).getTime(), text: String(t) }); have.add(id); }
      }
    }
  });
  gb.sort((a, b) => (a.ts || 0) - (b.ts || 0));
  lsSet('guestbook', gb);
  lsSet('gb_migrated_v4', true);
}

function fmtGbDate(ts) {
  const d = new Date(ts);
  const days = ['일','월','화','수','목','금','토'];
  return `${d.getMonth() + 1}.${d.getDate()}(${days[d.getDay()]}) ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function submitGb() {
  const input = document.getElementById('gbInput');
  const text = input.value.trim();
  if (!text) return;
  const gb = ls('guestbook', []) || [];
  gb.push({ id: `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`, ts: Date.now(), text });
  lsSet('guestbook', gb);
  input.value = '';
  renderGb();
  showToast('방명록에 남김 ✓');
  syncAfterChange();
}
function startEditGb(id) { editingGbId = id; renderGb(); }
function cancelEditGb() { editingGbId = null; renderGb(); }
function saveEditGb(id, newTextRaw) {
  const newText = (newTextRaw || '').trim();
  if (!newText) return;
  const gb = ls('guestbook', []) || [];
  const i = gb.findIndex(x => x.id === id);
  if (i !== -1) { gb[i].text = newText; gb[i].editedTs = Date.now(); lsSet('guestbook', gb); }
  editingGbId = null;
  renderGb(); showToast('수정됨 ✓'); syncAfterChange();
}
function deleteGb(id) {
  if (!confirm('이 글을 삭제할까?')) return;
  const gb = ls('guestbook', []) || [];
  const i = gb.findIndex(x => x.id === id);
  if (i !== -1) { gb[i].deleted = true; gb[i].deletedTs = Date.now(); lsSet('guestbook', gb); }
  renderGb(); showToast('삭제됨 ✓'); syncAfterChange();
}

function renderGb() {
  const list = document.getElementById('gbList');
  const gb = (ls('guestbook', []) || []).filter(e => !e.deleted).sort((a, b) => (b.ts || 0) - (a.ts || 0));
  list.innerHTML = '';
  if (!gb.length) {
    list.innerHTML = `<div class="gb-empty">첫 글을 남겨봐. 여기 글은 계속 쌓여.</div>`;
    return;
  }
  gb.forEach(e => {
    const el = document.createElement('div');
    el.className = 'gb-item';
    if (editingGbId === e.id) {
      const row = document.createElement('div');
      row.className = 'gb-edit-row';
      const input = document.createElement('input');

function buildSprite(map, cls) {
  const wrap = document.createElement('div');
  wrap.className = 'pxwrap ' + (cls || '');
  const inner = document.createElement('div');
  inner.className = 'pxinner';
  const px = document.createElement('div');
  px.className = 'px';
  const shadows = [];
  map.forEach((row, y) => {
    [...row].forEach((c, x) => {
      if (PALETTE[c]) shadows.push(`${x * PX}px ${y * PX}px 0 ${PALETTE[c]}`);
    });
  });
  px.style.boxShadow = shadows.join(',');
  const w = map[0].length * PX, h = map.length * PX;
  wrap.style.width = w + 'px';
  wrap.style.height = h + 'px';
  inner.style.width = w + 'px';
  inner.style.height = h + 'px';
  inner.appendChild(px);
  wrap.appendChild(inner);
  return wrap;
}

// ── 시간대 & 해·달 ──
let curPhase = 'night';
function farmPhase(d) {
  const h = d.getHours();
  if (h >= 5 && h < 7) return 'dawn';
  if (h >= 7 && h < 17) return 'day';
  if (h >= 17 && h < 20) return 'dusk';
  return 'night';
}
function updateFarmSky() {
  const farm = document.getElementById('farm');
  if (!farm) return;
  const now = new Date();
  curPhase = farmPhase(now);
  farm.classList.remove('t-dawn', 't-day', 't-dusk', 't-night');
  farm.classList.add('t-' + curPhase);
  const W = farm.clientWidth;
  const sun = document.getElementById('sunOrb');
  const moon = document.getElementById('moonOrb');
  if (!sun || !moon) return;
  const mins = now.getHours() * 60 + now.getMinutes();
  const sunRise = 6 * 60, sunSet = 19.5 * 60; // 해: 06:00 ~ 19:30
  if (mins >= sunRise && mins <= sunSet) {
    const p = (mins - sunRise) / (sunSet - sunRise);
    sun.style.opacity = 1;
    sun.style.left = (10 + p * (W - 34)) + 'px';
    sun.style.bottom = (28 + Math.sin(p * Math.PI) * (farm.clientHeight - 58)) + 'px';
    moon.style.opacity = 0;
  } else {
    sun.style.opacity = 0;
    const nm = mins < sunRise ? mins + 1440 : mins;
    const p = (nm - sunSet) / (1440 - (sunSet - sunRise));
    moon.style.opacity = 1;
    moon.style.left = (10 + p * (W - 30)) + 'px';
    moon.style.bottom = (32 + Math.sin(p * Math.PI) * (farm.clientHeight - 64)) + 'px';
  }
}

function initFarm() {
  const farm = document.getElementById('farm');
  let W = farm.clientWidth;
  const rand = (a, b) => a + Math.random() * (b - a);
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 밤하늘 별
  for (let i = 0; i < 8; i++) {
    const st = document.createElement('div');
    st.className = 'star';
    st.style.left = rand(10, W - 12) + 'px';
    st.style.top = rand(4, farm.clientHeight * 0.45) + 'px';
    st.style.animationDelay = rand(0, 3).toFixed(1) + 's';
    farm.appendChild(st);
  }

  // 풀·꽃
  for (let i = 0; i < 4; i++) {
    const g = buildSprite(GRASS_MAP, 'deco');
    g.style.left = rand(10, W - 20) + 'px';
    farm.appendChild(g);
  }
  for (let i = 0; i < 3; i++) {
    const f = buildSprite(FLOWER_MAP, 'deco');
    f.style.left = rand(20, W - 30) + 'px';
    farm.appendChild(f);
  }

  // 나무 두 그루 (크기 다르게)
  const tree1 = buildSprite(TREE_MAP, 'tree');
  tree1.style.left = Math.round(W * 0.09) + 'px';
  farm.appendChild(tree1);
  const tree2 = buildSprite(TREE_MAP, 'tree');
  tree2.style.left = Math.round(W * 0.84) + 'px';
  tree2.querySelector('.pxinner').style.transform = 'scale(0.72)';
  tree2.querySelector('.pxinner').style.transformOrigin = 'bottom center';
  farm.appendChild(tree2);

  // 나무 그늘에서 자는 고양이
  const cat = buildSprite(CAT_MAP, 'cat');
  const catX = Math.round(W * 0.09) + 24;
  cat.style.left = catX + 'px';
  cat.title = 'Zz…';
  cat.addEventListener('click', () => {
    cat.classList.add('twitch');
    setTimeout(() => cat.classList.remove('twitch'), 500);
    showToast('…냐옹 (잠결) 🐈');
  });
  farm.appendChild(cat);
  const zz = document.createElement('div');
  zz.className = 'cat-zz';
  zz.textContent = 'z z';
  zz.style.left = (catX + 26) + 'px';
  zz.style.bottom = '32px';
  farm.appendChild(zz);

  // 반딧불이 (저녁·밤에만 보임 — CSS가 제어)
  for (let i = 0; i < 4; i++) {
    const ff = document.createElement('div');
    ff.className = 'firefly';
    ff.style.left = rand(W * 0.15, W * 0.9) + 'px';
    ff.style.bottom = rand(24, 84) + 'px';
    ff.style.animationDelay = (i * 1.3 + Math.random()) + 's';
    ff.style.animationDuration = rand(3.4, 5.2) + 's';
    farm.appendChild(ff);
  }

  // 알
  const egg = buildSprite(EGG_MAP, 'egg');
  egg.style.left = rand(W * 0.55, W * 0.78) + 'px';
  egg.title = '?';
  egg.addEventListener('click', () => {
    egg.classList.remove('wobble'); void egg.offsetWidth; egg.classList.add('wobble');
    showToast('…꼼틀 🥚');
  });
  farm.appendChild(egg);

  // 나비 (낮에만 보임 — CSS가 제어)
  const bfly = buildSprite(BFLY_MAP, 'butterfly');
  let bx = W * 0.4, bdir = 1, bt = 0;
  bfly.style.bottom = '52px';
  farm.appendChild(bfly);

  // 말풍선·흙먼지 헬퍼
  function bubbleAt(x, text) {
    const b = document.createElement('div');
    b.className = 'peep-bubble';
    b.textContent = text;
    b.style.left = x + 'px';
    b.style.bottom = '38px';
    farm.appendChild(b);
    setTimeout(() => b.remove(), 1100);
  }
  function puffAt(x) {
    const p = document.createElement('div');
    p.className = 'dust-puff';
    p.style.left = x + 'px';
    p.style.bottom = (15 + Math.random() * 4) + 'px';
    p.style.setProperty('--dx', (Math.random() * 12 - 6).toFixed(0) + 'px');
    farm.appendChild(p);
    setTimeout(() => p.remove(), 700);
  }

  // 엄마 닭
  const henEl = buildSprite(HEN_MAP, 'hen');
  henEl.title = '꼬꼬';
  const H = { el: henEl, x: rand(W * 0.3, W * 0.55), dir: 1, v: 0.3, mode: 'walk', t: 0 };
  henEl.addEventListener('click', () => {
    showToast('꼬꼬! 🐔');
    if (!reduced && curPhase !== 'night') henCall();
  });
  farm.appendChild(henEl);
  const drawH = () => { H.el.style.transform = `translateX(${H.x}px) scaleX(${H.dir})`; };
  drawH();

  // 병아리들
  const SLOTS = [-18, 20, -30]; // 엄마 기준 각자 자리
  const chicks = [];
  for (let i = 0; i < 3; i++) {
    const el = buildSprite(CHICK_MAP, 'chick');
    el.title = '삐약';
    el.addEventListener('click', () => showToast('삐약! 🐥'));
    farm.appendChild(el);
    chicks.push({ el, x: rand(30, W - 60), dir: Math.random() < 0.5 ? 1 : -1, v: rand(0.35, 0.75), mode: 'walk', t: 0, slot: SLOTS[i] });
  }
  const draw = c => { c.el.style.transform = `translateX(${c.x}px) scaleX(${c.dir})`; };
  chicks.forEach(draw);

  // 엄마가 부르면 병아리들이 우르르
  function henCall() {
    bubbleAt(H.x + 12, '꼬꼬—!');
    chicks.forEach(c => {
      c.el.classList.remove('dust', 'peck');
      c.mode = 'gather';
      c.t = Math.floor(rand(45, 70));
    });
  }

  if (reduced) {
    bfly.style.left = Math.round(W * 0.4) + 'px';
    return;
  }

  const clampC = c => { if (c.x < 6) c.x = 6; if (c.x > W - 22) c.x = W - 22; };

  setInterval(() => {
    W = farm.clientWidth;
    const night = curPhase === 'night';
    const roostX = Math.min(W - 48, Math.round(W * 0.7)); // 밤에 모이는 홰 자리

    // 나비: 낮 동안만 팔랑팔랑
    if (!night) {
      bt += 0.12;
      bx += bdir * 0.9;
      if (bx < 10) { bx = 10; bdir = 1; }
      if (bx > W - 22) { bx = W - 22; bdir = -1; }
      if (Math.random() < 0.008) bdir *= -1;
      bfly.style.transform = `translate(${bx}px, ${-Math.sin(bt) * 9}px)`;
      bfly.classList.toggle('flap', Math.floor(bt * 4) % 2 === 0);
    }

    // ── 엄마 닭 ──
    if (night) {
      H.el.classList.remove('scratch', 'peck');
      H.mode = 'walk';
      if (Math.abs(H.x - roostX) > 4) {
        H.el.classList.remove('sleep');
        H.dir = roostX > H.x ? 1 : -1;
        H.x += H.dir * 0.5;
      } else {
        H.el.classList.add('sleep');
        if (Math.random() < 0.004) bubbleAt(H.x + 14, 'z z');
      }
    } else {
      H.el.classList.remove('sleep');
      if (H.mode === 'walk') {
        H.x += H.dir * H.v;
        if (H.x < 6) { H.x = 6; H.dir = 1; }
        if (H.x > W - 36) { H.x = W - 36; H.dir = -1; }
        const r = Math.random();
        if (r < 0.010) { H.mode = 'scratch'; H.t = Math.floor(rand(14, 24)); H.el.classList.add('scratch'); }
        else if (r < 0.020) { H.mode = 'peck'; H.t = 8; H.el.classList.add('peck'); }
        else if (r < 0.030) { H.mode = 'pause'; H.t = Math.floor(rand(10, 35)); }
        else if (r < 0.0335) { henCall(); }
        else if (r < 0.038) {
          H.el.classList.add('flapwing');
          setTimeout(() => H.el.classList.remove('flapwing'), 520);
          bubbleAt(H.x + 10, '푸드덕');
        }
      } else if (H.mode === 'scratch') {
        // 발로 흙 긁기 → 한 발 물러나 쪼아먹기 (닭 특유의 동작)
        if (H.t % 4 === 0) puffAt(H.x + (H.dir > 0 ? 6 : 22));
        if (--H.t <= 0) {
          H.el.classList.remove('scratch');
          H.x -= H.dir * 3;
          H.mode = 'peck'; H.t = 9; H.el.classList.add('peck');
        }
      } else if (H.mode === 'peck') {
        if (--H.t <= 0) { H.el.classList.remove('peck'); H.mode = 'walk'; }
      } else if (H.mode === 'pause') {
        if (--H.t <= 0) { if (Math.random() < 0.5) H.dir *= -1; H.mode = 'walk'; }
      }
    }
    drawH();

    // ── 병아리들 ──
    chicks.forEach(c => {
      if (night) {
        // 엄마 옆 각자 자리에서 잠
        c.el.classList.remove('peck', 'dust');
        const target = roostX + c.slot;
        if (Math.abs(c.x - target) > 3) {
          c.el.classList.remove('sleep');
          c.dir = target > c.x ? 1 : -1;
          c.x += c.dir * 0.6;
          clampC(c);
        } else {
          c.el.classList.add('sleep');
          if (Math.random() < 0.003) bubbleAt(c.x + 4, 'z');
        }
        draw(c);
        return;
      }
      c.el.classList.remove('sleep');
      if (c.mode === 'walk') {
        c.x += c.dir * c.v;
        if (c.x < 6) { c.x = 6; c.dir = 1; }
        if (c.x > W - 22) { c.x = W - 22; c.dir = -1; }
        const r = Math.random();
        if (r < 0.013) { c.mode = 'peck'; c.t = 7; c.el.classList.add('peck'); }
        else if (r < 0.026) { c.mode = 'pause'; c.t = Math.floor(rand(8, 30)); }
        else if (r < 0.033) { c.mode = 'chase'; c.t = Math.floor(rand(35, 60)); }
        else if (r < 0.043) { c.el.classList.add('hop'); setTimeout(() => c.el.classList.remove('hop'), 180); }
        else if (r < 0.047) { bubbleAt(c.x + 4, '삐약'); }
        else if (r < 0.052) {
          // 날개 파닥파닥
          c.el.classList.add('flapwing');
          setTimeout(() => c.el.classList.remove('flapwing'), 520);
        }
        else if (r < 0.0555) { c.mode = 'dust'; c.t = Math.floor(rand(30, 55)); c.el.classList.add('dust'); }
        else if (r < 0.062) { c.dir = H.x > c.x ? 1 : -1; } // 엄마 쪽으로 슬쩍
      } else if (c.mode === 'gather') {
        const target = H.x + c.slot;
        c.dir = target > c.x ? 1 : -1;
        c.x += c.dir * (c.v + 0.9);
        clampC(c);
        if (Math.random() < 0.12) { c.el.classList.add('hop'); setTimeout(() => c.el.classList.remove('hop'), 160); }
        if (--c.t <= 0 || Math.abs(target - c.x) < 5) { bubbleAt(c.x + 4, '삐약'); c.mode = 'walk'; }
      } else if (c.mode === 'dust') {
        // 모래목욕 — 누워서 버둥버둥, 흙이 폴폴
        if (c.t % 6 === 0) puffAt(c.x + rand(0, 11));
        if (--c.t <= 0) {
          c.el.classList.remove('dust');
          c.el.classList.add('flapwing'); // 일어나서 흙 털기
          setTimeout(() => c.el.classList.remove('flapwing'), 520);
          c.mode = 'walk';
        }
      } else if (c.mode === 'chase') {
        c.dir = bx > c.x ? 1 : -1;
        c.x += c.dir * (c.v + 0.7);
        clampC(c);
        if (Math.random() < 0.12) { c.el.classList.add('hop'); setTimeout(() => c.el.classList.remove('hop'), 160); }
        if (--c.t <= 0 || Math.abs(bx - c.x) < 8) {
          if (Math.abs(bx - c.x) < 12) bubbleAt(c.x + 4, '삐약');
          c.mode = 'walk';
        }
      } else if (c.mode === 'peck') {
        if (--c.t <= 0) { c.el.classList.remove('peck'); c.mode = 'walk'; }
      } else if (c.mode === 'pause') {
        if (--c.t <= 0) { if (Math.random() < 0.5) c.dir *= -1; c.mode = 'walk'; }
      }
      draw(c);
    });
  }, 90);

  // 고양이 꼬리 씰룩 (가끔)
  setInterval(() => {
    if (document.visibilityState !== 'visible') return;
    if (Math.random() < 0.5) {
      cat.classList.add('twitch');
      setTimeout(() => cat.classList.remove('twitch'), 600);
    }
  }, 9000);

  setInterval(() => {
    if (document.visibilityState !== 'visible') return;
    if (curPhase === 'night') return; // 밤엔 알도 조용히
    egg.classList.remove('wobble'); void egg.offsetWidth; egg.classList.add('wobble');
  }, 24000);
}

  if (state === 'syncing') { dot.classList.add('syncing'); label.textContent = '동기화 중...'; }
  else if (state === 'synced') { dot.classList.add('synced'); label.textContent = '동기화됨'; }
  else { label.textContent = '동기화'; }
}

async function cloudPushRaw() {
  const data = { timestamp: Date.now(), device: detectDevice() };
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    try { data[k] = JSON.parse(localStorage.getItem(k)); }
    catch { data[k] = localStorage.getItem(k); }
  }
  await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
    body: JSON.stringify(data)
  });
  lsSet('last_sync_ts', Date.now());
}

// id 기반 병합 대상: 방명록 + (구버전) 날짜별 기록
function isMergedListKey(k) { return k === 'guestbook' || k.startsWith('entries_'); }

async function cloudPullMerge() {
  const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
    headers: { 'X-Master-Key': API_KEY }
  });
  const json = await res.json();
  const cloud = json.record;
  if (!cloud) return;

  const localIdx = ls('_ts_index', {}) || {};
  const cloudIdx = cloud['_ts_index'] || {};
  let idxChanged = false;

  Object.keys(cloud).forEach(k => {
    if (k === 'timestamp' || k === 'device' || k === '_ts_index') return;

    if (isMergedListKey(k)) {
      const localArr = ls(k, []) || [];
      const cloudArr = Array.isArray(cloud[k]) ? cloud[k] : [];
      const versionTime = e => Math.max(e.ts || 0, e.editedTs || 0, e.deletedTs || 0);
      const map = new Map();
      localArr.forEach(e => { if (e && e.id) map.set(e.id, e); });
      cloudArr.forEach(e => {
        if (!e || !e.id) return;
        const existing = map.get(e.id);
        if (!existing || versionTime(e) > versionTime(existing)) map.set(e.id, e);
      });
      const merged = Array.from(map.values()).sort((a, b) => (a.ts || 0) - (b.ts || 0));
      if (JSON.stringify(merged) !== JSON.stringify(localArr)) {
        try { localStorage.setItem(k, JSON.stringify(merged)); } catch {}
      }
      return;
    }

    const localExists = localStorage.getItem(k) !== null;
    const cloudTs = cloudIdx[k] || 0;
    const localTs = localIdx[k] || 0;
    if (!localExists || cloudTs > localTs) {
      try {
        localStorage.setItem(k, typeof cloud[k] === 'string' ? cloud[k] : JSON.stringify(cloud[k]));
        localIdx[k] = cloudTs || Date.now();
        idxChanged = true;
      } catch {}
    }
  });

  if (idxChanged) {
    try { localStorage.setItem('_ts_index', JSON.stringify(localIdx)); } catch {}
  }
}

async function syncAfterChange() {
  setSyncUI('syncing');
  try {
    await cloudPullMerge();
    migrateToGuestbook();
    renderGb();
    await cloudPushRaw();
    setSyncUI('synced');
  } catch {
    setSyncUI('idle');
  }
}
async function manualSync() { await syncAfterChange(); }

async function initialSync() {
  setSyncUI('syncing');
  try {
    await cloudPullMerge();
    migrateToGuestbook();
    renderGb();
    setSyncUI('synced');
    const last = ls('last_sync_ts', 0);
    if (Date.now() - last > AUTO_SYNC_INTERVAL) await cloudPushRaw();
  } catch {
    setSyncUI('idle');
  }
}
async function backgroundPull() {
  try {
    await cloudPullMerge();
    renderGb();
  } catch {}
}
