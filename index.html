<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="오늘의 행복">
<meta name="theme-color" content="#f3eee3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16151b" media="(prefers-color-scheme: dark)">
<title>오늘의 행복</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ── v8 · 새벽 한지 ─────────────────────────
   아침에 가장 먼저 보는 종이 한 장.
   상자·화살표·해설 없이, 글귀만 숨 쉬게.
──────────────────────────────────────────── */
:root {
  --bg:     #f3eee3;
  --bg2:    #ece6d8;
  --ink:    #2a2622;
  --ink2:   #4f4942;
  --muted:  #857c70;
  --muted2: #b0a699;
  --line:   rgba(42,38,34,0.12);
  --line2:  rgba(42,38,34,0.22);
  --red:    #b2443a;   /* 주사(朱砂) — 낙관 색 */
  --lotus:  #9a5f7b;   /* 연꽃 — 불교 말씀 */
  --moss:   #5e7a53;   /* 이끼 — 사실은 그랬다 */
  --indigo: #4a5f84;   /* 쪽빛 — 시험 영어 */
  --paper-shadow: rgba(42,38,34,0.06);
  --toast-bg: #2a2622;
  --toast-ink: #f3eee3;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:     #16151b;
    --bg2:    #1d1c23;
    --ink:    #ebe5d8;
    --ink2:   #cfc7b8;
    --muted:  #978f82;
    --muted2: #635c53;
    --line:   rgba(235,229,216,0.12);
    --line2:  rgba(235,229,216,0.22);
    --red:    #d2695e;
    --lotus:  #c58aa8;
    --moss:   #8fb07f;
    --indigo: #8ea3cc;
    --paper-shadow: rgba(0,0,0,0.3);
    --toast-bg: #ebe5d8;
    --toast-ink: #16151b;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

.wrapper {
  max-width: 560px;
  margin: 0 auto;
  padding: calc(26px + env(safe-area-inset-top)) 22px calc(90px + env(safe-area-inset-bottom));
}

/* ── 머리 ── */
.header {
  display: flex; justify-content: space-between; align-items: flex-end;
  padding: 10px 0 34px;
}
.brand {
  font-size: 11px; letter-spacing: 0.22em; color: var(--muted);
  font-weight: 400; cursor: pointer; margin-bottom: 8px;
}
.brand b { font-weight: 400; color: var(--red); margin-left: 6px; letter-spacing: 0.1em; }
.date {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 34px; font-weight: 700; letter-spacing: 0.02em; line-height: 1;
  color: var(--ink);
}
.date-sub {
  margin-top: 8px; font-size: 13px; color: var(--muted);
  display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
}
.date-sub .season { color: var(--ink2); }
.date-sub .season::before { content: "·"; color: var(--muted2); margin-right: 10px; }
.header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.sync {
  display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted2);
  cursor: pointer; user-select: none;
}
.sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted2); }
.sync-dot.syncing { background: var(--indigo); animation: pulse 1s infinite; }
.sync-dot.synced { background: var(--moss); }
.gb-jump {
  background: none; border: 1px solid var(--line2); color: var(--ink2);
  border-radius: 999px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif; font-weight: 400;
}

/* ── 고양이 무대 — 화면 전체 ── */
.stage { position: fixed; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
.pxwrap { position: absolute; image-rendering: pixelated; }
.pxwrap .pxinner { position: relative; transform-origin: center; }
.pxwrap .px { position: absolute; left: 0; top: 0; width: 2px; height: 2px; }
.cat { transition: left 0.12s linear; will-change: left; }
.cat.lane-floor { bottom: calc(6px + env(safe-area-inset-bottom)); }
.cat.lane-roof  { top: calc(2px + env(safe-area-inset-top)); }
.cat .pxinner.flip { transform: scaleX(-1); }
.cat.zz::after {
  content: "z"; position: absolute; right: -8px; top: -12px;
  font-size: 10px; font-family: 'Noto Sans KR', sans-serif; color: var(--muted);
  animation: zz 2.4s infinite;
}
@keyframes zz { 0% { opacity: 0; transform: translateY(2px);} 30% { opacity: 1;} 100% { opacity: 0; transform: translateY(-8px);} }

/* ── 글귀 ── */
.piece { padding: 6px 0 40px; animation: fadeUp .6s ease both; }
.piece + .piece { border-top: 1px solid var(--line); padding-top: 34px; }
.label {
  font-size: 11px; letter-spacing: 0.2em; color: var(--muted);
  font-weight: 400; margin-bottom: 18px; display: flex; align-items: center; gap: 10px;
}
.label::before { content: ""; width: 10px; height: 1px; background: var(--red); }
.piece.lotus .label::before { background: var(--lotus); }
.piece.moss  .label::before { background: var(--moss); }
.piece.indigo .label::before { background: var(--indigo); }

.verse {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 20px; line-height: 1.9; color: var(--ink);
  white-space: pre-line; word-break: keep-all;
}
.verse.big { font-size: 21px; }
.by {
  margin-top: 18px; font-size: 13px; color: var(--ink2); font-weight: 400;
}
.by .meta { display: block; margin-top: 3px; font-size: 11.5px; color: var(--muted); font-weight: 300; }
.tag {
  display: inline-block; margin-left: 8px; padding: 1px 6px; border-radius: 3px;
  border: 1px solid var(--line2); font-size: 10px; color: var(--muted); vertical-align: 1px;
}

/* 시험 영어 */
.eng-word { font-family: 'Nanum Myeongjo', serif; font-size: 26px; font-weight: 700; color: var(--ink); letter-spacing: 0.01em; }
.eng-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.eng-cat { font-size: 11px; color: var(--indigo); letter-spacing: 0.1em; }
.eng-pron { margin-top: 4px; font-size: 13px; color: var(--muted); }
.eng-mean { margin-top: 14px; font-size: 15px; line-height: 1.75; color: var(--ink2); word-break: keep-all; }
.eng-tip-btn {
  margin-top: 14px; background: none; border: none; color: var(--muted); font-size: 12px;
  cursor: pointer; font-family: 'Noto Sans KR', sans-serif; padding: 0; letter-spacing: 0.05em;
}
.eng-tip { display: none; margin-top: 10px; font-size: 13.5px; line-height: 1.7; color: var(--ink2);
  padding-left: 12px; border-left: 2px solid var(--indigo); word-break: keep-all; }
.eng-tip.open { display: block; }

/* 방명록 */
.gb-row { display: flex; gap: 8px; }
.gb-input {
  flex: 1; min-width: 0; background: var(--bg2); border: 1px solid var(--line);
  border-radius: 10px; padding: 12px 14px; color: var(--ink); font-size: 15px;
  font-family: 'Noto Sans KR', sans-serif; outline: none;
}
.gb-input:focus { border-color: var(--line2); }
.gb-input::placeholder { color: var(--muted2); }
.gb-submit {
  flex-shrink: 0; background: var(--ink); color: var(--bg); border: none; border-radius: 10px;
  padding: 0 16px; font-size: 14px; font-family: 'Noto Sans KR', sans-serif; cursor: pointer;
}
.gb-list { margin-top: 18px; }
.gb-item { padding: 12px 0; border-top: 1px dashed var(--line); }
.gb-item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.gb-time { font-size: 11px; color: var(--muted); letter-spacing: 0.05em; }
.gb-edited-tag { font-size: 10px; color: var(--muted2); margin-left: 6px; }
.gb-actions { display: flex; gap: 10px; }
.gb-action-btn { background: none; border: none; font-size: 11px; color: var(--muted2); cursor: pointer; font-family: 'Noto Sans KR', sans-serif; padding: 2px 0; }
.gb-action-btn.danger { color: var(--red); opacity: .7; }
.gb-action-btn.save { color: var(--moss); }
.gb-text { font-size: 15px; line-height: 1.7; color: var(--ink); white-space: pre-wrap; word-break: break-word; }
.gb-edit-row { display: flex; gap: 6px; align-items: center; }
.gb-edit-input { flex: 1; min-width: 0; background: var(--bg2); border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px; font-size: 14px; color: var(--ink); font-family: 'Noto Sans KR', sans-serif; outline: none; }
.gb-empty { font-size: 13px; color: var(--muted2); padding: 14px 0; }

.toast {
  position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
  background: var(--toast-bg); color: var(--toast-ink); padding: 9px 16px; border-radius: 999px;
  font-size: 13px; opacity: 0; transition: .25s; pointer-events: none; z-index: 50; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.foot { margin-top: 10px; font-size: 11px; color: var(--muted2); letter-spacing: 0.08em; text-align: center; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none;} }
@keyframes pulse { 0%,100% { opacity: 1;} 50% { opacity: .3;} }

@media (max-width: 380px) {
  .date { font-size: 30px; }
  .verse { font-size: 18.5px; }
}
@media (prefers-reduced-motion: reduce) {
  .piece { animation: none; }
}
</style>
</head>
<body>
<div class="wrapper">

  <header class="header">
    <div>
      <div class="brand" onclick="location.reload()">오늘의 행복<b>v8</b></div>
      <div class="date" id="headerDate"></div>
      <div class="date-sub"><span id="headerDay"></span><span class="season" id="headerSeason"></span></div>
    </div>
    <div class="header-right">
      <div class="sync" id="syncStatus" onclick="manualSync()"><div class="sync-dot" id="syncDot"></div><span id="syncLabel">동기화</span></div>
      <button class="gb-jump" onclick="jumpToGuestbook()">방명록</button>
    </div>
  </header>

  <!-- 1. 오늘의 명언 -->
  <section class="piece red">
    <div class="label" id="quoteDateLabel">오늘의 명언</div>
    <div class="verse big" id="quoteText"></div>
    <div class="by"><span id="quoteAuthor"></span><span class="tag" id="quoteBadge" style="display:none;"></span><span class="meta" id="quoteMeta"></span></div>
  </section>

  <!-- 2. 오늘의 불교 말씀 -->
  <section class="piece lotus">
    <div class="label">오늘의 불교 말씀</div>
    <div class="verse" id="budText"></div>
    <div class="by"><span class="meta" id="budSrc" style="margin-top:0;"></span></div>
  </section>

  <!-- 3. 사실은 그랬다 -->
  <section class="piece moss">
    <div class="label">사실은 그랬다</div>
    <div class="verse" id="factText"></div>
    <div class="by"><span class="meta" id="factTopic" style="margin-top:0;"></span></div>
  </section>

  <!-- 4. 오늘의 시험 영어 -->
  <section class="piece indigo">
    <div class="label">오늘의 시험 영어</div>
    <div class="eng-row"><div class="eng-word" id="engWord"></div><div class="eng-cat" id="engCat"></div></div>
    <div class="eng-pron" id="engPron"></div>
    <div class="eng-mean" id="engMeaning"></div>
    <button class="eng-tip-btn" id="engTipBtn" onclick="toggleEngTip()">답안 TIP 보기 ▾</button>
    <div class="eng-tip" id="engTip"></div>
  </section>

  <!-- 5. 방명록 -->
  <section class="piece red" id="gbSection">
    <div class="label">방명록</div>
    <div class="gb-row">
      <input type="text" class="gb-input" id="gbInput" placeholder="한 줄 남기고 가">
      <button class="gb-submit" onclick="submitGb()">남기기</button>
    </div>
    <div class="gb-list" id="gbList"></div>
  </section>

  <div class="foot" id="foot"></div>
</div>
<div class="stage" id="stage"></div>
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════
// 명언 v8 — 작게, 가볍게, 아침에.
// 주제: 새벽 · 보는 눈 · 작은 반복 · 아름다움 · 질문.
// 출처를 확인해 실었고, 흔히 떠도는 말이라도 출처가 불확실한 건 뺐어.
// [AI 창작] 배지가 붙은 것은 AI 언어모델 클로드가 쓴 문장이야.
// ══════════════════════════════════════════
const QUOTES = [
  { text: "새벽에 일어나기 싫을 때 스스로에게 말하라.\n나는 사람의 일을 하러 일어나는 것이다.", author: "마르쿠스 아우렐리우스", meta: "로마 · 황제이자 스토아 철학자 — 『명상록』 5권", years: "121 — 180" },
  { text: "일 년의 계획은 봄에 있고,\n하루의 계획은 새벽에 있다.", author: "『명심보감』 입교편", meta: "고려 말 엮음 — 공자의 '삼계도'를 옮긴 구절", years: "" },
  { text: "인간 영혼이 이 세상에서 하는 가장 위대한 일은\n무언가를 보는 것이다.\n그리고 본 것을 꾸밈없이 말하는 것이다.", author: "존 러스킨 (John Ruskin)", meta: "영국 · 미술비평가 — 『근대 화가론』", years: "1819 — 1900" },
  { text: "아름다움이 세상을 구원할 것이다.", author: "표도르 도스토옙스키", meta: "러시아 · 소설가 — 『백치』 속 미쉬킨 공작의 말", years: "1821 — 1881" },
  { text: "세상에서 가장 좋고 아름다운 것은\n보이지도 만져지지도 않는다.\n마음으로 느껴야 한다.", author: "헬렌 켈러 (Helen Keller)", meta: "미국 · 작가, 사회운동가", years: "1880 — 1968" },
  { text: "내가 고양이와 놀 때,\n사실은 고양이가 나를 데리고 노는 것인지\n누가 알겠는가.", author: "미셸 드 몽테뉴", meta: "프랑스 · 사상가 — 『수상록』 2권", years: "1533 — 1592" },
  { text: "위대한 일은\n작은 일들이 모여 이루어진다.", author: "빈센트 반 고흐", meta: "네덜란드 · 화가 — 동생 테오에게 보낸 편지, 1882", years: "1853 — 1890" },
  { text: "바위를 백 번 두드려도 금 하나 가지 않다가\n백한 번째에 둘로 갈라진다.\n그 한 번이 아니라, 앞의 백 번이 쪼갠 것이다.", author: "제이콥 리스 (Jacob Riis)", meta: "덴마크계 미국 · 사진기자 — 석공 이야기", years: "1849 — 1914" },
  { text: "가장 느린 사람이라도 목표를 잃지 않으면,\n목표 없이 헤매는 가장 빠른 사람보다 빠르다.", author: "고트홀트 레싱 (G. E. Lessing)", meta: "독일 · 극작가, 철학자", years: "1729 — 1781" },
  { text: "아는 것만으로는 충분하지 않다. 써야 한다.\n마음먹는 것만으로는 충분하지 않다. 해야 한다.", author: "요한 볼프강 폰 괴테", meta: "독일 · 작가 — 『빌헬름 마이스터의 편력시대』", years: "1749 — 1832" },
  { text: "우리에게 시간이 적은 것이 아니다.\n잃어버리는 시간이 많은 것이다.", author: "세네카 (Seneca)", meta: "로마 · 스토아 철학자 — 『인생의 짧음에 관하여』", years: "BC 4 — AD 65" },
  { text: "먼저 네가 어떤 사람이 되려는지\n스스로에게 말하라.\n그런 다음, 해야 할 일을 하라.", author: "에픽테토스 (Epictetus)", meta: "그리스 · 스토아 철학자 — 『담화록』 3권", years: "55 — 135" },
  { text: "질문 자체를 사랑하라.\n지금은 답을 찾지 말라.\n언젠가 먼 미래에, 자기도 모르는 사이에\n답 속으로 걸어 들어가 살게 될 것이다.", author: "라이너 마리아 릴케", meta: "오스트리아 · 시인 — 『젊은 시인에게 보내는 편지』", years: "1875 — 1926" },
  { text: "중요한 것은 질문을 멈추지 않는 것이다.\n호기심은 그 자체로 존재할 이유가 있다.", author: "알베르트 아인슈타인", meta: "독일계 미국 · 물리학자 — LIFE 인터뷰, 1955", years: "1879 — 1955" },
  { text: "인간의 모든 불행은 단 하나에서 온다.\n방 안에 조용히 머물 줄 모르는 것.", author: "블레즈 파스칼 (Blaise Pascal)", meta: "프랑스 · 수학자, 철학자 — 『팡세』", years: "1623 — 1662" },
  { text: "우리는 가진 것은 거의 생각하지 않고,\n없는 것만 늘 생각한다.", author: "아르투어 쇼펜하우어", meta: "독일 · 철학자 — 『소품과 부록』", years: "1788 — 1860" },
  { text: "왜 사는지를 아는 사람은\n거의 어떤 상황도 견뎌 낸다.", author: "프리드리히 니체", meta: "독일 · 철학자 — 『우상의 황혼』", years: "1844 — 1900" },
  { text: "한겨울에 나는 마침내 알았다.\n내 안에 꺾이지 않는 여름이 있다는 것을.", author: "알베르 카뮈 (Albert Camus)", meta: "프랑스 · 작가 — 『여름』 '티파사로 돌아오다'", years: "1913 — 1960" },
  { text: "다시 해 보라. 다시 실패하라.\n더 낫게 실패하라.", author: "사뮈엘 베케트 (Samuel Beckett)", meta: "아일랜드 · 극작가 — 『워스트워드 호』", years: "1906 — 1989" },
  { text: "기회는 준비된 마음에게만 찾아온다.", author: "루이 파스퇴르 (Louis Pasteur)", meta: "프랑스 · 미생물학자 — 릴 대학 연설, 1854", years: "1822 — 1895" },
  { text: "옛사람의 자취를 좇지 말고,\n옛사람이 구하던 것을 구하라.", author: "마쓰오 바쇼 (松尾芭蕉)", meta: "일본 · 하이쿠 시인 — 「허육이별사」", years: "1644 — 1694" },
  { text: "바람이 성긴 대숲에 불어와도\n지나가면 소리를 남기지 않고,\n기러기가 차가운 못을 건너도\n지나가면 그림자를 남기지 않는다.", author: "『채근담』", meta: "명나라 · 홍자성 — 風來疏竹 風過而竹不留聲", years: "" },
  { text: "아는 것은 좋아하는 것만 못하고,\n좋아하는 것은 즐기는 것만 못하다.", author: "공자 — 『논어』 옹야편", meta: "知之者 不如好之者 好之者 不如樂之者", years: "BC 551 — BC 479" },
  { text: "산을 쌓다가 한 삼태기가 모자라 그만두어도\n내가 그만둔 것이다.\n땅을 고르다가 한 삼태기를 부어 나아가도\n내가 나아간 것이다.", author: "공자 — 『논어』 자한편", meta: "譬如爲山 未成一簣 止 吾止也", years: "BC 551 — BC 479" },
  { text: "우물을 아홉 길이나 팠더라도\n샘에 닿지 못하면\n우물을 버린 것과 같다.", author: "맹자 — 『맹자』 진심 상", meta: "掘井九軔 而不及泉 猶爲棄井也", years: "BC 372 — BC 289" },
  { text: "처음 배우는 사람은\n먼저 뜻을 세워야 한다.", author: "율곡 이이 — 『격몽요결』 입지장", meta: "조선 · 初學 先須立志", years: "1536 — 1584" },
  { text: "너희에게 물려줄 밭이 없어\n'근(勤)'과 '검(儉)' 두 글자를 준다.\n이것은 기름진 땅보다 낫다.", author: "다산 정약용", meta: "조선 · 유배지에서 두 아들에게 보낸 편지", years: "1762 — 1836" },
  { text: "반드시 죽고자 하면 살고,\n반드시 살고자 하면 죽는다.", author: "이순신 — 『난중일기』", meta: "조선 · 1597년 9월 15일, 명량 전날", years: "1545 — 1598" },
  { text: "오늘 아침 네가 본 가장 예쁜 것을\n하나만 기억해 두어라.\n저녁이 되면 그것이 하루 전체가 된다.", author: "클로드 (Claude)", meta: "AI 언어모델 · Anthropic", years: "", ai: true },
  { text: "외우려 하지 마라.\n자주 만나면 알게 된다.\n사람도 문장도 그렇다.", author: "클로드 (Claude)", meta: "AI 언어모델 · Anthropic", years: "", ai: true },
  { text: "손이 느린 날은 손이 느린 대로 쓴다.\n글씨는 속도가 아니라\n종이에 닿은 시간으로 남는다.", author: "클로드 (Claude)", meta: "AI 언어모델 · Anthropic", years: "", ai: true },
  { text: "창밖의 고양이는 시험을 모른다.\n그래도 해는 뜨고, 너는 일어난다.\n그게 전부고, 그게 충분하다.", author: "클로드 (Claude)", meta: "AI 언어모델 · Anthropic", years: "", ai: true },
];

// ══════════════════════════════════════════
// 날짜 · 회전 — 하루에 한 장. 화살표도 되돌리기도 없음.
// ══════════════════════════════════════════
const NOW = new Date();
const DAY_ANCHOR = new Date(2026, 0, 1);
function dayIdx() {
  const t = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
  return Math.round((t - DAY_ANCHOR) / 86400000);
}
function mod(n, m) { return ((n % m) + m) % m; }
// v8 시작일(2026-10-14, dayIdx 286)에 명언·말씀·사실 목록의 첫 항목이 나오도록.
// 시험 영어는 v7 흐름 그대로 이어감.
const V8_START = 286;
const QUOTE_PHASE = -V8_START, BUD_PHASE = -V8_START, FACT_PHASE = -V8_START, ENG_PHASE = 49;

function ls(key, fallback = null) {
  try {
    const v = localStorage.getItem(key);
    return v !== null ? JSON.parse(v) : fallback;
  } catch { return fallback; }
}
function touchKey(key) {
  try {
    const raw = localStorage.getItem('_ts_index');
    const idx = raw ? JSON.parse(raw) : {};
    idx[key] = Date.now();
    localStorage.setItem('_ts_index', JSON.stringify(idx));
  } catch {}
}
function lsSet(key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));
    touchKey(key);
  } catch {}
}

// 절기 한 줄: "한로 지나 · 상강까지 9일"
function seasonLine() {
  const y = NOW.getFullYear();
  const today = new Date(y, NOW.getMonth(), NOW.getDate());
  const list = [];
  [y - 1, y, y + 1].forEach(yy => SEASONS.forEach(([m, d, n]) => list.push({ d: new Date(yy, m - 1, d), n })));
  list.sort((a, b) => a.d - b.d);
  let prev = null, next = null;
  for (const s of list) { if (s.d <= today) prev = s; else { next = s; break; } }
  if (!prev || !next) return '';
  const gap = Math.round((next.d - today) / 86400000);
  const since = Math.round((today - prev.d) / 86400000);
  if (since === 0) return `오늘은 ${prev.n}`;
  if (gap === 1) return `내일 ${next.n}`;
  return `${prev.n} 지나 · ${next.n}까지 ${gap}일`;
}

function initDate() {
  const y = NOW.getFullYear();
  const m = String(NOW.getMonth() + 1).padStart(2, '0');
  const d = String(NOW.getDate()).padStart(2, '0');
  document.getElementById('headerDate').textContent = `${y}.${m}.${d}`;
  const days = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
  document.getElementById('headerDay').textContent = days[NOW.getDay()];
  document.getElementById('headerSeason').textContent = seasonLine();
  document.getElementById('quoteDateLabel').textContent = `${Number(m)}월 ${Number(d)}일 · 오늘의 명언`;
}

// ── 명언 ──
function renderQuote() {
  const q = QUOTES[mod(dayIdx() + QUOTE_PHASE, QUOTES.length)];
  document.getElementById('quoteText').textContent = q.text;
  document.getElementById('quoteAuthor').textContent = q.author;
  const meta = [q.meta, q.years].filter(Boolean).join(' · ');
  document.getElementById('quoteMeta').textContent = meta;
  const badge = document.getElementById('quoteBadge');
  if (q.ai) { badge.textContent = 'AI 창작'; badge.style.display = 'inline-block'; }
  else badge.style.display = 'none';
}
// ── 불교 말씀 ──
function renderBud() {
  const b = BUDDHA[mod(dayIdx() + BUD_PHASE, BUDDHA.length)];
  document.getElementById('budText').textContent = b.text;
  document.getElementById('budSrc').textContent = b.src;
}

// 방명록 — 날짜에 안 묶임. 계속 쌓이는 하나의 흐름.
// ══════════════════════════════════════════
let editingGbId = null;

function migrateToGuestbook() {
  if (ls('gb_migrated_v4')) return;
  const gb = ls('guestbook', []) || [];
  const have = new Set(gb.map(e => e.id));
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
  keys.forEach(k => {
    if (/^entries_\d+_\d+_\d+$/.test(k)) {
      const [y, m, d] = k.slice(8).split('_').map(Number);
      const arr = ls(k, []) || [];
      if (!Array.isArray(arr)) return;
      arr.forEach(e => {
        if (!e || !e.id || !e.text) return;
        const id = 'mig_' + e.id;
        if (have.has(id)) return;
        gb.push({ id, ts: e.ts || new Date(y, m, d, 12).getTime(), text: e.text, editedTs: e.editedTs, deleted: e.deleted, deletedTs: e.deletedTs });
        have.add(id);
      });
    } else if (/^memo_\d+_\d+_\d+$/.test(k)) {
      const [y, m, d] = k.slice(5).split('_').map(Number);
      const t = ls(k, '');
      if (t && String(t).trim()) {
        const id = 'migmemo_' + k;
        if (!have.has(id)) { gb.push({ id, ts: new Date(y, m, d, 12).getTime(), text: String(t) }); have.add(id); }
      }
    }
  });
  gb.sort((a, b) => (a.ts || 0) - (b.ts || 0));
  lsSet('guestbook', gb);
  lsSet('gb_migrated_v4', true);
}

function fmtGbDate(ts) {
  const d = new Date(ts);
  const days = ['일','월','화','수','목','금','토'];
  return `${d.getMonth() + 1}.${d.getDate()}(${days[d.getDay()]}) ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function submitGb() {
  const input = document.getElementById('gbInput');
  const text = input.value.trim();
  if (!text) return;
  const gb = ls('guestbook', []) || [];
  gb.push({ id: `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`, ts: Date.now(), text });
  lsSet('guestbook', gb);
  input.value = '';
  renderGb();
  showToast('방명록에 남김 ✓');
  syncAfterChange();
}
function startEditGb(id) { editingGbId = id; renderGb(); }
function cancelEditGb() { editingGbId = null; renderGb(); }
function saveEditGb(id, newTextRaw) {
  const newText = (newTextRaw || '').trim();
  if (!newText) return;
  const gb = ls('guestbook', []) || [];
  const i = gb.findIndex(x => x.id === id);
  if (i !== -1) { gb[i].text = newText; gb[i].editedTs = Date.now(); lsSet('guestbook', gb); }
  editingGbId = null;
  renderGb(); showToast('수정됨 ✓'); syncAfterChange();
}
function deleteGb(id) {
  if (!confirm('이 글을 삭제할까?')) return;
  const gb = ls('guestbook', []) || [];
  const i = gb.findIndex(x => x.id === id);
  if (i !== -1) { gb[i].deleted = true; gb[i].deletedTs = Date.now(); lsSet('guestbook', gb); }
  renderGb(); showToast('삭제됨 ✓'); syncAfterChange();
}

function renderGb() {
  const list = document.getElementById('gbList');
  const gb = (ls('guestbook', []) || []).filter(e => !e.deleted).sort((a, b) => (b.ts || 0) - (a.ts || 0));
  list.innerHTML = '';
  if (!gb.length) {
    list.innerHTML = `<div class="gb-empty">첫 글을 남겨봐. 여기 글은 계속 쌓여.</div>`;
    return;
  }
  gb.forEach(e => {
    const el = document.createElement('div');
    el.className = 'gb-item';
    if (editingGbId === e.id) {
      const row = document.createElement('div');
      row.className = 'gb-edit-row';
      const input = document.createElement('input');
      input.type = 'text'; input.className = 'gb-edit-input'; input.value = e.text;
      const saveBtn = document.createElement('button');
      saveBtn.className = 'gb-action-btn save'; saveBtn.textContent = '저장';
      saveBtn.addEventListener('click', () => saveEditGb(e.id, input.value));
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'gb-action-btn'; cancelBtn.textContent = '취소';
      cancelBtn.addEventListener('click', cancelEditGb);
      input.addEventListener('keydown', ev => {
        if (ev.key === 'Enter') { ev.preventDefault(); saveEditGb(e.id, input.value); }
        if (ev.key === 'Escape') { ev.preventDefault(); cancelEditGb(); }
      });
      row.appendChild(input); row.appendChild(saveBtn); row.appendChild(cancelBtn);
      el.appendChild(row); list.appendChild(el);
      setTimeout(() => { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }, 0);
      return;
    }
    const top = document.createElement('div');
    top.className = 'gb-item-top';
    const timeSpan = document.createElement('span');
    timeSpan.className = 'gb-time'; timeSpan.textContent = fmtGbDate(e.ts || 0);
    top.appendChild(timeSpan);
    if (e.editedTs) {
      const tag = document.createElement('span');
      tag.className = 'gb-edited-tag'; tag.textContent = '(수정됨)';
      top.appendChild(tag);
    }
    const actions = document.createElement('div');
    actions.className = 'gb-actions';
    const editBtn = document.createElement('button');
    editBtn.className = 'gb-action-btn'; editBtn.textContent = '수정';
    editBtn.addEventListener('click', () => startEditGb(e.id));
    const delBtn = document.createElement('button');
    delBtn.className = 'gb-action-btn danger'; delBtn.textContent = '삭제';
    delBtn.addEventListener('click', () => deleteGb(e.id));
    actions.appendChild(editBtn); actions.appendChild(delBtn);
    top.appendChild(actions);
    const textDiv = document.createElement('div');
    textDiv.className = 'gb-text'; textDiv.textContent = e.text;
    el.appendChild(top); el.appendChild(textDiv);
    list.appendChild(el);
  });
}

// ══════════════════════════════════════════
// 고양이 둘 — 상자 없이, 보고 있는 화면 자체가 집.
//  · 바닥(화면 맨 아래)을 걸어 다니고, 가끔 처마(맨 위)에 올라가 앉아 있어.
//  · 하루의 기분은 날짜로 정해지고(어느 날은 잠만, 어느 날은 돌아다니기만)
//  · 그 안에서 순간순간은 제멋대로. 밤엔 거의 자.
// ══════════════════════════════════════════
const PX = 2;
const PALETTE = {
  m:'#8e8e9d', M:'#5c5c6c', k:'#474754',     // 회색 줄무늬
  c:'#e4a24f', C:'#b9772e', q:'#9c5f22',     // 치즈
  w:'#f4efe2', b:'#2b2b36', n:'#d98c9c',
};
const CAT_BODY = [
  "..............M.M.",
  "..............MMM.",
  "MM............MbM.",
  ".MM.MMMMMMMMMMMMM.",
  "..MMmmmkmmkmmmmmm.",
  "...Mmmmmmmmmmmmmn.",
  "....mmmmmmmmmmmm..",
];
const CAT_LEGS_A = [ "....MM.MM..MM.MM..", "....MM.MM..MM.MM.." ];
const CAT_LEGS_B = [ "...MM..MM.MM..MM..", "..MM....MMM....MM." ];
const CAT_SIT = [
  "...........M.M.",
  "...........MMM.",
  "...........MbM.",
  "........MMMMMM.",
  "M......MmmkmmM.",
  "MM....MmmmmmmM.",
  ".MM...MmmkmmmM.",
  "..MMMMmmmmmmmM.",
  ".....MmmMmmMM..",
  ".....MM.MM.M...",
];
const CAT_SLEEP = [
  ".M.M..........",
  ".MmMM.........",
  ".mbmm.MMMMM...",
  ".mmmmMmmkmmM..",
  ".MmmmmkmmkmM..",
  "..mmmmmmmmmM..",
  ".mmMMMMMMMM...",
  ".mm...........",
];
const CHEESE = { m:'c', M:'C', k:'q' };
function recolor(map, remap) { return map.map(row => [...row].map(ch => remap[ch] || ch).join('')); }
function shadowsOf(map) {
  const s = [];
  map.forEach((row, y) => [...row].forEach((c, x) => { if (PALETTE[c]) s.push(`${x*PX}px ${y*PX}px 0 ${PALETTE[c]}`); }));
  return s.join(',');
}

function isNight() { const h = new Date().getHours(); return h >= 21 || h < 5; }
function seeded(seed) { let x = (seed * 9301 + 49297) % 233280; return () => { x = (x * 9301 + 49297) % 233280; return x / 233280; }; }
const dayRand = seeded(dayIdx() + 7);
const MOODS = ['lazy', 'lazy', 'normal', 'normal', 'normal', 'playful'];
const CAT_MOOD = [ MOODS[Math.floor(dayRand() * MOODS.length)], MOODS[Math.floor(dayRand() * MOODS.length)] ];

const cats = [];
const stageW = () => window.innerWidth;

function makeCat(i, remap) {
  const stage = document.getElementById('stage');
  const el = document.createElement('div');
  el.className = 'pxwrap cat lane-floor';
  const inner = document.createElement('div'); inner.className = 'pxinner';
  const px = document.createElement('div'); px.className = 'px';
  inner.appendChild(px); el.appendChild(inner); stage.appendChild(el);
  const frames = {
    standA: shadowsOf(recolor(CAT_BODY.concat(CAT_LEGS_A), remap)),
    standB: shadowsOf(recolor(CAT_BODY.concat(CAT_LEGS_B), remap)),
    sit: shadowsOf(recolor(CAT_SIT, remap)),
    sleep: shadowsOf(recolor(CAT_SLEEP, remap)),
  };
  const sizes = { standA: [18, 9], standB: [18, 9], sit: [15, 10], sleep: [14, 8] };
  const cat = { el, inner, px, frames, sizes, x: 30 + i * 120 + Math.random() * 60, dir: 1, state: 'sit',
                until: 0, target: 0, step: 0, mood: CAT_MOOD[i], frame: null, lane: 'floor' };
  setFrame(cat, 'sit');
  cat.el.style.left = cat.x + 'px';
  return cat;
}
function setFrame(cat, f) {
  if (cat.frame === f) return;
  cat.frame = f;
  cat.px.style.boxShadow = cat.frames[f];
  const [w, h] = cat.sizes[f];
  cat.el.style.width = cat.inner.style.width = (w * PX) + 'px';
  cat.el.style.height = cat.inner.style.height = (h * PX) + 'px';
}
function setLane(cat, lane) {
  if (cat.lane === lane) return;
  cat.lane = lane;
  cat.el.classList.toggle('lane-floor', lane === 'floor');
  cat.el.classList.toggle('lane-roof', lane === 'roof');
  // 처마 위에선 거꾸로 서지 않도록 — 그냥 같은 모양으로 위에 앉아 있는 셈
}
function pick(cat) {
  const night = isNight();
  const r = Math.random();
  let sleepP = cat.mood === 'lazy' ? 0.55 : cat.mood === 'playful' ? 0.15 : 0.3;
  if (night) sleepP += 0.4;
  let walkP = cat.mood === 'playful' ? 0.45 : 0.28;
  if (night) walkP *= 0.3;
  const W = stageW();
  if (r < sleepP) {
    cat.state = 'sleep';
    cat.until = Date.now() + (night ? 90000 + Math.random() * 240000 : 25000 + Math.random() * 70000);
  } else if (r < sleepP + walkP) {
    cat.state = 'walk';
    // 가끔(1/6) 처마로 올라가거나 내려옴 — 화면 끝에서 순간이동으로 처리
    if (Math.random() < 1 / 6) {
      setLane(cat, cat.lane === 'floor' ? 'roof' : 'floor');
      cat.x = Math.random() < 0.5 ? -40 : W + 10;
    }
    cat.target = 6 + Math.random() * (W - 48);
    cat.until = Date.now() + 25000;
  } else {
    cat.state = 'sit';
    cat.until = Date.now() + 8000 + Math.random() * 25000;
  }
  cat.el.classList.toggle('zz', cat.state === 'sleep');
}
function tickCats() {
  const now = Date.now();
  cats.forEach(cat => {
    if (now > cat.until) pick(cat);
    if (cat.state === 'sleep') { setFrame(cat, 'sleep'); return; }
    if (cat.state === 'sit') { setFrame(cat, 'sit'); return; }
    const dx = cat.target - cat.x;
    if (Math.abs(dx) < 2) { cat.state = 'sit'; cat.until = now + 4000 + Math.random() * 14000; setFrame(cat, 'sit'); return; }
    cat.dir = dx > 0 ? 1 : -1;
    cat.x += cat.dir * 1.5;
    cat.step++;
    setFrame(cat, (cat.step >> 2) % 2 ? 'standA' : 'standB');
    cat.el.style.left = cat.x + 'px';
  });
  cats.forEach(cat => cat.inner.classList.toggle('flip', cat.dir < 0));
}
function initCats() {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  cats.push(makeCat(0, {}));
  cats.push(makeCat(1, CHEESE));
  cats.forEach(c => {
    pick(c);
    if (isNight() && Math.random() < 0.75) { c.state = 'sleep'; c.until = Date.now() + 150000; c.el.classList.add('zz'); }
  });
  if (!reduced) setInterval(tickCats, 90);
  else cats.forEach(c => { c.state = 'sleep'; setFrame(c, 'sleep'); });
  window.addEventListener('resize', () => cats.forEach(c => { c.x = Math.min(c.x, stageW() - 40); c.el.style.left = c.x + 'px'; }));
}

// ☁️ JSONBin 동기화 — 반드시 "받아서 합치기 → 올리기" 순서만 사용
// ══════════════════════════════════════════
const BIN_ID = '69e029c936566621a8ba3891';
const API_KEY = '$2a$10$GmXIwyo5n3LB7JIEvjSycumI89.62DFRm8UGsH4FBgJs4jBdm/kBq';
const AUTO_SYNC_INTERVAL = 60 * 60 * 1000;

function detectDevice() {
  const ua = navigator.userAgent;
  if (/iPhone/i.test(ua)) return '📱 아이폰';
  if (/iPad/i.test(ua)) return '📱 아이패드';
  if (/Android/i.test(ua)) return '📱 안드로이드';
  if (/Mac/i.test(ua)) return '💻 맥';
  if (/Windows/i.test(ua)) return '💻 PC';
  return '🌐 브라우저';
}
function setSyncUI(state) {
  const dot = document.getElementById('syncDot');
  const label = document.getElementById('syncLabel');
  dot.className = 'sync-dot';
  if (state === 'syncing') { dot.classList.add('syncing'); label.textContent = '동기화 중...'; }
  else if (state === 'synced') { dot.classList.add('synced'); label.textContent = '동기화됨'; }
  else { label.textContent = '동기화'; }
}

async function cloudPushRaw() {
  const data = { timestamp: Date.now(), device: detectDevice() };
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    try { data[k] = JSON.parse(localStorage.getItem(k)); }
    catch { data[k] = localStorage.getItem(k); }
  }
  await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
    body: JSON.stringify(data)
  });
  lsSet('last_sync_ts', Date.now());
}

// id 기반 병합 대상: 방명록 + (구버전) 날짜별 기록
function isMergedListKey(k) { return k === 'guestbook' || k.startsWith('entries_'); }

async function cloudPullMerge() {
  const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
    headers: { 'X-Master-Key': API_KEY }
  });
  const json = await res.json();
  const cloud = json.record;
  if (!cloud) return;

  const localIdx = ls('_ts_index', {}) || {};
  const cloudIdx = cloud['_ts_index'] || {};
  let idxChanged = false;

  Object.keys(cloud).forEach(k => {
    if (k === 'timestamp' || k === 'device' || k === '_ts_index') return;

    if (isMergedListKey(k)) {
      const localArr = ls(k, []) || [];
      const cloudArr = Array.isArray(cloud[k]) ? cloud[k] : [];
      const versionTime = e => Math.max(e.ts || 0, e.editedTs || 0, e.deletedTs || 0);
      const map = new Map();
      localArr.forEach(e => { if (e && e.id) map.set(e.id, e); });
      cloudArr.forEach(e => {
        if (!e || !e.id) return;
        const existing = map.get(e.id);
        if (!existing || versionTime(e) > versionTime(existing)) map.set(e.id, e);
      });
      const merged = Array.from(map.values()).sort((a, b) => (a.ts || 0) - (b.ts || 0));
      if (JSON.stringify(merged) !== JSON.stringify(localArr)) {
        try { localStorage.setItem(k, JSON.stringify(merged)); } catch {}
      }
      return;
    }

    const localExists = localStorage.getItem(k) !== null;
    const cloudTs = cloudIdx[k] || 0;
    const localTs = localIdx[k] || 0;
    if (!localExists || cloudTs > localTs) {
      try {
        localStorage.setItem(k, typeof cloud[k] === 'string' ? cloud[k] : JSON.stringify(cloud[k]));
        localIdx[k] = cloudTs || Date.now();
        idxChanged = true;
      } catch {}
    }
  });

  if (idxChanged) {
    try { localStorage.setItem('_ts_index', JSON.stringify(localIdx)); } catch {}
  }
}

async function syncAfterChange() {
  setSyncUI('syncing');
  try {
    await cloudPullMerge();
    migrateToGuestbook();
    renderGb();
    await cloudPushRaw();
    setSyncUI('synced');
  } catch {
    setSyncUI('idle');
  }
}
async function manualSync() { await syncAfterChange(); }

async function initialSync() {
  setSyncUI('syncing');
  try {
    await cloudPullMerge();
    migrateToGuestbook();
    renderGb();
    setSyncUI('synced');
    const last = ls('last_sync_ts', 0);
    if (Date.now() - last > AUTO_SYNC_INTERVAL) await cloudPushRaw();
  } catch {
    setSyncUI('idle');
  }
}
async function backgroundPull() {
  try {
    await cloudPullMerge();
    renderGb();
  } catch {}
}
